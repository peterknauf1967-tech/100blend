<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2dc;
 --accent:#e2543f;--ok:#2f8f5b;--okbg:#f4faf6;--okln:#c4e2d0;--miss:#c0392b;--missbg:#fdf4f3;--missln:#f0cdc8;
 --warn:#b8860b;--nose:#5b6cb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
 padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:11px 16px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.who{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;text-align:right;line-height:1.3}
main{padding:16px;max-width:820px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
 display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--muted);font:700 11px inherit;cursor:pointer;
 padding:7px 2px;border-radius:9px;line-height:1.3}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ink);background:#f1ede8}
/* Fertige Antworten auf die Plausibilitaetsfrage - gross genug
   fuer den Daumen, damit niemand tippen muss. */
button.plausi{width:100%;text-align:left;border:1px solid var(--line);
  background:#fff;border-radius:9px;padding:9px 11px;font:600 13px inherit;
  color:var(--ink);cursor:pointer}
button.plausi:active{background:#f1ede8}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:800}
h2:first-child{margin-top:4px}
h2 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;
 display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.mengen{flex:1 0 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 margin-top:2px;padding-top:9px;border-top:1px dashed var(--line)}
.mengen label{font:700 11px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mengen .feld{display:flex;align-items:center;gap:5px}
.row.has{border-color:var(--okln);background:var(--okbg)}
.row.miss{border-color:var(--missln);background:var(--missbg)}
.row.own{border-color:#cdd6ee;background:#f8f9fd}
.code{font:800 12px/1 ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:7px 8px;flex:0 0 auto}
.row.miss .code{background:#f6ddd9;color:var(--miss)}
.row.own .code{background:#e4e9f7;color:#3c4a7d}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:15px}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.pr{font:700 11.5px/1.4 inherit;color:#7a6f5f;margin-top:3px}
.rz{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.rz span{font:700 10px/1 ui-monospace,Menlo,monospace;background:#eceae5;color:#5d5850;padding:3px 5px;border-radius:4px}
.row.miss .rz span{background:#f6ddd9;color:#9b3226}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
 font:16px inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.qty{width:82px;text-align:right;font-weight:700;flex:0 0 auto}
input.tkqty{width:82px;text-align:right;font-weight:700;flex:0 0 auto;background:#eef6ff;border-color:#c3d9f0}
button.mv{flex:0 0 auto;padding:9px 12px;font:800 13px inherit;border:1px solid #9ec2e6;background:#dbeafe;color:#1c5389;border-radius:9px;cursor:pointer}
.warnbox{flex:1 0 100%;display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px;
 font:600 12.5px inherit;color:var(--miss);background:var(--missbg);border:1px solid var(--missln);
 border-radius:9px;padding:7px 10px}
.u{color:var(--muted);font-size:13px;width:30px;flex:0 0 auto}
.f{margin-bottom:11px}
.f2{display:flex;gap:10px}.f2>div{flex:1}
label{display:block;font:700 11.5px/1.4 inherit;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
button.b{border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:11px 15px;border-radius:10px;font:700 14px inherit;cursor:pointer}
button.b.p{background:var(--ink);color:#fff;border-color:var(--ink)}
button.b.r{background:var(--miss);color:#fff;border-color:var(--miss)}
button.b.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;
 font:700 15px inherit;cursor:pointer;color:var(--muted)}
.stars button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stars.nose button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
 padding:8px 12px;font:600 13.5px inherit;cursor:pointer;line-height:1.25;text-align:left}
.chips button small{display:block;font-size:11px;opacity:.75;font-weight:500}
.chips button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips.bad button.on{background:var(--miss);color:#fff;border-color:var(--miss)}
.tip{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:14px}
.tip.nose{background:#f7f8fd;border-color:#ccd2ec}
.tip.bad{background:var(--missbg);border-color:var(--missln)}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:23px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .miss b{color:var(--miss)} .kpi .ok b{color:var(--ok)}
.kpi div{cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.such.lupe input{padding-left:36px}
.such.lupe:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);
 font-size:15px;opacity:.55;pointer-events:none;z-index:1}
.such .loeschen{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;
 background:#e8e2d8;color:#40352a;border-radius:50%;width:26px;height:26px;font:700 13px inherit;cursor:pointer}
/* Mengen-Kaestchen und Zeitangabe — gehoerten zur Aenderungsanzeige und
   fehlten bisher im Stylesheet. */
.menge{display:inline-block;margin:2px 6px 2px 0;padding:3px 9px;border-radius:7px;
 background:#f0ede8;font:700 12.5px inherit;color:#40352a;white-space:nowrap}
.wann{display:block;margin-top:3px;font:600 11.5px inherit;color:#7a6f5f}
.fzeile{display:flex;align-items:center;gap:8px;justify-content:space-between}
.fhaupt{font-size:16px}
.fmenge{flex:0 0 auto}
.fgrp2{opacity:.6}
.frisch{display:inline-block;margin-left:6px;font:700 10.5px inherit;color:#1c5389;
 background:#eef6ff;border:1px solid #c3d9f0;border-radius:20px;padding:2px 7px;vertical-align:middle}
.kpi div:after{content:"⌄";position:absolute;top:9px;right:10px;font-size:13px;color:var(--muted);opacity:.55}
.kpi div.auf:after{content:"⌃"}
.kpi div.auf{border-color:var(--fg);box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.such{position:relative;position:sticky;top:56px;background:var(--bg);padding:6px 0 8px;z-index:5}
.frow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;
 padding:9px 11px;margin-bottom:6px;font:15px inherit;cursor:pointer}
.frow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fgrp{font:800 11px inherit;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.list{max-height:60vh;overflow:auto}
.dead{background:#f7f4f2;border:1px dashed #c9bcb6;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.dead .code{background:#eadfdb;color:#8a3f34;text-decoration:line-through}
.dead .nm b{text-decoration:line-through;color:#7a6a66}
.dead .why{font-size:12.5px;color:#8a3f34;font-weight:600}
.rez{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.rez .kopf{display:flex;align-items:baseline;gap:9px}
.rez .no{font:800 15px ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:5px 8px}
.rez .ampel{margin-left:auto;font:700 12px inherit;padding:4px 9px;border-radius:20px}
.rez .ampel.gr{background:var(--okbg);color:var(--ok);border:1px solid var(--okln)}
.rez .ampel.rt{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
.rez .ampel.ge{background:#fffaf0;color:var(--warn);border:1px solid #ecdfae}
.rez .zut{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.rez .zut span{font:600 11.5px inherit;padding:4px 8px;border-radius:6px;background:var(--okbg);color:#2c6b4a;border:1px solid var(--okln)}
.rez .zut span.f{background:var(--missbg);color:var(--miss);border-color:var(--missln)}
.rez .zut span.g{background:#fffaf0;color:#8a6d1f;border-color:#ecdfae}
.rez .zut span.r{background:#fff4e8;color:#9a5a12;border-color:#f0d3b0}
.rez .zut span.s{background:#eef6ff;color:#1c5389;border-color:#c3d9f0}
.rez .zut span.b{background:#f6f2fb;color:#5b3f86;border-color:#ddd0ee}
.rez .zut span.u{background:#f2f6f2;color:#4a6b4a;border-color:#cbdccb}
.row.spring{cursor:pointer;-webkit-tap-highlight-color:transparent}
.chev{flex:0 0 auto;opacity:.45;font-size:19px;line-height:1}
.rez.fokus{outline:2px solid var(--fg);outline-offset:3px}
.rez .ampel.or{background:#fff4e8;color:#9a5a12;border:1px solid #f0d3b0}
.rez .probiert{font:700 11px inherit;padding:4px 8px;border-radius:20px;background:#fdf6e3;
 color:#8a6a1f;border:1px solid #ecdfae;margin-left:6px}
.del{border:none;background:none;color:var(--miss);font:700 18px/1 inherit;cursor:pointer;padding:4px 6px;flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:36px 20px;font-size:15px}
textarea#out{height:210px;font:12px/1.5 ui-monospace,Menlo,monospace;margin-top:12px}
.mini{font-size:12.5px;color:var(--muted)}
.user{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;
 font:700 12px inherit;cursor:pointer;margin-left:auto;white-space:nowrap}
label i.en{display:block;font-style:normal;font-weight:600;font-size:11.5px;color:#a09a92;
 text-transform:none;letter-spacing:0}
.en{color:#a09a92;font-weight:600;font-size:12px}
.nm .haupt{display:block;font-weight:600;font-size:15px;line-height:1.25}
.nm .zweit{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nm .dritt{display:block;font-size:12.5px;color:var(--nose);font-weight:600}
.nm .dritt i.laut{font-style:italic;color:#8a7a55;font-weight:600;margin-left:5px}
.hoer{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;
 font-size:15px;cursor:pointer;flex:0 0 auto}
.hoer:active{background:#f0ede8}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
 display:flex;align-items:center;justify-content:center;padding:16px}
.ovl>.dlg{background:#fff;border-radius:14px;max-width:340px;width:100%;
 max-height:88vh;overflow:auto;padding:16px}
.dlg{padding:16px}
.dlg h3{margin:0 0 12px;font-size:15.5px;line-height:1.4}
.wahl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
 border-radius:10px;padding:11px 13px;margin-bottom:8px;font:15px inherit;cursor:pointer}
.wahl.on{border-color:var(--ink);background:#f1ede8;font-weight:700}
.wahl small{display:block;color:var(--muted);font-size:12px}
.schalter{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin-top:10px}
.stimmen{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:10px}
.stimmen.ok{background:var(--okbg);color:#22694a;border:1px solid var(--okln)}
.stimmen.no{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
details.tipp{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;margin-bottom:13px;overflow:hidden}
details.tipp summary{padding:10px 12px;cursor:pointer;font:700 13.5px inherit;list-style:none}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp .inhalt{padding:0 12px 11px;font-size:13.5px;line-height:1.55}
details.tipp .inhalt .en{display:block;margin-top:4px}
/* --- AMPEL: START --- */
/* Zutaten-Ampel: die drei runden Knoepfe stehen direkt neben dem Code.
   18-20 px reicht auf dem Handy, ohne die Zeile aufzublaehen. */
.ampel{display:inline-flex;gap:5px;align-items:center;margin-left:6px;flex:0 0 auto;vertical-align:middle}
.ampel button{width:20px;height:20px;border-radius:50%;border:1px solid #cfc9bd;background:#f8f5f0;
  cursor:pointer;padding:0;font:11px/1 inherit;display:inline-flex;align-items:center;justify-content:center;
  color:#888;-webkit-tap-highlight-color:transparent}
.ampel button:active{transform:scale(.9)}
.ampel button.on.a-g{background:#2f8f5b;border-color:#207348;color:#fff;box-shadow:0 0 0 2px rgba(47,143,91,.25)}
.ampel button.on.a-y{background:#eab308;border-color:#a67a08;color:#fff;box-shadow:0 0 0 2px rgba(234,179,8,.3)}
.ampel button.on.a-r{background:#d33;border-color:#a02020;color:#fff;box-shadow:0 0 0 2px rgba(211,51,51,.3)}
/* Der duenne farbige Balken links markiert den Ampel-Status der Zeile —
   auch im "has"/"miss"-Zustand noch deutlich sichtbar. */
.row.a-rot{box-shadow:inset 3px 0 0 #d33}
.row.a-gelb{box-shadow:inset 3px 0 0 #eab308}
.row.a-gruen{box-shadow:inset 3px 0 0 #2f8f5b}
.a-grund{display:block;font:600 11.5px/1.35 inherit;color:#a02020;margin-top:2px}
/* --- AMPEL: ENDE --- */

/* --- WEGWEISER: START (05.09.2026) ---------------------------------------
   Peter wollte das Ganze in acht Gruppen sortiert sehen, mit dem Hinweis,
   wo es klemmen koennte. Der Wegweiser steht ganz oben auf der Startseite
   und ist die einzige Stelle, an der ALLE acht Bereiche nebeneinander
   sichtbar sind - inklusive Kasse und Arbeitskarte, die eigene Seiten sind. */
#wegw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
#wegw .kar{background:var(--k,#fff);border:1px solid rgba(0,0,0,.12);border-radius:12px;
  padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:76px}
#wegw .kar:active{transform:scale(.985)}
#wegw .kar b{font-size:14px;display:flex;align-items:center;gap:6px}
#wegw .kar i{font-style:normal;font-size:11.5px;opacity:.72;line-height:1.3}
#wegw .kar .warn{font-size:11.5px;font-weight:700;color:#b45309;line-height:1.3}
#wegw .kar .stop{font-size:11.5px;font-weight:700;color:#b91c1c;line-height:1.3}
#wegw .kar .gut{font-size:11.5px;font-weight:600;color:#15803d;line-height:1.3}
#sync_zeile{font-size:11.5px;opacity:.8;margin:-6px 0 12px;display:flex;gap:6px;align-items:center}
/* --- WEGWEISER: ENDE --- */

/* --- REZEPT-ANPASSUNG + SCHRITTE: START (06.09.2026) --------------------- */
.fg{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;
    padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.fg-tk{background:#dbeafe;color:#1e40af}
.fg-fr{background:#dcfce7;color:#166534}
.fg-tr{background:#fef3c7;color:#92400e}
.schritte{margin:9px 0 2px;padding:0;list-style:none;counter-reset:sc}
.schritte li{counter-increment:sc;position:relative;padding:5px 0 5px 26px;
             border-top:1px solid rgba(0,0,0,.07);font-size:13.5px;line-height:1.4}
.schritte li::before{content:counter(sc);position:absolute;left:0;top:5px;width:18px;height:18px;
  border:1.5px solid currentColor;border-radius:50%;font:700 11px/16px system-ui;text-align:center;opacity:.65}
.schritte li i{display:block;font-style:normal;font-size:11.5px;opacity:.62;margin-top:1px}
.schrBtn,.anpBtn{border:1.5px solid rgba(0,0,0,.25);background:transparent;border-radius:8px;
  padding:5px 10px;font:700 12.5px system-ui;cursor:pointer;margin:7px 6px 0 0}
.anpBtn.aktiv{background:#111;color:#fff;border-color:#111}
.anpInfo{margin-top:6px;font-size:12px;background:#fffbeb;border:1px solid #fde68a;
  border-radius:8px;padding:5px 8px}
.anpMod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;
  align-items:flex-end;justify-content:center}
.anpBox{background:#fff;color:#111;width:100%;max-width:560px;max-height:88vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:14px 14px 20px}
.anpBox h3{margin:0 0 3px;font-size:17px}
.anpBox .sub{font-size:12px;opacity:.7;margin:0 0 10px}
.anpZ{display:flex;align-items:center;gap:7px;padding:7px 0;border-top:1px solid #eee}
.anpZ .nm{flex:1;font-size:13.5px;line-height:1.25}
.anpZ .nm small{display:block;opacity:.6;font-size:11px}
.anpZ button{width:34px;height:34px;border:1.5px solid #ccc;background:#fff;border-radius:9px;
  font:700 17px system-ui;cursor:pointer;flex:none}
.anpZ input{width:66px;height:34px;border:1.5px solid #ccc;border-radius:9px;text-align:right;
  font:700 14px system-ui;padding:0 6px}
.anpZ .weg{border-color:#fca5a5;color:#b91c1c;font-size:15px}
.anpZ.raus{opacity:.4}
.anpZ.raus .nm{text-decoration:line-through}
.anpNeu{display:flex;gap:7px;margin-top:10px}
.anpNeu select{flex:1;height:38px;border:1.5px solid #ccc;border-radius:9px;font-size:13.5px;padding:0 6px}
.anpNeu input{width:78px;height:38px;border:1.5px solid #ccc;border-radius:9px;text-align:right;
  font:700 14px system-ui;padding:0 6px}
.anpNotiz{width:100%;margin-top:10px;min-height:56px;border:1.5px solid #ccc;border-radius:9px;
  padding:8px;font:14px system-ui}
.anpBtns{display:flex;gap:8px;margin-top:12px}
.anpBtns button{flex:1;height:46px;border:0;border-radius:11px;font:800 14.5px system-ui;cursor:pointer}
.anpOk{background:#111;color:#fff}
.anpReset{background:#fee2e2;color:#b91c1c}
.anpAb{background:#eee;color:#111}
/* --- REZEPT-ANPASSUNG + SCHRITTE: ENDE --- */
</style>

<body>
<header>
  <div class="top">
    <div class="brand">100<span>blend</span> · Stand-OS <i id="verstempel" style="font:400 10.5px/1 ui-monospace,monospace;opacity:.45;font-style:normal"></i><i id="syncstempel" style="font:400 10.5px/1 ui-monospace,monospace;opacity:.7;font-style:normal;margin-left:6px"></i></div>
    <button class="user" id="userbtn">👤</button>
  </div>
</header>

p":["🔒 NICHT im Verkaufsmenü — Peters persönlicher Smoothie. NEUE FASSUNG 05.09.2026 (Peter): Joghurt trägt den Becher statt Wasser, Whey Protein neu drin, Ananas ersetzt Mango und Beeren, Passionsfrucht grün fürs Aroma. ZWEI MIXGÄNGE SIND ABSICHT: erst alles ohne Brokkoli 35 Sekunden, dann Brokkoli dazu und nochmal 35 Sekunden — so wird er fein, ohne den ganzen Becher warm zu schlagen. ⚠ SOFORT TRINKEN: Ananas enthält Bromelain, ein Enzym, das Eiweiß zerlegt — Einfrieren zerstört es nicht, nur Hitze. Frisch getrunken passiert nichts; stehen gelassen wird der Becher bitter und das Whey verliert seinen Zweck. GESCHMACK GEHT VOR (Peter 24.08.): Kurkuma 0,4 g, Pfeffer 0,1 g. Der Pfeffer geht mit, weil er nur wegen des Kurkumas drin ist — Piperin macht Curcumin verfügbar. KEINE Banane, KEIN Zucker (Diabetes), KEIN Grapefruit/Pomelo (Eliquis), KEIN Salz (Bauchwasser). Wenn noch zu grasig: Gurke schälen · Ananas auf 120 g · Brokkoli auf 40 g — in dieser Reihenfolge, Brokkoli zuletzt.","🔒 ไม่อยู่ในเมนูขาย — สูตรส่วนตัวของปีเตอร์ · สูตรใหม่ 05.09.2026: ใช้โยเกิร์ตแทนน้ำ · เพิ่มเวย์โปรตีน · ใช้สับปะรดแทนมะม่วงและเบอร์รี · เสาวรสเขียวเพิ่มกลิ่น · ปั่นสองรอบโดยตั้งใจ: รอบแรก 35 วินาทีโดยยังไม่ใส่บรอกโคลี แล้วค่อยใส่บรอกโคลีปั่นต่ออีก 35 วินาที · ⚠ ดื่มทันที เพราะสับปะรดมีโบรมีเลนที่ย่อยโปรตีน ถ้าตั้งทิ้งไว้จะขม · ขมิ้น 0,4 กรัม พริกไทย 0,1 กรัม · ไม่ใส่กล้วย ไม่ใส่น้ำตาล (เบาหวาน) ไม่ใส่ส้มโอ/เกรปฟรุต (ยาอีลิควิส) ไม่ใส่เกลือ (ท้องมาน) · ถ้ายังรสเขียวเกินไป: ปอกเปลือกแตงกวา · เพิ่มสับปะรดเป็น 120 กรัม · ลดบรอกโคลีเหลือ 40 กรัม","🔒 NOT on the sales menu — Peter's personal smoothie. NEW VERSION 05.09.2026 (Peter): yogurt carries the cup instead of water, whey protein added, pineapple replaces mango and berries, green passion fruit for the aroma. TWO BLENDS ARE DELIBERATE: everything except the broccoli for 35 seconds, then the broccoli and another 35 seconds — it gets fine without beating the whole cup warm. ⚠ DRINK IT IMMEDIATELY: pineapple contains bromelain, an enzyme that splits protein — freezing does not destroy it, only heat does. Drunk fresh nothing happens; left standing it turns bitter and the whey loses its point. TASTE COMES FIRST (Peter 24.08.): turmeric 0.4 g, pepper 0.1 g — the pepper is only in for the turmeric, piperine makes curcumin available. NO banana, NO sugar (diabetes), NO grapefruit or pomelo (Eliquis), NO salt (ascites). If still too grassy: peel the cucumber · pineapple to 120 g · broccoli to 40 g — in that order, broccoli last."]},{"n":"15","de":"Wassermelone-Limette-Minze","th":"แตงโม-มะนาว-สะระแหน่","en":"Watermelon-Lime-Mint","stufe":"C","basis":0,"alg":"","bestaetigt":0,"zut":[["LS",21,"Limettensaft (¾ Limette)","น้ำมะนาว (¾ ลูก)","Lime juice (¾ lime)"],["MI",2,"Minze, gezählt (12-15 Blätter)","ใบสะระแหน่ เด็ดใบ (12-15 ใบ)","Mint, counted (12-15 leaves)"],["WM",196,"Wassermelone FRISCH (Saft + Aroma)","แตงโมสด (น้ำ + กลิ่น)","Watermelon FRESH (juice + aroma)"],["WM",252,"Wassermelone GEFROREN (die Kälte)","แตงโมแช่แข็ง (ความเย็น)","Watermelon FROZEN (the cold)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Limettensaft","① ใส่ของเหลวก่อน: น้ำมะนาว","① Liquids first: Lime juice"],["② Frisches & Weiches: Minze, gezählt, Wassermelone","② ของสดและของนิ่ม: ใบสะระแหน่ เด็ดใบ · แตงโมสด","② Fresh & soft: Mint, counted, Watermelon"],["④ Gefrorenes ganz oben: Wassermelone","④ ของแช่แข็งไว้บนสุด: แตงโมแช่แข็ง","④ Frozen last, on top: Watermelon"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["GEFROREN + FRISCH kombiniert: die gefrorene Hälfte kühlt, die frische bringt Saft und Aroma — deshalb kein Wasser und kein Eis nötig. Nur 5–8 Sekunden mixen, sonst wird es schaumig.","ใช้แช่แข็งคู่กับของสด: ครึ่งที่แช่แข็งให้ความเย็น ครึ่งที่สดให้น้ำและกลิ่น จึงไม่ต้องใส่น้ำและไม่ต้องใส่น้ำแข็ง · ปั่นแค่ 5–8 วินาที ไม่อย่างนั้นจะเป็นฟอง · แช่แข็งแค่พอใช้ในวันนั้น อย่าเก็บนานเป็นสัปดาห์","The frozen melon IS the cold source — no ice needed. Freeze only a day's worth, not for weeks."]},{"n":"16","de":"Ananas-Passionsfrucht-Kokos","th":"สัปปะรด-เสาวรส-มะพร้าว","en":"Pineapple-Passion Fruit-Coconut","stufe":"A","basis":0,"alg":"","bestaetigt":0,"zut":[["KW",179.9,"Kokoswasser (frisch aus der Nuss)","น้ำมะพร้าวสด","Coconut water (fresh from the nut)"],["PF",47,"Passionsfrucht-Mark (mit Kernen)","เนื้อเสาวรส (มีเมล็ด)","Passion fruit pulp (with seeds)"],["AN",47,"Ananas FRISCH (Aroma + Beweglichkeit)","สัปปะรดสด (กลิ่นและช่วยให้ปั่นลง)","Pineapple FRESH (aroma and flow)"],["AN",199.1,"Ananas GEFROREN (die Kälte)","สัปปะรดแช่แข็ง (ความเย็น)","Pineapple FROZEN (the cold)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Kokoswasser","① ใส่ของเหลวก่อน: น้ำมะพร้าวสด","① Liquids first: Coconut water"],["② Frisches & Weiches: Passionsfrucht-Mark, Ananas","② ของสดและของนิ่ม: เนื้อเสาวรส · สัปปะรดสด","② Fresh & soft: Passion fruit pulp, Pineapple"],["④ Gefrorenes ganz oben: Ananas","④ ของแช่แข็งไว้บนสุด: สัปปะรดแช่แข็ง","④ Frozen last, on top: Pineapple"],["90\"-Taste  (90 s, höchste Stufe)","กดปุ่ม 90 วินาที  (90 วินาที ความเร็วสูงสุด)","The 90\" button  (90 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["⚠ WIEDERHOLUNG mit GEÄNDERTEM REZEPT. Der Ansatz vom 19.08. klemmte und lief erst mit 42 g mehr Flüssigkeit - die Probe war dadurch um 17 % verdünnt, Säure und Süße zählen nicht. Jetzt ist die Flüssigkeit IM Rezept: Kokoswasser hoch, gefrorene Ananas um denselben Betrag runter. Der Becher bleibt 473 g, es kommt kein Wasser dazu - deshalb diesmal NICHTS nachgießen. Wenn es trotzdem klemmt: Menge notieren und melden, nicht schätzen. Kein Eis: das Kokoswasser ist die Flüssigkeit, die gefrorene Ananas die Kälte. Passionsfrucht-Kerne NICHT absieben, das Knacken ist das Erkennungsmerkmal. Passionsfrucht-Kerne NICHT absieben, das Knacken ist das Erkennungsmerkmal.","ทำซ้ำ แต่สูตรเปลี่ยนแล้ว · ครั้งวันที่ 19.08. เครื่องปั่นไม่ลง ต้องเติมของเหลวเพิ่ม 42 กรัม ตัวอย่างจึงเจือจางไป 17 % ความเปรี้ยวและความหวานครั้งนั้นใช้ไม่ได้ · ตอนนี้ของเหลวอยู่ในสูตรแล้ว: เพิ่มน้ำมะพร้าว และลดสับปะรดแช่แข็งลงเท่ากัน · แก้วยังคง 473 กรัม ไม่มีน้ำเพิ่ม ครั้งนี้จึงห้ามเติมอะไรทั้งสิ้น · ถ้ายังปั่นไม่ลง ให้จดปริมาณที่ต้องใช้แล้วแจ้ง อย่ากะเอา · ไม่ใส่น้ำแข็ง: น้ำมะพร้าวคือของเหลว สับปะรดแช่แข็งคือความเย็น · ห้ามกรองเมล็ดเสาวรสออก เสียงกรุบคือเอกลักษณ์ของแก้วนี้","Three ingredients, no water, no ice. Do NOT sieve the passion fruit seeds."]},{"n":"17","de":"Banane-Kakao-Protein","th":"กล้วย-โกโก้-โปรตีน","en":"Banana-Cacao-Protein","stufe":"A","basis":0,"alg":"🌱","bestaetigt":0,"zut":[["MM",198.8,"Mandelmilch fertig aus der Flasche — FLASCHE SCHÜTTELN","นมอัลมอนด์สำเร็จรูปจากขวด — เขย่าขวดก่อน","Bottled almond milk - SHAKE THE BOTTLE"],["TO",60,"Seidentofu (Protein + Cremigkeit, schmeckt man nicht)","เต้าหู้อ่อน (โปรตีนและความครีมมี่ ไม่มีรสเต้าหู้)","Silken tofu (protein and creaminess, not tasted)"],["BA",101.2,"Banane (frisch)","กล้วยแช่แข็ง (สด)","Banana (fresh)"],["KK",10,"Kakao ungesüßt — von 12 g auf 10 g gesenkt (Peters Verkostung 30.08.: bitter und schwer)","ผงโกโก้ไม่หวาน","Unsweetened cacao"],["SA",0.3,"Salz — abwiegen, nicht schätzen (hebt den Kakao)","เกลือ — ต้องชั่ง ไม่กะ (ช่วยชูรสโกโก้)","Salt — weighed, not guessed (lifts the cacao)"],["HS",21,"Hanfsamen geschält (das Protein)","เมล็ดกัญชงกะเทาะเปลือก (โปรตีน)","Hulled hemp seeds (the protein)"],["BA",80,"Banane (gefroren)","กล้วยแช่แข็ง (แช่แข็ง)","Banana (frozen)"]],"schritte":[["MIXBEHÄLTER: der breite 1,5 L (breiter Boden, 24 cm) — dünnflüssig","โถปั่น: โถกว้าง 1.5 ล. (ก้นกว้าง สูง 24 ซม.) — เนื้อเหลว","BLENDER JAR: the wide 1.5 L (wide base, 24 cm) — thin drink"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Mandelmilch fertig aus der Flasche","① ใส่ของเหลวก่อน: นมอัลมอนด์สำเร็จรูปจากขวด","① Liquids first: Bottled almond milk - SHAKE THE BOTTLE"],["② Frisches & Weiches: Seidentofu, Banane","② ของสดและของนิ่ม: เต้าหู้อ่อน · กล้วยแช่แข็ง","② Fresh & soft: Silken tofu, Banana"],["③ Trockenes darüber: Kakao ungesüßt, Salz, Hanfsamen geschält","③ ใส่ของแห้งทับ: ผงโกโก้ไม่หวาน · เกลือ · เมล็ดกัญชงกะเทาะเปลือก","③ Dry on top: Unsweetened cacao, Salt, Hulled hemp seeds"],["④ Gefrorenes ganz oben: Banane","④ ของแช่แข็งไว้บนสุด: กล้วยแช่แข็ง","④ Frozen last, on top: Banana"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["⚠ VERKOSTET 30.08.2026 (Peter, mit 20 g Whey-Isolat): »Das Proteinpulver war geschmacksneutral. Aber der Smoothie war sehr schwer, süß UND bitter, guter Geschmack durch die Mandelmilch — nach dem Smoothie ist mir übel, als hätte ich 2 Tafeln Schokolade zum Frühstück gegessen. Irgendwas war überdosiert.« NACHGERECHNET, ZWEI URSACHEN: (1) KAKAO WAR DER AUSREISSER — 12 g in 473 ml, die höchste Dosis der ganzen Karte; alle anderen Kakao-Rezepte (07, 36, 39, 44) liegen bei 10 g, Nr. 30 sogar bei 8 g. Auf 10 g gesenkt, damit dieser Becher nicht aus der Reihe fällt. (2) PROTEIN AUF PROTEIN — der Becher trägt schon rund 15,9 g Eigenprotein (21 g Hanfsamen à 31 %, 60 g Seidentofu, dazu Kakao und Mandelmilch). Mit 20 g Isolat kommen 18 g dazu: rund 34 g Protein in EINEM Becher, plus etwa 10 g Fett aus den Hanfsamen. Das ist die Schwere und die Übelkeit. Die Booster-Empfehlung war deshalb falsch: chemisch passt Whey hier (keine Säure, kein Bromelain), ernährungsphysiologisch ist es Doppelung. Ab jetzt rechnet die Karte das Eigenprotein aus und halbiert die Whey-Menge automatisch ab 8 g — für Nr. 17 also 12,5 g statt 25 g. NEU VERKOSTEN mit 10 g Kakao und 12,5 g Whey. PROTEIN-SMOOTHIE der Karte. Die Recherche nennt Schokolade + Kern/Nuss + Banane als die beliebteste Proteinkombination - hier mit Hanfsamen (31 % Protein) und Seidentofu statt Erdnussbutter, weil beides im Haus ist und Hanf keinen Eigengeschmack aufdrängt. ⚠ EHRLICHE ZAHL: das ergibt rund 13 g Protein, nicht die 25-40 g der US-Rezepte - dafür fehlt Proteinpulver. Wer mehr will: 10 g Marine-Kollagen dazu (+9 g), dann ~22 g. Kakao IMMER zuerst in der Flüssigkeit lösen, sonst bleiben Klumpen. Die 0,2 g Salz sind kein Fehler - sie machen den Kakao tiefer. ABWIEGEN, nicht mit den Fingern schaetzen: eine Fingerprise streut zwischen 0,1 und 0,5 g, und bei 0,5 g schmeckt der Becher salzig. Kakao kostet 1.000 THB/kg: 8 g sind bewusst knapp und reichen voellig.","สมูทตี้โปรตีนประจำเมนู · จากการค้นข้อมูล ช็อกโกแลต + ถั่วหรือเมล็ด + กล้วย คือสูตรโปรตีนที่นิยมที่สุด ที่นี่ใช้เมล็ดกัญชง (โปรตีน 31 %) และเต้าหู้อ่อน แทนเนยถั่ว เพราะมีอยู่แล้วทั้งคู่ และกัญชงไม่มีรสของตัวเองมากลบ · ตัวเลขตามจริง: ได้โปรตีนราว 13 กรัม ไม่ใช่ 25-40 กรัม แบบสูตรอเมริกัน เพราะเราไม่ใส่ผงโปรตีน · ถ้าต้องการมากกว่านี้ ใส่มารีนคอลลาเจน 10 กรัม (เพิ่ม 9 กรัม) รวมเป็นราว 22 กรัม · ละลายโกโก้ในของเหลวก่อนเสมอ ไม่อย่างนั้นจะเป็นก้อน · เกลือ 0,2 กรัม ไม่ใช่ความผิดพลาด มันทำให้โกโก้ลึกขึ้น · ต้องชั่ง อย่าหยิบด้วยนิ้ว: หยิบมือหนึ่งได้ตั้งแต่ 0,1 ถึง 0,5 กรัม และที่ 0,5 hälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Hafermilch","① ใส่ของเหลวก่อน: นมข้าวโอ๊ต","① Liquids first: Oat milk"],["② Frisches & Weiches: Banane, reif","② ของสดและของนิ่ม: กล้วยสด สุก","② Fresh & soft: Banana, ripe"],["④ Gefrorenes ganz oben: Erdbeere","④ ของแช่แข็งไว้บนสุด: สตรอว์เบอร์รี่แช่แข็ง","④ Frozen last, on top: Strawberry"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["⚠ GEÄNDERT am 22.08. nach Lexys Verkostung: „zu sauer, ich schmecke kaum Erdbeere heraus.“ Die LIMETTE IST RAUS – 11 g auf 473 g waren der größte Säurebringer, und Säure überdeckt auch das Fruchtaroma. Der alte Tip hatte es vorhergesagt: „zu viel = die Erdbeere verschwindet.“ Die schwache Erdbeere liegt NICHT an der Menge – 220 g sind die höchste aller Rezepte – sondern an der Reife: Erdbeeren reifen nach dem Pflücken nicht nach. Grün gepflückt bleibt sauer, auch im Froster. Nur EINE Änderung, damit man sie zuordnen kann. Ob Salz zusätzlich hilft, klärt der Salz-Test.","แก้ไข 22.08. หลังเล็กซี่ชิม: “เปรี้ยวเกินไป แทบไม่ได้รสสตรอว์เบอร์รี่” · เอามะนาวออก – 11 กรัม ต่อ 473 กรัม คือตัวทำให้เปรี้ยวที่สุด และความเปรี้ยวก็กลบกลิ่นรสผลไม้ด้วย · ทิปเก่าเคยเตือนไว้แล้ว: “ใส่มากไปสตรอว์เบอร์รี่จะหาย” · รสสตรอว์เบอร์รี่ที่อ่อน ไม่ได้เพราะปริมาณ – 220 กรัม มากที่สุดในทุกสูตร – แต่เพราะความสุก: สตรอว์เบอร์รี่ไม่สุกต่อหลังเก็บ เก็บตอนเขียวก็เปรี้ยวตลอด แม้แช่แข็ง · แก้อย่างเดียว จะได้รู้ว่าอะไรทำให้ต่าง · เกลือจะช่วยไหม ดูจากการทดสอบเกลือ","CHANGED 22.08. after Lexy tasted it: “too sour, hardly any strawberry.” The LIME IS OUT. Strawberries are non-climacteric – they never ripen after picking, so berries harvested green stay sour, freezer or not. The weak flavour is a ripeness problem, not a quantity problem. One change only."]},{"n":"22","de":"Erdbeere-Hibiskus","th":"สตรอว์เบอร์รี-กระเจี๊ยบ","en":"Strawberry-Hibiscus","stufe":"X","basis":0,"alg":"","bestaetigt":0,"zut":[["HT",165,"Hibiskustee, kalt (aus getrockneten Blüten)","ชากระเจี๊ยบเย็น (ชงจากดอกแห้ง)","Hibiscus tea, chilled"],["BA",66,"Banane FRISCH, reif — gibt Körper UND Beweglichkeit","กล้วยสด สุก — ให้เนื้อและช่วยให้ปั่นลง","Banana FRESH, ripe — body and flow"],["ER",242,"Erdbeere GEFROREN (Royal Project Nr. 80)","สตรอว์เบอร์รี่แช่แข็ง (โครงการหลวง เบอร์ 80)","Strawberry FROZEN"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Hibiskustee, kalt","① ใส่ของเหลวก่อน: ชากระเจี๊ยบเย็น","① Liquids first: Hibiscus tea, chilled"],["② Frisches & Weiches: Banane, reif","② ของสดและของนิ่ม: กล้วยสด สุก","② Fresh & soft: Banana, ripe"],["④ Gefrorenes ganz oben: Erdbeere","④ ของแช่แข็งไว้บนสุด: สตรอว์เบอร์รี่แช่แข็ง","④ Frozen last, on top: Strawberry"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["Der KICK ist der Hibiskus: herb-säuerlich wie Cranberry, tiefrot, und er kostet 0,2 g getrocknete Blüten je Becher. Krachiap kennt in Thailand jeder — aber als Smoothie steht er auf keiner Karte in Pattaya. Tee am Vortag ansetzen (4–5 Blüten auf 1 L, 10 Min ziehen, abseihen, kalt stellen). ⚠ Ungetestet: wenn zu sauer, Banane auf 90 g; wenn zu dünn, Tee auf 120 ml.","จุดเด่นคือกระเจี๊ยบ: เปรี้ยวอมฝาดคล้ายแครนเบอร์รี่ สีแดงเข้ม และใช้ดอกแห้งแค่ 0,2 กรัมต่อแก้ว · คนไทยร ch Farbe gewählt, sondern weil jede in der Recherche einzeln als Hautzutat genannt wird: Ananas liefert Vitamin C, das der Körper zur Kollagenbildung braucht; Erdbeere enthält Ellagsäure, die den Kollagenabbau bremst; Mango bringt Carotinoide, die für den Glow genannt werden. Kokoswasser statt Milch, weil Hydration Teil der Wirkung ist. ⚠ WELLNESS-SPRACHE, KEIN HEILVERSPRECHEN - nach außen nur \"für Haut und Frische\", nie eine Wirkung behaupten. Kollagen IMMER zuerst in der Flüssigkeit lösen, sonst klumpt es.","สมูทตี้เพื่อความงามประจำเมนู · ผลไม้สามอย่างนี้ไม่ได้เลือกตามสี แต่เพราะแต่ละอย่างถูกระบุแยกกันว่าดีต่อผิว: สับปะรดให้วิตามินซี ซึ่งร่างกายต้องใช้สร้างคอลลาเจน · สตรอว์เบอร์รี่มีกรดเอลลาจิก ซึ่งชะลอการสลายคอลลาเจน · มะม่วงให้แคโรทีนอยด์ ที่ถูกพูดถึงเรื่องผิวเปล่งปลั่ง · ใช้น้ำมะพร้าวแทนนม เพราะการเติมน้ำให้ร่างกายเป็นส่วนหนึ่งของผล · ใช้ภาษาแบบเวลเนส ห้ามอ้างสรรพคุณรักษา — พูดกับลูกค้าได้แค่ว่า เพื่อผิวและความสดชื่น ห้ามอ้างผลลัพธ์ · ละลายคอลลาเจนในของเหลวก่อนเสมอ ไม่อย่างนั้นจะจับตัวเป็นก้อน","The BEAUTY smoothie. Pineapple for vitamin C, strawberry for ellagic acid, mango for carotenoids. Dissolve the collagen in the liquid first."]},{"n":"29","de":"Orange Sunrise","th":"ออเรนจ์ ซันไรส์","en":"Orange Sunrise","stufe":"A","basis":0,"alg":"🌱","bestaetigt":0,"zut":[["OS",214,"Orangensaft FRISCH GEPRESST (nicht bis zum letzten Tropfen auspressen)","น้ำส้มคั้นสดใหม่ (อย่าคั้นจนหมดเกลี้ยง จะขม)","Orange juice FRESHLY PRESSED (do not squeeze to the last drop)"],["OZ",1,"Orangenzeste — NUR das Orange, kein Weiß (hier sitzt der Duft)","ผิวส้มขูด — เอาแต่ส่วนสีส้ม ไม่เอาสีขาว (กลิ่นอยู่ตรงนี้)","Orange zest - ONLY the orange part, no white (the aroma lives here)"],["IG",3,"Ingwer frisch","ขิงสด","Fresh ginger"],["MG",45,"Mango (frisch)","มะม่วงแช่แข็ง (สด)","Mango (fresh)"],["SA",0.25,"Salz — abwiegen, nicht schätzen","เกลือ — ต้องชั่ง ไม่กะ","Salt - weighed, not guessed"],["OG",165,"Orangensaft GEFROREN (die Kälte kommt aus der Orange selbst)","น้ำส้มแช่แข็ง (ความเ lz. Wir behalten das Salz und lassen den Zucker weg. ⚠ Nicht bis zum letzten Tropfen pressen - der letzte Druck holt die Bitterstoffe aus der weißen Haut.","ใหม่ 20.08. ยังไม่เคยปั่น · สามคำตอบต่อคำถามของปีเตอร์ · (1) ปั่นได้หรือไม่: อย่าใช้ส้มแช่แข็งทั้งกลีบ เยื่อขาวจะขมและถูกปั่นไปด้วย ให้แช่แข็งน้ำส้มที่คั้นเองเป็นแผ่นบางแล้วหักใช้แทน: ผลไม้ 100 % ไม่มีน้ำ ไม่มีน้ำแข็งเพิ่ม และความเย็นมาจากส้มเอง · มะม่วงให้เนื้อสัมผัสที่น้ำส้มอย่างเดียวไม่มีวันมี · (2) อะไรคือตัวชูรส: ผิวส้มขูด กลิ่นส้มกว่า 90 % คือลิโมนีนในน้ำมันที่เปลือก ไม่ใช่ในน้ำ ส้มที่ปอกจึงหอมกว่าส้มที่คั้น · ผิวขูด 1 กรัม ได้ผลมากกว่าน้ำส้มเพิ่ม 100 กรัม · (3) เกลือไม่ใช่สิ่งที่เราคิดขึ้นเอง: ร้านน้ำส้มไทยใส่น้ำเชื่อมพร้อมเกลือหยิบมือในน้ำส้มมาแต่ไหนแต่ไร เราเก็บเกลือไว้และตัดน้ำตาลออก · อย่าคั้นจนหมดเกลี้ยง แรงบีบครั้งสุดท้ายจะดึงความขมจากเยื่อขาวออกมา","NEW 20.08., never blended. Do NOT use frozen orange segments - the white membranes are bitter. Freeze your own juice instead. The aroma of an orange is over 90 % limonene in the PEEL oil, not in the juice - 1 g of zest beats 100 g more juice. The salt is traditional in Thai nam som; we keep the salt and drop the sugar."]},{"n":"30","de":"Espresso-Banane-Kakao","th":"เอสเปรสโซ-กล้วย-โกโก้","en":"Espresso-Banana-Cacao","stufe":"A","basis":0,"alg":"🌱","bestaetigt":0,"zut":[["HM",170,"Hafermilch — FLASCHE SCHÜTTELN","นมข้าวโอ๊ต — เขย่าขวดก่อน","Oat milk - SHAKE THE BOTTLE"],["KF",55,"Espresso — KALT, doppelter Bezug (nie heiß in den Mixer)","เอสเปรสโซ — เย็น 1 ช็อตคู่ (ห้ามใส่ตอนร้อน)","Espresso - COLD, double shot (never hot into the blender)"],["TO",60,"Seidentofu (Cremigkeit, schmeckt man nicht)","เต้าหู้อ่อน (ความครีมมี่ ไม่มีรสเต้าหู้)","Silken tofu (creaminess, not tasted)"],["BA",100,"Banane (frisch)","กล้วยแช่แข็ง (สด)","Banana (fresh)"],["KK",8,"Kakao ungesüßt","ผงโกโก้ไม่หวาน","Unsweetened cacao"],["SA",0.3,"Salz — abwiegen, nicht schätzen (nimmt dem Kaffee die Bitterkeit)","เกลือ — ต้องชั่ง ไม่กะ (ลดความขมของกาแฟ)","Salt - weighed, not guessed (t ot guessed"],["④ Gefrorenes ganz oben: Banane","④ ของแช่แข็งไว้บนสุด: กล้วยแช่แข็ง","④ Frozen last, on top: Banana"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["NEU 21.08., noch nie gemixt. Kein Experiment, sondern ein Klassiker der Region: Avocado mit Kaffee wird in Vietnam als cà phê bơ und in Indonesien als es alpukat kopi seit Jahrzehnten getrunken — dort mit gezuckerter Kondensmilch. Wir lassen den Zucker weg und holen die Süße aus der gefrorenen Banane. Das ist der Becher, der uns von jedem anderen Stand in Pattaya unterscheidet, und Avocado steht mit Nr. 11 ohnehin schon im Einkauf. ⚠ Avocado MUSS reif sein — eine harte Avocado schmeckt nach nichts und macht den Becher grasig. Daumendruck am Stielansatz: gibt leicht nach = reif. ⚠ KOFFEIN auf die Karte.","ใหม่ 21.08. ยังไม่เคยปั่น · ไม่ใช่การทดลอง แต่เป็นของคลาสสิกในภูมิภาค เวียดนามเรียก cà phê bơ อินโดนีเซียเรียก es alpukat kopi ดื่มกันมาหลายสิบปี ที่นั่นใส่นมข้นหวาน เราตัดน้ำตาลออกและเอาความหวานจากกล้วยแช่แข็งแทน · อะโวคาโดต้องสุก ถ้าแข็งจะไม่มีรสและเหม็นเขียว กดที่ขั้วเบา ๆ ถ้านิ่มคือสุก · อะโวคาโดมีอยู่ในรายการสั่งซื้ออยู่แล้วจากสูตรเบอร์ 11 · ต้องระบุคาเฟอีนบนเมนู","NEW 21.08., never blended. Not an experiment but a regional classic: avocado with coffee is drunk in Vietnam as ca phe bo and in Indonesia as es alpukat kopi, there with sweetened condensed milk. We drop the sugar and take the sweetness from the frozen banana. The avocado MUST be ripe."]},{"n":"32","de":"Passionsfrucht grün-Mango-Kokos","th":"เสาวรสเขียว-มะม่วง-กะทิ","en":"Green Passion-Mango-Coconut","stufe":"A","basis":0,"alg":"","bestaetigt":0,"zut":[["KO",173,"Kokosmilch (der Aromaträger — Fett bindet das Passionsfrucht-Aroma)","กะทิ (ตัวพากลิ่น — ไขมันจับกลิ่นเสาวรส)","Coconut milk (the aroma carrier)"],["PG",70,"Passionsfrucht GRÜN, mit Kernen — NICHT absieben","เสาวรสสีเขียว พร้อมเมล็ด — ห้ามกรอง","Passion fruit GREEN, with seeds — do NOT strain"],["MG",115,"Mango (frisch)","มะม่วงแช่แข็ง (สด)","Mango (fresh)"],["SA",0.3,"Salz — abwiegen, nicht schätzen (dämpft die Säure)","เกลือ — ต้องชั่ง ไม่กะ (ลดความเปรี้ยว)","Salt — weighed, not guessed"],["MG",115,"Mango (gefroren)","มะม่วงแช่แข็ง (แช่แข็ง)","Mango (frozen)"]],"schritte":[["MIXBEHÄLTER: der breite 1,5 L (breiter Boden, 24 cm) — dünnflüssig","โถปั่น: โถกว้าง 1.5 ล. (ก้นกว้าง สูง 24 ซม.) — เนื้อเหลว","BLENDER JAR: the wide 1.5 L (wide base, 24 cm) — thin drink"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Kokosmilch","① ใส่ของเหลวก่อน: กะทิ","① Liquids first: Coconut milk"],["② Frisches & Weiches: Passionsfrucht GRÜN, mit Kernen, Mango","② ของสดและของนิ่ม: เสาวรสสีเขียว พร้อมเมล็ด · มะม่วงแช่แข็ง","② Fresh & soft: Passion fruit GREEN, with seeds, Mango"],["③ Trockenes darüber: Salz","③ ใส่ของแห้งทับ: เกลือ","③ Dry on top: Salt"],["④ Gefrorenes ganz oben: Mango","④ ของแช่แข็งไว้บนสุด: มะม่วงแช่แข็ง","④ Frozen last, on top: Mango"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["DER KICK IST DIE GRÜNE PASSIONSFRUCHT — und sie ist das Gegenteil der Erdbeere, an der wir uns heute die Zähne ausgebissen haben: sie bringt das Aroma MIT der Säure, nicht ohne. ⚠ Peters Urteil vom 23.08. („mehr Säure, aber auch viel mehr Aroma\") widerspricht der Katalognotiz vom 14.08., die die ROTE als die aromatischere führte — beide nebeneinander gegenprüfen, bevor über den Preis entschieden wird. RECHNUNG: grün kostet 271 ฿ je kg Fruchtmark gegen 158 bei rot, also 72 % mehr; das gleicht sich aus, sobald 58 % der Menge für dasselbe Aroma reichen. KERNE BLEIBEN DRIN — das Knacken ist das Erkennungsmerkmal, und die Kerne tragen den größten Teil der Ballaststoffe: rohe Passionsfruchtkerne liegen bei 64,8 g je 100 g, Kerne und Mark zusammen bei 53,5 g. Wer absiebt, siebt genau das weg. KOKOSMILCH IST KEIN FÜLLER, sondern der Aromaträger: Fett bindet die fettlöslichen Aromastoffe und hält sie länger im Mund — genau das, was die fettarme Hafermilch bei Nr. 21 nicht konnte. ⚠ NEU 23.08., noch nie gemixt. Salz-Test durchführen: bei dieser Säure ist Salz der stärkste Hebel.","จุดเด่นคือเสาวรสสีเขียว และมันตรงข้ามกับสตรอว์เบอร์รี่ที่เรามีปัญหาวันนี้: มันให้กลิ่นรสมาพร้อมความเปรี้ยว ไม่ใช่เปรี้ยวเพียงอย่างเดียว · คำตัดสินของปีเตอร์ 23.08. (“เปรี้ยวกว่า แต่ก็หอมกว่ามาก”) ขัดกับบันทึกในคู่มือเมื่อ 14.08. ที่ระบุว่าพันธุ์สีม่วงหอมกว่า — ต้องชิมเทียบกันก่อนตัดสินเรื่องราคา · ตัวเลข: สีเขียวราคา 271 บาทต่อกิโลเนื้อ ส่วนสีม่วง 158 บาท แพงกว่า 72 % จะคุ้มกันถ้าใช้เพียง 58 % ของปริมาณก็ได้กลิ่นเท่าเดิม · ห้ามกรองเมล็ดออก — เสียงกรุบคือเอกลักษณ์ และเมล็ดคือส่วนที่มีใยอาหารมากที่สุด: เมล็ดดิบ 64,8 กรัม ต่อ 100 กรัม เมล็ดรวมเนื้อ 53,5 กรัม · ใครกรอง ก็กรองสิ่งนี้ทิ้ง · กะทิไม่ใช่ตัวเติม แต่เป็นตัวพากลิ่น: ไขมันจับกลิ่นที่ละลายในไขมันและเก็บไว้ในปากนานกว่า — สิ่งที่นมข้าวโอ๊ตไขมันต่ำทำไม่ได้ในเบอร์ 21 · ใหม่ 23.08. ยังไม่เคยปั่น · ให้ทำการทดสอบเกลือ: ที่ความเปรี้ยวระดับนี้ เกลือคือตัวช่วยที่แรงที่สุด","THE KICK IS THE GREEN PASSION FRUIT — the opposite of the strawberry problem: it brings the aroma WITH the acid, not without it. Seeds stay in: raw passion fruit seeds carry 64.8 g dietary fibre per 100 g, seeds and pulp together 53.5 g. Straining removes exactly that. Coconut milk is not a filler but the aroma carrier — fat binds the fat-soluble aromatics. NEW 23.08., never blended."]},{"n":"33","de":"Mango-Ananas-Mandelmilch","th":"มะม่วง-สับปะรด-นมอัลมอนด์","en":"Mango-Pineapple-Almond","stufe":"A","basis":0,"alg":"","bestaetigt":0,"zut":[["MM",180,"Mandelmilch — Karton pruefen: steht SOJAPROTEIN drauf, siehe Hinweis","นมอัลมอนด์ — ตรวจกล่อง: ถ้ามีโปรตีนถั่วเหลือง ดูคำเตือน","Almond milk — check the carton for added soy protein"],["MG",85,"Mango (frisch)","มะม่วงแช่แข็ง (สด)","Mango (fresh)"],["AN",57.7,"Ananas (frisch)","สับปะรดแช่แข็ง (สด)","Pineapple (fresh)"],["SA",0.3,"Salz — abwiegen, nicht schaetzen","เกลือ — ต้องชั่ง ไม่กะ","Salt — weighed, not guessed"],["MG",90,"Mango (gefroren)","มะม่วงแช่แข็ง (แช่แข็ง)","Mango (frozen)"],["AN",60,"Ananas (gefroren)","สับปะรดแช่แข็ง (แช่แข็ง)","Pineapple (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Mandelmilch","① ใส่ของเหลวก่อน: นมอัลมอนด์","① Liquids first: Almond milk"],["② Frisches & Weiches: Mango, Ananas","② ของสดและของนิ่ม: มะม่วงแช่แข็ง · สับปะรดแช่แข็ง","② Fresh & soft: Mango, Pineapple"],["③ Trockenes darüber: Salz","③ ใส่ของแห้งทับ: เกลือ","③ Dry on top: Salt"],["④ Gefrorenes ganz oben: Mango, Ananas","④ ของแช่แข็งไว้บนสุด: มะม่วงแช่แข็ง · สับปะรดแช่แข็ง","④ Frozen last, on top: Mango, Pineapple"],["90\"-Taste  (90 s, höchste Stufe)","กดปุ่ม 90 วินาที  (90 วินาที ความเร็วสูงสุด)","The 90\" button  (90 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["MANGO FUEHRT, ANANAS GIBT DEN KICK — 175 g gegen 117,7 g, also rund 1,5 : 1. Andersherum kippt der Becher in die Saeure, und die duenne Mandelmilch faengt das nicht auf. WARUM 180 g FLUESSIG: alle Basis-Rezepte liegen bei 35-48 % Fluessigkeit; Nr. 16 (Ananas-Passionsfrucht-Kokos, Peters bester mit 9 Punkten) liegt bei 38 % — genau darauf ist dieser hier gesetzt. ⚠ KARTON PRUEFEN: unsere Mandelmilch ist V-Soy, also von . 13. DER WIDERSPRUCH UND SEINE AUFLÖSUNG: Zunehmen heißt Kalorien, Diabetes heißt kein Zucker. Der Ausweg ist FETT — es hat mehr als doppelt so viele Kalorien je Gramm wie Zucker und bewegt den Blutzucker praktisch nicht. Deshalb tragen Hanfsamen, Avocado und Vollmilch diesen Becher, nicht Banane und nicht Sirup. RECHNUNG (Referenzwerte aus Nährwerttabellen, ⚠ nicht an unseren Zutaten gemessen): rund 620 kcal auf 535 g. Der Löwenanteil kommt aus 25 g Hanfsamen und 40 g Haferflocken. Zum Vergleich: Nr. 13 liegt bei etwa 200 kcal. WARUM KAKAO DEN BROKKOLI RETTET: Peters Zweifel war berechtigt — im grünen Becher schmeckt man ihn. Kakao ist bitter und dunkel; die Bitterkeit deckt den Kohlgeschmack, die Farbe deckt das Grün. Dieselbe Überlegung wie bei Nr. 36. Der Brokkoli sinkt trotzdem von 60 g auf 30 g. ⚠ KEIN SALZ. In jedem Verkaufsrezept ist Salz der stärkste Hebel gegen Säure — hier ist es gesperrt, weil bei Bauchwasser Natrium begrenzt wird. Nr. 13 hat auch keins. Nicht nachträglich zufügen, auch nicht \"nur eine Prise\". AUF ZWEI GLÄSER: 535 g auf einmal drücken bei Bauchwasser auf den Bauch. Zweimal ein halber Becher über den Tag bringt dieselben Kalorien, ohne Völlegefühl. KEINE BANANE, KEIN ZUCKER (Diabetes), KEIN Grapefruit/Pomelo (Eliquis) — unverändert aus Nr. 13. ANANAS GEHÖRT HIER NICHT HINEIN, obwohl Peter sie liebt: ihr Bromelain zerlegt genau das Eiweiß, das dieser Becher liefern soll, in bittere Bruchstücke — und das zweite Glas steht. Der Ananas-Becher ist Nr. 42, dort trägt Kokosfett statt Eiweiß die Kalorien. ⚠ NEU 24.08.2026, noch nie gemixt. Die Eiweißmenge und die Natriumgrenze entscheidet der Arzt, nicht dieses Rezept.","🔒 ไม่อยู่ในเมนูขาย — แก้วส่วนตัวของปีเตอร์ เป็นฉบับที่ทำให้อิ่มของเบอร์ 13 · ความขัดแย้งและทางออก: จะเพิ่มน้ำหนักต้องมีแคลอรี แต่เบาหวานห้ามน้ำตาล · ทางออกคือไขมัน — ให้แคลอรีต่อกรัมมากกว่าน้ำตาลสองเท่า และแทบไม่ขยับน้ำตาลในเลือด · ดังนั้นแก้วนี้จึงพึ่งเมล็ดกัญชง อะโวคาโด และนมไขมันเต็ม ไม่ใช่กล้วยและไม่ใช่น้ำเชื่อม · การคำนวณ ccoli still drops from 60 g to 30 g. ⚠ NO SALT. In every sales recipe salt is the strongest lever against acid — here it is blocked, because ascites means limiting sodium. Nr. 13 has none either. Do not add it later, not even a pinch. ⚠ SOAKING THE OATS IS MANDATORY, not a refinement — dry into a cold cup they turn gritty and hard to digest. TWO GLASSES: 535 g at once presses on a distended abdomen. Half a cup twice a day delivers the same calories without the fullness. NO banana, NO sugar (diabetes), NO grapefruit or pomelo (Eliquis) — unchanged from Nr. 13. PINEAPPLE DOES NOT BELONG HERE although Peter loves it: its bromelain splits exactly the protein this cup is meant to deliver into bitter fragments, and the second glass stands. The pineapple cup is Nr. 42, where coconut fat carries the calories instead of protein. NEW 24.08.2026, never blended. The protein amount and the sodium limit are the doctor's call, not this recipe's."]},{"n":"42","de":"Ananas-Kokos-Kraft 🔒","th":"สับปะรด-กะทิ-พลัง 🔒","en":"Pineapple-Coconut-Strength 🔒","stufe":"A","basis":0,"alg":"","bestaetigt":0,"zut":[["KO",200,"Kokosmilch — fast reines Fett, deshalb greift das Bromelain nichts an","กะทิ — เกือบเป็นไขมันล้วน โบรมีเลนจึงไม่มีอะไรให้ย่อย","Coconut milk — almost pure fat, so the bromelain has nothing to attack"],["AN",90,"Ananas (frisch)","สับปะรดแช่แข็ง (สด)","Pineapple (fresh)"],["AV",60,"Avocado — Fett ohne Zucker, macht es samtig statt wässrig","อะโวคาโด — ไขมันที่ไม่มีน้ำตาล ทำให้เนื้อนุ่มลื่นไม่ใส","Avocado — fat without sugar, velvety instead of watery"],["GK",60,"Gurke mit Schale — Volumen und Frische, ohne Zucker dazuzugeben","แตงกวาทั้งเปลือก — เพิ่มปริมาณและความสดชื่นโดยไม่เพิ่มน้ำตาล","Cucumber with skin — volume and freshness without adding sugar"],["IG",2,"Ingwer — ein Hauch, er hebt die Ananas an","ขิง — แผ่วบาง ๆ ช่วยชูรสสับปะรด","Ginger — a hint, it lifts the pineapple"],["ZI",0.5,"Ceylon-Zimt — schmeckt süß, ohne Zucker zu sein","อบเชยซีลอน — ให้ความรู้สึกหวานโดยไม่มี taten gemessen): rund 570 kcal auf 502 g, davon etwa zwei Drittel aus der Kokosmilch. Fruchtzucker rund 20 g — vergleichbar mit Nr. 41, weil die Gurke Volumen ohne Zucker liefert. SO ERGIBT SICH EIN PAAR, KEIN ENTWEDER-ODER: Nr. 41 ist der Eiweiß-Becher für den Muskel, Nr. 42 der Ananas-Becher. Abwechselnd getrunken deckt das beide Ziele. ⚠ KEIN SALZ — wie bei Nr. 13 und Nr. 41, wegen Bauchwasser. ⚠ KOKOSMILCH IST NICHT KOKOSWASSER. Ausgeschlossen wurde Kokos-WASSER (Kalium). Kokosmilch ist ein anderes Erzeugnis mit deutlich weniger Kalium je Portion, aber nicht null — beim nächsten Arzttermin ansprechen, bevor das ein täglicher Becher wird. 60 SEKUNDEN SIND DIE ZUTAT: bei Nr. 16 haben Ananasfasern die Glattheit auf 4 von 10 gedrückt. ALLE ZUTATEN IM HAUS (Bestand 24.08.): Kokosmilch 500 g, Ananas 1.146 g, Avocado 200 g, Gurke 300 g, Ingwer 30 g, Zimt 100 g. ⚠ NEU 24.08.2026, noch nie gemixt.","🔒 ไม่อยู่ในเมนูขาย — แก้วสับปะรดส่วนตัวของปีเตอร์ เป็นคู่ของเบอร์ 41 · ทำไมสับปะรดใส่ในเบอร์ 41 ไม่ได้: เบอร์ 41 ตั้งใจให้มีโปรตีนสูง (นม โยเกิร์ต เมล็ดกัญชง) · สับปะรดมีเอนไซม์โบรมีเลนที่ย่อยโปรตีนจนเกิดรสขม — การแช่แข็งไม่ทำลายมัน มีแต่ความร้อนที่ทำได้ · และเพราะเบอร์ 41 ต้องแบ่งดื่มสองแก้วตลอดวัน แก้วที่สองจะตั้งทิ้งไว้และกลายเป็นขม · ทางแก้ไม่ใช่การเลิกใส่ แต่คือเปลี่ยนตัวพา: โบรมีเลนต้องมีโปรตีนจึงจะสร้างปัญหาได้ · กะทิเกือบเป็นไขมันล้วนและมีโปรตีนน้อยมาก — แคลอรีในแก้วนี้จึงมาจากไขมันแทนโปรตีน และเอนไซม์ก็ไม่มีอะไรให้ย่อย · แก้วนี้ตั้งทิ้งไว้ได้ · การคำนวณ (ค่าอ้างอิงจากตารางโภชนาการ ยังไม่ได้วัดจากวัตถุดิบของเราเอง): ประมาณ 570 กิโลแคลอรี ต่อ 502 กรัม ราวสองในสามมาจากกะทิ · น้ำตาลผลไม้ราว 20 กรัม เทียบเท่าเบอร์ 41 เพราะแตงกวาเพิ่มปริมาณโดยไม่เพิ่มน้ำตาล · จึงกลายเป็นคู่ ไม่ใช่ต้องเลือกอย่างใดอย่างหนึ่ง: เบอร์ 41 คือแก้วโปรตีนเพื่อกล้ามเนื้อ เบอร์ 42 คือแก้วสับปะรด · ดื่มสลับกันจะได้ทั้งสองเป้าหมาย · ห้ามใส่เกลือ — เหมือนเบอร์ 13 และ 41 เพราะภาวะน้ำในช่องท้อง · กะทิไม่ใช่น้ำมะพร้าว · สิ่งที่ห้ามคือน้ำมะพร้าว (โพแทสเซียม) · กะทิเป็นผลิตภัณฑ์อีกชนิด มีโพแทสเซียมต่อหนึ่งเสิร์ฟน้อยกว่ามาก แต่ไม่ใช่ศูนย์ — ให้ปรึกษาแพทย์ครั้งต่อไปก่อนที่จะดื่มเป็นประจำทุกวัน · 60 วินาทีคือส่วนผสมอย่างหนึ่ง: ในเบอร์ 16 เส้นใยสับปะรดทำให้คะแนนความเนียนตกเหลือ 4 เต็ม 10 · วัตถุดิบมีอยู่ในบ้านทั้งหมด (สต๊อก 24.08.): กะทิ 500 กรัม สับปะรด 1.146 กรัม อะโวคาโด 200 กรัม แตงกวา 300 กรัม ขิง 30 กรัม อบเชย 100 กรัม · ใหม่ 24.08.2026 ยังไม่เคยปั่น","🔒 NOT on the sales menu — Peter's personal pineapple cup, the counterpart to Nr. 41. WHY PINEAPPLE CANNOT GO INTO NR. 41: that cup is deliberately protein-rich (milk, yoghurt, hemp seeds). Pineapple carries bromelain, an enzyme that splits protein into bitter fragments — freezing does not destroy it, only heat does. And since Nr. 41 is split across two glasses over the day, the second glass would stand and turn bitter. THE ANSWER IS NOT GOING WITHOUT, BUT A DIFFERENT CARRIER: bromelain needs protein to do damage. Coconut milk is almost pure fat and brings almost none — the calories here come from fat instead of protein, and the enzyme finds nothing. This cup may stand. MATH (reference values, ⚠ not measured on our own ingredients): about 570 kcal in 502 g, roughly two thirds from the coconut milk. Fruit sugar about 20 g, comparable to Nr. 41, because the cucumber delivers volume without sugar. SO IT IS A PAIR, NOT AN EITHER-OR: Nr. 41 is the protein cup for muscle, Nr. 42 the pineapple cup. Alternating them covers both goals. ⚠ NO SALT — as in Nr. 13 and Nr. 41, because of ascites. ⚠ COCONUT MILK IS NOT COCONUT WATER. What was excluded is coconut WATER (potassium). Coconut milk is a different product with far less potassium per serving, but not zero — raise it at the next doctor's appointment before this becomes a daily cup. 60 SECONDS IS AN INGREDIENT: at Nr. 16 pineapple fibres pushed smoothness down to 4 of 10. ALL INGREDIENTS IN THE HOUSE (stock 24.08.). NEW 24.08.2026, never blended."]},{"n":"43","de":"Wassermelone-Minze (frisch & gefroren)","th":"แตงโม-สะระแหน่ (สดและแช่แข็ง)","en":"Watermelon-Mint (fresh & frozen)","stufe":"A","basis":0,"alg":"","bestaetigt":0,"zut":[["WM",235,"Wassermelone (frisch)","แตงโม (สด)","Watermelon (fresh)"],["MI",2,"Minze, gezählt (12-15 Blätter)","ใบสะระแหน่ เด็ดใบ (12-15 ใบ)","Mint, counted (12-15 leaves)"],["SA",0.3,"Salz — Prise. Verstärkt die Süße der Wassermelone, wie im thai Nam Som","เกลือ — นิดเดียว ช่วยชูความหวานของแตงโม แบบเดียวกับน้ำส้มไทย","Salt — a pinch. Lifts the sweetness of the melon, same trick as in Thai nam som"],["WM",235,"Wassermelone (gefroren)","แตงโม (แช่แข็ง)","Watermelon (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["② Frisches & Weiches: Wassermelone, Minze, gezählt","② ของสดและของนิ่ม: แตงโม · ใบสะระแหน่ เด็ดใบ","② Fresh & soft: Watermelon, Mint, counted"],["③ Trockenes darüber: Salz","③ ใส่ของแห้งทับ: เกลือ","③ Dry on top: Salt"],["④ Gefrorenes ganz oben: Wassermelone","④ ของแช่แข็งไว้บนสุด: แตงโม","④ Frozen last, on top: Watermelon"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["EINFACHSTES REZEPT DER KARTE. Zwei Zutaten (Wassermelone + Minze), eine Prise Salz. WARUM 1:1 FRISCH+GEFROREN: reine frische Wassermelone ist warm und wässrig. Reine gefrorene Wassermelone verliert Aroma und schmeckt nach Sorbet. Die Mischung bringt Kälte OHNE Aromaverlust — die frische Hälfte hält den Duft, die gefrorene die Temperatur. Kein Eiszusatz nötig, keine Milch, kein Fett-Träger (Wassermelone ist nicht sauer). WARUM MINZE PASST: Wassermelone+Minze ist das älteste Kombinationspaar in der arabischen und mexikanischen Sommergetränke-Tradition (agua fresca). Die Minze muss frisch sein — getrocknet schmeckt sie nach Zahnpasta. Und sie muss ANGEQUETSCHT werden, nicht zerhackt: Zerhacken bricht die Blätter und setzt Bitterstoffe frei; Anquetschen presst nur die ätherischen Öle raus. SALZ: 0,3 g klingt wie Rundungsfehler, aber der Effekt ist gewaltig. Salz maskiert Bittere und verstärkt Süße-Wahrnehmung — deshalb wird in Thai-Fruchtsäften traditionell mit einer Prise Salz gearbeitet, nicht mit mehr Zucker. GRAB-TAUGLICH: keine Deko, keine Toppings, durch den Halm trinkbar. Regel 8 erfüllt. AGUA-FRESCA-SIGNATURE: dieses Rezept ist der Sommer-Becher schlechthin — man kann Gäste damit bewirten, die noch nie ein 100blend-Smoothie getrunken haben, und sie verstehen ihn sofort. Nichts zu erklären, nur Wassermelone kalt und lebendig. ⚠ NEU 25.08.2026, noch nie gemixt.","สูตรที่ง่ายที่สุดในเมนู · สองวัตถุดิบ (แตงโม + สะระแหน่) กับเกลือหนึ่งหยิบมือ · ทำไม 1:1 สด+แช่แข็ง: แตงโมสดล้วนอุ่นและเป็นน้ำ · แตงโมแช่แข็งล้วนสูญเสียกลิ่นและกลายเป็นเชอร์เบท · การผสมครึ่งต่อครึ่งให้ความเย็นโดยไม่เสียกลิ่น — ครึ่งสดเก็บกลิ่น ครึ่งแช่แข็งเก็บอุณหภูมิ · ไม่ต้องใส่น้ำแข็ง ไม่ต้องใส่นม ไม่ต้องมีตัวพาไขมัน (แตงโมไม่เปรี้ยว) · ทำไมสะระแหน่เข้ากัน: แตงโม+สะระแหน่คือคู่เก่าแก่ที่สุดในเครื่องดื่มฤดูร้อนของอาหรับและเม็กซิโก (agua fresca) · สะระแหน่ต้องสด — แบบแห้งจะเหมือนยาสีฟัน · และต้องบดเบา ๆ ไม่ใช่สับ: สับจะทำให้ใบแตกและปล่อยรสขม ส่วนบดเบา ๆ จะบีบเฉพาะน้ำมันหอม · เกลือ: 0.3 กรัม ดูเหมือนไม่มีค่า แต่ผลใหญ่มาก · เกลือกลบรสขมและเพิ่มการรับรู้ความหวาน — นี่คือเหตุผลที่น้ำผลไม้ไทยใช้เกลือแทนน้ำตาลเพิ่ม · ผ่านเกณฑ์แกร็บ: ไม่มีของแต่ง ไม่มีท็อปปิ้ง ดื่มผ่านหลอดได้ ผ่านกฎข้อ 8 · ซิกเนเจอร์อาควาเฟรสก้า: สูตรนี้คือแก้วฤดูร้อนของแท้ — ให้แขกที่ไม่เคยดื่ม 100blend มาก่อนดื่มได้ทันที ไม่ต้องอธิบายอะไร แค่แตงโมเย็นและมีชีวิต · ใหม่ 25.08.2026 ยังไม่เคยปั่น","SIMPLEST RECIPE ON THE MENU. Two ingredients (watermelon + mint), a pinch of salt. WHY 1:1 FRESH+FROZEN: pure fresh watermelon is warm and watery. Pure frozen watermelon loses aroma and tastes like sorbet. The blend brings cold WITHOUT aroma loss — the fresh half keeps the scent, the frozen half keeps the temperature. No added ice, no milk, no fat carrier (watermelon is not acidic). WHY MINT WORKS: watermelon+mint is the oldest pairing in Arabic and Mexican summer-drink tradition (agua fresca). The mint must be fresh — dried mint tastes like toothpaste. And it must be BRUISED, not chopped: chopping breaks the leaves and releases bitters; bruising presses out only the essential oils. SALT: 0.3 g sounds like a rounding error, but the effect is huge. Salt masks bitters and boosts sweetness perception — that is why Thai fruit juices traditionally use a pinch of salt instead of more sugar. GRAB-COMPATIBLE: no deco, no toppings, drinkable through a straw. Rule 8 met. AGUA FRESCA SIGNATURE: this is the summer cup, plain and simple — you can serve it to guests who have never had a 100blend smoothie, and they get it instantly. Nothing to explain, just watermelon cold and alive. ⚠ NEW 25.08.2026, never blended."]},{"n":"44","de":"Beere-Kakao-Mandel (Praliné)","th":"เบอร์รี-โกโก้-อัลมอนด์","en":"Berry-Cacao-Almond","stufe":"B","basis":0,"alg":"🥛","bestaetigt":0,"zut":[["KM",200,"Kuhmilch EISKALT — das Milchfett trägt Kakao UND Mandel-Aroma","นมวัวเย็นจัด — ไขมันในนมพาทั้งกลิ่นโกโก้และอัลมอนด์","Cold milk — dairy fat carries both cacao AND almond aroma"],["BA",55,"Banane (frisch)","กล้วยแช่แข็ง (สด)","Banana (fresh)"],["MA",30,"Mandeln GERÖSTET ungesalzen, GANZ in den Mixer — kein Einweichen (Nr. 43 verifiziert)","อัลมอนด์คั่วไม่ใส่เกลือทั้งเมล็ด ใส่เครื่องปั่นได้เลย — ไม่ต้องแช่ (เบอร์ 43 ยืนยัน)","Roasted unsalted almonds, WHOLE into the mixer — no soaking (verified by Nr. 43)"],["KK",10,"Kakao ungesüßt — dämpft die Beerensäure und verbindet Beere mit Mandel","โกโก้ไม่ใส่น้ำตาล — ลดความเปรี้ยวของเบอร์รีและเชื่อมกับอัลมอนด์","Unsweetened cacao — softens berry acid and links berry to almond"],["ZI",0.5,"Ceylon-Zimt — schmeckt süß, ohne Zucker zu sein","อบเชยซีลอน — ให้ความรู้สึกหวานโดยไม่มีน้ำตาล","Ceylon cinnamon — tastes sweet without being sugar"],["SA",0.3,"Salz — hebt den Kakao und rundet die Beerensäure","เกลือ — ชูโกโก้และช่วยเบอร์รี","Salt — lifts the cacao and rounds the berry acid"],["BM",130,"Beeren-Mix GEFROREN — die Säure gegen die Süße von Kakao/Banane","เบอร์รีรวมแช่แข็ง — ความเปรี้ยวมาสมดุลกับความหวานของโกโก้และกล้วย","Berry-mix FROZEN — acidity balances the sweetness of cacao and banana"],["BA",45,"Banane (gefroren)","กล้วยแช่แข็ง (แช่แข็ง)","Banana (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Kuhmilch EISKALT","① ใส่ของเหลวก่อน: นมวัวเย็นจัด","① Liquids first: Cold milk"],["② Frisches & Weiches: Banane","② ของสดและของนิ่ม: กล้วยแช่แข็ง","② Fresh & soft: Banana"],["③ Trockenes darüber: Mandeln GERÖSTET ungesalzen, GANZ in den Mixer, Kakao ungesüßt, Ceylon-Zimt, Salz","③ ใส่ของแห้งทับ: อัลมอนด์คั่วไม่ใส่เกลือทั้งเมล็ด ใส่เครื่องปั่นได้เลย · โกโก้ไม่ใส่น้ำตาล · อบเชยซีลอน · เกลือ","③ Dry on top: Roasted unsalted almonds, WHOLE into the mixer, Unsweetened cacao, Ceylon cinnamon, Salt"],["④ Gefrorenes ganz oben: Beeren-Mix, Banane","④ ของแช่แข็งไว้บนสุด: เบอร์รีรวมแช่แข็ง · กล้วยแช่แข็ง","④ Frozen last, on top: Berry-mix, Banana"],["90\"-Taste  (90 s, höchste Stufe)","กดปุ่ม 90 วินาที  (90 วินาที ความเร็วสูงสุด)","The 90\" button  (90 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["TESTKANDIDAT (Stufe B) NEU 25.08.2026, noch nie gemixt. Die Kombination Beere+Kakao+Mandel ist die klassische PRALINÉ-Formel — Sacher, Rehrücken, Nougat: alle drei drehen sich um genau diese drei Aromen. WARUM ES FUNKTIONIEREN SOLLTE: (1) Beerenmix bringt Säure, die den Kakao braucht, sonst wirkt er dumpf. (2) Geröstete Mandeln geben eine tiefe Nuss-Note, die Mandelmilch nicht schafft — Rösten setzt Aromastoffe frei, die im Rohmandel gebunden sind. (3) Banane liefert die Süße OHNE Zucker und bindet die Mischung. WARUM NR. 44 UND NICHT NR. 36 REICHT: Nr. 36 (Erdbeere-Schoko-Mandel) hat Erdbeere allein und Mandel als MILCH — leichter und einfarbig-pink. Nr. 44 hat den vollen Beeren-Mix (dunkler, komplexer) und GANZE Mandeln (nussiger, sättigender). Andere Zielgruppe: Nr. 36 = Frühstück-leicht, Nr. 44 = Dessert-satt. NACH DEM MIXEN: sofort trinken, sonst setzt sich der Mandel-Trester unten ab. Wenn es zu dick wird: 20 g Milch nachgießen. Wenn es sandig ist: nochmal 20 Sekunden mixen — geröstete Mandeln brauchen etwas mehr Zeit als Mandelmilch. Grab-tauglich (Regel 8): keine Deko, alles im Mix, durch den Halm trinkbar.","แบบทดสอบ (ระดับ B) ใหม่ 25.08.2026 ยังไม่เคยปั่น · การรวมกันของเบอร์รี+โกโก้+อัลมอนด์คือสูตรพราลิเน่คลาสสิก — ซาเชอร์ เรห์รือคเคน นูกาต์ ทั้งสามอย่างหมุนรอบสามกลิ่นนี้ · ทำไมมันน่าจะได้ผล: (1) เบอร์รีให้ความเปรี้ยวที่โกโก้ต้องการ ไม่งั้นจะทึม (2) อัลมอนด์คั่วให้ความหอมลึกที่นมอัลมอนด์ทำไม่ได้ — การคั่วปลดปล่อยกลิ่นที่ผูกอยู่ในอัลมอนด์ดิบ (3) กล้วยให้ความหวานโดยไม่มีน้ำตาลและช่วยยึดส่วนผสม · ทำไมเบอร์ 44 ต้องมีทั้งที่มีเบอร์ 36: เบอร์ 36 (สตรอว์เบอร์รี-ช็อกโกแลต-อัลมอนด์) มีสตรอว์เบอร์รีอย่างเดียวและอัลมอนด์ในรูปนม — เบา สีชมพูล้วน · เบอร์ 44 มีเบอร์รีรวมเต็ม (สีเข้มกว่า ซับซ้อนกว่า) และอัลมอนด์ทั้งเมล็ด (หอมกว่า อิ่มกว่า) · กลุ่มเป้าหมายต่างกัน: เบอร์ 36 = อาหารเช้าเบา ๆ เบอร์ 44 = ของหวานอิ่ม · หลังปั่น: ดื่มทันที ไม่งั้นกากอัลมอนด์จะตกก้น · ถ้าข้นเกิน: เติมนม 20 กรัม · ถ้าสาก: ปั่นต่ออีก 20 วินาที — อัลมอนด์คั่วใช้เวลานานกว่านมอัลมอนด์เล็กน้อย · ผ่านเกณฑ์แกร็บ (กฎ 8): ไม่มีของแต่ง ทุกอย่างอยู่ในแก้ว ดื่มผ่านหลอดได้","TEST CANDIDATE (stufe B) NEW 25.08.2026, never blended. The combination berry+cacao+almond is the classic PRALINÉ formula — Sachertorte, Rehrücken, nougat: all three revolve around exactly these three aromas. WHY IT SHOULD WORK: (1) Berry mix brings acidity, which cacao needs — otherwise it tastes flat. (2) Roasted almonds give a deep nut note that almond milk cannot deliver — roasting releases aroma compounds that are locked in the raw nut. (3) Banana delivers sweetness WITHOUT sugar and binds the mixture. WHY NR. 44 IF NR. 36 ALREADY EXISTS: Nr. 36 (Strawberry-Chocolate-Almond) uses strawberry alone and almond AS MILK — lighter, monochrome pink. Nr. 44 uses the full berry mix (darker, more complex) and WHOLE almonds (nuttier, more filling). Different targets: Nr. 36 = light breakfast, Nr. 44 = dessert-satisfying. AFTER BLENDING: drink immediately, otherwise the almond pulp settles. If too thick: add 20 g milk. If sandy: blend another 20 s — roasted almonds need a touch more time than almond milk. Grab-compatible (rule 8): no deco, everything in the mix, drinkable through a straw."]},{"n":"45","de":"Tarator (Gurke-Joghurt-Knoblauch) 🧪","th":"ทาราเตอร์ 🧪","en":"Tarator (savoury lab) 🧪","stufe":"X","basis":0,"alg":"🥛","bestaetigt":0,"zut":[["WA",60,"Flaschen-Trinkwasser EISKALT (KEIN Leitungswasser) — macht es trinkbar (Joghurt allein ist zu dick für einen Smoothie)","น้ำเย็นจัด — ทำให้ดื่มได้ (โยเกิร์ตล้วนข้นเกินไปสำหรับสมูทตี้)","Ice-cold water — makes it drinkable (yoghurt alone is too thick)"],["LS",5,"Limettensaft — hebt alle Aromen und ersetzt Balsamico/Weißweinessig","น้ำมะนาว — ชูกลิ่นทั้งหมด แทนน้ำส้มสายชูองุ่นขาว","Lime juice — lifts all aromas and replaces balsamic/white wine vinegar"],["JO",240,"Naturjoghurt UNGESÜẞT — die Basis und der Fett-Träger","โยเกิร์ตธรรมชาติไม่หวาน — เป็นฐานและตัวพาไขมัน","Plain unsweetened yoghurt — base and fat carrier"],["GK",120,"Gurke MIT SCHALE — Frische, Volumen, klassisch bulgarisch","แตงกวาทั้งเปลือก — สดชื่น เพิ่มปริมาณ แบบบัลแกเรียคลาสสิก","Cucumber WITH SKIN — freshness, volume, classic Bulgarian"],["KB",4,"Knoblauch ≈½ Zehe — mit dem Salz  ≈½ clove, Shallot instead of regular onion, dill, Mint, counted"],["③ Trockenes darüber: Schwarzer Pfeffer, gemahlen, Salz","③ ใส่ของแห้งทับ: พริกไทยดำ บดสด ๆ · เกลือ","③ Dry on top: Black pepper, FRESHLY ground, Salt"],["35\"-Taste  (30 s, höchste Stufe)","กดปุ่ม 35 วินาที  (30 วินาที ความเร็วสูงสุด)","The 35\" button  (30 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["🧪 LABOR-REZEPT (Stufe X), NEU 25.08.2026 · Der erste HERZHAFTE Smoothie in der Karte — direkte Vorlage: Tarator (Bulgarien) / Cacık (Türkei) / Tzatziki (Griechenland als Sauce). Zielgruppe: der Gast, der nichts Süßes will, oder als Begleiter zu Essen. NICHT als Zwischenmahlzeit-Smoothie gedacht. WARUM SCHALOTTE STATT ZWIEBEL: rohe normale Zwiebel setzt Schwefelverbindungen frei, die im warmen Mixer noch aggressiver werden. Schalotte hat davon deutlich weniger und ist in Thailand ohnehin die Standard-Zwiebel (หอมแดง). WARUM PASTE STATT ROHER KNOBLAUCH: mit Salz zerdrücken zerstört einen Teil der Allicin-Enzyme, bevor sie im Speichel den scharfen Effekt entfalten — genau der Trick, den italienische Aioli-Köche seit Jahrhunderten machen. LIMETTE STATT ESSIG: türkische Restaurants nehmen Zitrone, bulgarische Balsamico. Wir haben Limette im Haus, sie tut denselben Job. SALZ WICHTIG: Tarator ist salzig, das ist kein Fehler. Wenn er nicht salzig genug ist, wirkt der Joghurt kreidig. TEXTUR: bewusst DÜNN — Ayran-nah, kein Sattmach-Smoothie. Grab-tauglich (Regel 8): keine Deko, alles gemixt. ⚠ VERKOSTUNG STEHT AUS — Peter/Freundin haben eine Variante experimentiert; dies ist die Labor-Version zum systematischen Vergleich.","🧪 สูตรทดลอง (ระดับ X) ใหม่ 25.08.2026 · แก้วรสเผ็ดร้อนแรกในเมนู — ต้นแบบตรง: ทาราเตอร์ (บัลแกเรีย) / จาจีก (ตุรกี) / ทซัตซิกิ (กรีกในรูปซอส) · กลุ่มเป้าหมาย: ลูกค้าที่ไม่ต้องการอะไรหวาน หรือดื่มคู่กับอาหาร ไม่ได้ตั้งใจเป็นสมูทตี้ทานเล่น · ทำไมใช้หอมแดงแทนหอมใหญ่: หอมใหญ่ดิบปล่อยสารซัลเฟอร์ที่แรงขึ้นในเครื่องปั่นที่อุ่น ๆ · หอมแดงมีน้อยกว่ามาก และเป็นหอมมาตรฐานในไทยอยู่แล้ว · ทำไมทำเป็นเนื้อแทนกระเทียมดิบ: การบดกับเกลือทำลายเอนไซม์อัลลิซินบางส่วนก่อนที่มันจะเผ็ดในน้ำลาย — เป็นเคล็ดลับที่คนทำอาหารอิตาเลียนใช้มาหลายศตวรรษ · มะนาวแทนน้ำส้มสายชู: ร้านตุรกีใช้มะนาว บัลแกเรียใช้บัลซามิก · เรามีมะนาว มันทำงานเหมือนกัน · เกลือสำคัญ: ทาราเตอร์ต้องเค็ม ไม่ใช่ความผิด ถ้าไม่เค็มพอ โยเกิร์ตจะรู้สึกฝืด · เนื้อสัมผัส: ตั้งใจให้เจือจาง — คล้ายอายราน ไม่ใช่สมูทตี้อิ่ม · ผ่านเกณฑ์แกร็บ (กฎ 8): ไม่มีของแต่ง ทุกอย่างอยู่ในแก้ว · ยังไม่ได้ชิม — ปีเตอร์กับแฟนทดลองเวอร์ชันหนึ่งแล้ว นี่คือเวอร์ชันห้องแล็บสำหรับเปรียบเทียบอย่างเป็นระบบ","🧪 LAB RECIPE (stufe X), NEW 25.08.2026 · The first SAVOURY smoothie on the menu — direct model: Tarator (Bulgaria) / Cacık (Turkey) / Tzatziki (Greece as a sauce). Target: the guest who does not want anything sweet, or as a companion to food. NOT intended as an in-between-meal smoothie. WHY SHALLOT INSTEAD OF ONION: raw regular onion releases sulphur compounds that become even more aggressive in a warm mixer. Shallot has far less of them and is the standard onion in Thailand anyway (หอมแดง). WHY PASTE INSTEAD OF RAW GARLIC: crushing with salt destroys part of the allicin enzymes before they unfold their sharp effect in saliva — exactly the trick Italian aioli cooks have used for centuries. LIME INSTEAD OF VINEGAR: Turkish restaurants use lemon, Bulgarian ones balsamic. We have lime in the house, it does the same job. SALT MATTERS: Tarator is salty, that is not a mistake. If it is not salty enough, the yoghurt feels chalky. TEXTURE: deliberately THIN — close to Ayran, not a filling smoothie. Grab-compatible (rule 8): no deco, everything blended. ⚠ TASTING PENDING — Peter/partner have experimented with a variant; this is the lab version for systematic comparison."]},{"n":"46","de":"Ayran (Instant, mit Limette) 🧪","th":"อายราน (โยเกิร์ตดื่ม) 🧪","en":"Ayran (instant, with lime) 🧪","stufe":"X","basis":0,"alg":"🥛","bestaetigt":0,"zut":[["JO",310,"Naturjoghurt UNGESÜẞT — 2 Teile Joghurt : 1 Teil Wasser ist die klassische türkische Ratio","โยเกิร์ตธรรมชาติไม่หวาน — โยเกิร์ต 2 ส่วน ต่อน้ำ 1 ส่วน คืออัตราส่วนคลาสสิกของตุรกี","Plain unsweetened yoghurt — 2 parts yoghurt to 1 part water is the classic Turkish ratio"],["WA",150,"Flaschen-Trinkwasser EISKALT (KEIN Leitungswasser) — verdünnt auf Trink-Konsistenz (Ayran ist DÜNNER als jeder Smoothie)","น้ำเย็นจัด — เจือจางให้ดื่มได้ (อายรานเจือจางกว่าสมูทตี้)","Ice-cold water — dilutes to drinking consistency (Ayran is THINNER than any smoothie)"],["LS",5,"Limettensaft — Peters Variation (klassisch kein Zitrus, aber hebt den Joghurt spürbar)","น้ำมะนาว — เวอร์ชันของปีเตอร์ (คลาสสิกไม่มี แต่ช่วยชูโยเกิร์ตชัดเจน)","Lime juice — Peter's variation (classic has no citrus, but lifts the yoghurt noticeably)"],["MI",1,"Minze, gezählt (6-8 Blätter)","ใบสะระแหน่ เด็ดใบ (6-8 ใบ)","Mint, counted (6-8 leaves)"],["SA",1,"Salz — Ayran braucht MEHR Salz als jeder süße Becher (das ist der Charakter)","เกลือ — อายรานต้องเค็มมากกว่าแก้วหวาน (เป็นเอกลักษณ์)","Salt — Ayran needs MORE salt than any sweet cup (that is the character)"]],"schritte":[["Joghurt + Salz mit dem Schneebesen von Hand kurz aufschlagen — nicht mit dem Mixer, sonst schäumt es zu stark","ตีโยเกิร์ต + เกลือด้วยตะกร้อมือสั้น ๆ — อย่าใช้เครื่องปั่น ไม่งั้นเป็นฟองมาก","Whisk yoghurt + salt by hand briefly — do not use the blender, otherwise it foams too much"],["Eiskaltes Wasser in dünnem Strahl unter Rühren dazugeben — nie umgekehrt, sonst wird der Joghurt körnig","ค่อย ๆ เทน้ำเย็นจัดเป็นสายบาง ๆ ขณะคน — อย่ากลับกัน ไม่งั้นโยเกิร์ตจะเป็นเม็ด","Slowly stream in the ice-cold water while stirring — never the other way around, otherwise the yoghurt turns grainy"],["Limette + Minze am Ende zufügen und noch einmal kurz verrühren","ใส่มะนาวและสะระแหน่ตอนท้าย แล้วคนอีกสั้น ๆ","Add lime and mint at the end, stir briefly again"],["Direkt in ein GEKÜHLTES Glas, sofort trinken","เทลงแก้วเย็น ดื่มทันที","Pour straight into a CHILLED glass, drink immediately"]],"tip":["🧪 LABOR-REZEPT (Stufe X), NEU 25.08.2026 · Türkischer Klassiker in seiner reinsten Form — nur Joghurt, Wasser, Salz. Peter fügt Limette als moderne Variation dazu; das ist keine Häresie, sondern Öffnung Richtung Osten (arabischer Laban hat oft Zitrus). WARUM 2:1 (Joghurt zu Wasser): das ist die getestete Volksrezeptur, weniger wird zu wässrig, mehr zu breiig. WARUM VON HAND STATT MIXER: der Ayran soll SEIDIG und leicht luftig sein, nicht schaumig. Ein Mixer schlägt so viel Luft ein, dass er innerhalb von 10 Minuten zusammenfällt und den Joghurt trennt. WARUM WASSER IN JOGHURT und nicht umgekehrt: Joghurt in Wasser lässt Eiweiß koagulieren — das gibt Klümpchen. Wasser langsam in Joghurt ergibt eine glatte Emulsion. WARUM VIEL SALZ: Ayran wird ohne Salz fad und kreidig. 1 g auf 460 g klingt viel, ist aber die Grenze zum Wohlfühlen — türkische Standard-Ayrans sind sogar salziger. TEMPERATUR-KRITISCH: warmer Ayran ist ungenießbar. Glas im Voraus kühlen. Grab-tauglich (Regel 8) — aber vermutlich zu ungewöhnlich für den ersten Grab-Bestand; erst mal als Stand-Verkauf testen. ⚠ VERKOSTUNG STEHT AUS.","🧪 สูตรทดลอง (ระดับ X) ใหม่ 25.08.2026 · คลาสสิกตุรกีในรูปแบบดั้งเดิม — มีแค่โยเกิร์ต น้ำ เกลือ · ปีเตอร์เติมมะนาวเป็นเวอร์ชันสมัยใหม่ ไม่ใช่นอกรีต แต่เปิดไปทางตะวันออก (ลาบันอาหรับมักมีรสส้ม) · ทำไม 2:1 (โยเกิร์ตต่อน้ำ): เป็นสัดส่วนที่ทดสอบมาแล้ว น้อยกว่าจะเหลว มากกว่าจะข้น · ทำไมตีมือแทนเครื่องปั่น: อายรานต้องนุ่มนวลและเบาเล็กน้อย ไม่ใช่เป็นฟอง เครื่องปั่นจะตีอากาศเข้ามากจนพังใน 10 นาทีและโยเกิร์ตแยกชั้น · ทำไมเทน้ำในโยเกิร์ตแทนที่จะกลับกัน: โยเกิร์ตในน้ำจะทำให้โปรตีนจับตัว — เกิดเม็ด · เทน้ำช้า ๆ ในโยเกิร์ตจะได้อิมัลชันเนียน · ทำไมเกลือมาก: อายรานไม่มีเกลือจะจืดและฝืด · 1 กรัมต่อ 460 กรัมฟังดูมาก แต่เป็นขอบเขตของความสบายลิ้น — อายรานตุรกีมาตรฐานเค็มกว่านี้อีก · อุณหภูมิสำคัญ: อายรานอุ่นดื่มไม่ได้ · ให้แช่แก้วก่อน · ผ่านเกณฑ์แกร็บ (กฎ 8) — แต่คงแปลกเกินไปสำหรับแกร็บครั้งแรก ทดสอบขายที่ร้านก่อน · ยังไม่ได้ชิม","🧪 LAB RECIPE (stufe X), NEW 25.08.2026 · Turkish classic in its purest form — only yoghurt, water, salt. Peter adds lime as a modern variation; that is not heresy but opens towards the east (Arab laban often has citrus). WHY 2:1 (yoghurt to water): the tested folk ratio, less becomes watery, more becomes pasty. WHY BY HAND INSTEAD OF BLENDER: Ayran should be SILKY and slightly airy, not foamy. A blender whips so much air in that it collapses within 10 minutes and the yoghurt separates. WHY WATER INTO YOGHURT and not the other way: yoghurt into water makes protein coagulate — that gives lumps. Water slowly into yoghurt gives a smooth emulsion. WHY LOTS OF SALT: Ayran without salt is bland and chalky. 1 g on 460 g sounds like a lot but is the border of the comfort zone — standard Turkish Ayrans are even saltier. TEMPERATURE-CRITICAL: warm Ayran is undrinkable. Chill the glass in advance. Grab-compatible (rule 8) — but probably too unusual for the first Grab order; test as counter sale first. ⚠ TASTING PENDING."]},{"n":"47","de":"Avocado-Joghurt-Gurke (herzhaft Labor)","th":"อะโวคาโด-โยเกิร์ต-แตงกวา","en":"Avocado-Yogurt-Cucumber","stufe":"X","basis":0,"alg":"🥛","bestaetigt":0,"zut":[["MM",95,"Mandelmilch EISKALT — auffüllen auf 470 g (fehlen 95 g)","นมอัลมอนด์","Almond milk ready-made (1 L)"],["LS",9,"Limettensaft — hebt Avocado, rundet Joghurt-Säure","มะนาว","Lime"],["JO",225,"Naturjoghurt UNGESÜẞT — die verkostete Basis","โยเกิร์ต","Plain yogurt (2 L)"],["AV",80,"Avocado FRISCH, reif — Fett ohne Zucker","อะโวคาโด (สด)","Avocado (fresh)"],["GK",60,"Gurke MIT SCHALE — Frische und Volumen","แตงกวา","Cucumber"],["SA",1.5,"Salz — herzhafte Linie, deshalb mehr als 0,3 g","เกลือ","Salt"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale,
