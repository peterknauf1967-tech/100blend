function grundLesen(){ try{ return JSON.parse(localStorage.getItem("blend_sperrgrund")||"{}"); }catch(e){ return {}; } }
function zutatRaus(code, grund){
  S.bestand=S.bestand||{}; S.tk=S.tk||{}; S.reift=S.reift||{}; S.ts=S.ts||{}; S.wer=S.wer||{};
  S.bestand[code]=0; S.tk[code]=0; S.reift[code]=0;
  S.ts[code]=Date.now();
  S.wer[code]=(S.cfg&&S.cfg.who)||"";
  const gr=grundLesen();
  gr[code]={grund:grund, zeit:new Date().toISOString().slice(0,16).replace("T"," "), wer:(S.cfg&&S.cfg.who)||""};
  localStorage.setItem("blend_sperrgrund", JSON.stringify(gr));
  save();
  syncSpaeter();     /* damit Kasse und zweites Handy es sofort erfahren */
  render();
}

function vRezepte(){

  const mit=alle.filter(r=>r.zut&&r.zut.length), ohne=alle.filter(r=>!r.zut||!r.zut.length);

    const fehlen=pflicht(r).filter(z=>!daIst(z[0]));

/* --- AUSWERTUNG: START ------------------------------------------------------
   Chargen-Historie-Auswertung: welche Zutat wird am haeufigsten weggeworfen?
   Liest S.chargen_frisch (Baustein 2), aendert nichts an ihnen. Rein Read.
   ------------------------------------------------------------------------- */
let aFilter="all";                 /* Zeitfilter: "all" | "30" | "7" */
const AUSW_KOSTEN_FALLBACK = 0.05; /* THB je g/ml wenn kein Katalogpreis */

/* Alle Chargen (auch aufgebraucht/entsorgt) fuer die Auswertung. */
function auswChargen(){
  return Object.entries(S.chargen_frisch||{}).map(([id,c])=>Object.assign({_id:id},c||{}));
}
/* Chargen nach Zeitfilter (Bezugspunkt: produziert_am). */
function auswGefiltert(){
  const all = auswChargen();
  if(aFilter==="all") return all;
  const tage = aFilter==="7" ? 7 : 30;
  const grenze = Date.now() - tage*24*3600*1000;
  return all.filter(c=>c.produziert_am && new Date(c.produziert_am).getTime()>=grenze);
}
/* Grobe Kosten je g/ml der Zutat. Wenn Katalogpreis (฿/kg oder ฿/L) bekannt,
   dann ฿/g bzw. ฿/ml daraus; sonst Fallback. */
function auswKosten(code){
  const k = (typeof findeCode==="function") ? findeCode(code) : null;
  let ref = null;
  if(k){
    if(k.pmin!=null) ref = k.pmin;
    else if(typeof letzterPreis==="function"){ try{ ref = letzterPreis(code); }catch(e){} }
  }
  if(ref==null || !isFinite(+ref) || +ref<=0) return AUSW_KOSTEN_FALLBACK;
  return (+ref)/1000; /* ฿/kg oder ฿/L -> ฿/g bzw. ฿/ml */
}
/* Kern-Statistik: KPIs + Ranking je Zutat. */
function auswStats(){
  const rows = auswGefiltert();
  const gesamt = rows.length;
  const aufgebraucht = rows.filter(c=>c.status==="aufgebraucht").length;
  const entsorgt = rows.filter(c=>c.status==="entsorgen").length;
  /* Lebensdauer nur fuer abgeschlossene Chargen (Status aufgebraucht/entsorgen).
     Endzeitpunkt approximieren: letzter peter_freigabe-Eintrag, sonst ablauf_am,
     sonst jetzt. */
  let stundenSumme=0, stundenZahl=0;
  rows.forEach(c=>{
    if(c.status!=="aufgebraucht" && c.status!=="entsorgen") return;
    const start = c.produziert_am ? new Date(c.produziert_am).getTime() : 0;
    if(!start) return;
    let ende = 0;
    const letzte = (c.peter_freigaben||[]).slice(-1)[0];
    if(letzte && letzte.ts) ende = +letzte.ts;
    else if(c.ablauf_am) ende = new Date(c.ablauf_am).getTime();
    else ende = Date.now();
    if(ende>start){ stundenSumme += (ende-start)/3600000; stundenZahl++; }
  });
  const oLeben = stundenZahl ? Math.round(stundenSumme/stundenZahl) : 0;
  /* Verlust in THB. */
  let verlustTHB = 0;
  rows.filter(c=>c.status==="entsorgen").forEach(c=>{
    const rest = +(c.menge_rest||c.menge_ml||c.menge_g||0);
    verlustTHB += rest * auswKosten(c.zutat_code);
  });
  /* Ranking je Zutat. */
  const byCode = {};
  rows.forEach(c=>{
    const code = c.zutat_code||"?";
    const b = byCode[code] || (byCode[code] = {code, ges:0, entsorgt:0, aufgebraucht:0, restSumme:0, restZahl:0});
    b.ges++;
    if(c.status==="entsorgen"){
      b.entsorgt++;
      b.restSumme += +(c.menge_rest||c.menge_ml||c.menge_g||0);
      b.restZahl++;
    }
    if(c.status==="aufgebraucht") b.aufgebraucht++;
  });
  const rank = Object.values(byCode).map(b=>{
    const abges = b.entsorgt + b.aufgebraucht;
    const quote = abges>0 ? Math.round(b.entsorgt/abges*100) : 0;
    const restAvg = b.restZahl>0 ? Math.round(b.restSumme/b.restZahl) : 0;
    const H = chHaltbar(b.code);
    return {code:b.code, name:H.name, einheit:H.einheit, ges:b.ges, entsorgt:b.entsorgt,
            aufgebraucht:b.aufgebraucht, quote, restAvg};
  }).sort((x,y)=> y.quote-x.quote || y.entsorgt-x.entsorgt || y.ges-x.ges);
  return {gesamt, aufgebraucht, entsorgt, oLeben, verlustTHB, rank};
}
/* Karenz-Statistik: wie oft genutzt, Peter-Freigaben, Erfolgsquote. */
function auswKarenzStats(){
  const rows = auswGefiltert();
  let karenzChargen=0, freigOK=0, freigWeg=0, karenzDannAuf=0, karenzDannEnt=0;
  rows.forEach(c=>{
    const fr = c.peter_freigaben||[];
    const hatKarenz = fr.length>0 || c.status==="karrenz" || c.karrenz_bis;
    if(!hatKarenz) return;
    karenzChargen++;
    fr.forEach(f=>{
      if(!f) return;
      if(f.entscheidung==="weg") freigWeg++;
      else if(String(f.entscheidung||"").indexOf("ok")===0) freigOK++;
    });
    if(c.status==="aufgebraucht") karenzDannAuf++;
    else if(c.status==="entsorgen") karenzDannEnt++;
  });
  const abges = karenzDannAuf + karenzDannEnt;
  const erfolg = abges>0 ? Math.round(karenzDannAuf/abges*100) : 0;
  return {karenzChargen, freigOK, freigWeg, karenzDannAuf, karenzDannEnt, erfolg};
}
/* Zeitreihe der letzten 30 Tage (auch wenn Filter="7", die Reihe zeigt 30). */
function auswZeitreihe(){
  const tage = 30;
  const heute = new Date(); heute.setHours(0,0,0,0);
  const arr = [];
  for(let i=tage-1;i>=0;i--){
    const d = new Date(heute.getTime() - i*24*3600*1000);
    arr.push({tag:d, aufgebraucht:0, entsorgt:0});
  }
  const idx = new Map(arr.map((x,i)=>[x.tag.getTime(), i]));
  auswChargen().forEach(c=>{
    if(c.status!=="aufgebraucht" && c.status!=="entsorgen") return;
    const letzte = (c.peter_freigaben||[]).slice(-1)[0];
    const t = letzte && letzte.ts ? new Date(+letzte.ts)
            : c.ablauf_am ? new Date(c.ablauf_am)
            : c.produziert_am ? new Date(c.produziert_am) : null;
    if(!t) return;
    const dd = new Date(t); dd.setHours(0,0,0,0);
    const i = idx.get(dd.getTime()); if(i==null) return;
    if(c.status==="aufgebraucht") arr[i].aufgebraucht++; else arr[i].entsorgt++;
  });
  return arr;
}
/* Handlungsempfehlungen aus dem Ranking + Karenz. */
function auswEmpfehlungen(){
  const {rank} = auswStats();
  const kar = auswKarenzStats();
  const tips = [];
  rank.filter(r=>r.ges>=3 && r.quote>=60).slice(0,3).forEach(r=>{
    /* -20 % als grobe Schaetzung fuer die Einkaufsempfehlung. */
    tips.push(`✋ ${r.name} wird zu ${r.quote}% entsorgt — Einkaufsmenge um 20% reduzieren?`);
  });
  rank.filter(r=>r.ges>=3 && r.quote===0 && r.aufgebraucht>=2).slice(0,3).forEach(r=>{
    tips.push(`🌟 ${r.name} wird zu 100% aufgebraucht — Einkauf könnte um 20% erhöht werden.`);
  });
  if(kar.freigWeg > kar.freigOK && (kar.freigOK+kar.freigWeg)>=3){
    tips.push(`⚠ Karenz wird oft abgelehnt (weg ${kar.freigWeg} > ok ${kar.freigOK}) — Kühlkette / Herstellung prüfen.`);
  }
  return tips;
}
/* CSV-Export aller Chargen-Rohdaten. */
function auswCSVExport(){
  const rows = auswChargen();
  const head = ["produziert_am","zutat_code","zutat_name","status","menge","einheit",
                "menge_rest","karenz_ja","lebensdauer_h","peter_freigaben","notiz"];
  const zeilen = [head.join(";")];
  rows.forEach(c=>{
    const H = chHaltbar(c.zutat_code);
    const menge = +(c.menge_ml||c.menge_g||0);
    const rest  = +(c.menge_rest||0);
    const start = c.produziert_am ? new Date(c.produziert_am).getTime() : 0;
    const letzte = (c.peter_freigaben||[]).slice(-1)[0];
    const ende = letzte && letzte.ts ? +letzte.ts
               : (c.status==="aufgebraucht"||c.status==="entsorgen") && c.ablauf_am ? new Date(c.ablauf_am).getTime()
               : 0;
    const lebH = (start && ende && ende>start) ? Math.round((ende-start)/3600000) : "";
    const karJa = (c.peter_freigaben && c.peter_freigaben.length) || c.status==="karrenz" || c.karrenz_bis ? "ja":"nein";
    const frText = (c.peter_freigaben||[]).map(f=>f.entscheidung||"?").join("|");
    const notiz  = (c.notiz||"").replace(/[;\n\r]/g," ");
    zeilen.push([
      c.produziert_am||"", c.zutat_code||"", (H.name||"").replace(/;/g,","),
      c.status||"", menge, H.einheit||"", rest, karJa, lebH, frText, notiz
    ].join(";"));
  });
  const txt = "﻿" + zeilen.join("\n");
  const name = "100blend_chargen_" + heute() + ".csv";
  const url = URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
  const a = document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  S.verarb.forEach(v=>{ const k=findeCode(v.code)||{de:v.code,th:"",gruppe:""};

async function senden(){
  const wer=(S.cfg.who||"unbekannt").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const txt=csvText(), name=`100blend_standos_${heute()}_${wer}.csv`;
  try{
    const file=new File([txt],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"100blend Stand-OS",text:`Bestand + ${S.chargen.length} Chargen`}); return;
    }
  }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a"), url=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* --- Uebernahme per QR-Code / Link ---------------------------------------
   Peter kann Werte nicht vom PC aufs Handy tippen. Deshalb kann die Adresse
   die Mengen mitbringen:  ...standos.html#lade=roh:KN-4,PF-400;tk:WM-333
   Es wird NICHTS still uebernommen — erst Vorschau, dann Knopf.
   (Hash statt ?-Parameter, damit die Werte nie an den Server gehen.) */
function qrAngebot(){
  const h2=(location.hash||"").replace(/^#/,"");
  if(h2.indexOf("lade=")<0)return null;
  const roh={}, tk={};
  decodeURIComponent(h2.slice(h2.indexOf("lade=")+5)).split(";").forEach(teil=>{
    const m=teil.split(":"); if(m.length<2)return;
    const ziel=/^tk$/i.test(m[0].trim())?tk:roh;
    m[1].split(",").forEach(paar=>{
      const q=paar.split("-"); if(q.length<2)return;
      const c=q[0].trim().toUpperCase(), g=parseFloat(q[1]);
      if(findeCode(c)&&g>=0)ziel[c]=g;
    });
  });
  return (Object.keys(roh).length||Object.keys(tk).length)?{roh,tk}:null;
}
function qrUebernehmen(a){
  Object.keys(a.roh).forEach(c=>{ if(a.roh[c]>0)S.bestand[c]=a.roh[c]; else delete S.bestand[c]; });
  Object.keys(a.tk).forEach(c=>{ if(a.tk[c]>0){S.tk[c]=a.tk[c]; delete S.bestand[c];} else delete S.tk[c]; });
  save(); history.replaceState(null,"",location.pathname); render();
}
function qrKarte(){
  const a=qrAngebot(); if(!a)return "";
  const zeile=(c,g,tkFlag)=>{ const k=findeCode(c);
    return `<div class="row"><span class="code">${c}</span><span class="nm">${zname(k)}
      <span class="pr">${tkFlag?"🧊 ":""}<b>${g} ${k.einheit||"g"}</b></span></span></div>`; };
  return `<div class="card" style="border-color:var(--fg)">
    <div style="font-weight:700;margin-bottom:8px">📲 ${h("qrTitel")}</div>
    ${Object.keys(a.roh).map(c=>zeile(c,a.roh[c],false)).join("")}
    ${Object.keys(a.tk).map(c=>zeile(c,a.tk[c],true)).join("")}
    <div class="bar" style="margin-top:10px">
      <button class="b p" id="qr_ok" style="flex:1">${h("qrOk")}</button>
      <button class="b" id="qr_ab">${h("abbrechen")}</button></div>
    <div class="mini" style="margin-top:6px">${h("qrHint")}</div></div>`;
}

  /* Start */
  const ek=$("ekliste"); if(ek)ek.onclick=()=>{ $("out").value=einkaufsliste(); $("out").style.display="block"; $("out").select(); };
  const zt=$("zeigetot"); if(zt)zt.onclick=()=>{

  };
  const cb=$("csvb"); if(cb)cb.onclick=()=>{ $("out").value=csvText().replace(/^﻿/,""); $("out").style.display="block"; $("out").select(); };
  const sd=$("senden"); if(sd)sd.onclick=senden;
  /* Zweiter Weg ohne Drive: alles als Text in die Zwischenablage, damit Peter
     es direkt in den Chat einfuegen kann. Peter 15.08.: "wohin womit senden?" */
  /* Stand vom Server holen: setzt das Geraet auf den mitgelieferten Bestand
     zurueck. Fuer den Fall, dass ein zweites Handy leer dasteht. */
  const ss=$("serverstand");
  if(ss)ss.onclick=()=>{
    if(!confirm(h("serverStandFrage")))return;
    serverStandUebernehmen(S); save(); render();
  };
  /* Gemeinsamer Speicher: URL einmal einfuegen, danach laeuft es von allein. */
  const sb=$("syncb");
  if(sb)sb.onclick=()=>{
    const box=$("syncbox");
    if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div class="card">
      <div class="mini" style="margin-bottom:8px">${h("syncHint")}</div>
      <input id="s_url" placeholder="https://script.google.com/macros/s/…/exec"
        value="${esc(syncUrl())}" autocomplete="off" style="font-size:13px">
      <div class="bar" style="margin:8px 0 0">
        <button class="b p" id="s_ok" style="flex:1">${h("syncSpeichern")}</button>
        ${syncUrl()?`<button class="b r" id="s_weg">${h("syncTrennen")}</button>`:""}</div>
      <div class="mini" id="s_log" style="margin-top:8px">${
        syncFehler?"⚠ "+esc(syncFehler):(syncStand?"🔗 "+h("zuletzt")+" "+syncStand:"")}</div>
      <div class="mini" style="margin-top:8px;opacity:.75">${h("syncGeraet")}: <b>${esc(geraetName())}</b></div></div>`;
    const ok=$("s_ok");
    if(ok)ok.onclick=async()=>{
      const u=($("s_url").value||"").trim();
      if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)){
        $("s_log").innerHTML="⚠ "+h("syncUrlFalsch"); return;
      }
      if(u)localStorage.setItem(SYNCKEY,u); else localStorage.removeItem(SYNCKEY);
      $("s_log").innerHTML="⟳ …";
      await syncJetzt(false);
      const l=$("s_log");
      if(l)l.innerHTML=syncFehler?("⚠ "+esc(syncFehler)):("✅ "+h("syncOk"));
    };
    const weg=$("s_weg");
    if(weg)weg.onclick=()=>{ localStorage.removeItem(SYNCKEY); render(); };
  };
  const sn=$("syncnow"); if(sn)sn.onclick=()=>syncJetzt(true);

  const kp=$("kopieren");
  if(kp)kp.onclick=async()=>{
    const txt=csvText(), m=$("kopiermeldung");
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ const t=$("out"); t.style.display="block"; t.value=txt; t.focus(); t.select(); }
    if(m)m.innerHTML=h("kopiert");
  };

  /* Einkauf */
  const such=$("e_such");
  if(such){
    const zeigen=()=>{
      const q=such.value.trim().toLowerCase();
      const L=$("e_liste");
      if(!q){L.style.display="none";return}
      const tr=sortiereTreffer(alleZutaten().filter(k=>passt(k,q)),q).slice(0,40);
      L.innerHTML=tr.length?tr.map(k=>`<button class="frow" data-c="${k.code}"><b>${esc(nm1(k))}</b> · ${esc(k.en||"")} · ${esc(nmDE(k))}
        <small>${esc(gName(k.gruppe))}${k.pmin!=null?` · ${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:""}</small></button>`).join("")
        :`<div class="fgrp">nichts gefunden</div>`;
      L.style.display="block";
      L.querySelectorAll(".frow").forEach(b=>b.onclick=()=>{
        eCode=b.dataset.c; localStorage.setItem("blend_os_code",eCode); eSuche=""; render();
      });
    };
    such.oninput=zeigen; such.onfocus=zeigen;

    const sumZeigen=()=>{
      /* Eingegeben wird GRAMM (bzw. Stueck), berechnet wird B/kg (bzw. B/Stk).
         Peter 17.08.: "Preis pro Kilo, ja, aber Menge in Gramm." */
      const menge=parseFloat($("e_kg").value), ges=parseFloat($("e_ges").value), k=findeCode(eCode);
      const el=$("e_sum"); if(!el)return;
      if(!(menge>0)||!(ges>0)){el.innerHTML="";return}
      const stk=(k.einheit==="Stk");
      const proEinheit=stk?menge:menge/1000;          /* Stueck oder Kilo */
      const pr=Math.round(ges/proEinheit*10)/10, eh=stk?"Stück":"kg";
      let s=`🧾 ${zahl(ges)} ฿ ÷ ${zahl(menge)} ${stk?"Stk":"g"} = <b>${zahl(pr)} ฿/${eh}</b>`;
      const a=$("e_verarb").checked?100:k.ausbeute;
      if(a&&a<100&&!stk)s+=`<br>🥤 ${h("ausbeuteTxt")} ~${a} % → <b>${zahl(Math.round(pr/a*100))} ${h("fruchtfleisch")}</b>`;
      if(k.pmax!=null){ if(pr>k.pmax*1.15)s+=`<br><b style="color:var(--miss)">⚠ ${h("ueberRef")} ${k.pmin}–${k.pmax} ฿</b>`;
        else if(pr<=k.pmin)s+=`<br><b style="color:var(--ok)">✓ ${h("unterRef")}</b>`; }
      el.innerHTML=s;
    };
    $("e_kg").oninput=sumZeigen; $("e_ges").oninput=sumZeigen; $("e_verarb").onchange=sumZeigen;

    const sterne=(id,set)=>{const el=$(id); el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const n=+b.dataset.n; set(n); el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=n))}};
    sterne("e_duft",n=>eDuft=n); sterne("e_note",n=>eNote=n);
    const toggle=(id,arr)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const i=arr.indexOf(b.dataset.k); if(i<0)arr.push(b.dataset.k); else arr.splice(i,1); b.classList.toggle("on",i<0)}};
    toggle("e_des",eDes); toggle("e_feh",eFeh);
    $("e_markt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      S.cfg.markt=(S.cfg.markt===b.dataset.m)?"":b.dataset.m; save();
      $("e_markt").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.m===S.cfg.markt));
      $("who").innerHTML=(S.cfg.who?esc(S.cfg.who):"—")+(S.cfg.markt?`<br>${esc(S.cfg.markt)}`:"");};

    const uw=$("e_unterwegs");
    if(uw){
      const box=$("e_liefbox");
      const zeig=()=>{ box.style.display=uw.checked?"":"none";
        /* Beides zugleich waere widerspruechlich: entweder es liegt da
           oder es ist unterwegs. */
        const eb=$("e_bestand"); if(uw.checked)eb.checked=false; };
      uw.onchange=zeig; zeig();
      const eb=$("e_bestand");
      if(eb)eb.onchange=()=>{ if(eb.checked){uw.checked=false; zeig();} };
    }
    $("e_ok").onclick=()=>{
      const menge=$("e_kg").value, ges=$("e_ges").value;
      const kk=findeCode(eCode), istStk=(kk.einheit==="Stk");
      /* Preis bleibt B/kg bzw. B/Stk — nur die Eingabe ist Gramm. */
      const proEinheit=istStk?+menge:(+menge)/1000;
      const pr=(+menge>0&&+ges>0)?Math.round(+ges/proEinheit*10)/10:"";
      const kg=menge;   /* Feldname in der Charge bleibt, Inhalt ist jetzt Gramm */
      const c={dat:heute(),who:S.cfg.who||"",code:eCode,sorte:$("e_sorte").value.trim(),
        kg,ges,pr,verarb:$("e_verarb").checked?1:"",bx:$("e_bx").value,
        duft:eDuft||"",des:eDes.slice(),feh:eFeh.slice(),note:eNote||"",
        markt:S.cfg.markt,bem:$("e_bem").value.trim()};
      if(!c.ges&&!c.bx&&!c.duft&&!c.sorte){alert(h("mind"));return}
      S.chargen.push(c);
      if($("e_unterwegs").checked&&+menge>0){
        /* Bestellt, aber noch nicht im Haus: eigener Topf, kein Bestand. */
        S.bestellt=S.bestellt||{};
        S.bestellt[eCode]={m:Math.round(+menge), ab:$("e_lieferung").value||"",
                           p:pr||"", q:c.sorte||""};
        stempel(eCode);
      } else if($("e_bestand").checked&&+menge>0){
        /* Keine Umrechnung mehr: was eingetippt wurde, ist die Bestandsmenge. */
        S.bestand[eCode]=Math.round((+(S.bestand[eCode]||0)) + (+menge));
        stempel(eCode);
      }
      save(); eDuft=0;eNote=0;eDes=[];eFeh=[];
      render();
    };
  }
  /* Verarbeiten */
  /* Auswahlliste war auf dem Handy umstaendlich: 96 Eintraege durchscrollen.
     Jetzt Teilsuche wie im Einkauf, plus Schnellknoepfe fuer alles, was
     tatsaechlich als Rohware daliegt. (Peter 17.08.) */
  const rs=$("r_such");
  if(rs){
    const zeigen=()=>{
      const q=rs.value.trim().toLowerCase();
      const L=$("r_liste");
      rSuche=rs.value;
      if(!q){L.style.display="none";return}
      const tr=sortiereTreffer(alleZutaten().filter(k=>passt(k,q)),q).slice(0,40);
      L.innerHTML=tr.length?tr.map(k=>{
        /* Erste Zeile IMMER in der Sprache des Angemeldeten — Lexi soll ihr Wort
           nicht in der vierten Zeile suechen muessen. */
        const haupt = nm1(k);
        const zweit = (thaiZuerst() ? [k.en, k.de] : [k.en, k.th])
                        .filter(x => x && x !== haupt);
        const menge = [];
        if(bestandVon(k.code)>0) menge.push(`🔪 ${zahl(bestandVon(k.code))} ${k.einheit||"g"}`);
        if(tkVon(k.code)>0)      menge.push(`🧊 ${zahl(tkVon(k.code))} ${k.einheit||"g"}`);
        return `<button class="frow" data-rwahl="${k.code}">
        <span class="fzeile">
          <span class="fhaupt"><b>${esc(haupt)}</b>${istFrisch(k.code)?` <span class="frisch">🕒 ${vorZeit((S.ts||{})[k.code])}</span>`:""}</span>
          ${menge.length?`<span class="fmenge">${menge.map(x=>`<span class="menge">${x}</span>`).join("")}</span>`:""}
        </span>
        <small>${esc(zweit.join(" · "))}${k.laut?` · <i>${esc(k.laut)}</i>`:""}</small>
        <small class="fgrp2">${k.code} · ${esc(gName(k.gruppe))}</small></button>`;}).join("")
        :`<div class="fgrp">${h("nixGefunden")}</div>`;
      L.style.display="block";
      L.querySelectorAll(".frow").forEach(b=>b.onclick=()=>{
        /* Suchtext NICHT loeschen: Peter arbeitet drei Mangos nacheinander ab
           und musste sonst jedes Mal neu suchen. */
        rCode=b.dataset.rwahl; render();
      });
    };
    rs.oninput=zeigen; rs.onfocus=zeigen;
  }
  document.querySelectorAll("[data-rschnell]").forEach(b=>b.onclick=()=>{
    rCode=b.dataset.rschnell; render();
  });
  /* Haengt jetzt am Mengenfeld statt an der geloeschten Auswahlliste —
     sonst waere die ganze Verarbeitungs-Rechnung darunter tot. */
  const rc=$("r_roh");
  if(rc){
    const rechnung=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      const el=$("r_rechnung"); if(!el)return;
      if(!(roh>0)||!(fertig>0)){el.innerHTML="";return}
      const rohG=roh, fertigG=fertig;   /* jetzt beides direkt in Gramm bzw. Stueck */
      const proz=Math.round(fertigG/rohG*1000)/10;
      let s=`📊 ${h("ausbeuteTxt")} <b>${stk?Math.round(fertigG/roh)+" g/Stk":proz+" %"}</b>`
        +(stk?"":` · 🗑 ${h("abfall")} <b>${Math.round((100-proz)*10)/10} %</b>`);
      /* echter Preis der Verkaufsware: was die Rohware kostete, geteilt durch das, was übrig blieb */
      const pr=letzterPreis(k.code);
      if(pr){
        const kosten=Math.round(pr*rohG/fertigG*10)/10;
        s+=`<br>💰 ${zahl(pr)} ฿/${stk?"Stk":"kg"} → <b>${zahl(kosten)} ฿ ${h("verkaufsware")}</b>`;
        if(!stk&&pr)s+=` <span style="opacity:.7">(+${Math.round((kosten/pr-1)*100)} % ${h("durchVerschnitt")})</span>`;
      }
      /* PLAUSIBILITAETSFRAGE - Peter 20.08.: MIXO soll sofort nachfragen,
         wenn die Ausbeute unrealistisch aussieht, und fertige Antworten
         anbieten statt eine leere Zeile. Massstab: die eigene gemessene
         Ausbeute, sonst die Katalog-Schaetzung. Ausgeloest wird erst bei
         mehr als einem Viertel Abweichung nach unten - kleine Streuung
         ist normal und soll nicht nerven. */
      if(!stk){
        const rr=ausbeuteReal(k.code);
        const soll=(rr&&rr.proz)||k.ausbeute;
        if(soll&&proz<soll*0.75){
          const sollG=Math.round(rohG*soll/100);
          const rest=Math.round(sollG-fertigG);
          const fmt=(t,o)=>Object.keys(o).reduce((a,x)=>a.split("{"+x+"}").join(o[x]),t);
          s+=`<div class="card" style="margin-top:8px;border-color:var(--warn)">
            <b>🤔 ${h("plausiTitel")}</b><br>
            ${fmt(h("plausiText"),{roh:zahl(rohG)+" g",soll:"~"+zahl(sollG)+" g",ist:zahl(fertigG)+" g"})}
            <div style="margin-top:7px;display:flex;flex-direction:column;gap:5px">
              <button class="plausi" data-pl="rest">${fmt(h("plausiRest"),{rest:zahl(rest)+" g"})}</button>
              <button class="plausi" data-pl="muell">${fmt(h("plausiMuell"),{rest:zahl(rest)+" g"})}</button>
              <button class="plausi" data-pl="ok">${h("plausiPasst")}</button>
            </div></div>`;
        }
      }
      const rohDa=bestandVon(k.code);
      if(rohG>rohDa)s+=`<br><b style="color:var(--warn)">⚠ ${h("zuVielRoh")} (${zahl(rohDa)} ${k.einheit||"g"})</b>`;
      if(fertigG>rohG)s+=`<br><b style="color:var(--miss)">⚠ ${h("dreher")}</b>`;
      el.innerHTML=s;
    };
    $("r_roh").oninput=rechnung; $("r_fertig").oninput=rechnung;
    $("r_ok").onclick=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      if(!(roh>0)||!(fertig>0)){alert(h("rohFertig"));return}
      /* Eingabe ist jetzt durchgehend Gramm (bzw. Stueck) — keine Umrechnung mehr. */
      const rohG=Math.round(roh), fertigG=Math.round(fertig);
      const pr=letzterPreis(k.code);
      S.verarb.push({dat:heute(),who:S.cfg.who||"",code:rCode,roh:rohG,fertig:fertigG,
        proz:Math.round(fertigG/rohG*1000)/10,
        kosten:pr?Math.round(pr*rohG/fertigG*10)/10:"",bem:$("r_bem").value.trim()});
      S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-rohG);
      if(!S.bestand[rCode])delete S.bestand[rCode];
      S.tk[rCode]=(+(S.tk[rCode]||0))+fertigG;
      /* Was noch nicht reif war, wandert ins Reifelager statt verloren zu gehen */
      const reift=parseFloat($("r_reift").value);
      if(reift>0){
        const reiftG=Math.round(reift);
        S.reift[rCode]={menge:(reiftVon(rCode)+reiftG), seit:heute()};
        S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-reiftG);
        if(!S.bestand[rCode])delete S.bestand[rCode];
      }
      save(); render();
    };
  }
  document.querySelectorAll("[data-verk]").forEach(b=>b.onclick=()=>verkostungAuf(+b.dataset.verk));
  document.querySelectorAll("[data-verarb]").forEach(b=>b.onclick=()=>{
    if(!confirm(h("zurueck")))return;
    const v=S.verarb[+b.dataset.verarb];
    S.bestand[v.code]=(+(S.bestand[v.code]||0))+ +v.roh;
    S.tk[v.code]=Math.max(0,(+(S.tk[v.code]||0))- +v.fertig);
    if(!S.tk[v.code])delete S.tk[v.code];
    S.verarb.splice(+b.dataset.verarb,1); save(); render();
  });

  document.querySelectorAll("[data-charge]").forEach(b=>b.onclick=()=>{
    if(!confirm("Charge löschen?"))return;
    S.chargen.splice(+b.dataset.charge,1); save(); render();
  });
}

function freierCode(name){
  const alle=new Set(alleZutaten().map(k=>k.code));
  let b=(name.toUpperCase().replace(/[^A-ZÄÖÜ]/g,"").replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U")+"XX").slice(0,2);
  if(!alle.has(b))return b;
  for(let i=2;i<10;i++){const k=b[0]+i; if(!alle.has(k))return k}
  return b[0]+"9";
}

/* ---- Verkostung der AUFGETAUTEN, selbst gefrorenen Ware ------------------
   Genau die Lücke aus Peters Test: frische Frucht konnte man bewerten,
   die eigene Gefrierware bisher nicht. Sie hängt jetzt an der Verarbeitung. */
let vIdx=-1, vGeruch=0, vGeschmack=0;

  vIdx=i; const v=S.verarb[i]; if(!v)return;
  const k=findeCode(v.code)||{de:v.code};
  $("vtitel").textContent="👅 "+h("verkosten")+" — "+(nm1(k))+" ("+v.dat+")";
  $("vl_geruch").innerHTML=L("geruch");
  $("vl_geschmack").innerHTML=L("geschmack");
  $("vl_brix").innerHTML=L("brixTk");
  $("vl_bem").innerHTML=L("bem");
  $("v_ok").textContent=h("verkSpeichern");
  const alt=v.verk||{};
  vGeruch=+alt.geruch||0; vGeschmack=+alt.geschmack||0;
  $("v_bx").value=alt.bx||""; $("v_bem").value=alt.bem||"";
  [["v_geruch",vGeruch],["v_geschmack",vGeschmack]].forEach(([id,wert])=>{
    $(id).innerHTML=[1,2,3,4,5].map(x=>`<button data-n="${x}"${x<=wert?' class="on"':''}>${x}</button>`).join("");
  });
  const setz=(id,fn)=>{ $(id).onclick=e=>{const b=e.target.closest("button"); if(!b)return;
    const nn=+b.dataset.n; fn(nn);
    $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=nn)); }};
  setz("v_geruch",x=>vGeruch=x); setz("v_geschmack",x=>vGeschmack=x);
  $("vdlg").style.display="flex";
}
$("v_ab").onclick=()=>{$("vdlg").style.display="none"};
$("v_ok").onclick=()=>{
  if(vIdx<0)return;
  S.verarb[vIdx].verk={geruch:vGeruch||"",geschmack:vGeschmack||"",
    bx:$("v_bx").value,bem:$("v_bem").value.trim(),dat:heute(),who:S.cfg.who||""};
  save(); $("vdlg").style.display="none"; render();
};

/* 🔄 holt die neueste Fassung — löscht den Offline-Speicher, NICHT die Daten */
$("frisch").onclick=async()=>{
  try{
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister())); }
  }catch(e){}
  location.replace(location.pathname+"?v="+Date.now());
};

/* Kann das Handy Thai und Deutsch sprechen? */
function stimmenPruefen(){
  const el=$("stimmen");
  if(!window.speechSynthesis){el.className="stimmen no";el.textContent="🔊 —";return}
  const zeig=()=>{
    const v=speechSynthesis.getVoices();
    const th=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("th"));
    const de=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("de"));
    el.className="stimmen "+(th&&de?"ok":"no");
    el.innerHTML=`🔊 ไทย ${th?"✓":"✗"} · Deutsch ${de?"✓":"✗"}`
      +(th&&de?"":"<br>Fehlende Stimme in den Android-Einstellungen (Sprachausgabe) nachladen.");
  };
  zeig(); speechSynthesis.onvoiceschanged=zeig;
}
