chste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["Mango 50 % gefroren / 50 % frisch nach Grundlage 27 (83,5 % Wasser + Kokosmilch als Basis). Matcha IMMER durch ein feines Sieb — er klumpt sonst und man beißt auf grüne Nester. Das Sieb hängt am Mixplatz, es kostet drei Sekunden. Kokosmilch, nicht Kokoswasser: das Fett nimmt dem Matcha die Bitterkeit und trägt gleichzeitig das Mangoaroma. ⚠ Verkostung steht aus — beim ersten Mal mit 1,5 g Matcha anfangen und hochtasten, 2 g ist der Startwert für kräftigen Geschmack.","มะม่วงแช่แข็งครึ่ง สดครึ่ง ตามหลักเกณฑ์ข้อ 27 · ต้องร่อนผงมัทฉะทุกครั้ง ไม่งั้นจับเป็นก้อน · ใช้กะทิ ไม่ใช่น้ำมะพร้าว เพราะไขมันช่วยลดความขมและชูกลิ่นมะม่วง · ⚠ ยังไม่ได้ชิมทดสอบ ครั้งแรกเริ่มที่ 1.5 กรัม แล้วค่อยเพิ่ม","Mango half frozen, half fresh per rule 27. Always sift the matcha — otherwise you bite into green pockets. Coconut milk, not coconut water: the fat takes the bitterness off the matcha and carries the mango. ⚠ Not yet tasted — start at 1.5 g matcha and work up."]},{"n":"53","de":"Matcha-Ananas-Zimt","th":"มัทฉะ-สับปะรด-อบเชย","en":"Matcha-Pineapple-Cinnamon","stufe":"C","basis":0,"alg":"","bestaetigt":0,"zut":[["KO",110,"Kokosmilch","กะทิ","Coconut milk"],["AN",180,"Ananas reif (frisch)","สับปะรดสุก (สด)","Ripe pineapple (fresh)"],["MC",2,"Matcha — gesiebt","ผงมัทฉะ — ร่อนก่อน","Matcha — sifted"],["ZI",0.5,"Ceylon-Zimt — schmeckt süß, ohne Zucker zu sein","อบเชยซีลอน — ให้ความรู้สึกหวานโดยไม่ใส่น้ำตาล","Ceylon cinnamon — reads sweet without sugar"],["SA",0.3,"Salz — puffert die Ananas-Säure","เกลือ — ลดความเปรี้ยวของสับปะรด","Salt — buffers the pineapple acidity"],["AN",180,"Ananas reif (gefroren)","สับปะรดสุก (แช่แข็ง)","Ripe pineapple (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Kokosmilch","① ใส่ของเหลวก่อน: กะทิ","① Liquids first: Coconut milk"],["② Frisches & Weiches: Ananas reif","② ของสดและของนิ่ม: สับปะรดสุก","② Fresh & soft: Ripe pineapple"],["③ Trockenes darüber: Matcha, Ceylon-Zimt, Salz","③ ใส่ของแห้งทับ: ผงมัทฉะ · อบเชยซีลอน · เกลือ","③ Dry on top: Matcha, Ceylon cinnamon, Salt"],["④ Gefrorenes ganz oben: Ananas reif","④ ของแช่แข็งไว้บนสุด: สับปะรดสุก","④ Frozen last, on top: Ripe pineapple"],["90\"-Taste  (90 s, höchste Stufe)","กดปุ่ม 90 วินาที  (90 วินาที ความเร็วสูงสุด)","The 90\" button  (90 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["Der Zimt ist der Trick: er schmeckt süß, ohne Zucker zu sein, und baut eine Brücke zwischen der spitzen Ananas-Säure und der Herbe des Matcha. Ohne ihn stehen beide unverbunden nebeneinander. Zimt abwiegen, nicht schätzen — 0,5 g ist ein gestrichener Viertel-Teelöffel, ab 1 g schmeckt der Becher nach Weihnachten. Ananas braucht 90 Sekunden wegen der Fasern (Grundlage 27). ⚠ Verkostung steht aus.","อบเชยคือหัวใจ: ให้รสหวานโดยไม่ใส่น้ำตาล และเชื่อมความเปรี้ยวของสับปะรดกับความฝาดของมัทฉะ · ต้องชั่งอบเชย ไม่กะ — 0.5 กรัม คือ 1/4 ช้อนชาปาด ถ้าเกิน 1 กรัมจะกลิ่นแรงเกิน · สับปะรดต้องปั่น 90 วินาที เพราะมีเส้นใย · ⚠ ยังไม่ได้ชิมทดสอบ","The cinnamon is the trick: it reads sweet without being sugar and bridges the sharp pineapple acidity and the matcha astringency. Weigh it, don't guess — 0.5 g is a level quarter teaspoon; past 1 g the cup tastes like Christmas. Pineapple needs 90 s because of the fibres. ⚠ Not yet tasted."]},{"n":"54","de":"Matcha-Banane-Mandel (Latte-Stil)","th":"มัทฉะ-กล้วย-อัลมอนด์ (สไตล์ลาเต้)","en":"Matcha-Banana-Almond (latte style)","stufe":"C","basis":0,"alg":"🥜","bestaetigt":0,"zut":[["MM",148,"Mandelmilch EISKALT — Flasche schütteln","นมอัลมอนด์ เย็นจัด — เขย่าขวดก่อน","Almond milk, ICE COLD — shake the bottle"],["BA",120,"Banane reif (frisch)","กล้วยสุก (สด)","Ripe banana (fresh)"],["MC",2,"Matcha — gesiebt","ผงมัทฉะ — ร่อนก่อน","Matcha — sifted"],["HF",20,"Haferflocken — Körper und Sättigung","ข้าวโอ๊ต — ให้เนื้อและอยู่ท้อง","Rolled oats — body and staying power"],["SA",0.3,"Salz","เกลือ","Salt"],["BA",180,"Banane reif (gefroren)","กล้วยสุก (แช่แข็ง)","Ripe banana (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Mandelmilch EISKALT","① ใส่ของเหลวก่อน: นมอัลมอนด์ เย็นจัด","① Liquids first: Almond milk, ICE COLD"],["② Frisches & Weiches: Banane reif","② ของสดและของนิ่ม: กล้วยสุก","② Fresh & soft: Ripe banana"],["③ Trockenes darüber: Matcha, Haferflocken, Salz","③ ใส่ของแห้งทับ: ผงมัทฉะ · ข้าวโอ๊ต · เกลือ","③ Dry on top: Matcha, Rolled oats, Salt"],["④ Gefrorenes ganz oben: Banane reif","④ ของแช่แข็งไว้บนสุด: กล้วยสุก","④ Frozen last, on top: Ripe banana"],["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],["In den Trinkbecher gießen · Deckel · Halm · Sticker","เทใส่แก้ว · ปิดฝา · หลอด · สติกเกอร์","Pour into the cup · lid · straw · sticker"]],"tip":["Das ist der Matcha-Latte als Smoothie — die Fassung, die in Thailand jeder kennt, nur ohne Zucker und ohne Eis. AUSNAHME ZUR REGEL: Banane steht hier bei 60 % gefroren statt der üblichen 45 %. Das ist Absicht. Banane friert cremig statt eisig, weil sie kaum freies Wasser hat, das große Kristalle bilden könnte — und die Mandelmilch trägt die Masse. So werden die 180 g Kälte je Becher erreicht, die die Frucht ohne Eiszusatz liefern muss. Haferflocken kommen trocken dazu (Stufe ③) und mixen sich in 60 Sekunden glatt; sie machen aus dem Getränk ein Frühstück. ⚠ Verkostung steht aus.","มัทฉะลาเต้ในแบบสมูทตี้ — ไม่ใส่น้ำตาล ไม่ใส่น้ำแข็ง · ข้อยกเว้น: กล้วยแช่แข็ง 60% แทน 45% ตั้งใจทำ เพราะกล้วยแช่แข็งแล้วเนียน ไม่เป็นเกล็ดน้ำแข็ง และนมอัลมอนด์ช่วยพยุงเนื้อ · ข้าวโอ๊ตใส่ตอนของแห้ง (ขั้นที่ ③) ปั่น 60 วินาทีก็เนียน ทำให้อิ่มเหมือนมื้อเช้า · ⚠ ยังไม่ได้ชิมทดสอบ","The matcha latte as a smoothie — the version everyone in Thailand knows, minus the sugar and the ice. EXCEPTION TO THE RULE: banana sits at 60 % frozen here instead of the usual 45 %. That is deliberate. Banana freezes creamy rather than icy because it holds almost no free water to form large crystals, and the almond milk carries the mass. That is how the cup reaches its 180 g of cold without added ice. ⚠ Not yet tasted."]},{"n":"55","de":"Kurkuma-Ananas-Ingwer","th":"ขมิ้น-สับปะรด-ขิง","en":"Turmeric-Pineapple-Ginger","stufe":"C","basis":0,"alg":"","bestaetigt":0,"zut":[["KO",100,"Kokosmilch — Fettträger, ohne ihn bleibt Kurkuma wirkungslos","กะทิ — ตัวพาไขมัน","Coconut milk — the fat carrier"],["LS",5,"Limettensaft","น้ำมะนาว","Lime juice"],["AN",160,"Ananas (frisch)","สับปะรด (สด)","Pineapple (fresh)"],["IG",3,"Ingwer, frisch gerieben (≈1 cm)","ขิงสดขูด (ราว 1 ซม.)","Fresh ginger, grated"],["KU",1,"Kurkuma, frisch gerieben — Handschuhe, färbt","ขมิ้นสดขูด — ใส่ถุงมือ ติดสี","Fresh turmeric, grated — gloves, it stains"],["PP",0.2,"Schwarzer Pfeffer, 1 Mühlendrehung","พริกไทยดำ 1 หมุน","Black pepper, one grind"],["AN",200,"Ananas (gefroren)","สับปะรด (แช่แข็ง)","Pineapple (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล die 3 kg abzubauen. Als zweite „pur“-Farbe (weiß) neben dem Gelb von Mango und Ananas. ⚠ Verkostung steht aus.","ผลชิมของปีเตอร์ 15.08. เรื่องแก้วมังกรดิบ: แทบไม่มีกลิ่น แทบไม่มีรส · มะนาว สะระแหน่ และเกลือจึงไม่ใช่ของตกแต่ง แต่เป็นตัวปลุกรส ถ้าไม่มีจะจืดสนิท · เกลือคือตัวที่แรงที่สุด แม้จะไม่รู้สึกว่าเค็ม · ใช้แก้วมังกร 450 กรัมต่อแก้ว จึงลดสต็อก 3 กก. ได้เร็วที่สุด · ⚠ ยังไม่ได้ชิมทดสอบ","Peter's own tasting note on raw dragon fruit (15.08.): barely any smell, barely any taste. That is exactly why lime, mint and salt are here as wake-up agents, not garnish. Salt is the strongest of the three even though you never taste it. Uses 450 g per cup — the fastest way to clear the 3 kg. ⚠ Not yet tasted."]},{"n":"57","de":"Drachenfrucht-Ananas-Limette","th":"แก้วมังกรขาว-สับปะรด-มะนาว","en":"Dragon Fruit White-Pineapple-Lime","stufe":"B","basis":0,"alg":"","bestaetigt":0,"zut":[["KW",90,"Kokoswasser","น้ำมะพร้าว","Coconut water"],["LS",8,"Limettensaft","น้ำมะนาว","Lime juice"],["DW",100,"Drachenfrucht weiß (frisch)","แก้วมังกรขาว (สด)","White dragon fruit (fresh)"],["AN",67,"Ananas (frisch)","สับปะรด (สด)","Pineapple (fresh)"],["DW",123,"Drachenfrucht weiß (gefroren)","แก้วมังกรขาว (แช่แข็ง)","White dragon fruit (frozen)"],["AN",82,"Ananas (gefroren)","สับปะรด (แช่แข็ง)","Pineapple (frozen)"]],"schritte":[["MIXBEHÄLTER: der schlanke 2,0 L (schmaler Boden, 33 cm) — Standard","โถปั่น: โถทรงสูง 2.0 ล. (ก้นแคบ สูง 33 ซม.) — ใช้ประจำ","BLENDER JAR: the slim 2.0 L (narrow base, 33 cm) — standard"],["Mixbehälter auf die Waage, Tara drücken","วางโถปั่นบนตาชั่ง แล้วกดทาร่า","Blender jar on the scale, press tare"],["① Flüssigkeit zuerst: Kokoswasser, Limettensaft","① ใส่ของเหลวก่อน: น้ำมะพร้าว · น้ำมะนาว","① Liquids first: Coconut water, Lime juice"],["② Frisches & Weiches: Drachenfrucht weiß, Ananas","② ของสดและของนิ่ม: แก้วมังกรขาว · สับปะรด","② Fresh & soft: White dragon fruit, Pineapple"],["④ Gefrorenes ganz oben: Drachenfrucht weiß, Ananas","④ ของแช่แข็งไว้บนสุด: แก้วมังกรขาว · /* Bestellungen, die mit der App ausgeliefert werden, muessen auch auf schon
   eingerichteten Geraeten ankommen — dort laeuft serverStandUebernehmen nie
   wieder. Deshalb einmalig nachtragen, aber NUR was der Nutzer nicht laengst
   selbst erfasst oder als angekommen abgehakt hat. */
function bestellungenNachtragen(){
  const b=STARTBESTAND.bestellt||{};
  const quittiert=JSON.parse(localStorage.getItem("blend_best_quittiert")||"{}");
  let neu=false;
  Object.keys(b).forEach(c=>{
    if(quittiert[c])return;                       /* schon einmal eingespielt */
    /* Ab hier gilt die Bestellung als eingespielt — auch wenn wir sie gleich
       nicht eintragen. Sonst versucht die App es bei jedem Start erneut und
       ueberschreibt, was der Nutzer inzwischen abgehakt hat. */
    quittiert[c]=1; neu=true;
    if(S.bestellt&&S.bestellt[c])return;          /* Nutzer hat es selbst erfasst */
    if(bestandVon(c)>0||tkVon(c)>0)return;        /* liegt laengst im Haus */
    S.bestellt=S.bestellt||{}; S.bestellt[c]=b[c];
  });
  if(neu){ localStorage.setItem("blend_best_quittiert",JSON.stringify(quittiert)); save(); }
}

    S.bestand=S.bestand||{}; S.bestand[e.code]=e.menge;

/* --- AMPEL: START --- */
/* Zutaten-Ampel: gruen = frei, gelb = Vorsicht, rot = nicht verkaufen.
   Datenlage:
   - Wird ZUSAETZLICH zum State-Blob in einem eigenen Schluessel gehalten,
     damit auch die Kasse in demselben Browser (gleicher Origin) live liest,
     ohne den ganzen Bestands-Blob laden zu muessen.
   - S.ampel bleibt die Wahrheit fuer diese App und wird bei jedem set
     zurueck in den gemeinsamen Schluessel gespiegelt.                     */
const AMPELKEY="blend_ampel_v1";
function _ampelLesen(){ try{ return JSON.parse(localStorage.getItem(AMPELKEY)||"{}")||{}; }catch(e){ return {}; } }
S.ampel = Object.assign({}, _ampelLesen(), S.ampel||{});
function saveAmpel(){
  try{ localStorage.setItem(AMPELKEY, JSON.stringify(S.ampel||{})); }catch(e){}
  save();
}
function setAmpel(code,status,grund){
  if(!code)return;
  S.ampel = S.ampel || {};
  const wer = (S.cfg && S.cfg.who) || (typeof istLexi==="function" && istLexi() ? "Lexi" : "Peter");
  /* CHARGEN: manuell-Marker, damit die Auto-Ableitung aus Chargen die
     bewusste Wahl nicht ueberschreibt (Baustein 1/2 verzahnt). */
  S.ampel[code] = {status:String(status), grund: (grund==null?"":String(grund)),
                   ts: Date.now(), wer, manuell:true};
  saveAmpel();
  syncAmpel(code,status,grund||"");
}
/* Cross-Device via existierenden Webhook: fire-and-forget, Offline-tolerant.
   Der Server kennt "typ:ampel" heute noch nicht; die Nachricht wird ignoriert
   und schadet nichts, sobald der Server sie kennt, wird sie uebernommen.   */
function syncAmpel(code,status,grund){
  const url = (typeof syncUrl==="function") ? syncUrl() : "";
  if(!url) return;
  try{
    fetch(url,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({typ:"ampel",code,status,grund:grund||"",ts:Date.now(),
        wer:(S.cfg && S.cfg.who)||""})
    }).catch(()=>{});
  }catch(e){}
}
/* Wenn ein anderes Tab (typisch die Kasse) die Ampel aendert, live nachladen. */
window.addEventListener("storage", ev=>{
  if(ev && ev.key===AMPELKEY){
    S.ampel = _ampelLesen();
    if(typeof render==="function") render();
  }
});
/* Kleine Helfer fuers Rendern. */
const ampelStatus = c => (S.ampel && S.ampel[c] && S.ampel[c].status) || "";
const ampelGrund  = c => (S.ampel && S.ampel[c] && S.ampel[c].grund)  || "";
function ampelRowKlasse(c){
  const s = ampelStatus(c);
  return s==="rot" ? "a-rot" : s==="gelb" ? "a-gelb" : s==="gruen" ? "a-gruen" : "";
}
function ampelKnopfe(c){
  const s = ampelStatus(c);
  return `<span class="ampel" data-ampel-code="${c}">
    <button type="button" data-ampel-set="gruen" data-code="${c}" class="${s==="gruen"?"on a-g":""}" title="frei">🟢</button>
    <button type="button" data-ampel-set="gelb"  data-code="${c}" class="${s==="gelb" ?"on a-y":""}" title="Vorsicht">🟡</button>
    <button type="button" data-ampel-set="rot"   data-code="${c}" class="${s==="rot"  ?"on a-r":""}" title="nicht verkaufen">🔴</button>
  </span>`;
}
/* Teil E — Verkopplung mit ENTSORGT.
   Ist eine Zutat in ENTSORGT gelistet UND weder Rohware noch TK vorhanden,
   dann automatisch auf 'rot' setzen. Bereits manuell auf 'rot' gesetzte
   Zutaten werden nicht ueberschrieben (der Grund koennte wertvoller sein). */
function ampelAutoAusEntsorgt(){
  try{
    if(typeof ENTSORGT==="undefined" || !Array.isArray(ENTSORGT)) return;
    const gesehen={};
    ENTSORGT.forEach(x=>{
      const c = x && x[0]; if(!c || gesehen[c]) return;
      gesehen[c]=1;
      const roh=+(S.bestand[c]||0), tk=+(S.tk[c]||0);
      if(roh===0 && tk===0){
        const cur = (S.ampel[c]||{}).status;
        if(cur!=="rot"){
          S.ampel[c] = {status:"rot",
            grund:"automatisch: entsorgt und kein Bestand mehr",
            ts:Date.now(), wer:"System"};
        }
      }
    });
    try{ localStorage.setItem(AMPELKEY, JSON.stringify(S.ampel||{})); }catch(e){}
    save();
  }catch(e){}
}

const CHARGE_DEFAULT_TAGE = 3;
function chHaltbar(code){
  const k = (typeof findeCode==="function") ? findeCode(code) : null;
  return HALTBARKEIT[code] || {name:(k&&k.de)||code, einheit:(k&&k.einheit)||"g",
    tage_frisch:CHARGE_DEFAULT_TAGE, tage_angebrochen:CHARGE_DEFAULT_TAGE, kategorie:"unbekannt"};
}
function chargeId(code){
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  return code+"_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())
        +"_"+pad(d.getHours())+pad(d.getMinutes())+"_"+Math.random().toString(36).slice(2,5);
}

/* Ableitungsregel Chargen -> Ampel (Baustein 1). */
function ampelAusChargen(code){
  const alle = Object.values(S.chargen_frisch||{}).filter(c=>c && c.zutat_code===code);
  const aktiv = alle.filter(c=>c.status==="frisch"||c.status==="karrenz");
  if(!aktiv.length) return "rot";
  const frischOK = aktiv.some(c=>{
    if(c.status!=="frisch") return false;
    const menge = +(c.menge_ml||c.menge_g||0);
    const rest  = +(c.menge_rest||0);
    return menge>0 && (rest/menge) > 0.20;
  });
  return frischOK ? "gruen" : "gelb";
}
function chargenAmpelSyncAll(){
  Object.keys(HALTBARKEIT).forEach(code=>{
    const hatChargen = Object.values(S.chargen_frisch||{}).some(c=>c && c.zutat_code===code);
    if(!hatChargen) return;                           /* keine Chargen: nichts anfassen */
    S.ampel = S.ampel || {};
    const cur = S.ampel[code];
    if(cur && cur.manuell) return;                    /* manuell hat Vorrang */
    const soll = ampelAusChargen(code);
    if(!cur || cur.status !== soll){
      S.ampel[code] = {status:soll, grund:"auto: aus Chargen abgeleitet",
        ts:Date.now(), wer:"System", manuell:false};
    }
  });
  saveAmpel();
}
/* Status-Autoruecker (Ablauf -> Check, Karenz-Ablauf -> entsorgen, Rest 0 -> aufgebraucht). */
function chargenAutoStatus(){
  const jetzt = Date.now();
  let ver = false;
  Object.values(S.chargen_frisch||{}).forEach(c=>{
    if(!c) return;
    if((+c.menge_rest||0)<=0 && c.status!=="entsorgen" && c.status!=="aufgebraucht"){
      c.status = "aufgebraucht"; ver=true;
    }
    if(c.status==="frisch" && c.ablauf_am && new Date(c.ablauf_am).getTime()<=jetzt){
      c.status = "abgelaufen_pruefen"; ver=true;
    }
    if(c.status==="karrenz" && c.karrenz_bis && new Date(c.karrenz_bis).getTime()<=jetzt){
      const letzte = (c.peter_freigaben||[]).slice(-1)[0];
      const jung = letzte && (jetzt - new Date(letzte.ts).getTime()) < 2*3600*1000;
      if(!jung){ c.status = "entsorgen"; ver=true; }
    }
  });
  if(ver){ chargenSaveMirror(); }
  chargenAmpelSyncAll();
  if(ver && typeof render==="function") render();
}
setInterval(chargenAutoStatus, 5*60*1000);
setTimeout(chargenAutoStatus, 600);

/* Neue Charge anlegen. */
function chargeAnlegen(code, menge, produziertLocal, von, notiz){
  const H = chHaltbar(code);
  const prod = produziertLocal ? new Date(produziertLocal) : new Date();
  const ablauf = new Date(prod.getTime() + H.tage_frisch*24*3600*1000);
  const id = chargeId(code);
  const ist_ml = (H.einheit==="ml");
  S.chargen_frisch = S.chargen_frisch || {};
  S.chargen_frisch[id] = {
    zutat_code: code,
    zutat_key: (H.name||code).toLowerCase().replace(/[^a-z0-9]+/g,"_"),
    produziert_am: prod.toISOString(),
    produziert_von: von||"unbekannt",
    [ist_ml?"menge_ml":"menge_g"]: menge,
    menge_rest: menge,
    ablauf_am: ablauf.toISOString(),
    haltbarkeit_tage: H.tage_frisch,
    karrenz_bis: null,
    status: "frisch",
    sinnes_check: null,
    peter_freigaben: [],
    beleg_foto_url: null,
    notiz: notiz||""
  };
  chargenSaveMirror();
  const cur = (S.ampel||{})[code];
  if(!cur || !cur.manuell){
    S.ampel = S.ampel || {};
    S.ampel[code] = {status:"gruen", grund:"neue Charge angelegt", ts:Date.now(), wer:"System", manuell:false};
    saveAmpel();
  }
  chargenSync({typ:"charge_neu", id, code, menge, von, notiz:notiz||""});
}
function chargeAlsAufgebraucht(id){
  const c = (S.chargen_frisch||{})[id]; if(!c) return;
  c.menge_rest = 0; c.status = "aufgebraucht";
  chargenSaveMirror(); chargenAmpelSyncAll();
  chargenSync({typ:"charge_aufgebraucht", id});
  render();
}
function chargeEntsorgen(id, grund){
  const c = (S.chargen_frisch||{})[id]; if(!c) return;
  if(!confirm("Charge "+id+" wirklich entsorgen?")) return;
  c.status = "entsorgen";
  c.notiz  = (c.notiz||"") + (grund?(" · WEG: "+grund):" · entsorgt");
  chargenSaveMirror(); chargenAmpelSyncAll();
  chargenSync({typ:"charge_entsorgt", id, grund:grund||""});
  render();
}

/* Renderer fuer den neuen Filter „chargen" in vBestand. */
function vChargenListe(){
  const items = Object.entries(S.chargen_frisch||{})
    .filter(([,c])=>c && c.status!=="aufgebraucht")
    .sort((a,b)=> String(a[1].ablauf_am||"").localeCompare(String(b[1].ablauf_am||"")));
  const jetzt = Date.now();
  const heutBis = new Date(); heutBis.setHours(23,59,59,999);
  const abH = items.filter(([,c])=>c.ablauf_am && new Date(c.ablauf_am).getTime()<=heutBis.getTime() && c.status==="frisch").length;
  const chip = st => ({frisch:"🟢 frisch",abgelaufen_pruefen:"🟠 Check nötig",karrenz:"🟡 Karenz",entsorgen:"🔴 entsorgen",aufgebraucht:"⚪ leer"})[st]||st;
  let neu = `<div class="bar" style="margin:0 0 12px;flex-wrap:wrap">
    ${Object.keys(HALTBARKEIT).map(code=>`<button class="b" data-chneu="${code}">➕ ${HALTBARKEIT[code].name}</button>`).join("")}
  </div>`;
  if(!items.length) return neu + `<div class="empty">Keine aktiven Chargen — mit ➕ oben eine anlegen.</div>`;
  const header = abH ? `<div class="row" style="background:#fff3cd">⚠ ${abH} Charge${abH===1?"":"n"} läuft heute ab</div>` : "";
  return neu + header + items.map(([id,c])=>{
    const Hz = chHaltbar(c.zutat_code);
    const menge = +(c.menge_ml||c.menge_g||0);
    const rest  = +(c.menge_rest||0);
    const pct   = menge>0 ? Math.round(rest/menge*100) : 0;
    const abl   = c.ablauf_am ? new Date(c.ablauf_am) : null;
    const tageBis = abl ? Math.round((abl.getTime()-jetzt)/(24*3600*1000)) : "";
    const karenz = c.karrenz_bis ? new Date(c.karrenz_bis) : null;
    const karAb  = karenz && karenz.getTime()<=jetzt;
    const bg = c.status==="entsorgen"?"#ffe5e5":c.status==="karrenz"?"#fffbe6":c.status==="abgelaufen_pruefen"?"#ffedd8":"#fff";
    const border = c.status==="entsorgen" ? "2px solid #d32f2f" : "1px solid #e5e0d8";
    return `<div style="border:${border};border-radius:10px;padding:10px;margin:6px 0;background:${bg}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <b>${esc(Hz.name)}</b><span>${chip(c.status)}</span>
      </div>
      <div class="mini">
        ${abl?abl.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})+" · ":""}
        ${typeof tageBis==="number" ? (tageBis>=0?"in "+tageBis+" T":Math.abs(tageBis)+" T abgelaufen") : ""}
        · ${esc(c.produziert_von||"")}
      </div>
      <div style="background:#eee;border-radius:5px;height:8px;overflow:hidden;margin:6px 0">
        <div style="background:${pct>50?"#4caf50":pct>20?"#ffb74d":"#e57373"};width:${pct}%;height:100%"></div>
      </div>
      <div class="mini">${rest} / ${menge} ${Hz.einheit} (${pct}%)</div>
      <div class="bar" style="margin-top:6px;flex-wrap:wrap">
        ${c.status==="abgelaufen_pruefen" ? `<button class="b" data-ch4sinne="${id}">👃 4-Sinne-Check</button>`:""}
        ${c.status==="karrenz" && karAb ?  `<button class="b" data-chpeter="${id}">📱 Peter fragen</button>`:""}
        ${c.status!=="entsorgen" ? `<button class="b" data-chleer="${id}">🥛 aufgebraucht</button>`:""}
        ${c.status!=="entsorgen" ? `<button class="b r" data-chweg="${id}">🗑 entsorgen</button>`:""}
      </div>
      ${c.notiz?`<div class="mini" style="margin-top:6px">${esc(c.notiz)}</div>`:""}
    </div>`;
  }).join("");
}

/* ===== Gemeinsamer Speicher =============================================
   Peter (Android) und Lexi (iPhone) hatten je einen eigenen Browser-Speicher.
   Hier gleichen beide gegen ein Google-Apps-Script ab.

   Zusammengefuehrt wird PRO ZUTAT nach Zeitstempel, nicht pro Geraet. Wer
   zuletzt gesendet hat, ist egal — es zaehlt, wer zuletzt GEAENDERT hat.
   Ohne das wuerde ein Abgleich die Arbeit des anderen loeschen.          */

const SYNCKEY="blend_os_sync", GERKEY="blend_os_geraet";
/* Adresse des gemeinsamen Speichers, mit der App ausgeliefert. Damit muss
   niemand mehr etwas eintippen — Peter und Lexi haengen sofort am selben
   Bestand. Ueber das Feld in der Bestandsansicht laesst sie sich ueberschreiben. */
const SYNC_STANDARD="https://script.google.com/macros/s/AKfycbzDrg7mh6nIeGWYKNOXRYjs4bw0aAqmOyN1ZQQZcfbyWg5MZLt87B7FbiqyeN2p1f0S/exec";
const syncUrl =()=>{ const g=localStorage.getItem(SYNCKEY); return g===null?SYNC_STANDARD:g; };
const geraetName=()=>{
  let g=localStorage.getItem(GERKEY);
  if(!g){ g=(istLexi()?"lexi":"peter")+"-"+Math.floor(Math.random()*9000+1000);
          localStorage.setItem(GERKEY,g); }
  return g;
};

/* Jede Aenderung bekommt die aktuelle Uhrzeit. */
function stempel(code){
  S.ts=S.ts||{}; S.wer=S.wer||{};
  S.ts[code]=Date.now();
  /* Wer die Menge zuletzt angefasst hat — sonst sieht Peter zwar, DASS sich
     etwas geaendert hat, aber nicht, ob er selbst oder Lexi es war. */
  S.wer[code]=istLexi()?"Lexi":"Peter";
}

/* "vor 20 Min", "vor 3 Std", "gestern" — kurz genug fuer eine Zeile. */
function vorZeit(ms){
  if(!ms)return "";
  const min=Math.floor((Date.now()-ms)/60000);
  if(min<1)  return h("geradeEben");
  if(min<60) return h("vor")+" "+min+" "+h("min");
  const std=Math.floor(min/60);
  if(std<24) return h("vor")+" "+std+" "+h("std");
  const tg=Math.floor(std/24);
  return tg===1?h("gestern"):h("vor")+" "+tg+" "+h("tagen");
}
/* Frisch = in den letzten 12 Stunden angefasst. */
const FRISCH_MS=12*3600*1000;
const istFrisch=c=>((S.ts||{})[c]||0) > Date.now()-FRISCH_MS;

/* Nach jeder Aenderung: kurz warten, dann abgleichen. Waehrend des Tippens
   soll nicht bei jedem Tastendruck gesendet werden. */
function syncSpaeter(){
  if(!syncUrl())return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncJetzt(false), 2500);
}

/* KEIN SCHREIBEN AUS EINER TESTUMGEBUNG.
   Am 30.08.2026 haben zwei Tests auf localhost den Kakao im ECHTEN
   gemeinsamen Speicher auf 0 gesetzt — der Server nimmt jeden POST an, und
   der frische Zeitstempel gewinnt gegen die echten Daten. Der Schutz sitzt
   deshalb an der Wurzel, nicht an einer einzelnen Funktion: Gesendet wird
   nur von der ausgelieferten Fassung ueber https, nie von localhost oder
   aus einer Datei. Lesen bleibt erlaubt — das schadet nichts und macht
   Tests mit echten Mengen erst moeglich. */
const DARF_SENDEN = location.protocol==="https:" &&
  !/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);

async function syncJetzt(zeigen){
  const url=syncUrl();
  if(!DARF_SENDEN){ console.log("[Test] kein Abgleich von",location.hostname); return; }
  if(!url||syncLauft)return;
  syncLauft=true; syncFehler="";
  if(zeigen)render();
  try{
    /* text/plain ist Absicht: bei application/json verlangt der Browser eine
       Vorab-Anfrage, die Apps Script nicht beantwortet. */
    const antw=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        geraet:geraetName(),
        bestand:S.bestand||{}, tk:S.tk||{}, reift:S.reift||{}, bestellt:S.bestellt||{},
        ts:S.ts||{}, wer:S.wer||{}, stand:S.stand||0
      })
    });
    const daten=await antw.json();
    if(!daten||!daten.ok)throw new Error((daten&&daten.fehler)||"Antwort unbrauchbar");
    S.bestand=daten.bestand||{};
    S.tk     =daten.tk||{};
    S.reift  =daten.reift||{};
    /* NICHT ||{} — der Server kennt "bestellt" erst ab der Fassung vom
       19.08. Ein alter Server antwortet ohne das Feld, und ein leeres
       Objekt wuerde die Bestellung auf dem Geraet stillschweigend
       loeschen. Fehlt das Feld, bleibt der lokale Stand stehen. */
    if(daten.bestellt) S.bestellt=daten.bestellt;
    S.ts     =daten.ts||{};
    S.wer    =daten.wer||S.wer||{};
    S.stand  =daten.stand||0;
    save();
    syncStand=new Date().toTimeString().slice(0,5);
    bestellungenNachtragen();
    wareneingangNachtragen();
  }catch(e){
    syncFehler=(e&&e.message)||"kein Netz";
  }finally{
    syncLauft=false;
    render();
  }
}

/* Beim Oeffnen und beim Zurueckkommen zur App abgleichen. */
function syncStart(){
  if(!syncUrl())return;
  syncJetzt(false);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden)syncJetzt(false);
  });
}

/* Wenn irgendetwas schiefgeht, soll man es SEHEN statt eine weiße Seite zu bekommen.
   (14.08.: Lexis iPhone zeigte nur eine Fehlermeldung, ohne dass wir wussten, welche.) */
window.onerror=function(msg,src,zeile,spalte,err){
  try{
    var box=document.createElement("div");
    box.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fdf4f3;"
      +"border-top:2px solid #c0392b;color:#7a2018;padding:12px 14px;font:12px/1.5 monospace;max-height:45vh;overflow:auto";
    box.innerHTML="<b>Fehler / Error</b><br>"+String(msg)+"<br>Zeile "+zeile+":"+spalta(spalte)
      +"<br><br><button onclick=\"location.replace(location.pathname+'?v='+Date.now())\" "
      +"style=\"padding:8px 12px;font:700 13px sans-serif;border-radius:8px;border:1px solid #c0392b;background:#fff\">"
      +"🔄 Neu laden</button>";
    document.body.appendChild(box);
  }catch(e){}
  function spalta(c){return c===undefined?"?":c}
  return false;
};

/* NAMEN — Thai zuerst, Englisch immer dabei, Deutsch als Rueckfall.
   Peter, 30.08.2026: "erst thai, dann deutsch, wo noch platz ist gerne auch
   in englisch […] falls das zu viel text ist, dann nur thai & Englisch."

     nm1  nur der Hauptname  — Thai, notfalls Deutsch
     nm2  Thai · Englisch    — fuer enge Stellen (Aufzaehlungen, Chips)

   Diese Helfer haengen NICHT an istLexi(). Genau das war der Fehler:

/* 🔊 spricht ein Wort in der jeweiligen Sprache */
function sprich(text,lang){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.slice(0,2)));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

const heute=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* Sucht über ALLE Felder und alle Sprachen. Mehrere Wörter = alle müssen passen.
   „erd" findet Erdbeere, „straw" findet Strawberry, „สตรอ" findet สตรอว์เบอร์รี,
   „ER" findet den Code, „tk" findet die TK-Gruppe. */
/* Wie gut passt ein Treffer? Kleinere Zahl = weiter oben.
   Ohne das stand "Mangostan" ueber "Mango", weil es frueher im Katalog steht. */
function rang(k,q){
  const w=q.trim().toLowerCase();
  if(!w)return 99;
  if(k.code.toLowerCase()===w)return 0;                     /* Code exakt */
  const namen=[k.de,k.th,k.en,k.laut].filter(Boolean).map(x=>String(x).toLowerCase());
  if(namen.some(x=>x===w))return 1;                         /* Name exakt */
  if(namen.some(x=>x.startsWith(w)))return 2;               /* Name beginnt damit */
  if(namen.some(x=>x.split(/[\s\-\/(),]+/).some(t=>t.startsWith(w))))return 3;  /* Wortanfang */
  return 4;                                                 /* irgendwo enthalten */
}
/* Bei gleichem Rang gewinnt der kuerzere Name: "Mango" vor "Mango-Pueree". */
function sortiereTreffer(liste,q){
  return liste.slice().sort((a,b)=>
    rang(a,q)-rang(b,q) || (a.de||"").length-(b.de||"").length || (a.de||"").localeCompare(b.de||""));
}

function passt(k,q){
  const heu=[k.code,k.de,k.th,k.en,k.gruppe,k.sorten,k.preistext,k.laut,k.deLaut]
    .filter(Boolean).join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(w=>{
    /* GROSS geschriebene 2-3 Buchstaben = Code-Suche ("ER" soll nicht in "Beere" treffen) */
    if(/^[A-Z]{2,3}[0-9]?$/.test(w))return k.code===w;
    return heu.includes(w.toLowerCase());
  });
}

/* Katalog + eigene Zutaten in einer Liste */
const alleZutaten=()=>KATALOG.concat(S.eigen);
const findeCode=c=>alleZutaten().find(k=>k.code===c);
/* Alle Mengen mit Tausenderpunkt. Peter 17.08.: "1.146 g liest sich sicherer
   als 1146 g" — und ein verrutschtes Komma faellt sofort auf, weil 627.000
   optisch nichts mit 627 zu tun hat. */
function zahl(w){
  const n=+w; if(!isFinite(n))return String(w);
  /* Trennzeichen ist ein SCHMALES LEERZEICHEN, kein Punkt.
     Peter 17.08.: "Da steht 435.300, der Punkt ist in der Mitte. Was bedeutet
     das?" — Der Punkt heisst auf Deutsch Tausender, auf Thai und Englisch aber
     Komma. In einer dreisprachigen App ist er nicht eindeutig. Ein Leerzeichen
     ist es in jeder Sprache: 435 300 kann niemand als 435,3 lesen. */
  return n.toLocaleString("de-DE",{maximumFractionDigits:2}).replace(/\./g," ");
}
const bestandVon=c=>+(S.bestand[c]||0);          // Rohware
const tkVon=c=>+(S.tk[c]||0);                     // verarbeitet, verkaufsfähig
const selbstDa=c=>tkVon(c)>0||bestandVon(c)>0||reiftVon(c)>0;
const daIst=c=>istHausvorrat(c)||ausRohstoff(c)||selbstDa(c)||ersatzFuer(c).some(selbstDa);
/* Welche Sorte vertritt hier gerade? "" wenn die eigene da ist. */
const vertretenDurch=c=>selbstDa(c)||istHausvorrat(c)||ausRohstoff(c)?"":(ersatzFuer(c).find(selbstDa)||"");   // Hausvorrat zaehlt immer als da
/* GRUNDREGEL (Peter 16.08.): Was im Haus liegt, gilt als verfuegbar — auch
   ungeschnitten, auch noch reifend. Der Smoothie wird angeboten; ist die Frucht
   am Becher doch nicht so weit, sagen wir es dem Gast ("die braucht noch einen
   Tag bis zum vollen Genuss"). Der Zustand bleibt als Hinweis sichtbar, er
   blockiert aber nichts mehr. Einzige Ausnahme: trockene Kerne — die koennen
   physisch nicht in den Mixer. */
const verkaufsfaehig=c=>{ if(istHausvorrat(c)||ausRohstoff(c))return true;
  if(brauchtEinweichen(c))return tkVon(c)>0||ersatzFuer(c).some(e=>tkVon(e)>0);
  return selbstDa(c)||ersatzFuer(c).some(selbstDa);
};

/* Selbst hergestellte Fluessigkeiten: nur den Rohstoff im Bestand fuehren.
   Die App rechnet, fuer wie viele Liter er reicht.
   ⚠ Startannahmen — beim ersten Ansatz nachwiegen und hier korrigieren. */
const SELBST={
  HM:{aus:"HF", proLiter:100, name:"Hafermilch"},   /* 100 g Haferflocken -> 1 L */
  /* Peter 15.08.: "Kokoswasser habe ich frisch aus der Nuss."
     ⚠ 4 junge Nuesse ~ 1 L ist der Startwert — beim naechsten Aufschlagen
     das Wasser JEDER Nuss einzeln wiegen und hier korrigieren. */
  /* 400 ml je Nuss = 2,5 Nuesse je Liter, aus Peters Einkaufszettel
     (Foto 30.08.2026, schriftlich: "Wasser davon ~ 400 ml/Nuss").
     Der alte Wert 4 Nuesse/Liter (250 ml) war ein Startwert und zu niedrig.
     ⚠ WIDERSPRUCH, noch nicht aufgeloest: Peter nannte muendlich am selben
     Tag "6–7 Liter aus 10 Nuessen" = 600–700 ml je Nuss, also fast das
     Doppelte. Gerechnet wird mit den 400 ml vom Zettel — die niedrigere Zahl
     ist die sichere Richtung, denn zu hoch angesetzt haelt die App
     Kokoswasser fuer vorhanden, das nicht da ist. Einmal aufschlagen und
     wiegen, dann steht die Zahl fest. */
  KW:{aus:"KN", proLiter:2.5, name:"Kokoswasser", frisch:true},
  /* Peter 17.08.: "Da kommen 4–5 getrocknete Hibiskusblueten in 1 Liter Wasser.
     Ich habe 90 g da, das reicht fuer mindestens 30 Liter."
     90 g / 30 L = 3 g/L. Der alte Startwert 25 g/L war um Faktor 8 zu hoch —
     dadurch meldete die App Nachkaufbedarf, obwohl der Vorrat fuer Monate reicht. */
  HT:{aus:"RO", proLiter:3, name:"Hibiskustee"},
  /* Peter 30.08.2026: "Orangensaft habe ich, solange ich Orangen als Rohware
     habe — steht aber auf der Einkaufsliste, obwohl vorhanden."
     Genau richtig: OS fehlte hier, also galt Saft als Kaufware, die nie im
     Bestand steht. Belegt aus dem Katalog: 1 kg Orange ergibt 480 g Saft,
     also braucht 1 Liter Saft rund 2.083 g Orangen. */
  OS:{aus:"OR", proLiter:2083, name:"Orangensaft", frisch:true},
  /* Die Zeste faellt beim selben Arbeitsgang ab — solange Orangen da sind,
     ist sie da. Sie wird nie gekauft.
     ⚠ 40 g Orange je 1 g Zeste ist ein STARTWERT (mittlere Orange ~200 g gibt
     ~5 g Abrieb), nicht gemessen. Beim naechsten Pressen den Abrieb wiegen
     und die Zahl hier korrigieren — dieselbe Regel wie beim Kokoswasser. */
  OZ:{aus:"OR", proLiter:40, name:"Orangenzeste", einheit:"g", frisch:true}
  /* Mandel- und Sojamilch werden GEKAUFT (V-Soy / Benefit), nicht selbst angesetzt.
     Kokosmilch ebenfalls immer gekauft (Dose/UHT ~60 THB/L) — Peter 15.08.2026. */
};
const literAus=code=>{ const s2=SELBST[code]; if(!s2)return null;
  const roh=+(S.bestand[s2.aus]||0); return roh?Math.round(roh/s2.proLiter*10)/10:0; };
/* Selbst herstellbar = der Rohstoff liegt da. Das Rezept ist damit machbar,
   auch wenn die Zutat selbst nie im Bestand steht. Ohne das stand Rezept 06
   auf "Kokoswasser fehlt", obwohl vier Nuesse in der Kueche lagen. */
const ausRohstoff=c=>{ const l=literAus(c); return l!==null&&l>0; };

/* Kerne und Samen, die vor dem Mixen EINGEWEICHT werden muessen. Trocken
   im Sack sind sie nicht einsatzbereit — sie verhalten sich damit wie frische
   Marktware: weisses Feld = trocken, blaues Feld = eingeweicht und mixfertig.
   faktor = Gewicht nach dem Einweichen / Trockengewicht.
   ⚠ Faktoren sind Erfahrungswerte — beim ersten Ansatz nachwiegen.
   (Peter 15.08.: "Kuerbiskerne 500 g uneingeweicht, da muss ich etwas einweichen.") */
const EINWEICHEN={
  KE:{std:"4–8",  faktor:1.8},   /* Kuerbiskerne */
  SK:{std:"2–4",  faktor:1.6},   /* Sonnenblumenkerne — laenger wird bitter */

  /* Hanfsamen geschaelt NICHT: sind weich, koennen trocken in den Mixer. */
};
const brauchtEinweichen=c=>!!EINWEICHEN[c];

/* Gekaufte TK-Ware und Pürees sind fertig — sie brauchen keine Verarbeitung.
   Frische Marktware dagegen muss erst geschnitten und gefrostet werden. */
function schonFertig(k){
  if(!k)return false;
  if(brauchtEinweichen(k.code))return false;   /* trocken ist nicht mixfertig */
  if((k.gruppe||"").indexOf("B · Früchte TK")===0)return true;
  if((" "+(k.de||"")+" ").indexOf(" TK ")>=0)return true;
  if(/P.?ree|puree|frozen|IQF/i.test(k.de||""))return true;
  return ["D · Milch","E · Tee","G · Aroma","H · Supplements","C · Rohstoffe","I · Verpackung","F · Grün"]
    .some(x=>(k.gruppe||"").indexOf(x)===0);
}

  ["ER","JB","BM"],        /* Dunkle Beere, suess-saeuerlich: Erdbeere · schwarze

const ersatzFuer=c=>{ const f=FAMILIEN.find(x=>x.indexOf(c)>=0);

/* Bechergroessen. Geeicht an der Praxis: die Rezeptmengen (~400 g) fuellen
   einen 22-oz-Becher genau. Alles andere rechnet die App daraus ab, damit am
   Stand niemand im Kopf umrechnen muss.
   (Peter 16.08.2026 nach dem Verkosten von Rezept 19.) */
const GROESSEN={
  /* BEZUGSGROESSE 16 oz = 473 ml = Faktor 1. Peter hat am 19.08. nachgemessen:
     200 g Einwaage ergaben exakt 200 ml Smoothie — der Mixer schlaegt KEINE
     Luft ein. Die alten Faktoren unterstellten rund 62 % Aufschlag und
     haetten den 22-oz-Becher nur zu zwei Dritteln gefuellt. */
  "16":{ml:473, oz:"16 oz", becher:"B16",deckel:"D16",faktor:1     },
  "22":{ml:650, oz:"22 oz", becher:"BE", deckel:"DE", faktor:1.374 },
  "12":{ml:355, oz:"12 oz", becher:"B12",deckel:"D12",faktor:0.751 },
  "P" :{ml:50,  oz:"50 ml", becher:"PB", deckel:"",   faktor:0.106 }
};
const groesse=()=>GROESSEN[bGroesse]||GROESSEN["22"];
/* Rundung so, dass Gramm-Zahlen am Stand lesbar bleiben:
   ab 10 g auf ganze Gramm, darunter auf halbe, unter 1 g auf Zehntel. */
function mengeSkaliert(g){
  const w=g*groesse().faktor;
  if(w>=10)return Math.round(w);
  if(w>=1) return Math.round(w*2)/2;
  return Math.round(w*10)/10;
}

/* Tippfehler-Bremse. Peter 16.08.: "Was, wenn ich statt 627 g die Zahl 627000
   eintippe?" Ein verrutschtes Komma faellt sonst niemandem auf und verzerrt
   Reichweite, Einkaufsvorschlag und Kalkulation still vor sich hin.
   Grenzen grosszuegig: sie sollen Tippfehler fangen, nicht Grosseinkaeufe. */
const OBERGRENZE={ "g":30000, "ml":30000, "Stk":500 };
function unplausibel(k,wert){
  const w=+wert; if(!(w>0))return null;
  const g=OBERGRENZE[k.einheit||"g"]||30000;
  if(w<=g)return null;
  /* Sieht es nach einem Faktor 1000 aus? Dann gleich den Korrekturwert anbieten. */
  return { grenze:g, vorschlag:(w/1000>=1 && w/1000<=g) ? Math.round(w/1000*100)/100 : null };
}

/* Peter 17.08.: "Die Muellbeutel muessen irgendwie anders gefuehrt werden."
   Richtig — Becher, Deckel und Halme gehen je Verkauf weg, Muellbeutel nicht.
   Sie sind Betriebsmittel wie Salz und Pfeffer: immer da, nie im Rezept. */
/* TE dazu, Peter 30.08.2026: "Gruener Tee ist in den Rezepten rot als fehlt
   markiert, ist aber doch da." Stimmt — und die Menge steht nirgends, weil
   sie noch nie jemand gewogen hat. Sie ist auch nicht die Frage: Im Rezept
   sind die 150 g der fertige AUFGUSS, nicht das Blatt. Bei den ueblichen
   ~10 g Blatt je Liter reicht eine normale Packung fuer hunderte Becher —
   genau die Rechnung, die am 17.08. schon beim Hibiskus gefuehrt wurde
   (90 g = 33 Liter = rund 500 Becher). Blatt-Tee ist damit dasselbe wie Salz
   und Pfeffer: im Haus, nicht bestandsgefuehrt.
   ⚠ Wenn die Packung wirklich leer ist, TE hier herausnehmen — dann steht er
   sofort wieder auf der Einkaufsliste. */
const HAUSVORRAT=["WA","SA","PP","MU","TR","TE"];
const istHausvorrat=c=>HAUSVORRAT.indexOf(c)>=0;

/* BOOSTER: Aufpreis-Zutat, die der Gast dazubestellen kann. Sie darf das
   Rezept NICHT blockieren — ohne Astaxanthin ist der Smoothie trotzdem
   verkaeuflich, nur eben ohne Booster. (Gefunden 16.08.: Rezept 05 stand auf
   "Astaxanthin fehlt", obwohl es nur auf Bestellung dazukommt.) */
const istBooster=z=>/BOOSTER/i.test(String(z[1]||""));
const pflicht=r=>(r.zut||[]).filter(z=>!istBooster(z));

/* BESTELLT = unterwegs. Bewusst NICHT in selbstDa/verkaufsfaehig:
   was in Isan im Lastwagen liegt, kann niemand in den Mixer geben. */
const bestelltVon=c=>+(S.bestellt&&S.bestellt[c]&&S.bestellt[c].m||0);
const bestelltAb =c=>(S.bestellt&&S.bestellt[c]&&S.bestellt[c].ab)||"";
const istBestellt=c=>bestelltVon(c)>0;
/* "am 21.08." bzw. "heute" / "morgen" — kurz genug fuer eine Zeile. */
function lieferText(ab){
  if(!ab)return "";
  const t=new Date(ab+"T00:00:00"), h0=new Date(heute()+"T00:00:00");
  const tage=Math.round((t-h0)/86400000);
  if(tage<0) return h("ueberfaellig");
  if(tage===0)return h("heute");
  if(tage===1)return h("morgen");
  return h("am")+" "+t.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
}
const reiftVon=c=>+(S.reift&&S.reift[c]&&S.reift[c].menge||0);
const reiftSeit=c=>(S.reift&&S.reift[c]&&S.reift[c].seit)||"";
/* Liegt NUR im Reifelager: da, aber noch nicht verwendbar.
   Peter 15.08.: "die braucht noch nen Tag bis zum vollen Genuss." */
const nurReift=c=>{ const e=vertretenDurch(c); if(e)return nurReift(e);
  return reiftVon(c)>0&&tkVon(c)<=0&&bestandVon(c)<=0&&!ausRohstoff(c); };
/* "1 Tag" statt "1 Tagen" — Peter liest das seinen Gaesten vor. */
const tageText=n=>n<=0?h("heute"):(n===1?"1 "+h("tag"):n+" "+h("tagen"));
const tageSeit=d=>{ if(!d)return 0;
  const a=new Date(d+"T00:00:00"), b=new Date(heute()+"T00:00:00");
  return Math.round((b-a)/86400000); };

/* Wie viel von einer Zutat steckt in EINEM Smoothie? Mittel über alle Rezepte, die sie brauchen. */
/* Nur noch fuer Zutaten, die WIRKLICH stueckweise gehandelt werden.
   Alle Rezepte sind seit 15.08. in Gramm — Blaetter zaehlen war eine Fehlerquelle
   (Peter: 3 kleine vs. 3 grosse Blaetter = spuerbarer Geschmacksunterschied). */
const STUECK_GRAMM={KN:350, SA:1};
function proSmoothie(code){
  const m=[];
  REZEPTE.forEach(r=>(r.zut||[]).forEach(z=>{
    if(z[0]!==code)return;
    if(typeof z[1]==="number"){ m.push(z[1]); return; }
    /* "4 Blätter", "1 Prise", "½ Limette" — mit Erfahrungswert in Gramm umrechnen */
    const zahl=parseFloat(String(z[1]).replace(",","."))||1;
    if(STUECK_GRAMM[code])m.push(zahl*STUECK_GRAMM[code]);
  }));
  if(!m.length){
    /* Kein Rezept nennt den Rohstoff direkt — dann ueber das Erzeugnis rechnen.
       Beispiel: 120 g Kokoswasser je Smoothie, 4 Nuesse ergeben 1 L
       -> 0,48 Nuesse je Smoothie. */
    const p=machtDaraus(code);
    if(p){ const gr=proSmoothie(p); if(gr)return Math.round(gr/1000*SELBST[p].proLiter*100)/100; }
    return 0;
  }
  return Math.round(m.reduce((a,b)=>a+b,0)/m.length*10)/10;
}
/* Reichweite in Smoothies — zählt NUR verkaufsfähige (verarbeitete) Ware,
   bei Flüssigkeiten und Trockenware den normalen Bestand. */
function reichweite(k){
  const g=proSmoothie(k.code); if(!g)return null;
  /* Kokosnuss und Haferflocken werden nicht vorverarbeitet — sie werden bei
     Bedarf frisch aufgeschlagen bzw. angesetzt. Ihre Rohform IST die Lagerform. */
  const da=(schonFertig(k)||machtDaraus(k.code)) ? bestandVon(k.code)+tkVon(k.code) : tkVon(k.code);
  return Math.floor(da/g);
}

/* Gemessene Ausbeute aus den eigenen Verarbeitungen — schlägt die Katalog-Schätzung */
function ausbeuteReal(code){
  const v=S.verarb.filter(x=>x.code===code&&+x.roh>0&&+x.fertig>0);
  if(!v.length)return null;
  const roh=v.reduce((a,x)=>a+ +x.roh,0), fertig=v.reduce((a,x)=>a+ +x.fertig,0);
  return {proz:Math.round(fertig/roh*1000)/10, n:v.length};
}

/* Welche Rezepte brauchen diese Zutat? ("*" = alle) */
/* Welches Erzeugnis wird aus dieser Zutat gemacht? (KN -> KW, HF -> HM) */
const machtDaraus=c=>Object.keys(SELBST).find(x=>SELBST[x].aus===c)||"";
/* Der Rohstoff erbt den Rezeptbedarf seines Erzeugnisses: die Kokosnuss wird
   fuer jedes Rezept gebraucht, das Kokoswasser braucht — sonst taucht sie in
   keiner Einkaufsplanung auf und geht irgendwann still aus. */
const brauchtRezepte=k=>{
  const eigen=k.rezepte||[], p=machtDaraus(k.code);
  if(!p)return eigen;
  const kk=findeCode(p), fremd=(kk&&kk.rezepte)||[];
  return eigen.concat(fremd.filter(r=>eigen.indexOf(r)<0));
};
/* Zutat gilt als Defizit, wenn ein Rezept sie braucht und nichts da ist */
const fehlt=k=>!istHausvorrat(k.code) && brauchtRezepte(k).length>0 && !daIst(k.code);

/* Preis-Historie aus den eigenen Chargen: letzter tatsächlich bezahlter ฿/Einheit */
function letzterPreis(code){
  const c=S.chargen.filter(x=>x.code===code&&x.pr).slice(-1)[0];
  return c?+c.pr:null;
}
function preisText(k){
  const eigen=letzterPreis(k.code);
  const ref=k.pmin!=null?(k.pmin===k.pmax?`${k.pmin}`:`${k.pmin}–${k.pmax}`):null;
  if(eigen!=null)return `${h("gezahlt")} <b>${eigen} ฿</b>${ref?` · ${h("referenz")} ${ref}`:""}`;
  if(ref)return `${h("referenz")} ${ref} ฿`;
  /* preistext ist eine deutsche Notiz aus dem Katalog — fuer Lexi nicht lesbar. */
  return k.preistext&&!istLexi()?esc(k.preistext.replace(/<[^>]*>/g,""))
    :`<span style="color:var(--warn)">⚠ ${h("keinPreis")}</span>`;
}

}

  if(kpiOffen==="weg"){

    inhalt=l.length ? l.map(k=>{
      const b=S.bestellt[k.code];
      return kpiZeile(k,`🚚 ${zahl(b.m)} ${E(k)} · <b>${esc(lieferText(b.ab))}</b>`
        +`${b.p?` · ${zahl(b.p)} ฿/${k.einheit==="Stk"?"Stk":"kg"}`:""}${b.q?` · ${esc(b.q)}`:""}`
        +` <button class="b" data-da="${k.code}" style="padding:4px 10px;font-size:12px;margin-left:6px">✅ ${h("angekommen")}</button>`,"own");
    }).join("") : `<div class="mini">${h("nixUnterwegs")}</div>`;
  }

  if(kpiOffen==="neu"){
    /* Die Antwort auf "welche Mango hat Lexi angefasst?" — ohne zu suchen. */
    const l=zut.filter(k=>istFrisch(k.code))
               .sort((a,b)=>((S.ts||{})[b.code]||0)-((S.ts||{})[a.code]||0));
    titel=h("zuletztGeaendert");

      if(tkVon(k.code))t2.push(`🧊 ${zahl(tkVon(k.code))} ${E(k)}`);
      if(bestandVon(k.code))t2.push(`🔪 ${zahl(bestandVon(k.code))} ${E(k)}`);

      return kpiZeile(k,`${t2.map(x=>`<span class="menge">${x}</span>`).join("")}<span class="wann">${vorZeit((S.ts||{})[k.code])}${(S.wer||{})[k.code]?" · "+esc(S.wer[k.code]):""}</span>`,"has");
    }).join("") : `<div class="mini">${h("nichtsGeaendert")}</div>`;
  }

  if(kpiOffen==="da"){
    const l=zut.filter(k=>daIst(k.code)&&!istHausvorrat(k.code));
    titel=h("posDa");
    inhalt=l.map(k=>{

      return kpiZeile(k,t.map(x=>`<span class="menge">${x}</span>`).join(""),tkVon(k.code)?"has":"");
    }).join("");
  }

  return `<div class="card" style="margin:-6px 0 14px">
    <div class="mini" style="margin-bottom:8px"><b>${titel}</b></div>${inhalt}</div>`;
}

          "สูตรทั้ง 58 พร้อมกรัม ลำดับ และวิธีทำ"),
     warn: mixbar ? ["gut", mixbar+D(" Rezepte sind aus dem Bestand mixbar."," สูตรปั่นได้จากสต็อกที่มี")]
                  : ["warn",D("Kein Rezept vollständig mixbar.","ยังไม่มีสูตรที่ปั่นได้ครบ")]},

    {v:"auswertung", ic:"📊", t:D("Auswertung","สรุป"),
     zw:D("Preise, Marge, Verbrauch, was sich rechnet.","ราคา กำไร การใช้วัตถุดิบ อะไรคุ้ม"),
     warn: ohnePreis ? ["warn",D("Aussage nur so gut wie die Preise — ","แม่นยำเท่าที่ราคาครบ — ")+ohnePreis+D(" fehlen noch."," รายการยังขาด")] : null},

    {v:"kasse", ic:"💳", t:D("Kasse","แคชเชียร์"),
     zw:D("Verkaufen, Bon, Bonusheft. Eigene Seite, gleicher Datenstand.",
          "ขาย ใบเสร็จ บัตรสะสม — คนละหน้า แต่ข้อมูลชุดเดียวกัน"),
     warn: ["warn",D("Verkaufspreise sind teils kalkuliert, nicht entschieden.",
                     "ราคาขายบางส่วนยังเป็นราคาคำนวณ ยังไม่ได้ตัดสินใจ")]},

    {v:"karte", ic:"👩‍🍳", t:D("Zubereitung","วิธีทำ"),
     zw:D("Die Arbeitskarte am Stand: Schritt für Schritt, Thai zuerst.",
          "การ์ดทำงานหน้าร้าน: ทีละขั้น ภาษาไทยก่อน"),
     warn: chargen===0 ? ["warn",D("Keine Frisch-Charge erfasst — Haltbarkeit läuft ungeprüft.",
                                   "ยังไม่มีล็อตของสด — อายุการเก็บยังไม่ถูกตรวจ")]
         : abgelaufen ? ["stop", abgelaufen+D(" Charge(n) über dem Ablaufdatum."," ล็อตเลยวันหมดอายุ")]
         : ["gut", chargen+D(" Frisch-Charge(n) mit Datum."," ล็อตของสดมีวันที่กำกับ")]}
  ];

  const karte = k => {
    const w = k.warn ? `<span class="${k.warn[0]}">${esc(k.warn[1])}</span>` : "";
    const ziel = (k.v==="kasse"||k.v==="karte") ? ` data-wegw="${k.v}"` : ` data-navto="${k.v}"`;
    return `<div class="kar"${ziel}><b>${k.ic} ${esc(k.t)}</b><i>${esc(k.zw)}</i>${w}</div>`;
  };

  const ger = (window.blendGeraeteSync && window.blendGeraeteSync.geraet) || "—";
  return `<div id="wegw">${K.map(karte).join("")}</div>
    <div id="sync_zeile">🔗 Dieses Gerät (<b>${esc(ger)}</b>) schreibt in die gemeinsame Datenbank —
      PC und Handy sehen denselben Stand.</div>`;
}
/* --- WEGWEISER: ENDE --- */

function vStart(){
  const zut=alleZutaten();
  const defizite=zut.filter(fehlt);
  const daZahl=zut.filter(k=>daIst(k.code)).length;
  /* Hausvorrat zaehlt NICHT als offener Preis. Peter 05.09.2026: "Aber ich
     verarbeite doch kein Wasser?!" - Wasser, Salz, Pfeffer, Muehle und Tee
     werden nicht je Becher eingekauft, sie stehen einfach da. Sie als offene
     Aufgabe zu fuehren macht die Zahl unbrauchbar, weil sie nie auf null geht. */
  const offenePreise=zut.filter(k=>!istHausvorrat(k.code)&&k.pmin==null&&letzterPreis(k.code)==null&&brauchtRezepte(k).length).length;
  const mixbar=REZEPTE.filter(r=>r.zut&&r.zut.length&&pflicht(r).every(z=>verkaufsfaehig(z[0]))).length;
  /* Verkaufsfaehig = verarbeitete Ware PLUS gekaufte Ware, die nichts mehr
     braucht (Joghurt, Milch, TK-Beeren). Sonst stehen 4 L Joghurt bei 0 kg. */
  const kgTk=Math.round(zut.reduce((sum,k)=>sum+tkVon(k.code)
    +(schonFertig(k)?bestandVon(k.code):0),0)/100)/10;
  /* Nur frische Marktware muss verarbeitet werden. Gekaufte TK-Ware, Milch,
     Supplements und Rohstoffe wie die Kokosnuss sind sofort einsatzbereit —
     sie standen faelschlich als "noch nicht verarbeitet" auf der Startseite. */
  const frischZahl=zut.filter(k=>istFrisch(k.code)).length;
  const wegZahl=zut.filter(k=>istBestellt(k.code)).length;
  const zuRuesten=zut.filter(k=>bestandVon(k.code)>0&&!tkVon(k.code)
    &&!schonFertig(k)&&!machtDaraus(k.code)&&!istHausvorrat(k.code));
  const letzte=S.chargen.slice(-3).reverse();
  verfuegbarkeitVeroeffentlichen(mixbar, REZEPTE.length);

  return `
  ${wegweiser()}
  <div class="kpi">
    <div class="ok ${kpiOffen==="mix"?"auf":""}" data-kpi="mix"><b>${mixbar}</b><span>${h("mixbar")}</span></div>
    <div class="miss ${kpiOffen==="fehl"?"auf":""}" data-kpi="fehl"><b>${defizite.length}</b><span>${h("fehlen")}</span></div>
    <div class="ok ${kpiOffen==="kg"?"auf":""}" data-kpi="kg"><b>${kgTk}</b><span>${h("kgVerk")}</span></div>
    <div class="${kpiOffen==="da"?"auf":""}" data-kpi="da"><b>${daZahl}</b><span>${h("posDa")}</span></div>
    <div class="${kpiOffen==="neu"?"auf":""}" data-kpi="neu"><b>${frischZahl}</b><span>${h("zuletztGeaendert")}</span></div>
    ${wegZahl?`<div class="${kpiOffen==="weg"?"auf":""}" data-kpi="weg"><b>${wegZahl}</b><span>${h("unterwegs")}</span></div>`:""}
    <!-- --- AUSWERTUNG: START --- -->
    <div data-navto="auswertung" title="${h("auswTileOff")}"><b>📊</b><span>${h("auswertung")}</span></div>
    <!-- --- AUSWERTUNG: ENDE --- -->
  </div>
  ${kpiDetail(defizite)}
  ${(()=>{ if(mixbar)return "";
    /* Warum steht da 0? Das gehoert auf den Bildschirm, nicht in eine Kachel,
       die man erst antippen muss. Peter 16.08.: "Was ist da los????" */
    const mit=REZEPTE.filter(r=>r.zut&&r.zut.length);
    const nah=mit.map(r=>({r,f:pflicht(r).filter(z=>!verkaufsfaehig(z[0]))}))
                 .sort((a,b)=>a.f.length-b.f.length)[0];
    if(!nah)return "";
    const liste=nah.f.map(z=>{ const kk=findeCode(z[0]);
      const nam=esc(kk?(nm1(kk)):z[0]);
      if(!daIst(z[0]))return `🛒 <b>${nam}</b>`;
      if(nurReift(z[0]))return `🌤 <b>${nam}</b> (${h("brauchtZeit")})`;
      if(brauchtEinweichen(z[0]))return `💧 <b>${nam}</b> (${h("nochEinweichen")})`;
      return `🔪 <b>${nam}</b> (${h("erstVerarbeiten")})`;
    }).join(" · ");
    return `<div class="tip">🎯 ${h("amNaechsten")}: <b>${nah.r.n} ${esc(nm1(nah.r))}</b><br>${liste}</div>`;
  })()}

  ${zuRuesten.length?`<div class="tip">🧊 <b>${zuRuesten.length}× ${h("nochRuesten")}</b>
    — ${zuRuesten.slice(0,6).map(k=>esc(nm1(k))).join(", ")}${zuRuesten.length>6?" …":""}.
    </div>`:""}

  ${defizite.length?`<h2>${L1("fehltFuer")} <em>· ${defizite.length}</em></h2>
    ${defizite.slice(0,5).map(k=>`<div class="row miss">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="rz">${brauchtRezepte(k).map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>
        <span class="pr">${preisText(k)}</span></span>${hoerBtn(k)}</div>`).join("")}
    ${defizite.length>5?`<div class="mini">… +${defizite.length-5} ${h("weitere")} — ${h("sieheBestand")}</div>`:""}
    <div class="bar"><button class="b r" id="ekliste">🛒 ${h("ekliste")}</button></div>`
   :`<div class="tip">✅ ${L1("allesDa")}</div>`}

  ${letzte.length?`<h2>${L1("zuletzt")}</h2>${letzte.map(c=>{
     const k=findeCode(c.code)||{de:c.code};
     return `<div class="row"><span class="code">${c.code}</span>
       <span class="nm"><b>${esc(nm1(k))}</b><i>${esc(c.dat)} · ${esc(c.markt||"")}</i>
         <span class="pr">${c.pr?`${c.pr} ฿/${k.einheit==="Stk"?"Stk":"kg"}`:""}${c.note?` · ${h("note")} ${c.note}/5`:""}${c.duft?` · 👃 ${c.duft}/5`:""}</span></span></div>`;
   }).join("")}`:""}

  ${offenePreise?`<div class="tip" id="tip-nopreis" style="cursor:pointer" role="button" tabindex="0">💰 <b>${offenePreise} ${h("ohnePreis")}</b> ${h("ohnePreisHint")} <span style="text-decoration:underline;white-space:nowrap">→ ${h("anzeigen")}</span></div>`:""}

  <div class="tip bad">🚫 <b>${ENTSORGT.length} ${h("gesperrt")}</b> (${h("durchgefallen")}, ${h("note")} 1–2). <button class="b" id="zeigetot" style="padding:5px 10px;font-size:12.5px;margin-left:4px">${h("anzeigen")}</button></div>
  <div id="totbox"></div>
  <textarea id="out" style="display:none" readonly></textarea>`;
}

/* ---- 📦 BESTAND --------------------------------------------------------- */
let bFilter="miss", bLimit=30, bSuche="";
function vBestand(){
  const zut=alleZutaten();
  const grp={};
  zut.forEach(k=>{(grp[k.gruppe]=grp[k.gruppe]||[]).push(k)});
  let html=`<div class="such lupe" style="top:52px">
      <input id="b_such" placeholder="${h("suchePl")}" value="${esc(bSuche)}" autocomplete="off">
      ${bSuche?`<button class="loeschen" id="b_leer">✕</button>`:""}
    </div>
    <div class="bar" style="margin:0 0 12px">
      <button class="b ${bFilter==="all"?"p":""}" data-bf="all">${h("alle")}</button>
      <button class="b ${bFilter==="miss"?"p":""}" data-bf="miss">${h("nurFehlt")}</button>
      <button class="b ${bFilter==="have"?"p":""}" data-bf="have">${h("nurDa")}</button>
      <button class="b ${bFilter==="nopreis"?"p":""}" data-bf="nopreis" title="${h("ohnePreis")}">💰 ${h("ohnePreis")}</button>
      <!-- CHARGEN: START -->
      <button class="b ${bFilter==="chargen"?"p":""}" data-bf="chargen" title="Frische-Chargen">🥛 Chargen</button>
      <!-- CHARGEN: ENDE -->
      <button class="b" id="neuzutat">➕ ${h("neueZutat")}</button></div>
    <div id="neuform"></div>
    <div class="mini" style="margin:-6px 0 10px">${h("zweiFelder")}</div>`;
  /* --- CHARGEN: START --- */
  if(bFilter==="chargen"){
    return html + vChargenListe();
  }
  /* --- CHARGEN: ENDE --- */
  let gezeigt=0, uebrig=0;
  Object.entries(grp).forEach(([g,items])=>{
    const gefiltert=items.filter(k=>{
      if(bSuche)return passt(k,bSuche);              /* Suche ignoriert den Filter */
      if(bFilter==="nopreis")return k.pmin==null && letzterPreis(k.code)==null && brauchtRezepte(k).length;
      return bFilter==="all"||(bFilter==="miss"?fehlt(k):daIst(k.code));
    /* Frisch Geaendertes zuerst — Peter 17.08.: "sofort erkennen, welche sie
       gerade geaendert hat". Innerhalb der Gruppe bleibt die Reihenfolge. */
    /* Bei einer Suche zaehlt die Trefferguete, sonst das Aenderungsdatum. */
    }).sort((a,b)=> bSuche
      ? (rang(a,bSuche)-rang(b,bSuche) || (a.de||"").length-(b.de||"").length)
      : (((S.ts||{})[b.code]||0)-((S.ts||{})[a.code]||0)));
    const rows=gefiltert.map(k=>{
      if(gezeigt>=bLimit){uebrig++;return ""}
      gezeigt++;
      const v=S.bestand[k.code]||"", da=+v>0, f=fehlt(k), own=S.eigen.includes(k);
      return `<div class="row ${da?"has":(f?"miss":"")} ${own?"own":""} ${ampelRowKlasse(k.code)/*--AMPEL--*/}">
        <span class="code">${k.code}</span>
        ${/* --- AMPEL: START --- */ ampelKnopfe(k.code) /* --- AMPEL: ENDE --- */}
        <span class="nm">${zname(k)}
          ${istFrisch(k.code)?`<span class="frisch">🕒 ${vorZeit((S.ts||{})[k.code])}${(S.wer||{})[k.code]?" · "+esc(S.wer[k.code]):""}</span>`:""}
          ${brauchtRezepte(k).length?`<span class="rz">${brauchtRezepte(k).map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}
          ${/* --- AMPEL: START --- */ (ampelStatus(k.code)==="rot" && ampelGrund(k.code)) ? `<span class="a-grund">⚠ ${esc(ampelGrund(k.code))}</span>` : "" /* --- AMPEL: ENDE --- */}
          <span class="pr">${preisText(k)}</span>
          ${/* --- ZERT-CHIPS: START --- */ zertChipReihe(k.code) /* --- ZERT-CHIPS: ENDE --- */}</span>
        ${hoerBtn(k)}
        ${own?`<button class="del" data-del="${k.code}">✕</button>`:""}
        ${istHausvorrat(k.code)
          ? `<span class="mini" style="flex:0 0 auto;text-align:right">${h("hausvorrat")}</span>`
          : `<div class="mengen">
               <span class="feld"><label>${brauchtEinweichen(k.code)?"💧 "+h("trocken"):h("rohLabel")}</label>
                 <input class="qty" title="${h("rohTitel")}" type="number" inputmode="decimal" step="any" min="0" data-c="${k.code}" value="${v}" placeholder="0">
                 <span class="u">${esc(k.einheit||"g")}</span></span>
               ${+v>0&&!brauchtEinweichen(k.code)?`<button class="mv" data-mv="${k.code}">→🧊 ${h("mvKurz")}</button>`:""}
               ${(()=>{ const p=unplausibel(k,v)||unplausibel(k,S.tk[k.code]);
                 if(!p)return "";
                 return `<span class="warnbox">⚠ ${h("unplausibel").replace("{g}",p.grenze.toLocaleString("de-DE"))}
                   ${p.vorschlag!=null?`<button class="b" data-durch1000="${k.code}" style="padding:6px 10px;font-size:12.5px;margin-left:6px">
                     → ${p.vorschlag} ${esc(k.einheit||"g")}</button>`:""}</span>`;})()}
               ${brauchtEinweichen(k.code)?`<span class="mini" style="flex:1 0 100%;color:#1c5389">💧 ${h("einweichHint")
                 .replace("{std}",EINWEICHEN[k.code].std).replace("{f}",String(Math.round(EINWEICHEN[k.code].faktor*100)))}</span>`:""}
               <span class="feld"><label>${brauchtEinweichen(k.code)?"💧 "+h("eingeweicht"):"🧊 "+h("tkLabel")}</label>
                 <input class="tkqty" title="${h("tkTitel")}" type="number" inputmode="decimal" step="any" min="0" data-c="${k.code}" value="${S.tk[k.code]||""}" placeholder="0">
                 <span class="u">${esc(k.einheit||"g")}</span></span>
             </div>`}</div>`;
    }).join("");
    if(rows)html+=`<h2>${esc(gName(g))}</h2>${rows}`;
  });
  if(bSuche&&!gezeigt)html+=`<div class="empty">${h("nixGefunden")}<br><b>„${esc(bSuche)}"</b></div>`;
  if(uebrig)html+=`<div class="bar"><button class="b" id="mehr" style="flex:1">⌄ ${uebrig} ${h("weitere")}</button></div>`;
  return html+`<div class="bar">
      <button class="b p" id="senden" style="flex:1">📤 ${h("senden")}</button>
      <button class="b" id="kopieren">${h("kopieren")}</button></div>
    <div class="mini" id="kopiermeldung" style="margin:-2px 0 6px;color:var(--ok)"></div>
    <div class="mini" style="margin:-2px 0 10px">${h("sendenHint")}<br>${h("kopierHint")}</div>
    <div class="bar" style="margin-top:4px">
      <button class="b r" id="ekliste">🛒 ${h("ekliste")}</button>
      <button class="b" id="csvb">${h("csvBestand")}</button>
      <button class="b" id="importb">📥 ${h("importieren")}</button>
      <button class="b" id="serverstand">⤓ ${h("serverStand")}</button></div>
    <div class="bar" style="margin-top:4px">
      <button class="b ${syncUrl()?"p":""}" id="syncb" style="flex:1">🔗 ${
        syncUrl() ? h("syncAn")+(syncStand?" · "+syncStand:"") : h("syncEinrichten")}</button>
      ${syncUrl()?`<button class="b" id="syncnow">⟳</button>`:""}</div>
    <div id="syncbox"></div>
    <div id="importbox"></div>
    <textarea id="out" style="display:none" readonly></textarea>`;
}

/* ---- 🛒 EINKAUFSVORSCHLAG — was zuerst? --------------------------------
   Dringlichkeit = wie viele Smoothies die Zutat noch hergibt, gewichtet damit,
   in wie vielen Rezepten sie steckt. Was nur noch für 1-2 Becher reicht,
   steht oben — auch wenn rechnerisch noch etwas da ist. */
/* Was nie auf eine Einkaufsliste gehört */
const NICHT_KAUFEN=["WA","SA","PP"];

function vorschlag(){
  const liste=[];
  alleZutaten().forEach(k=>{
    if(NICHT_KAUFEN.indexOf(k.code)>=0)return;
    /* Hausvorrat gehoert nicht auf die Einkaufsliste. Er zaehlte bisher zwar
       als verfuegbar, stand aber trotzdem zum Kauf da — bei gruenem Tee ist
       genau das aufgefallen (Peter 30.08.). NICHT_KAUFEN und HAUSVORRAT
       liefen als zwei Listen nebeneinander her; jetzt reicht ein Eintrag. */
    if(istHausvorrat(k.code))return;
    /* Was unterwegs ist, gehoert nicht auf die Kaufliste — sonst steht es
       am Markt oben und wird ein zweites Mal gekauft. */
    if(istBestellt(k.code))return;
    if(SELBST[k.code])return;   /* wird hergestellt, nicht gekauft — der Rohstoff steht in der Liste */
    const inRez=brauchtRezepte(k).length; if(!inRez)return;
    const g=proSmoothie(k.code);
    const roh=bestandVon(k.code), tk=tkVon(k.code), reift=reiftVon(k.code);
    const frisch=!schonFertig(k);
    let stufe, grund;

    /* WICHTIG: Rohware im Haus ist KEIN Einkaufsgrund, sondern ein Verarbeitungs-Auftrag. */
    if(frisch && roh>0 && tk<=0 && !machtDaraus(k.code)){
      liste.push({k,stufe:0,rw:null,grund:`${roh} ${k.einheit||"g"} ${h("rohUngeruestet")}`,reift,g});
      return;
    }
    const rw=reichweite(k);
    if(rw===null){ if(roh||tk||reift)return; stufe=2; grund=h("keineMenge"); }
    else if(rw<=0){ stufe=1; grund=`0 ${h("smoothies")}`; }
    else if(rw<=2){ stufe=1; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else if(rw<=5){ stufe=2; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else return;                          /* genug da */
    if(reift&&stufe===1)stufe=2;          /* Nachschub reift schon */
    liste.push({k,stufe,rw,grund,reift,g});
  });
  liste.sort((a,b)=>a.stufe-b.stufe || (a.rw==null?99:a.rw)-(b.rw==null?99:b.rw)
    || (b.k.rezepte||[]).length-(a.k.rezepte||[]).length);
  return liste;
}

function vVorschlag(){
  const L2=vorschlag();
  const L3=L2;   /* wird nach dem Hebel-Block gefiltert, siehe schonOben */
  const zeile=x=>{
    const k=x.k, pr=k.pmin!=null?`${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:h("keinPreis");
    return `<div class="row spring ${x.stufe===1?"miss":""}" data-kaufen="${k.code}">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="pr">${esc(x.grund)}${x.g?` · ${x.g} g/${h("smoothies")}`:""} · ${pr}
          ${x.reift?` · 🌤 ${x.reift} ${k.einheit||"g"} ${h("reiftNoch")}`:""}</span>
        ${(k.rezepte||[]).length?`<span class="rz">${k.rezepte.map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}</span>
      ${hoerBtn(k)}
      <span class="chev">›</span></div>`;
  };
  /* Wichtigste Frage beim Einkauf: was schaltet neue Rezepte frei?
     Nach Hebelwirkung sortiert — eine Limette hat drei Rezepte geoeffnet.
     Peter 16.08.: "Wenn ich sehen möchte welche Zutaten ich einkaufen muss…" */
  const sperrt={};
  REZEPTE.filter(r=>r.zut&&r.zut.length).forEach(r=>{
    pflicht(r).forEach(z=>{ if(verkaufsfaehig(z[0]))return;
      const e=sperrt[z[0]]=sperrt[z[0]]||{rez:[]};
      if(e.rez.indexOf(r.n)<0)e.rez.push(r.n); });
  });
  const hebel=Object.keys(sperrt).map(c=>({c,k:findeCode(c),rez:sperrt[c].rez}))
    .filter(x=>x.k).sort((a,b)=>b.rez.length-a.rez.length
      || (a.k.de||"").localeCompare(b.k.de||""));
  /* Jede Zutat NUR EINMAL in der ganzen Liste. Der Hebel-Block ist die
     Ueberschrift; was dort steht, faellt aus den drei Dringlichkeitsbloecken
     raus. (Peter 17.08.: "Kokosmilch taucht 2x auf.") */
  const schonOben=new Set(hebel.map(x=>x.c));
  const ruesten=L3.filter(x=>x.stufe===0&&!schonOben.has(x.k.code));
  const dring  =L3.filter(x=>x.stufe===1&&!schonOben.has(x.k.code));
  const bald   =L3.filter(x=>x.stufe===2&&!schonOben.has(x.k.code));
  const hebelZeile=x=>{
    const k=x.k, pr=k.pmin!=null?`${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:h("keinPreis");
    const zustand=!daIst(k.code)?`🛒 ${h("fehltBtn")}`
      : brauchtEinweichen(k.code)?`💧 ${h("nochEinweichen")}`
      : `🔪 ${h("erstVerarbeiten")}`;
    return `<div class="row spring ${!daIst(k.code)?"miss":""}" data-kaufen="${k.code}">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="pr">${zustand} · ${pr}</span>
        <span class="rz">${x.rez.map(r=>`<span>${r}</span>`).join("")}</span></span>
      ${hoerBtn(k)}
      <span style="flex:0 0 auto;font:800 15px inherit;color:var(--miss)">+${x.rez.length}</span>
      <span class="chev">›</span></div>`;
  };

  /* Bis zu 40 Artikel untereinander — ohne Suche findet man am Marktstand
     nichts wieder. (Peter 17.08.) */
  const vTreffer = x => !vSuche || passt(x.k, vSuche);
  return `<div class="such lupe">
      <input id="v_such" placeholder="${h("suchePl")}" value="${esc(vSuche)}" autocomplete="off">
      ${vSuche?`<button class="loeschen" id="v_leer">✕</button>`:""}
    </div>
    <div class="tip">${L1("vorschlagHint")}<br>👆 ${h("kaufenHint")}</div>
    ${hebel.length?`<h2>🎯 ${L1("schaltetFrei")} <em>· ${hebel.length}</em></h2>
      <div class="mini" style="margin:-4px 0 8px">${h("schaltetFreiHint")}</div>
      ${hebel.filter(x=>!vSuche||passt(x.k,vSuche)).map(hebelZeile).join("")}`:""}
    ${ruesten.length?`<h2>🧊 ${L1("zuRuestenTitel")} <em>· ${ruesten.length}</em></h2>
      <div class="mini" style="margin:-4px 0 8px">${h("zuRuestenHint")}</div>
      ${ruesten.filter(vTreffer).map(zeile).join("")}`:""}
    ${dring.length?`<h2>🔴 ${L1("jetzt")} <em>· ${dring.length}</em></h2>${dring.filter(vTreffer).map(zeile).join("")}`:""}
    ${bald.length?`<h2>🟡 ${L1("bald")} <em>· ${bald.length}</em></h2>${bald.filter(vTreffer).map(zeile).join("")}`:""}
    ${!L2.length?`<div class="empty">✅ ${h("allesDa")}</div>`:""}
    ${(()=>{  /* selbst hergestellte Flüssigkeiten: reicht der Rohstoff? */
      const rows=Object.keys(SELBST).map(c=>{
        const sp=SELBST[c], k=findeCode(c), roh=findeCode(sp.aus);
        const l=literAus(c);
        if(l===null)return "";
        /* Namen IMMER aus dem Katalog in der Sprache des Angemeldeten.
           Vorher stand hier der fest verdrahtete deutsche Name aus SELBST —
           Lexi sah "Hafermilch" und "Haferflocken". (Peter 17.08., Screenshot) */
        const erzName = k ? (nm1(k)) : (sp.name||c);
        const rohName = roh ? (nm1(roh)) : sp.aus;
        return `<div class="row ${l<1?"miss":""}"><span class="code">${sp.aus}</span>
          <span class="nm"><b>${esc(erzName)}</b>
            <span class="pr">${esc(rohName)}: <b>${zahl(bestandVon(sp.aus))} ${(roh&&roh.einheit)||"g"}</b> →
              ${h("reicht")} <b>${l} ${h("liter")}</b> <span style="opacity:.7">(${sp.proLiter} ${(roh&&roh.einheit)||"g"}/L)</span></span></span></div>`;
      }).filter(Boolean).join("");
      return rows?`<h2>🥛 ${L1("selbstHerstellen")}</h2>${rows}`:"";
    })()}
    <div class="bar"><button class="b p" id="ekliste" style="flex:1">🛒 ${h("ekliste")}</button></div>
    <textarea id="out" style="display:none" readonly></textarea>`;
}

/* Rezepte finden ueber Name, Nummer ODER enthaltene Zutat.
   "mango" zeigt jedes Rezept mit Mango darin — das ist bei 19 Rezepten die
   haeufigere Frage als der Name. (Peter 17.08.) */
function rezeptPasst(r,q){
  if(!q)return true;
  const w=q.trim().toLowerCase();
  if(r.n===w)return true;
  if([r.de,r.th,r.en].filter(Boolean).some(x=>String(x).toLowerCase().includes(w)))return true;
  return (r.zut||[]).some(z=>{ const k=findeCode(z[0]); return k&&passt(k,q); });
}

     Abgleich anstossen -> die Kasse sperrt den Becher, die Ampel wird rot,

function grundLesen(){ try{ return JSON.parse(localStorage.getItem("blend_sperrgrund")||"{}"); }catch(e){ return {}; } }
function zutatRaus(code, grund){
  S.bestand=S.bestand||{}; S.tk=S.tk||{}; S.reift=S.reift||{}; S.ts=S.ts||{}; S.wer=S.wer||{};
  S.bestand[code]=0; S.tk[code]=0; S.reift[code]=0;
  S.ts[code]=Date.now();
  S.wer[code]=(S.cfg&&S.cfg.who)||"";
  const gr=grundLesen();
  gr[code]={grund:grund, zeit:new Date().toISOString().slice(0,16).replace("T"," "), wer:(S.cfg&&S.cfg.who)||""};
  localStorage.setItem("blend_sperrgrund", JSON.stringify(gr));
  save();
  syncSpaeter();     /* damit Kasse und zweites Handy es sofort erfahren */
  render();
}

/* --- REZEPT-ANPASSUNG + SCHRITTE: START (06.09.2026) ----------------------
   Peter, 06.09.2026: "Es fehlt die Moeglichkeit die Rezepte zu aendern ...

   bleibt unangetastet: eine Anpassung ist eine Schicht darueber, jederzeit
   mit einem Knopf wieder weg. So kann in der Probephase niemand versehentlich
   die Rezeptur zerschiessen.                                              */

const dreisprachig = (de, th, en) => thaiZuerst() ? (th || de) : (de || th);

/* Frisch / gefroren / trocken - dieselbe Erkennung wie in der Arbeitskarte.
   Peter 02.09.: "Mango 99 g und Mango 100 g, welche ist frisch, welche
   gefroren?" - der Hinweis stand nur klein in Klammern im Namen. */
function frischChip(z){
  const t = String(z[2]||"") + " " + String(z[3]||"") + " " + String(z[4]||"");
  if (/gefroren|แช่แข็ง|frozen|TK\b/i.test(t))
    return '<span class="fg fg-tk" title="gefroren · แช่แข็ง · frozen">❄ '
         + (thaiZuerst() ? "แช่แข็ง" : "TK") + '</span>';
  if (/frisch|\(สด\)|fresh/i.test(t))
    return '<span class="fg fg-fr" title="frisch · สด · fresh">🍃 '
         + (thaiZuerst() ? "สด" : "FRISCH") + '</span>';
  if (/getrocknet|แห้ง|dried|Pulver|ผง|powder/i.test(t))
    return '<span class="fg fg-tr">☀ ' + (thaiZuerst() ? "แห้ง" : "TROCKEN") + '</span>';
  return "";
}

/* ---------- Anpassung lesen und rechnen ---------- */
S.anpass = S.anpass || {};
const anpassVon = n => S.anpass[n] || null;
function anpassAktiv(n){
  const a = anpassVon(n);
  return !!(a && ((a.mengen && Object.keys(a.mengen).length) ||
                  (a.weg && a.weg.length) || (a.extra && a.extra.length) || a.notiz));
}
/* Die Zutatenliste eines Rezepts MIT Anpassung. Gibt Objekte zurueck, damit
   die Anzeige weiss, was geaendert wurde. */
function zutatenAngepasst(r){
  const a = anpassVon(r.n);
  const raus = new Set((a && a.weg) || []);
  const liste = (r.zut||[]).map((z, i) => {
    const neu = a && a.mengen && a.mengen[i] != null ? +a.mengen[i] : null;
    return { z, idx:i, menge: neu != null ? neu : z[1],
             geaendert: neu != null && neu !== z[1], weg: raus.has(i), extra:false };
  });
  ((a && a.extra) || []).forEach((e, k) => {
    liste.push({ z:[e[0], e[1], e[2]||"", "", ""], idx:"x"+k, menge:e[1],
                 geaendert:false, weg:false, extra:true });
  });
  return liste;
}
const mengeAngepasstFuer = (r, i, fallback) => {
  const a = anpassVon(r.n);
  return (a && a.mengen && a.mengen[i] != null) ? +a.mengen[i] : fallback;
};

/* ---------- Schrittweite: am Stand tippt niemand Kommazahlen ---------- */
function schrittweite(v){
  v = Math.abs(+v || 0);
  if (v >= 100) return 10;
  if (v >= 20)  return 5;
  if (v >= 5)   return 1;
  return 0.1;
}

/* ---------- Schritt-fuer-Schritt-Anleitung ---------- */

    const zweit = EN_AUS ? "" : (thaiZuerst() ? (s[2] || s[0]) : (s[2] || s[1]));
    return "<li>" + esc(haupt) + (zweit && zweit !== haupt ? "<i>" + esc(zweit) + "</i>" : "") + "</li>";
  }).join("") + "</ol>";
}

/* --- AUSWERTUNG: START ------------------------------------------------------
   Chargen-Historie-Auswertung: welche Zutat wird am haeufigsten weggeworfen?
   Liest S.chargen_frisch (Baustein 2), aendert nichts an ihnen. Rein Read.
   ------------------------------------------------------------------------- */
let aFilter="all";                 /* Zeitfilter: "all" | "30" | "7" */
const AUSW_KOSTEN_FALLBACK = 0.05; /* THB je g/ml wenn kein Katalogpreis */

/* Alle Chargen (auch aufgebraucht/entsorgt) fuer die Auswertung. */
function auswChargen(){
  return Object.entries(S.chargen_frisch||{}).map(([id,c])=>Object.assign({_id:id},c||{}));
}
/* Chargen nach Zeitfilter (Bezugspunkt: produziert_am). */
function auswGefiltert(){
  const all = auswChargen();
  if(aFilter==="all") return all;
  const tage = aFilter==="7" ? 7 : 30;
  const grenze = Date.now() - tage*24*3600*1000;
  return all.filter(c=>c.produziert_am && new Date(c.produziert_am).getTime()>=grenze);
}
/* Grobe Kosten je g/ml der Zutat. Wenn Katalogpreis (฿/kg oder ฿/L) bekannt,
   dann ฿/g bzw. ฿/ml daraus; sonst Fallback. */
function auswKosten(code){
  const k = (typeof findeCode==="function") ? findeCode(code) : null;
  let ref = null;
  if(k){
    if(k.pmin!=null) ref = k.pmin;
    else if(typeof letzterPreis==="function"){ try{ ref = letzterPreis(code); }catch(e){} }
  }
  if(ref==null || !isFinite(+ref) || +ref<=0) return AUSW_KOSTEN_FALLBACK;
  return (+ref)/1000; /* ฿/kg oder ฿/L -> ฿/g bzw. ฿/ml */
}
/* Kern-Statistik: KPIs + Ranking je Zutat. */
function auswStats(){
  const rows = auswGefiltert();
  const gesamt = rows.length;
  const aufgebraucht = rows.filter(c=>c.status==="aufgebraucht").length;
  const entsorgt = rows.filter(c=>c.status==="entsorgen").length;
  /* Lebensdauer nur fuer abgeschlossene Chargen (Status aufgebraucht/entsorgen).
     Endzeitpunkt approximieren: letzter peter_freigabe-Eintrag, sonst ablauf_am,
     sonst jetzt. */
  let stundenSumme=0, stundenZahl=0;
  rows.forEach(c=>{
    if(c.status!=="aufgebraucht" && c.status!=="entsorgen") return;
    const start = c.produziert_am ? new Date(c.produziert_am).getTime() : 0;
    if(!start) return;
    let ende = 0;
    const letzte = (c.peter_freigaben||[]).slice(-1)[0];
    if(letzte && letzte.ts) ende = +letzte.ts;
    else if(c.ablauf_am) ende = new Date(c.ablauf_am).getTime();
    else ende = Date.now();
    if(ende>start){ stundenSumme += (ende-start)/3600000; stundenZahl++; }
  });
  const oLeben = stundenZahl ? Math.round(stundenSumme/stundenZahl) : 0;
  /* Verlust in THB. */
  let verlustTHB = 0;
  rows.filter(c=>c.status==="entsorgen").forEach(c=>{
    const rest = +(c.menge_rest||c.menge_ml||c.menge_g||0);
    verlustTHB += rest * auswKosten(c.zutat_code);
  });
  /* Ranking je Zutat. */
  const byCode = {};
  rows.forEach(c=>{
    const code = c.zutat_code||"?";
    const b = byCode[code] || (byCode[code] = {code, ges:0, entsorgt:0, aufgebraucht:0, restSumme:0, restZahl:0});
    b.ges++;
    if(c.status==="entsorgen"){
      b.entsorgt++;
      b.restSumme += +(c.menge_rest||c.menge_ml||c.menge_g||0);
      b.restZahl++;
    }
    if(c.status==="aufgebraucht") b.aufgebraucht++;
  });
  const rank = Object.values(byCode).map(b=>{
    const abges = b.entsorgt + b.aufgebraucht;
    const quote = abges>0 ? Math.round(b.entsorgt/abges*100) : 0;
    const restAvg = b.restZahl>0 ? Math.round(b.restSumme/b.restZahl) : 0;
    const H = chHaltbar(b.code);
    return {code:b.code, name:H.name, einheit:H.einheit, ges:b.ges, entsorgt:b.entsorgt,
            aufgebraucht:b.aufgebraucht, quote, restAvg};
  }).sort((x,y)=> y.quote-x.quote || y.entsorgt-x.entsorgt || y.ges-x.ges);
  return {gesamt, aufgebraucht, entsorgt, oLeben, verlustTHB, rank};
}
/* Karenz-Statistik: wie oft genutzt, Peter-Freigaben, Erfolgsquote. */
function auswKarenzStats(){
  const rows = auswGefiltert();
  let karenzChargen=0, freigOK=0, freigWeg=0, karenzDannAuf=0, karenzDannEnt=0;
  rows.forEach(c=>{
    const fr = c.peter_freigaben||[];
    const hatKarenz = fr.length>0 || c.status==="karrenz" || c.karrenz_bis;
    if(!hatKarenz) return;
    karenzChargen++;
    fr.forEach(f=>{
      if(!f) return;
      if(f.entscheidung==="weg") freigWeg++;
      else if(String(f.entscheidung||"").indexOf("ok")===0) freigOK++;
    });
    if(c.status==="aufgebraucht") karenzDannAuf++;
    else if(c.status==="entsorgen") karenzDannEnt++;
  });
  const abges = karenzDannAuf + karenzDannEnt;
  const erfolg = abges>0 ? Math.round(karenzDannAuf/abges*100) : 0;
  return {karenzChargen, freigOK, freigWeg, karenzDannAuf, karenzDannEnt, erfolg};
}
/* Zeitreihe der letzten 30 Tage (auch wenn Filter="7", die Reihe zeigt 30). */
function auswZeitreihe(){
  const tage = 30;
  const heute = new Date(); heute.setHours(0,0,0,0);
  const arr = [];
  for(let i=tage-1;i>=0;i--){
    const d = new Date(heute.getTime() - i*24*3600*1000);
    arr.push({tag:d, aufgebraucht:0, entsorgt:0});
  }
  const idx = new Map(arr.map((x,i)=>[x.tag.getTime(), i]));
  auswChargen().forEach(c=>{
    if(c.status!=="aufgebraucht" && c.status!=="entsorgen") return;
    const letzte = (c.peter_freigaben||[]).slice(-1)[0];
    const t = letzte && letzte.ts ? new Date(+letzte.ts)
            : c.ablauf_am ? new Date(c.ablauf_am)
            : c.produziert_am ? new Date(c.produziert_am) : null;
    if(!t) return;
    const dd = new Date(t); dd.setHours(0,0,0,0);
    const i = idx.get(dd.getTime()); if(i==null) return;
    if(c.status==="aufgebraucht") arr[i].aufgebraucht++; else arr[i].entsorgt++;
  });
  return arr;
}
/* Handlungsempfehlungen aus dem Ranking + Karenz. */
function auswEmpfehlungen(){
  const {rank} = auswStats();
  const kar = auswKarenzStats();
  const tips = [];
  rank.filter(r=>r.ges>=3 && r.quote>=60).slice(0,3).forEach(r=>{
    /* -20 % als grobe Schaetzung fuer die Einkaufsempfehlung. */
    tips.push(`✋ ${r.name} wird zu ${r.quote}% entsorgt — Einkaufsmenge um 20% reduzieren?`);
  });
  rank.filter(r=>r.ges>=3 && r.quote===0 && r.aufgebraucht>=2).slice(0,3).forEach(r=>{
    tips.push(`🌟 ${r.name} wird zu 100% aufgebraucht — Einkauf könnte um 20% erhöht werden.`);
  });
  if(kar.freigWeg > kar.freigOK && (kar.freigOK+kar.freigWeg)>=3){
    tips.push(`⚠ Karenz wird oft abgelehnt (weg ${kar.freigWeg} > ok ${kar.freigOK}) — Kühlkette / Herstellung prüfen.`);
  }
  return tips;
}
