<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2dc;
 --accent:#e2543f;--ok:#2f8f5b;--okbg:#f4faf6;--okln:#c4e2d0;--miss:#c0392b;--missbg:#fdf4f3;--missln:#f0cdc8;
 --warn:#b8860b;--nose:#5b6cb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
 padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:11px 16px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.who{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;text-align:right;line-height:1.3}
main{padding:16px;max-width:820px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
 display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--muted);font:700 11px inherit;cursor:pointer;
 padding:7px 2px;border-radius:9px;line-height:1.3}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ink);background:#f1ede8}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:800}
h2:first-child{margin-top:4px}
h2 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;
 display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.mengen{flex:1 0 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 margin-top:2px;padding-top:9px;border-top:1px dashed var(--line)}
.mengen label{font:700 11px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mengen .feld{display:flex;align-items:center;gap:5px}
.row.has{border-color:var(--okln);background:var(--okbg)}
.row.miss{border-color:var(--missln);background:var(--missbg)}
.row.own{border-color:#cdd6ee;background:#f8f9fd}
.code{font:800 12px/1 ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:7px 8px;flex:0 0 auto}
.row.miss .code{background:#f6ddd9;color:var(--miss)}
.row.own .code{background:#e4e9f7;color:#3c4a7d}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:15px}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.pr{font:700 11.5px/1.4 inherit;color:#7a6f5f;margin-top:3px}
.rz{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.rz span{font:700 10px/1 ui-monospace,Menlo,monospace;background:#eceae5;color:#5d5850;padding:3px 5px;border-radius:4px}
.row.miss .rz span{background:#f6ddd9;color:#9b3226}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
 font:16px inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.qty{width:82px;text-align:right;font-weight:700;flex:0 0 auto}
input.tkqty{width:82px;text-align:right;font-weight:700;flex:0 0 auto;background:#eef6ff;border-color:#c3d9f0}
button.mv{flex:0 0 auto;padding:9px 12px;font:800 13px inherit;border:1px solid #9ec2e6;background:#dbeafe;color:#1c5389;border-radius:9px;cursor:pointer}
.u{color:var(--muted);font-size:13px;width:30px;flex:0 0 auto}
.f{margin-bottom:11px}
.f2{display:flex;gap:10px}.f2>div{flex:1}
label{display:block;font:700 11.5px/1.4 inherit;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
button.b{border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:11px 15px;border-radius:10px;font:700 14px inherit;cursor:pointer}
button.b.p{background:var(--ink);color:#fff;border-color:var(--ink)}
button.b.r{background:var(--miss);color:#fff;border-color:var(--miss)}
button.b.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;
 font:700 15px inherit;cursor:pointer;color:var(--muted)}
.stars button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stars.nose button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
 padding:8px 12px;font:600 13.5px inherit;cursor:pointer;line-height:1.25;text-align:left}
.chips button small{display:block;font-size:11px;opacity:.75;font-weight:500}
.chips button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips.bad button.on{background:var(--miss);color:#fff;border-color:var(--miss)}
.tip{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:14px}
.tip.nose{background:#f7f8fd;border-color:#ccd2ec}
.tip.bad{background:var(--missbg);border-color:var(--missln)}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:23px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .miss b{color:var(--miss)} .kpi .ok b{color:var(--ok)}
.kpi div{cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.kpi div:after{content:"⌄";position:absolute;top:9px;right:10px;font-size:13px;color:var(--muted);opacity:.55}
.kpi div.auf:after{content:"⌃"}
.kpi div.auf{border-color:var(--fg);box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.such{position:sticky;top:56px;background:var(--bg);padding:6px 0 8px;z-index:5}
.frow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;
 padding:9px 11px;margin-bottom:6px;font:15px inherit;cursor:pointer}
.frow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fgrp{font:800 11px inherit;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.list{max-height:60vh;overflow:auto}
.dead{background:#f7f4f2;border:1px dashed #c9bcb6;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.dead .code{background:#eadfdb;color:#8a3f34;text-decoration:line-through}
.dead .nm b{text-decoration:line-through;color:#7a6a66}
.dead .why{font-size:12.5px;color:#8a3f34;font-weight:600}
.rez{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.rez .kopf{display:flex;align-items:baseline;gap:9px}
.rez .no{font:800 15px ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:5px 8px}
.rez .ampel{margin-left:auto;font:700 12px inherit;padding:4px 9px;border-radius:20px}
.rez .ampel.gr{background:var(--okbg);color:var(--ok);border:1px solid var(--okln)}
.rez .ampel.rt{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
.rez .ampel.ge{background:#fffaf0;color:var(--warn);border:1px solid #ecdfae}
.rez .zut{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.rez .zut span{font:600 11.5px inherit;padding:4px 8px;border-radius:6px;background:var(--okbg);color:#2c6b4a;border:1px solid var(--okln)}
.rez .zut span.f{background:var(--missbg);color:var(--miss);border-color:var(--missln)}
.rez .zut span.g{background:#fffaf0;color:#8a6d1f;border-color:#ecdfae}
.rez .zut span.r{background:#fff4e8;color:#9a5a12;border-color:#f0d3b0}
.rez .zut span.s{background:#eef6ff;color:#1c5389;border-color:#c3d9f0}
.rez .zut span.b{background:#f6f2fb;color:#5b3f86;border-color:#ddd0ee}
.row.spring{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rez.fokus{outline:2px solid var(--fg);outline-offset:3px}
.rez .ampel.or{background:#fff4e8;color:#9a5a12;border:1px solid #f0d3b0}
.rez .probiert{font:700 11px inherit;padding:4px 8px;border-radius:20px;background:#fdf6e3;
 color:#8a6a1f;border:1px solid #ecdfae;margin-left:6px}
.del{border:none;background:none;color:var(--miss);font:700 18px/1 inherit;cursor:pointer;padding:4px 6px;flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:36px 20px;font-size:15px}
textarea#out{height:210px;font:12px/1.5 ui-monospace,Menlo,monospace;margin-top:12px}
.mini{font-size:12.5px;color:var(--muted)}
.user{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;
 font:700 12px inherit;cursor:pointer;margin-left:auto;white-space:nowrap}
label i.en{display:block;font-style:normal;font-weight:600;font-size:11.5px;color:#a09a92;
 text-transform:none;letter-spacing:0}
.en{color:#a09a92;font-weight:600;font-size:12px}
.nm .haupt{display:block;font-weight:600;font-size:15px;line-height:1.25}
.nm .zweit{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nm .dritt{display:block;font-size:12.5px;color:var(--nose);font-weight:600}
.nm .dritt i.laut{font-style:italic;color:#8a7a55;font-weight:600;margin-left:5px}
.hoer{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;
 font-size:15px;cursor:pointer;flex:0 0 auto}
.hoer:active{background:#f0ede8}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
 display:flex;align-items:center;justify-content:center;padding:16px}
.ovl>.dlg{background:#fff;border-radius:14px;max-width:340px;width:100%;
 max-height:88vh;overflow:auto;padding:16px}
.dlg{padding:16px}
.dlg h3{margin:0 0 12px;font-size:15.5px;line-height:1.4}
.wahl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
 border-radius:10px;padding:11px 13px;margin-bottom:8px;font:15px inherit;cursor:pointer}
.wahl.on{border-color:var(--ink);background:#f1ede8;font-weight:700}
.wahl small{display:block;color:var(--muted);font-size:12px}
.schalter{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin-top:10px}
.stimmen{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:10px}
.stimmen.ok{background:var(--okbg);color:#22694a;border:1px solid var(--okln)}
.stimmen.no{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
details.tipp{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;margin-bottom:13px;overflow:hidden}
details.tipp summary{padding:10px 12px;cursor:pointer;font:700 13.5px inherit;list-style:none}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp .inhalt{padding:0 12px 11px;font-size:13.5px;line-height:1.55}
details.tipp .inhalt .en{display:block;margin-top:4px}
</style>

const STARTBESTAND = {"_hinweis":"Gemeinsamer Ausgangsbestand, der mit der App ausgeliefert wird. Jedes Geraet ohne eigene Daten uebernimmt ihn beim ersten Oeffnen. Stand 16.08.2026 (Becher: je 45 Stueck/Set).","stand":"2026-08-16","bestand":{"KN":4,"PF":400,"TO":200,"KE":350,"MI":37,"JB":1002,"KM":4000,"SM":1000,"MM":1000,"JO":4000,"BK":1022,"BM":979,"KL":1000,"HS":1000,"RO":100,"HF":1000,"GK":300,"KK":400,"IG":30,"ZI":100,"BE":45,"DE":45,"HA":400,"B12":45,"D12":45,"PB":45},"tk":{"WM":333,"AN":1146,"DR":352,"BA":628,"KE":220,"MG":300,"AV":200,"HT":800,"LS":80,"ZT":40}};

/* ---- Speicher: EIN Namensraum für alles -------------------------------- */
const SKEY="blend_os_v1";
function serverStandUebernehmen(ziel){
  ziel.bestand=Object.assign({}, STARTBESTAND.bestand||{});
  ziel.tk     =Object.assign({}, STARTBESTAND.tk||{});
  return ziel;
}
/* bestand = ROHWARE wie gekauft · tk = verarbeitet/gefroren = das, was verkauft werden kann

const leer={bestand:{},reift:{},tk:{},verarb:[],chargen:[],eigen:[],cfg:{who:"",markt:""}};
/* bestand = Rohware VERARBEITUNGSREIF · reift = Rohware NOCH NICHT REIF

let S=Object.assign({},leer,JSON.parse(localStorage.getItem(SKEY)||"{}"));
/* Erstes Oeffnen auf einem Geraet: den mitgelieferten Stand uebernehmen.
   Sobald eigene Mengen drinstehen, wird nie wieder ueberschrieben. */
if(!Object.keys(S.bestand||{}).length && !Object.keys(S.tk||{}).length){
  serverStandUebernehmen(S);

/* ===== Gemeinsamer Speicher =============================================
   Peter (Android) und Lexi (iPhone) hatten je einen eigenen Browser-Speicher.
   Hier gleichen beide gegen ein Google-Apps-Script ab.

   Zusammengefuehrt wird PRO ZUTAT nach Zeitstempel, nicht pro Geraet. Wer
   zuletzt gesendet hat, ist egal — es zaehlt, wer zuletzt GEAENDERT hat.
   Ohne das wuerde ein Abgleich die Arbeit des anderen loeschen.          */

const SYNCKEY="blend_os_sync", GERKEY="blend_os_geraet";
/* Adresse des gemeinsamen Speichers, mit der App ausgeliefert. Damit muss
   niemand mehr etwas eintippen — Peter und Lexi haengen sofort am selben
   Bestand. Ueber das Feld in der Bestandsansicht laesst sie sich ueberschreiben. */
const SYNC_STANDARD="https://script.google.com/macros/s/AKfycbzDrg7mh6nIeGWYKNOXRYjs4bw0aAqmOyN1ZQQZcfbyWg5MZLt87B7FbiqyeN2p1f0S/exec";
const syncUrl =()=>{ const g=localStorage.getItem(SYNCKEY); return g===null?SYNC_STANDARD:g; };
const geraetName=()=>{
  let g=localStorage.getItem(GERKEY);
  if(!g){ g=(istLexi()?"lexi":"peter")+"-"+Math.floor(Math.random()*9000+1000);
          localStorage.setItem(GERKEY,g); }
  return g;
};

/* Jede Aenderung bekommt die aktuelle Uhrzeit. */
function stempel(code){
  S.ts=S.ts||{};
  S.ts[code]=Date.now();
}

/* Nach jeder Aenderung: kurz warten, dann abgleichen. Waehrend des Tippens
   soll nicht bei jedem Tastendruck gesendet werden. */
function syncSpaeter(){
  if(!syncUrl())return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncJetzt(false), 2500);
}

async function syncJetzt(zeigen){
  const url=syncUrl();
  if(!url||syncLauft)return;
  syncLauft=true; syncFehler="";
  if(zeigen)render();
  try{
    /* text/plain ist Absicht: bei application/json verlangt der Browser eine
       Vorab-Anfrage, die Apps Script nicht beantwortet. */
    const antw=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        geraet:geraetName(),
        bestand:S.bestand||{}, tk:S.tk||{}, reift:S.reift||{},
        ts:S.ts||{}, stand:S.stand||0
      })
    });
    const daten=await antw.json();
    if(!daten||!daten.ok)throw new Error((daten&&daten.fehler)||"Antwort unbrauchbar");
    S.bestand=daten.bestand||{};
    S.tk     =daten.tk||{};
    S.reift  =daten.reift||{};
    S.ts     =daten.ts||{};
    S.stand  =daten.stand||0;
    save();
    syncStand=new Date().toTimeString().slice(0,5);
  }catch(e){
    syncFehler=(e&&e.message)||"kein Netz";
  }finally{
    syncLauft=false;
    render();
  }
}

/* Beim Oeffnen und beim Zurueckkommen zur App abgleichen. */
function syncStart(){
  if(!syncUrl())return;
  syncJetzt(false);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden)syncJetzt(false);
  });
}

/* Wenn irgendetwas schiefgeht, soll man es SEHEN statt eine weiße Seite zu bekommen.
   (14.08.: Lexis iPhone zeigte nur eine Fehlermeldung, ohne dass wir wussten, welche.) */
window.onerror=function(msg,src,zeile,spalte,err){
  try{
    var box=document.createElement("div");
    box.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fdf4f3;"
      +"border-top:2px solid #c0392b;color:#7a2018;padding:12px 14px;font:12px/1.5 monospace;max-height:45vh;overflow:auto";
    box.innerHTML="<b>Fehler / Error</b><br>"+String(msg)+"<br>Zeile "+zeile+":"+spalta(spalte)
      +"<br><br><button onclick=\"location.replace(location.pathname+'?v='+Date.now())\" "
      +"style=\"padding:8px 12px;font:700 13px sans-serif;border-radius:8px;border:1px solid #c0392b;background:#fff\">"
      +"🔄 Neu laden</button>";
    document.body.appendChild(box);
  }catch(e){}
  function spalta(c){return c===undefined?"?":c}
  return false;
};

let USER=localStorage.getItem("blend_user")||"";
let EN_AUS=localStorage.getItem("blend_enaus")==="1";
const istLexi=()=>USER==="lexi";
/* Hauptsprache = Muttersprache, Zweitsprache = Englisch */
const h=k=>(TXT[k]?(istLexi()?TXT[k].th:TXT[k].de):k);
const e2=k=>(TXT[k]?TXT[k].en:"");
/* Beschriftung mit kleiner Englisch-Zeile */
const L=k=>`${esc(h(k))}${EN_AUS?"":`<i class="en">${esc(e2(k))}</i>`}`;
/* Fließtext, Englisch angehängt */
const L1=k=>`${esc(h(k))}${EN_AUS?"":` · <span class="en">${esc(e2(k))}</span>`}`;

/* 🔊 spricht ein Wort in der jeweiligen Sprache */
function sprich(text,lang){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.slice(0,2)));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* Zutatenname mehrsprachig: Muttersprache · Englisch · Fremdsprache + Lautschrift + 🔊 */
function zname(k,klein){
  const fremd = istLexi() ? {txt:k.de,laut:k.deLaut,lang:"de-DE",flag:"🇩🇪"}
                          : {txt:k.th,laut:k.laut, lang:"th-TH",flag:"🇹🇭"};
  const haupt = istLexi() ? (k.th||k.de) : k.de;
  return `<span class="haupt">${esc(haupt)}</span>
    ${EN_AUS||!k.en?"":`<span class="zweit">${esc(k.en)}</span>`}
    ${fremd.txt?`<span class="dritt">${fremd.flag} ${esc(fremd.txt)}
      ${fremd.laut?`<i class="laut">${esc(fremd.laut)}</i>`:""}</span>`:""}`;
}
function hoerBtn(k){
  const t = istLexi() ? k.de : k.th;
  const lang = istLexi() ? "de-DE" : "th-TH";
  return t?`<button class="hoer" data-say="${esc(t)}" data-lang="${lang}">🔊</button>`:"";
}

const MAERKTE=["Ratanakorn","Theprasit","GO Wholesale","Makro","Villa Market","Central","Doi Kham","anderer"];

/* Sucht über ALLE Felder und alle Sprachen. Mehrere Wörter = alle müssen passen.
   „erd" findet Erdbeere, „straw" findet Strawberry, „สตรอ" findet สตรอว์เบอร์รี,
   „ER" findet den Code, „tk" findet die TK-Gruppe. */
function passt(k,q){
  const heu=[k.code,k.de,k.th,k.en,k.gruppe,k.sorten,k.preistext,k.laut,k.deLaut]
    .filter(Boolean).join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(w=>{
    /* GROSS geschriebene 2-3 Buchstaben = Code-Suche ("ER" soll nicht in "Beere" treffen) */
    if(/^[A-Z]{2,3}[0-9]?$/.test(w))return k.code===w;
    return heu.includes(w.toLowerCase());
  });
}

/* Katalog + eigene Zutaten in einer Liste */
const alleZutaten=()=>KATALOG.concat(S.eigen);
const findeCode=c=>alleZutaten().find(k=>k.code===c);
const bestandVon=c=>+(S.bestand[c]||0);          // Rohware
const tkVon=c=>+(S.tk[c]||0);                     // verarbeitet, verkaufsfähig
const selbstDa=c=>tkVon(c)>0||bestandVon(c)>0||reiftVon(c)>0;
const daIst=c=>istHausvorrat(c)||ausRohstoff(c)||selbstDa(c)||ersatzFuer(c).some(selbstDa);
/* Welche Sorte vertritt hier gerade? "" wenn die eigene da ist. */
const vertretenDurch=c=>selbstDa(c)||istHausvorrat(c)||ausRohstoff(c)?"":(ersatzFuer(c).find(selbstDa)||"");   // Hausvorrat zaehlt immer als da
/* GRUNDREGEL (Peter 16.08.): Was im Haus liegt, gilt als verfuegbar — auch
   ungeschnitten, auch noch reifend. Der Smoothie wird angeboten; ist die Frucht
   am Becher doch nicht so weit, sagen wir es dem Gast ("die braucht noch einen
   Tag bis zum vollen Genuss"). Der Zustand bleibt als Hinweis sichtbar, er
   blockiert aber nichts mehr. Einzige Ausnahme: trockene Kerne — die koennen
   physisch nicht in den Mixer. */
const verkaufsfaehig=c=>{ if(istHausvorrat(c)||ausRohstoff(c))return true;
  if(brauchtEinweichen(c))return tkVon(c)>0||ersatzFuer(c).some(e=>tkVon(e)>0);
  return selbstDa(c)||ersatzFuer(c).some(selbstDa);
};

/* Selbst hergestellte Fluessigkeiten: nur den Rohstoff im Bestand fuehren.
   Die App rechnet, fuer wie viele Liter er reicht.
   ⚠ Startannahmen — beim ersten Ansatz nachwiegen und hier korrigieren. */
const SELBST={
  HM:{aus:"HF", proLiter:100, name:"Hafermilch"},   /* 100 g Haferflocken -> 1 L */
  /* Peter 15.08.: "Kokoswasser habe ich frisch aus der Nuss."
     ⚠ 4 junge Nuesse ~ 1 L ist der Startwert — beim naechsten Aufschlagen
     das Wasser JEDER Nuss einzeln wiegen und hier korrigieren. */
  KW:{aus:"KN", proLiter:4, name:"Kokoswasser", frisch:true},
  /* Peter 16.08.: "Hibiskusblüten sind 100 g da, der Tee kann jederzeit
     produziert werden." ⚠ 25 g getrocknete Blueten auf 1 L ist der Startwert. */
  HT:{aus:"RO", proLiter:25, name:"Hibiskustee"}
  /* Mandel- und Sojamilch werden GEKAUFT (V-Soy / Benefit), nicht selbst angesetzt.
     Kokosmilch ebenfalls immer gekauft (Dose/UHT ~60 THB/L) — Peter 15.08.2026. */
};
const literAus=code=>{ const s2=SELBST[code]; if(!s2)return null;
  const roh=+(S.bestand[s2.aus]||0); return roh?Math.round(roh/s2.proLiter*10)/10:0; };
/* Selbst herstellbar = der Rohstoff liegt da. Das Rezept ist damit machbar,
   auch wenn die Zutat selbst nie im Bestand steht. Ohne das stand Rezept 06
   auf "Kokoswasser fehlt", obwohl vier Nuesse in der Kueche lagen. */
const ausRohstoff=c=>{ const l=literAus(c); return l!==null&&l>0; };

/* Kerne und Samen, die vor dem Mixen EINGEWEICHT werden muessen. Trocken
   im Sack sind sie nicht einsatzbereit — sie verhalten sich damit wie frische
   Marktware: weisses Feld = trocken, blaues Feld = eingeweicht und mixfertig.
   faktor = Gewicht nach dem Einweichen / Trockengewicht.
   ⚠ Faktoren sind Erfahrungswerte — beim ersten Ansatz nachwiegen.
   (Peter 15.08.: "Kuerbiskerne 500 g uneingeweicht, da muss ich etwas einweichen.") */
const EINWEICHEN={
  KE:{std:"4–8",  faktor:1.8},   /* Kuerbiskerne */
  SK:{std:"2–4",  faktor:1.6},   /* Sonnenblumenkerne — laenger wird bitter */
  MA:{std:"8–12", faktor:1.7},   /* Mandeln */
  SB:{std:"0,25", faktor:10}     /* Basilikumsamen (Sabja) — quellen stark, Gel */
  /* Hanfsamen geschaelt NICHT: sind weich, koennen trocken in den Mixer. */
};
const brauchtEinweichen=c=>!!EINWEICHEN[c];

/* Gekaufte TK-Ware und Pürees sind fertig — sie brauchen keine Verarbeitung.
   Frische Marktware dagegen muss erst geschnitten und gefrostet werden. */
function schonFertig(k){
  if(!k)return false;
  if(brauchtEinweichen(k.code))return false;   /* trocken ist nicht mixfertig */
  if((k.gruppe||"").indexOf("B · Früchte TK")===0)return true;
  if((" "+(k.de||"")+" ").indexOf(" TK ")>=0)return true;
  if(/P.?ree|puree|frozen|IQF/i.test(k.de||""))return true;
  return ["D · Milch","E · Tee","G · Aroma","H · Supplements","C · Rohstoffe","I · Verpackung","F · Grün"]
    .some(x=>(k.gruppe||"").indexOf(x)===0);
}

/* HAUSVORRAT: immer im Haus, wird nicht bestandsmaessig gefuehrt.
   Loest nie ein Defizit aus, steht nie auf der Einkaufsliste, blockiert nie eine
   Rezept-Ampel. (Peter 15.08.: "Pfeffer hab ich immer da.") */
/* Sorten, die einander im Rezept vertreten duerfen. Ein Rezept, das
   "Passionsfrucht" verlangt, ist auch mit der anderen Farbe machbar —
   sie unterscheiden sich in Suesse/Saeure, nicht in der Funktion.
   Peter 15.08.: rot war rot markiert, obwohl Passionsfrucht im Haus lag. */
/* Sortenfamilien: innerhalb einer Familie vertritt jede Sorte jede andere.
   Peter 16.08.: "Egal mit welcher Sorte kann ich den Smoothie erstellen."
   Unterschiede in Süße und Säure gleichen wir beim Abschmecken aus. */
const FAMILIEN=[
  ["MG","MT","MP"],        /* Mango: frisch · TK Nam Dok Mai · Püree */
  ["AV","AT"],             /* Avocado: frisch · TK/Püree */
  ["PF","PG","PP2"],       /* Passionsfrucht: rot · grün · Püree TK */
  ["DR","DW"],             /* Drachenfrucht: rot · weiß */
  ["LS","ZT"],             /* Zitrusfrucht: Limette · Zitrone — Peter 16.08. */
  ["SP","BK","WS"]         /* Blattgrün/Gemüse: Spinat TK · Brokkoli TK · Wasserspinat
                              Peter 16.08.: "Ich habe als Alternative zu Spinat Brokkoli."
                              Alle drei sind milde grüne Träger — sie vertreten einander,
                              der Geschmack wird ohnehin von Frucht und Limette getragen. */
];
const ersatzFuer=c=>{ const f=FAMILIEN.find(x=>x.indexOf(c)>=0);
  return f?f.filter(x=>x!==c):[]; };
/* Bechergroessen. Geeicht an der Praxis: die Rezeptmengen (~400 g) fuellen
   einen 22-oz-Becher genau. Alles andere rechnet die App daraus ab, damit am
   Stand niemand im Kopf umrechnen muss.
   (Peter 16.08.2026 nach dem Verkosten von Rezept 19.) */
const GROESSEN={
  "22":{ml:650, oz:"22 oz", becher:"BE", deckel:"DE", faktor:1    },
  "12":{ml:355, oz:"12 oz", becher:"B12",deckel:"D12",faktor:0.55 },
  "P" :{ml:50,  oz:"50 ml", becher:"PB", deckel:"",   faktor:0.125}
};
const groesse=()=>GROESSEN[bGroesse]||GROESSEN["22"];
/* Rundung so, dass Gramm-Zahlen am Stand lesbar bleiben:
   ab 10 g auf ganze Gramm, darunter auf halbe, unter 1 g auf Zehntel. */
function mengeSkaliert(g){
  const w=g*groesse().faktor;
  if(w>=10)return Math.round(w);
  if(w>=1) return Math.round(w*2)/2;
  return Math.round(w*10)/10;
}

const HAUSVORRAT=["WA","SA","PP"];
const istHausvorrat=c=>HAUSVORRAT.indexOf(c)>=0;

/* BOOSTER: Aufpreis-Zutat, die der Gast dazubestellen kann. Sie darf das
   Rezept NICHT blockieren — ohne Astaxanthin ist der Smoothie trotzdem
   verkaeuflich, nur eben ohne Booster. (Gefunden 16.08.: Rezept 05 stand auf
   "Astaxanthin fehlt", obwohl es nur auf Bestellung dazukommt.) */
const istBooster=z=>/BOOSTER/i.test(String(z[1]||""));
const pflicht=r=>(r.zut||[]).filter(z=>!istBooster(z));

const reiftVon=c=>+(S.reift&&S.reift[c]&&S.reift[c].menge||0);
const reiftSeit=c=>(S.reift&&S.reift[c]&&S.reift[c].seit)||"";
/* Liegt NUR im Reifelager: da, aber noch nicht verwendbar.
   Peter 15.08.: "die braucht noch nen Tag bis zum vollen Genuss." */
const nurReift=c=>{ const e=vertretenDurch(c); if(e)return nurReift(e);
  return reiftVon(c)>0&&tkVon(c)<=0&&bestandVon(c)<=0&&!ausRohstoff(c); };
/* "1 Tag" statt "1 Tagen" — Peter liest das seinen Gaesten vor. */
const tageText=n=>n<=0?h("heute"):(n===1?"1 "+h("tag"):n+" "+h("tagen"));
const tageSeit=d=>{ if(!d)return 0;
  const a=new Date(d+"T00:00:00"), b=new Date(heute()+"T00:00:00");
  return Math.round((b-a)/86400000); };

/* Wie viel von einer Zutat steckt in EINEM Smoothie? Mittel über alle Rezepte, die sie brauchen. */
/* Nur noch fuer Zutaten, die WIRKLICH stueckweise gehandelt werden.
   Alle Rezepte sind seit 15.08. in Gramm — Blaetter zaehlen war eine Fehlerquelle
   (Peter: 3 kleine vs. 3 grosse Blaetter = spuerbarer Geschmacksunterschied). */
const STUECK_GRAMM={KN:350, SA:1};
function proSmoothie(code){
  const m=[];
  REZEPTE.forEach(r=>(r.zut||[]).forEach(z=>{
    if(z[0]!==code)return;
    if(typeof z[1]==="number"){ m.push(z[1]); return; }
    /* "4 Blätter", "1 Prise", "½ Limette" — mit Erfahrungswert in Gramm umrechnen */
    const zahl=parseFloat(String(z[1]).replace(",","."))||1;
    if(STUECK_GRAMM[code])m.push(zahl*STUECK_GRAMM[code]);
  }));
  if(!m.length){
    /* Kein Rezept nennt den Rohstoff direkt — dann ueber das Erzeugnis rechnen.
       Beispiel: 120 g Kokoswasser je Smoothie, 4 Nuesse ergeben 1 L
       -> 0,48 Nuesse je Smoothie. */
    const p=machtDaraus(code);
    if(p){ const gr=proSmoothie(p); if(gr)return Math.round(gr/1000*SELBST[p].proLiter*100)/100; }
    return 0;
  }
  return Math.round(m.reduce((a,b)=>a+b,0)/m.length*10)/10;
}
/* Reichweite in Smoothies — zählt NUR verkaufsfähige (verarbeitete) Ware,
   bei Flüssigkeiten und Trockenware den normalen Bestand. */
function reichweite(k){
  const g=proSmoothie(k.code); if(!g)return null;
  /* Kokosnuss und Haferflocken werden nicht vorverarbeitet — sie werden bei
     Bedarf frisch aufgeschlagen bzw. angesetzt. Ihre Rohform IST die Lagerform. */
  const da=(schonFertig(k)||machtDaraus(k.code)) ? bestandVon(k.code)+tkVon(k.code) : tkVon(k.code);
  return Math.floor(da/g);
}

/* Gemessene Ausbeute aus den eigenen Verarbeitungen — schlägt die Katalog-Schätzung */
function ausbeuteReal(code){
  const v=S.verarb.filter(x=>x.code===code&&+x.roh>0&&+x.fertig>0);
  if(!v.length)return null;
  const roh=v.reduce((a,x)=>a+ +x.roh,0), fertig=v.reduce((a,x)=>a+ +x.fertig,0);
  return {proz:Math.round(fertig/roh*1000)/10, n:v.length};
}

/* Welche Rezepte brauchen diese Zutat? ("*" = alle) */
/* Welches Erzeugnis wird aus dieser Zutat gemacht? (KN -> KW, HF -> HM) */
const machtDaraus=c=>Object.keys(SELBST).find(x=>SELBST[x].aus===c)||"";
/* Der Rohstoff erbt den Rezeptbedarf seines Erzeugnisses: die Kokosnuss wird
   fuer jedes Rezept gebraucht, das Kokoswasser braucht — sonst taucht sie in
   keiner Einkaufsplanung auf und geht irgendwann still aus. */
const brauchtRezepte=k=>{
  const eigen=k.rezepte||[], p=machtDaraus(k.code);
  if(!p)return eigen;
  const kk=findeCode(p), fremd=(kk&&kk.rezepte)||[];
  return eigen.concat(fremd.filter(r=>eigen.indexOf(r)<0));
};
/* Zutat gilt als Defizit, wenn ein Rezept sie braucht und nichts da ist */
const fehlt=k=>!istHausvorrat(k.code) && brauchtRezepte(k).length>0 && !daIst(k.code);

/* Preis-Historie aus den eigenen Chargen: letzter tatsächlich bezahlter ฿/Einheit */
function letzterPreis(code){
  const c=S.chargen.filter(x=>x.code===code&&x.pr).slice(-1)[0];
  return c?+c.pr:null;
}
function preisText(k){
  const eigen=letzterPreis(k.code);
  const ref=k.pmin!=null?(k.pmin===k.pmax?`${k.pmin}`:`${k.pmin}–${k.pmax}`):null;
  if(eigen!=null)return `${h("gezahlt")} <b>${eigen} ฿</b>${ref?` · ${h("referenz")} ${ref}`:""}`;
  if(ref)return `${h("referenz")} ${ref} ฿`;
  /* preistext ist eine deutsche Notiz aus dem Katalog — fuer Lexi nicht lesbar. */
  return k.preistext&&!istLexi()?esc(k.preistext.replace(/<[^>]*>/g,""))
    :`<span style="color:var(--warn)">⚠ ${h("keinPreis")}</span>`;
}

/* Klick auf eine Kachel = Aufklappen der dahinterliegenden Positionen.
   Peter 15.08.: "Wenn ich auf die Kacheln klicke sollen mir jeweils die
   Positionen angezeigt werden." Bewusst als Aufklapper und nicht als
   Seitenwechsel — so bleibt der Ueberblick oben stehen. */
function kpiZeile(k,rechts,klasse){
  return `<div class="row ${klasse||""}"><span class="code">${k.code}</span>
    <span class="nm">${zname(k)}
      ${brauchtRezepte(k).length?`<span class="rz">${brauchtRezepte(k).map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}
      <span class="pr">${rechts||preisText(k)}</span></span>${hoerBtn(k)}</div>`;
}
function kpiDetail(defizite){
  if(!kpiOffen)return "";
  const zut=alleZutaten(), E=k=>k.einheit||"g";
  let titel="", inhalt="";

  if(kpiOffen==="mix"){
    const mit=REZEPTE.filter(r=>r.zut&&r.zut.length);
    const fertig=mit.filter(r=>pflicht(r).every(z=>verkaufsfaehig(z[0])));
    titel=h("mixbar");
    if(fertig.length){
      inhalt=fertig.map(r=>`<div class="row has spring" data-rez="${r.n}"><span class="code">${r.n}</span>
        <span class="nm"><b>${esc(istLexi()?(r.th||r.de):r.de)}</b><i>${esc(r.en||"")}</i></span>
        <span style="flex:0 0 auto;opacity:.5;font-size:18px">›</span></div>`).join("");
    }else{
      /* Nichts fertig? Dann zeigen, was am naechsten dran ist — das ist die
         eigentlich nuetzliche Auskunft, nicht die leere Liste. */
      const nah=mit.map(r=>({r,f:pflicht(r).filter(z=>!verkaufsfaehig(z[0]))}))
                   .sort((a,b)=>a.f.length-b.f.length).slice(0,5);
      inhalt=`<div class="mini" style="margin-bottom:8px">${h("nochNixMixbar")}</div>`+
        nah.map(x=>`<div class="row spring" data-rez="${x.r.n}"><span class="code">${x.r.n}</span>
          <span class="nm"><b>${esc(istLexi()?(x.r.th||x.r.de):x.r.de)}</b>
          <i>${x.f.map(z=>{const kk=findeCode(z[0]);
             return (nurReift(z[0])?"🌤 ":(daIst(z[0])?"🔪 ":"🛒 "))+esc(kk?(istLexi()?(kk.th||kk.de):kk.de):z[0])}).join(" · ")}</i></span></div>`).join("");
    }
  }

  if(kpiOffen==="fehl"){
    titel=h("fehlen");
    inhalt=defizite.length
      ? defizite.map(k=>kpiZeile(k,preisText(k),"miss")).join("")
      : `<div class="mini">${h("allesDa")}</div>`;
  }

  if(kpiOffen==="kg"){
    const l=zut.filter(k=>tkVon(k.code)>0).sort((a,b)=>tkVon(b.code)-tkVon(a.code));
    titel=h("kgVerk");
    inhalt=l.length ? l.map(k=>kpiZeile(k,`🧊 <b>${tkVon(k.code)} ${E(k)}</b>`,"has")).join("")
                    : `<div class="mini">${h("nixVerarbeitet")}</div>`;
  }

  if(kpiOffen==="da"){
    const l=zut.filter(k=>daIst(k.code)&&!istHausvorrat(k.code));
    titel=h("posDa");
    inhalt=l.map(k=>{
      const t=[];
      if(tkVon(k.code))t.push(`🧊 ${tkVon(k.code)} ${E(k)}`);
      if(bestandVon(k.code))t.push(`🔪 ${bestandVon(k.code)} ${E(k)} ${h("rohKurz")}`);
      if(reiftVon(k.code))t.push(`🌤 ${reiftVon(k.code)} ${E(k)} · ${tageText(tageSeit(reiftSeit(k.code)))}`);
      if(ausRohstoff(k.code))t.push(`🥥 ${h("selbstGemacht")} · ≈ ${literAus(k.code)} L`);
      return kpiZeile(k,t.join(" · "),tkVon(k.code)?"has":"");
    }).join("");
  }

  return `<div class="card" style="margin:-6px 0 14px">
    <div class="mini" style="margin-bottom:8px"><b>${titel}</b></div>${inhalt}</div>`;
}

function vStart(){
  const zut=alleZutaten();
  const defizite=zut.filter(fehlt);
  const daZahl=zut.filter(k=>daIst(k.code)).length;
  const offenePreise=zut.filter(k=>k.pmin==null&&letzterPreis(k.code)==null&&brauchtRezepte(k).length).length;
  const mixbar=REZEPTE.filter(r=>r.zut&&r.zut.length&&pflicht(r).every(z=>verkaufsfaehig(z[0]))).length;
  /* Verkaufsfaehig = verarbeitete Ware PLUS gekaufte Ware, die nichts mehr
     braucht (Joghurt, Milch, TK-Beeren). Sonst stehen 4 L Joghurt bei 0 kg. */
  const kgTk=Math.round(zut.reduce((sum,k)=>sum+tkVon(k.code)
    +(schonFertig(k)?bestandVon(k.code):0),0)/100)/10;
  /* Nur frische Marktware muss verarbeitet werden. Gekaufte TK-Ware, Milch,
     Supplements und Rohstoffe wie die Kokosnuss sind sofort einsatzbereit —
     sie standen faelschlich als "noch nicht verarbeitet" auf der Startseite. */
  const zuRuesten=zut.filter(k=>bestandVon(k.code)>0&&!tkVon(k.code)
    &&!schonFertig(k)&&!machtDaraus(k.code)&&!istHausvorrat(k.code));
  const letzte=S.chargen.slice(-3).reverse();

  return `
  <div class="kpi">
    <div class="ok ${kpiOffen==="mix"?"auf":""}" data-kpi="mix"><b>${mixbar}</b><span>${h("mixbar")}</span></div>
    <div class="miss ${kpiOffen==="fehl"?"auf":""}" data-kpi="fehl"><b>${defizite.length}</b><span>${h("fehlen")}</span></div>
    <div class="ok ${kpiOffen==="kg"?"auf":""}" data-kpi="kg"><b>${kgTk}</b><span>${h("kgVerk")}</span></div>
    <div class="${kpiOffen==="da"?"auf":""}" data-kpi="da"><b>${daZahl}</b><span>${h("posDa")}</span></div>
  </div>
  ${kpiDetail(defizite)}
  ${(()=>{ if(mixbar)return "";
    /* Warum steht da 0? Das gehoert auf den Bildschirm, nicht in eine Kachel,
       die man erst antippen muss. Peter 16.08.: "Was ist da los????" */
    const mit=REZEPTE.filter(r=>r.zut&&r.zut.length);
    const nah=mit.map(r=>({r,f:pflicht(r).filter(z=>!verkaufsfaehig(z[0]))}))
                 .sort((a,b)=>a.f.length-b.f.length)[0];
    if(!nah)return "";
    const liste=nah.f.map(z=>{ const kk=findeCode(z[0]);
      const nam=esc(kk?(istLexi()?(kk.th||kk.de):kk.de):z[0]);
      if(!daIst(z[0]))return `🛒 <b>${nam}</b>`;
      if(nurReift(z[0]))return `🌤 <b>${nam}</b> (${h("brauchtZeit")})`;
      if(brauchtEinweichen(z[0]))return `💧 <b>${nam}</b> (${h("nochEinweichen")})`;
      return `🔪 <b>${nam}</b> (${h("erstVerarbeiten")})`;
    }).join(" · ");
    return `<div class="tip">🎯 ${h("amNaechsten")}: <b>${nah.r.n} ${esc(istLexi()?(nah.r.th||nah.r.de):nah.r.de)}</b><br>${liste}</div>`;
  })()}

  ${zuRuesten.length?`<div class="tip">🧊 <b>${zuRuesten.length}× ${h("nochRuesten")}</b>
    — ${zuRuesten.slice(0,6).map(k=>esc(istLexi()?(k.th||k.de):k.de)).join(", ")}${zuRuesten.length>6?" …":""}.
    </div>`:""}

  ${defizite.length?`<h2>${L1("fehltFuer")} <em>· ${defizite.length}</em></h2>
    ${defizite.slice(0,5).map(k=>`<div class="row miss">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="rz">${brauchtRezepte(k).map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>

/* ---- 🛒 EINKAUFSVORSCHLAG — was zuerst? --------------------------------
   Dringlichkeit = wie viele Smoothies die Zutat noch hergibt, gewichtet damit,
   in wie vielen Rezepten sie steckt. Was nur noch für 1-2 Becher reicht,
   steht oben — auch wenn rechnerisch noch etwas da ist. */
/* Was nie auf eine Einkaufsliste gehört */
const NICHT_KAUFEN=["WA","SA","PP"];

function vorschlag(){
  const liste=[];
  alleZutaten().forEach(k=>{
    if(NICHT_KAUFEN.indexOf(k.code)>=0)return;
    if(SELBST[k.code])return;   /* wird hergestellt, nicht gekauft — der Rohstoff steht in der Liste */
    const inRez=brauchtRezepte(k).length; if(!inRez)return;
    const g=proSmoothie(k.code);
    const roh=bestandVon(k.code), tk=tkVon(k.code), reift=reiftVon(k.code);
    const frisch=!schonFertig(k);
    let stufe, grund;

    /* WICHTIG: Rohware im Haus ist KEIN Einkaufsgrund, sondern ein Verarbeitungs-Auftrag. */
    if(frisch && roh>0 && tk<=0 && !machtDaraus(k.code)){
      liste.push({k,stufe:0,rw:null,grund:`${roh} ${k.einheit||"g"} ${h("rohUngeruestet")}`,reift,g});
      return;
    }
    const rw=reichweite(k);
    if(rw===null){ if(roh||tk||reift)return; stufe=2; grund=h("keineMenge"); }
    else if(rw<=0){ stufe=1; grund=`0 ${h("smoothies")}`; }
    else if(rw<=2){ stufe=1; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else if(rw<=5){ stufe=2; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else return;                          /* genug da */
    if(reift&&stufe===1)stufe=2;          /* Nachschub reift schon */
    liste.push({k,stufe,rw,grund,reift,g});
  });
  liste.sort((a,b)=>a.stufe-b.stufe || (a.rw==null?99:a.rw)-(b.rw==null?99:b.rw)
    || (b.k.rezepte||[]).length-(a.k.rezepte||[]).length);
  return liste;
}

function vVorschlag(){
  const L2=vorschlag();
  const ruesten=L2.filter(x=>x.stufe===0), dring=L2.filter(x=>x.stufe===1), bald=L2.filter(x=>x.stufe===2);
  const zeile=x=>{
    const k=x.k, pr=k.pmin!=null?`${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:h("keinPreis");
    return `<div class="row ${x.stufe===1?"miss":""}">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="pr">${esc(x.grund)}${x.g?` · ${x.g} g/${h("smoothies")}`:""} · ${pr}
          ${x.reift?` · 🌤 ${x.reift} ${k.einheit||"g"} ${h("reiftNoch")}`:""}</span>
        ${(k.rezepte||[]).length?`<span class="rz">${k.rezepte.map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}</span>
      ${hoerBtn(k)}</div>`;
  };
  /* Wichtigste Frage beim Einkauf: was schaltet neue Rezepte frei?
     Nach Hebelwirkung sortiert — eine Limette hat drei Rezepte geoeffnet.
     Peter 16.08.: "Wenn ich sehen möchte welche Zutaten ich einkaufen muss…" */
  const sperrt={};
  REZEPTE.filter(r=>r.zut&&r.zut.length).forEach(r=>{
    pflicht(r).forEach(z=>{ if(verkaufsfaehig(z[0]))return;
      const e=sperrt[z[0]]=sperrt[z[0]]||{rez:[]};
      if(e.rez.indexOf(r.n)<0)e.rez.push(r.n); });
  });
  const hebel=Object.keys(sperrt).map(c=>({c,k:findeCode(c),rez:sperrt[c].rez}))
    .filter(x=>x.k).sort((a,b)=>b.rez.length-a.rez.length
      || (a.k.de||"").localeCompare(b.k.de||""));
  const hebelZeile=x=>{
    const k=x.k, pr=k.pmin!=null?`${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:h("keinPreis");
    const zustand=!daIst(k.code)?`🛒 ${h("fehltBtn")}`
      : brauchtEinweichen(k.code)?`💧 ${h("nochEinweichen")}`
      : `🔪 ${h("erstVerarbeiten")}`;
    return `<div class="row ${!daIst(k.code)?"miss":""}">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="pr">${zustand} · ${pr}</span>
        <span class="rz">${x.rez.map(r=>`<span>${r}</span>`).join("")}</span></span>
      ${hoerBtn(k)}
      <span style="flex:0 0 auto;font:800 15px inherit;color:var(--miss)">+${x.rez.length}</span></div>`;
  };

  return `<div class="tip">${L1("vorschlagHint")}</div>
    ${hebel.length?`<h2>🎯 ${L1("schaltetFrei")} <em>· ${hebel.length}</em></h2>
      <div class="mini" style="margin:-4px 0 8px">${h("schaltetFreiHint")}</div>
      ${hebel.map(hebelZeile).join("")}`:""}
    ${ruesten.length?`<h2>🧊 ${L1("zuRuestenTitel")} <em>· ${ruesten.length}</em></h2>
      <div class="mini" style="margin:-4px 0 8px">${h("zuRuestenHint")}</div>
      ${ruesten.map(zeile).join("")}`:""}
    ${dring.length?`<h2>🔴 ${L1("jetzt")} <em>· ${dring.length}</em></h2>${dring.map(zeile).join("")}`:""}
    ${bald.length?`<h2>🟡 ${L1("bald")} <em>· ${bald.length}</em></h2>${bald.map(zeile).join("")}`:""}
    ${!L2.length?`<div class="empty">✅ ${h("allesDa")}</div>`:""}
    ${(()=>{  /* selbst hergestellte Flüssigkeiten: reicht der Rohstoff? */
      const rows=Object.keys(SELBST).map(c=>{
        const sp=SELBST[c], k=findeCode(c), roh=findeCode(sp.aus);
        const l=literAus(c);
        if(l===null)return "";
        return `<div class="row ${l<1?"miss":""}"><span class="code">${sp.aus}</span>
          <span class="nm"><b>${esc(sp.name)}</b>
            <span class="pr">${roh?esc(roh.de):sp.aus}: <b>${bestandVon(sp.aus)} g</b> →
              ${h("reicht")} <b>${l} ${h("liter")}</b> <span style="opacity:.7">(${sp.proLiter} g/L)</span></span></span></div>`;
      }).filter(Boolean).join("");
      return rows?`<h2>🥛 ${L1("selbstHerstellen")}</h2>${rows}`:"";
    })()}
    <div class="bar"><button class="b p" id="ekliste" style="flex:1">🛒 ${h("ekliste")}</button></div>
    <textarea id="out" style="display:none" readonly></textarea>`;
}

/* ---- 📖 REZEPTE --------------------------------------------------------- */
function vRezepte(){
  const mit=REZEPTE.filter(r=>r.zut&&r.zut.length), ohne=REZEPTE.filter(r=>!r.zut||!r.zut.length);
  const karte=r=>{
    const fehlen=pflicht(r).filter(z=>!daIst(z[0]));
    const reifen=pflicht(r).filter(z=>nurReift(z[0]));
    const ruesten=pflicht(r).filter(z=>daIst(z[0])&&!nurReift(z[0])&&!verkaufsfaehig(z[0]));
    /* Reihenfolge = Dringlichkeit: fehlt schlaegt reift schlaegt verarbeiten. */
    const status=fehlen.length?["rt",`${fehlen.length} ${h("fehltBtn")}`]
                : reifen.length?["or",`🌤 ${h("brauchtZeit")}`]
                : ruesten.length?["ge",`${ruesten.length}${h("erstRuesten")}`]
                : ["gr",h("mixbarBtn")];
    return `<div class="rez${rezFokus===r.n?" fokus":""}" id="r${r.n}">
      <div class="kopf"><span class="no">${r.n}</span><b>${esc(istLexi()?(r.th||r.de):r.de)}</b>
        ${r.bestaetigt?`<span class="probiert" title="${h("bestaetigtLang")}">★ ${h("bestaetigt")}</span>`:""}
        <span class="ampel ${status[0]}">${status[1]}</span></div>
      <div class="mini">${esc(r.en||"")}${istLexi()?"":` · ${esc(r.th||"")}`}</div>
      <div class="zut">${r.zut.map(z=>{
        const cls=istBooster(z)?"b":(!daIst(z[0])?"f":(nurReift(z[0])?"r":(ausRohstoff(z[0])&&!tkVon(z[0])?"s":(verkaufsfaehig(z[0])?"":"g"))));
        const kk=findeCode(z[0]);
        const nam=kk?(istLexi()?(kk.th||kk.de):kk.de):z[2];
        const zw=kk&&!EN_AUS?(istLexi()?kk.en:(kk.th||kk.en)):"";
        return `<span class="${cls}">${z[0]} ${esc(nam)}${zw?` <i style="font-style:normal;opacity:.75">${esc(zw)}</i>`:""}${typeof z[1]==="number"?` <b>${mengeSkaliert(z[1])} g</b>`:` ${esc(z[1])}`}</span>`;
      }).join("")}</div>
      ${(()=>{ const ew=r.zut.filter(z=>brauchtEinweichen(z[0])&&bestandVon(z[0])>0&&tkVon(z[0])<=0);
        if(!ew.length)return "";
        const seen={};
        return `<div class="mini" style="margin-top:7px;color:#1c5389">💧 ${ew.filter(z=>seen[z[0]]?false:(seen[z[0]]=1)).map(z=>{
          const kk=findeCode(z[0]);
          return esc(kk?(istLexi()?(kk.th||kk.de):kk.de):z[0])+" — "+h("nochEinweichen")+" ("+EINWEICHEN[z[0]].std+" h)";
        }).join(" · ")}</div>`;})()}
      ${(()=>{ const ve=r.zut.map(z=>[z[0],vertretenDurch(z[0])]).filter(x=>x[1]);
        if(!ve.length)return "";
        const seen={};
        return `<div class="mini" style="margin-top:7px;color:#1c5389">🔁 ${ve.filter(x=>seen[x[0]]?false:(seen[x[0]]=1)).map(x=>{
          const a=findeCode(x[0]), b=findeCode(x[1]);
          return esc(a?(istLexi()?(a.th||a.de):a.de):x[0])+" → "+h("vertreten")+" "
                +esc(b?(istLexi()?(b.th||b.de):b.de):x[1]);
        }).join(" · ")}</div>`;})()}
      ${(()=>{ const sb=r.zut.filter(z=>ausRohstoff(z[0])&&!tkVon(z[0]));
        if(!sb.length||fehlen.length)return "";
        const seen={};
        return `<div class="mini" style="margin-top:7px;color:#1c5389">🥥 ${sb.filter(z=>seen[z[0]]?false:(seen[z[0]]=1)).map(z=>{
          const kk=findeCode(z[0]), q=findeCode(SELBST[z[0]].aus);
          return esc(kk?(istLexi()?(kk.th||kk.de):kk.de):z[0])+" — "+h("ausRoh")+" "
                +bestandVon(SELBST[z[0]].aus)+" "+((q&&q.einheit)||"g")+" "
                +esc(q?(istLexi()?(q.th||q.de):q.de):SELBST[z[0]].aus)+" ≈ "+literAus(z[0])+" L";
        }).join(" · ")}</div>`;})()}
      ${reifen.length&&!fehlen.length?`<div class="mini" style="margin-top:7px;color:#9a5a12">🌤 ${
        reifen.map(z=>{const kk=findeCode(z[0]);return esc(kk?(istLexi()?(kk.th||kk.de):kk.de):z[0])
          +" ("+tageText(tageSeit(reiftSeit(z[0])))+")"}).join(", ")
        } — ${h("reifePruefen")}</div>`:""}</div>`;
  };
  return `<div class="bar" style="margin:0 0 12px">
      ${Object.keys(GROESSEN).map(k=>`<button class="b ${bGroesse===k?"p":""}" data-groesse="${k}" style="flex:1">
        ${GROESSEN[k].oz}</button>`).join("")}</div>
    <div class="mini" style="margin:-6px 0 12px">${h("groesseHint")
      .replace("{oz}",groesse().oz).replace("{ml}",String(groesse().ml))}</div>
    <div class="tip">${L1("rezLegende")}</div>
    <h2>${L1("ausgearbeitet")} <em>· ${mit.length}</em></h2>${mit.map(karte).join("")}
    ${ohne.length?`<h2>${L1("ohneGramm")} <em>· ${ohne.length}</em></h2>${ohne.map(r=>`<div class="rez">
      <div class="kopf"><span class="no">${r.n}</span><b>${esc(istLexi()?(r.th||r.de):r.de)}</b>
      <span class="ampel rt">${h("rezFehlt")}</span></div></div>`).join("")}`:""}`;
}

function einkaufsliste(){
  const z=alleZutaten().filter(fehlt);
  let t="EINKAUFSLISTE 100blend — "+heute()+"\n\n";
  const grp={}; z.forEach(k=>{(grp[k.gruppe]=grp[k.gruppe]||[]).push(k)});
  Object.entries(grp).forEach(([g,items])=>{
    t+=g+"\n"+items.map(k=>{
      const ref=k.pmin!=null?` — ${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:"";
      return `  [ ] ${k.code}  ${k.de} (${k.th||""})${ref}   für Rezept ${brauchtRezepte(k).join("/")}`;
    }).join("\n")+"\n\n";
  });
  t+="NICHT KAUFEN (durchgefallen 13.08.):\n"+ENTSORGT.map(x=>`  ✗ ${x[1]} — ${x[2]} (Note ${x[5]}/5)`).join("\n");
  return t;
}

function csvText(){
  let t="﻿Typ;Datum;Wer;Code;Zutat;Thai;Gruppe;Sorte;Menge;Einheit;bezahlt_THB;THB_pro_Einheit;Brix;Duft;Duftnoten;Fehlnoten;Note;Markt;Bemerkung\n";
  alleZutaten().forEach(k=>{ if(S.bestand[k.code])
    t+=["Bestand",heute(),S.cfg.who||"",k.code,k.de,k.th||"",k.gruppe,"",S.bestand[k.code],k.einheit||"g","","","","","","","","",""].join(";")+"\n"; });
  alleZutaten().forEach(k=>{ if(S.tk[k.code])
    t+=["Verarbeitet",heute(),S.cfg.who||"",k.code,k.de,k.th||"",k.gruppe,"",S.tk[k.code],"g","","","","","","","","",""].join(";")+"\n"; });
  S.verarb.forEach(v=>{ const k=findeCode(v.code)||{de:v.code,th:"",gruppe:""};
    t+=["Verarbeitung",v.dat,v.who||"",v.code,k.de,k.th||"",k.gruppe,"",v.roh+" roh -> "+v.fertig+" fertig","g","",v.kosten||"","","","","",v.proz+"% Ausbeute","",(v.bem||"").replace(/;/g,",")].join(";")+"\n"; });
  S.chargen.forEach(c=>{ const k=findeCode(c.code)||{de:c.code,th:"",gruppe:"",einheit:""};
    t+=["Charge",c.dat,c.who||"",c.code,k.de,k.th||"",k.gruppe,c.sorte||"",c.kg||"",k.einheit||"",c.ges||"",c.pr||"",
        c.bx||"",c.duft||"",(c.des||[]).join("/"),(c.feh||[]).join("/"),c.note||"",c.markt||"",(c.bem||"").replace(/;/g,",")].join(";")+"\n"; });
  return t;
}

async function senden(){
  const wer=(S.cfg.who||"unbekannt").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const txt=csvText(), name=`100blend_standos_${heute()}_${wer}.csv`;
  try{
    const file=new File([txt],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"100blend Stand-OS",text:`Bestand + ${S.chargen.length} Chargen`}); return;
    }
  }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a"), url=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* --- Uebernahme per QR-Code / Link ---------------------------------------
   Peter kann Werte nicht vom PC aufs Handy tippen. Deshalb kann die Adresse
   die Mengen mitbringen:  ...standos.html#lade=roh:KN-4,PF-400;tk:WM-333
   Es wird NICHTS still uebernommen — erst Vorschau, dann Knopf.
   (Hash statt ?-Parameter, damit die Werte nie an den Server gehen.) */
function qrAngebot(){
  const h2=(location.hash||"").replace(/^#/,"");
  if(h2.indexOf("lade=")<0)return null;
  const roh={}, tk={};
  decodeURIComponent(h2.slice(h2.indexOf("lade=")+5)).split(";").forEach(teil=>{
    const m=teil.split(":"); if(m.length<2)return;
    const ziel=/^tk$/i.test(m[0].trim())?tk:roh;
    m[1].split(",").forEach(paar=>{
      const q=paar.split("-"); if(q.length<2)return;
      const c=q[0].trim().toUpperCase(), g=parseFloat(q[1]);
      if(findeCode(c)&&g>=0)ziel[c]=g;
    });
  });
  return (Object.keys(roh).length||Object.keys(tk).length)?{roh,tk}:null;
}
function qrUebernehmen(a){
  Object.keys(a.roh).forEach(c=>{ if(a.roh[c]>0)S.bestand[c]=a.roh[c]; else delete S.bestand[c]; });
  Object.keys(a.tk).forEach(c=>{ if(a.tk[c]>0){S.tk[c]=a.tk[c]; delete S.bestand[c];} else delete S.tk[c]; });
  save(); history.replaceState(null,"",location.pathname); render();
}
function qrKarte(){
  const a=qrAngebot(); if(!a)return "";
  const zeile=(c,g,tkFlag)=>{ const k=findeCode(c);
    return `<div class="row"><span class="code">${c}</span><span class="nm">${zname(k)}
      <span class="pr">${tkFlag?"🧊 ":""}<b>${g} ${k.einheit||"g"}</b></span></span></div>`; };
  return `<div class="card" style="border-color:var(--fg)">
    <div style="font-weight:700;margin-bottom:8px">📲 ${h("qrTitel")}</div>
    ${Object.keys(a.roh).map(c=>zeile(c,a.roh[c],false)).join("")}
    ${Object.keys(a.tk).map(c=>zeile(c,a.tk[c],true)).join("")}
    <div class="bar" style="margin-top:10px">
      <button class="b p" id="qr_ok" style="flex:1">${h("qrOk")}</button>
      <button class="b" id="qr_ab">${h("abbrechen")}</button></div>
    <div class="mini" style="margin-top:6px">${h("qrHint")}</div></div>`;
}

function binde(){
  const qo=$("qr_ok"), qa=$("qr_ab");
  if(qo)qo.onclick=()=>{ const a=qrAngebot(); if(a)qrUebernehmen(a); };
  if(qa)qa.onclick=()=>{ history.replaceState(null,"",location.pathname); render(); };
  /* --- Import: CSV-Export ODER einfache Zeilen "CODE MENGE" ---------------
     Damit lassen sich Mengen von aussen einspielen, ohne 95 Felder abzutippen.
     Erkennt beide Formate automatisch und meldet, was NICHT zugeordnet wurde. */
  const ib=$("importb");
  if(ib)ib.onclick=()=>{
    const box=$("importbox");
    if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div class="card">
      <div class="mini" style="margin-bottom:8px">${h("importHint")}</div>
      <textarea id="i_text" style="height:150px;font:12px/1.5 ui-monospace,Menlo,monospace"></textarea>
      <div class="bar" style="margin:8px 0 0">
        <button class="b p" id="i_ok" style="flex:1">${h("importOk")}</button></div>
      <div class="mini" id="i_log" style="margin-top:8px"></div></div>`;
    $("i_ok").onclick=()=>{
      const txt=$("i_text").value||"";
      let ok=0, unbekannt=[];
      txt.split(/\r?\n/).forEach(zeile=>{
        if(!zeile.trim())return;
        let code="", menge="";
        if(zeile.indexOf(";")>=0){                    /* CSV aus dem Export */
          const sp=zeile.split(";");
          if(!/^(Bestand|Verarbeitet)$/i.test((sp[0]||"").trim()))return;
          code=(sp[3]||"").trim(); menge=(sp[8]||"").trim();
          if(/^Verarbeitet$/i.test(sp[0].trim())){
            if(findeCode(code)&&+menge>0){S.tk[code]=+menge; ok++;}
            return;
          }
        }else{               /* einfache Zeile: "CODE MENGE" oder "TK CODE MENGE" */
          const roh=zeile.trim();
          const mt=roh.match(/^TK[\s:=,]+([A-Za-z]{2,3}[0-9]?)[\s:=,]+([0-9.,]+)/i);
          if(mt){            /* TK-Praefix = schon verarbeitete, verkaufsfertige Ware */
            const c2=mt[1].toUpperCase(), m2=+mt[2].replace(",",".");
            if(findeCode(c2)&&m2>0){ S.tk[c2]=m2; delete S.bestand[c2]; ok++; }
            else if(c2) unbekannt.push(c2+" "+mt[2]);
            return;
          }
          const m=roh.match(/^([A-Za-z]{2,3}[0-9]?)[\s:=,]+([0-9.,]+)/);
          if(!m)return;
          code=m[1].toUpperCase(); menge=m[2].replace(",",".");
        }
        if(findeCode(code)&&+menge>0){ S.bestand[code]=+menge; ok++; }
        else if(code) unbekannt.push(code+" "+menge);
      });
      save();
      $("i_log").innerHTML = ok
        ? `✅ <b>${ok}</b> ${h("importErgebnis")}`+(unbekannt.length?`<br>⚠ unbekannt: ${esc(unbekannt.join(", "))}`:"")
        : `⚠ ${h("importNichts")}`;
      if(ok){ setTimeout(()=>render(),900); }
    };
  };

  document.querySelectorAll(".hoer").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); sprich(b.dataset.say,b.dataset.lang);
  });
  /* Startseiten-Kacheln: gleiche Kachel nochmal = wieder zuklappen. */
  /* Aus der Kachel direkt ins Rezept springen. Peter 16.08.: "wenn ich
     draufklicke, lande ich nicht bei dem Rezept." */
  document.querySelectorAll("[data-groesse]").forEach(b=>b.onclick=()=>{
    bGroesse=b.dataset.groesse; render();
  });
  document.querySelectorAll("[data-rez]").forEach(d=>d.onclick=()=>{
    rezFokus=d.dataset.rez; V="rezepte"; kpiOffen="";
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="rezepte"));
    render();
    const ziel=$("r"+rezFokus);
    if(ziel&&ziel.scrollIntoView)ziel.scrollIntoView({block:"start"});
  });
  document.querySelectorAll("[data-kpi]").forEach(d=>d.onclick=()=>{
    kpiOffen = (kpiOffen===d.dataset.kpi) ? "" : d.dataset.kpi;
    render();
  });
  /* Bestand: Mengen + Filter + eigene Zutat */
  document.querySelectorAll("input.qty").forEach(i=>i.oninput=()=>{
    if(i.value==="")delete S.bestand[i.dataset.c]; else S.bestand[i.dataset.c]=i.value;
    stempel(i.dataset.c); save(); syncSpaeter();
    const r=i.closest(".row"); r.classList.toggle("has",+i.value>0);
    if(+i.value>0)r.classList.remove("miss");
  });
  /* Zweites Feld = verarbeitete (verkaufsfaehige) Menge.
     Peter 15.08.: Banane war als Rohware eingetragen, die 628 g sind aber
     das FERTIGE Gefriergut. Ohne dieses Feld war das nicht korrigierbar. */
  /* Ein Tipp verschiebt die ganze Menge von Rohware nach verarbeitet.
     Peter 15.08.: die importierte Inventur war groesstenteils schon
     eingefrorene Ware, stand aber komplett als Rohware da. */
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.mv, menge=+(S.bestand[c]||0);
    if(!menge)return;
    S.tk[c]=(+(S.tk[c]||0))+menge;
    delete S.bestand[c];
    stempel(c); save(); syncSpaeter(); render();
  });
  document.querySelectorAll("input.tkqty").forEach(i=>i.oninput=()=>{
    if(i.value===""||+i.value<=0)delete S.tk[i.dataset.c]; else S.tk[i.dataset.c]=+i.value;
    stempel(i.dataset.c); save(); syncSpaeter();
  });
  document.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{bFilter=b.dataset.bf;bLimit=30;render()});
  const mehr=$("mehr"); if(mehr)mehr.onclick=()=>{bLimit+=40;render()};
  const bs=$("b_such");
  if(bs){
    bs.oninput=()=>{
      bSuche=bs.value.trim(); bLimit=bSuche?200:30;
      const pos=bs.selectionStart; render();
      const neu=$("b_such"); if(neu){neu.focus(); try{neu.setSelectionRange(pos,pos)}catch(e){}}
    };
  }
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const k=findeCode(b.dataset.del);
    if(!confirm(`„${k.de}" entfernen?`))return;
    S.eigen=S.eigen.filter(x=>x.code!==b.dataset.del); delete S.bestand[b.dataset.del]; save(); render();
  });
  const nz=$("neuzutat"); if(nz)nz.onclick=()=>{
    const f=$("neuform");
    if(f.innerHTML){f.innerHTML="";return}
    f.innerHTML=`<div class="card">
      <div class="f"><label>${L("wasIstEs")}</label><input id="n_de" placeholder="z. B. Sesamöl"></div>
      <div class="f"><label>ไทย / Thai</label><input id="n_th"></div>
      <div class="f2"><div class="f"><label>${L("gruppe")}</label><select id="n_g">
        ${[...new Set(KATALOG.map(k=>k.gruppe))].map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
        <div class="f"><label>${L("einheit")}</label><select id="n_u"><option>g</option><option>ml</option><option>Stk</option><option>Pack</option><option>kg</option></select></div></div>
      <div class="f2"><div class="f"><label>${L("menge")}</label><input type="number" step="any" id="n_m"></div>
        <div class="f"><label>Code</label><input id="n_c" maxlength="3" style="text-transform:uppercase"></div></div>
      <div class="bar" style="margin:6px 0 0"><button class="b p" id="n_ok" style="flex:1">${h("uebernehmen")}</button></div></div>`;
    $("n_de").oninput=()=>{ if(!$("n_c").value)$("n_c").value=freierCode($("n_de").value) };
    $("n_ok").onclick=()=>{
      const de=$("n_de").value.trim(); if(!de){alert(h("wasIstEs"));return}
      const code=($("n_c").value.trim()||freierCode(de)).toUpperCase();
      S.eigen.push({code,de,th:$("n_th").value.trim(),gruppe:$("n_g").value,einheit:$("n_u").value,
                    rezepte:[],pmin:null,pmax:null,preistext:"selbst angelegt",eigen:true});
      const m=$("n_m").value.trim(); if(m)S.bestand[code]=m;
      save(); render();
    };
  };

  /* Start */
  const ek=$("ekliste"); if(ek)ek.onclick=()=>{ $("out").value=einkaufsliste(); $("out").style.display="block"; $("out").select(); };
  const zt=$("zeigetot"); if(zt)zt.onclick=()=>{
    const b=$("totbox");
    b.innerHTML=b.innerHTML?"":ENTSORGT.map(t=>`<div class="dead"><span class="code">${t[0]}</span>
      <span class="nm"><b>${esc(t[1])}</b><i>${esc(t[2])}</i>
      <span class="why">${h("note")} ${t[5]}/5 · ${t[4]} °Bx — ${esc(t[6])}</span></span></div>`).join("");
  };
  const cb=$("csvb"); if(cb)cb.onclick=()=>{ $("out").value=csvText().replace(/^﻿/,""); $("out").style.display="block"; $("out").select(); };
  const sd=$("senden"); if(sd)sd.onclick=senden;
  /* Zweiter Weg ohne Drive: alles als Text in die Zwischenablage, damit Peter
     es direkt in den Chat einfuegen kann. Peter 15.08.: "wohin womit senden?" */
  /* Stand vom Server holen: setzt das Geraet auf den mitgelieferten Bestand
     zurueck. Fuer den Fall, dass ein zweites Handy leer dasteht. */
  const ss=$("serverstand");
  if(ss)ss.onclick=()=>{
    if(!confirm(h("serverStandFrage")))return;
    serverStandUebernehmen(S); save(); render();
  };
  /* Gemeinsamer Speicher: URL einmal einfuegen, danach laeuft es von allein. */
  const sb=$("syncb");
  if(sb)sb.onclick=()=>{
    const box=$("syncbox");
    if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div class="card">
      <div class="mini" style="margin-bottom:8px">${h("syncHint")}</div>
      <input id="s_url" placeholder="https://script.google.com/macros/s/…/exec"
        value="${esc(syncUrl())}" autocomplete="off" style="font-size:13px">
      <div class="bar" style="margin:8px 0 0">
        <button class="b p" id="s_ok" style="flex:1">${h("syncSpeichern")}</button>
        ${syncUrl()?`<button class="b r" id="s_weg">${h("syncTrennen")}</button>`:""}</div>
      <div class="mini" id="s_log" style="margin-top:8px">${
        syncFehler?"⚠ "+esc(syncFehler):(syncStand?"🔗 "+h("zuletzt")+" "+syncStand:"")}</div>
      <div class="mini" style="margin-top:8px;opacity:.75">${h("syncGeraet")}: <b>${esc(geraetName())}</b></div></div>`;
    const ok=$("s_ok");
    if(ok)ok.onclick=async()=>{
      const u=($("s_url").value||"").trim();
      if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)){
        $("s_log").innerHTML="⚠ "+h("syncUrlFalsch"); return;
      }
      if(u)localStorage.setItem(SYNCKEY,u); else localStorage.removeItem(SYNCKEY);
      $("s_log").innerHTML="⟳ …";
      await syncJetzt(false);
      const l=$("s_log");
      if(l)l.innerHTML=syncFehler?("⚠ "+esc(syncFehler)):("✅ "+h("syncOk"));
    };
    const weg=$("s_weg");
    if(weg)weg.onclick=()=>{ localStorage.removeItem(SYNCKEY); render(); };
  };
  const sn=$("syncnow"); if(sn)sn.onclick=()=>syncJetzt(true);

  const kp=$("kopieren");
  if(kp)kp.onclick=async()=>{
    const txt=csvText(), m=$("kopiermeldung");
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ const t=$("out"); t.style.display="block"; t.value=txt; t.focus(); t.select(); }
    if(m)m.innerHTML=h("kopiert");
  };

  /* Einkauf */
  const such=$("e_such");
  if(such){
    const zeigen=()=>{
      const q=such.value.trim().toLowerCase();
      const L=$("e_liste");
      if(!q){L.style.display="none";return}
      const tr=alleZutaten().filter(k=>[k.de,k.th,k.en,k.code].join(" ").toLowerCase().includes(q)).slice(0,40);
      L.innerHTML=tr.length?tr.map(k=>`<button class="frow" data-c="${k.code}"><b>${esc(istLexi()?(k.th||k.de):k.de)}</b> · ${esc(k.en||"")} · ${esc(istLexi()?k.de:(k.th||""))}
        <small>${esc(k.gruppe)}${k.pmin!=null?` · ${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:""}</small></button>`).join("")
        :`<div class="fgrp">nichts gefunden</div>`;
      L.style.display="block";
      L.querySelectorAll(".frow").forEach(b=>b.onclick=()=>{
        eCode=b.dataset.c; localStorage.setItem("blend_os_code",eCode); eSuche=""; render();
      });
    };
    such.oninput=zeigen; such.onfocus=zeigen;

    const sumZeigen=()=>{
      const kg=parseFloat($("e_kg").value), ges=parseFloat($("e_ges").value), k=findeCode(eCode);
      const el=$("e_sum"); if(!el)return;
      if(!(kg>0)||!(ges>0)){el.innerHTML="";return}
      const pr=Math.round(ges/kg*10)/10, eh=k.einheit==="Stk"?"Stück":"kg";
      let s=`🧾 ${ges} ฿ ÷ ${kg} ${eh} = <b>${pr} ฿/${eh}</b>`;
      const a=$("e_verarb").checked?100:k.ausbeute;
      if(a&&a<100&&k.einheit!=="Stk")s+=`<br>🥤 ${h("ausbeuteTxt")} ~${a} % → <b>${Math.round(pr/a*100)} ${h("fruchtfleisch")}</b>`;
      if(k.pmax!=null){ if(pr>k.pmax*1.15)s+=`<br><b style="color:var(--miss)">⚠ ${h("ueberRef")} ${k.pmin}–${k.pmax} ฿</b>`;
        else if(pr<=k.pmin)s+=`<br><b style="color:var(--ok)">✓ ${h("unterRef")}</b>`; }
      el.innerHTML=s;
    };
    $("e_kg").oninput=sumZeigen; $("e_ges").oninput=sumZeigen; $("e_verarb").onchange=sumZeigen;

    const sterne=(id,set)=>{const el=$(id); el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const n=+b.dataset.n; set(n); el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=n))}};
    sterne("e_duft",n=>eDuft=n); sterne("e_note",n=>eNote=n);
    const toggle=(id,arr)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const i=arr.indexOf(b.dataset.k); if(i<0)arr.push(b.dataset.k); else arr.splice(i,1); b.classList.toggle("on",i<0)}};
    toggle("e_des",eDes); toggle("e_feh",eFeh);
    $("e_markt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      S.cfg.markt=(S.cfg.markt===b.dataset.m)?"":b.dataset.m; save();
      $("e_markt").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.m===S.cfg.markt));
      $("who").innerHTML=(S.cfg.who?esc(S.cfg.who):"—")+(S.cfg.markt?`<br>${esc(S.cfg.markt)}`:"");};

    $("e_ok").onclick=()=>{
      const kg=$("e_kg").value, ges=$("e_ges").value;
      const pr=(+kg>0&&+ges>0)?Math.round(+ges/+kg*10)/10:"";
      const c={dat:heute(),who:S.cfg.who||"",code:eCode,sorte:$("e_sorte").value.trim(),
        kg,ges,pr,verarb:$("e_verarb").checked?1:"",bx:$("e_bx").value,
        duft:eDuft||"",des:eDes.slice(),feh:eFeh.slice(),note:eNote||"",
        markt:S.cfg.markt,bem:$("e_bem").value.trim()};
      if(!c.ges&&!c.bx&&!c.duft&&!c.sorte){alert(h("mind"));return}
      S.chargen.push(c);
      if($("e_bestand").checked&&+kg>0){
        const k=findeCode(eCode);
        const dazu=k.einheit==="Stk"?+kg:(k.einheit==="ml"?+kg*1000:+kg*1000); // kg/l -> g/ml
        S.bestand[eCode]=Math.round((+(S.bestand[eCode]||0))+dazu);
      }
      save(); eDuft=0;eNote=0;eDes=[];eFeh=[];
      render();
    };
  }
  /* Verarbeiten */
  const rc=$("r_code");
  if(rc){
    rc.onchange=()=>{rCode=rc.value;render()};
    const rechnung=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      const el=$("r_rechnung"); if(!el)return;
      if(!(roh>0)||!(fertig>0)){el.innerHTML="";return}
      const rohG=stk?roh:roh*1000, fertigG=fertig*1000;
      const proz=Math.round(fertigG/rohG*1000)/10;
      let s=`📊 ${h("ausbeuteTxt")} <b>${stk?Math.round(fertigG/roh)+" g/Stk":proz+" %"}</b>`
        +(stk?"":` · 🗑 ${h("abfall")} <b>${Math.round((100-proz)*10)/10} %</b>`);
      /* echter Preis der Verkaufsware: was die Rohware kostete, geteilt durch das, was übrig blieb */
      const pr=letzterPreis(k.code);
      if(pr){
        const kosten=Math.round(pr*roh/fertig*10)/10;
        s+=`<br>💰 ${pr} ฿/${stk?"Stk":"kg"} → <b>${kosten} ฿ ${h("verkaufsware")}</b>`;
        if(!stk&&pr)s+=` <span style="opacity:.7">(+${Math.round((kosten/pr-1)*100)} % ${h("durchVerschnitt")})</span>`;
      }
      const rohDa=bestandVon(k.code);
      if(rohG>rohDa)s+=`<br><b style="color:var(--warn)">⚠ ${h("zuVielRoh")} (${rohDa} ${k.einheit||"g"})</b>`;
      if(fertigG>rohG)s+=`<br><b style="color:var(--miss)">⚠ ${h("dreher")}</b>`;
      el.innerHTML=s;
    };
    $("r_roh").oninput=rechnung; $("r_fertig").oninput=rechnung;
    $("r_ok").onclick=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      if(!(roh>0)||!(fertig>0)){alert(h("rohFertig"));return}
      const rohG=Math.round(stk?roh:roh*1000), fertigG=Math.round(fertig*1000);
      const pr=letzterPreis(k.code);
      S.verarb.push({dat:heute(),who:S.cfg.who||"",code:rCode,roh:rohG,fertig:fertigG,
        proz:Math.round(fertigG/rohG*1000)/10,
        kosten:pr?Math.round(pr*roh/fertig*10)/10:"",bem:$("r_bem").value.trim()});
      S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-rohG);
      if(!S.bestand[rCode])delete S.bestand[rCode];
      S.tk[rCode]=(+(S.tk[rCode]||0))+fertigG;
      /* Was noch nicht reif war, wandert ins Reifelager statt verloren zu gehen */
      const reift=parseFloat($("r_reift").value);
      if(reift>0){
        const reiftG=Math.round(stk?reift:reift*1000);
        S.reift[rCode]={menge:(reiftVon(rCode)+reiftG), seit:heute()};
        S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-reiftG);
        if(!S.bestand[rCode])delete S.bestand[rCode];
      }
      save(); render();
    };
  }
  document.querySelectorAll("[data-verk]").forEach(b=>b.onclick=()=>verkostungAuf(+b.dataset.verk));
  document.querySelectorAll("[data-verarb]").forEach(b=>b.onclick=()=>{
    if(!confirm(h("zurueck")))return;
    const v=S.verarb[+b.dataset.verarb];
    S.bestand[v.code]=(+(S.bestand[v.code]||0))+ +v.roh;
    S.tk[v.code]=Math.max(0,(+(S.tk[v.code]||0))- +v.fertig);
    if(!S.tk[v.code])delete S.tk[v.code];
    S.verarb.splice(+b.dataset.verarb,1); save(); render();
  });

  document.querySelectorAll("[data-charge]").forEach(b=>b.onclick=()=>{
    if(!confirm("Charge löschen?"))return;
    S.chargen.splice(+b.dataset.charge,1); save(); render();
  });
}

function freierCode(name){
  const alle=new Set(alleZutaten().map(k=>k.code));
  let b=(name.toUpperCase().replace(/[^A-ZÄÖÜ]/g,"").replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U")+"XX").slice(0,2);
  if(!alle.has(b))return b;
  for(let i=2;i<10;i++){const k=b[0]+i; if(!alle.has(k))return k}
  return b[0]+"9";
}

/* ---- Verkostung der AUFGETAUTEN, selbst gefrorenen Ware ------------------
   Genau die Lücke aus Peters Test: frische Frucht konnte man bewerten,
   die eigene Gefrierware bisher nicht. Sie hängt jetzt an der Verarbeitung. */
let vIdx=-1, vGeruch=0, vGeschmack=0;
function verkostungAuf(i){
  vIdx=i; const v=S.verarb[i]; if(!v)return;
  const k=findeCode(v.code)||{de:v.code};
  $("vtitel").textContent="👅 "+h("verkosten")+" — "+(istLexi()?(k.th||k.de):k.de)+" ("+v.dat+")";
  $("vl_geruch").innerHTML=L("geruch");
  $("vl_geschmack").innerHTML=L("geschmack");
  $("vl_brix").innerHTML=L("brixTk");
  $("vl_bem").innerHTML=L("bem");
  $("v_ok").textContent=h("verkSpeichern");
  const alt=v.verk||{};
  vGeruch=+alt.geruch||0; vGeschmack=+alt.geschmack||0;
  $("v_bx").value=alt.bx||""; $("v_bem").value=alt.bem||"";
  [["v_geruch",vGeruch],["v_geschmack",vGeschmack]].forEach(([id,wert])=>{
    $(id).innerHTML=[1,2,3,4,5].map(x=>`<button data-n="${x}"${x<=wert?' class="on"':''}>${x}</button>`).join("");
  });
  const setz=(id,fn)=>{ $(id).onclick=e=>{const b=e.target.closest("button"); if(!b)return;
    const nn=+b.dataset.n; fn(nn);
    $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=nn)); }};
  setz("v_geruch",x=>vGeruch=x); setz("v_geschmack",x=>vGeschmack=x);
  $("vdlg").style.display="flex";
}
$("v_ab").onclick=()=>{$("vdlg").style.display="none"};
$("v_ok").onclick=()=>{
  if(vIdx<0)return;
  S.verarb[vIdx].verk={geruch:vGeruch||"",geschmack:vGeschmack||"",
    bx:$("v_bx").value,bem:$("v_bem").value.trim(),dat:heute(),who:S.cfg.who||""};
  save(); $("vdlg").style.display="none"; render();
};

/* ---- Wer bedient? Jederzeit umschaltbar, keine Sackgasse mehr ---------- */
const dlg=$("dlg");
function dialogAuf(){
  $("dlgtitel").textContent=TXT.werArbeitet.de+" · "+TXT.werArbeitet.en+" · "+TXT.werArbeitet.th;
  $("enaustxt").textContent=TXT.enAus.de+" · "+TXT.enAus.en;
  $("enaus").checked=EN_AUS;
  document.querySelectorAll(".wahl").forEach(b=>b.classList.toggle("on",b.dataset.u===USER));
  stimmenPruefen();
  $("version").textContent="Version "+VERSION;
  dlg.style.display="flex";
}
$("userbtn").onclick=dialogAuf;
document.querySelectorAll(".wahl").forEach(b=>b.onclick=()=>{
  USER=b.dataset.u; localStorage.setItem("blend_user",USER);
  S.cfg.who=(USER==="lexi"?"Lexi":"Peter"); save();
  document.querySelectorAll(".wahl").forEach(x=>x.classList.toggle("on",x===b));
});
$("enaus").onchange=e=>{EN_AUS=e.target.checked;localStorage.setItem("blend_enaus",EN_AUS?"1":"0")};
$("dlgok").onclick=()=>{ if(!USER){USER="peter";S.cfg.who="Peter";save()} dlg.style.display="none"; render(); };

/* 🔄 holt die neueste Fassung — löscht den Offline-Speicher, NICHT die Daten */
$("frisch").onclick=async()=>{
  try{
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister())); }
  }catch(e){}
  location.replace(location.pathname+"?v="+Date.now());
};

/* Kann das Handy Thai und Deutsch sprechen? */
function stimmenPruefen(){
  const el=$("stimmen");
  if(!window.speechSynthesis){el.className="stimmen no";el.textContent="🔊 —";return}
  const zeig=()=>{
    const v=speechSynthesis.getVoices();
    const th=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("th"));
    const de=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("de"));
    el.className="stimmen "+(th&&de?"ok":"no");
    el.innerHTML=`🔊 ไทย ${th?"✓":"✗"} · Deutsch ${de?"✓":"✗"}`
      +(th&&de?"":"<br>Fehlende Stimme in den Android-Einstellungen (Sprachausgabe) nachladen.");
  };
  zeig(); speechSynthesis.onvoiceschanged=zeig;
}

if(!USER)dialogAuf(); else render();
syncStart();   /* gemeinsamer Speicher, falls eingerichtet */
