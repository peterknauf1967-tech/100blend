<head>

<title>100blend · Stand-OS</title>

<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2dc;
 --accent:#e2543f;--ok:#2f8f5b;--okbg:#f4faf6;--okln:#c4e2d0;--miss:#c0392b;--missbg:#fdf4f3;--missln:#f0cdc8;
 --warn:#b8860b;--nose:#5b6cb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
 padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:11px 16px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.who{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;text-align:right;line-height:1.3}
main{padding:16px;max-width:820px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
 display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--muted);font:700 11px inherit;cursor:pointer;
 padding:7px 2px;border-radius:9px;line-height:1.3}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ink);background:#f1ede8}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:800}
h2:first-child{margin-top:4px}
h2 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;
 display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.row.has{border-color:var(--okln);background:var(--okbg)}
.row.miss{border-color:var(--missln);background:var(--missbg)}
.row.own{border-color:#cdd6ee;background:#f8f9fd}
.code{font:800 12px/1 ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:7px 8px;flex:0 0 auto}
.row.miss .code{background:#f6ddd9;color:var(--miss)}
.row.own .code{background:#e4e9f7;color:#3c4a7d}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:15px}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.pr{font:700 11.5px/1.4 inherit;color:#7a6f5f;margin-top:3px}
.rz{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.rz span{font:700 10px/1 ui-monospace,Menlo,monospace;background:#eceae5;color:#5d5850;padding:3px 5px;border-radius:4px}
.row.miss .rz span{background:#f6ddd9;color:#9b3226}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
 font:16px inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.qty{width:88px;text-align:right;font-weight:700;flex:0 0 auto}
.u{color:var(--muted);font-size:13px;width:30px;flex:0 0 auto}
.f{margin-bottom:11px}
.f2{display:flex;gap:10px}.f2>div{flex:1}
label{display:block;font:700 11.5px/1.4 inherit;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#a09a92}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
button.b{border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:11px 15px;border-radius:10px;font:700 14px inherit;cursor:pointer}
button.b.p{background:var(--ink);color:#fff;border-color:var(--ink)}
button.b.r{background:var(--miss);color:#fff;border-color:var(--miss)}
button.b.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;
 font:700 15px inherit;cursor:pointer;color:var(--muted)}
.stars button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stars.nose button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
 padding:8px 12px;font:600 13.5px inherit;cursor:pointer;line-height:1.25;text-align:left}
.chips button small{display:block;font-size:11px;opacity:.75;font-weight:500}
.chips button.on{background:var(--nose);color:#fff;border-color:var(--nose)}
.chips.bad button.on{background:var(--miss);color:#fff;border-color:var(--miss)}
.tip{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:14px}
.tip.nose{background:#f7f8fd;border-color:#ccd2ec}
.tip.bad{background:var(--missbg);border-color:var(--missln)}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:23px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .miss b{color:var(--miss)} .kpi .ok b{color:var(--ok)}
.such{position:sticky;top:56px;background:var(--bg);padding:6px 0 8px;z-index:5}
.frow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;
 padding:9px 11px;margin-bottom:6px;font:15px inherit;cursor:pointer}
.frow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fgrp{font:800 11px inherit;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.list{max-height:60vh;overflow:auto}
.dead{background:#f7f4f2;border:1px dashed #c9bcb6;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.dead .code{background:#eadfdb;color:#8a3f34;text-decoration:line-through}
.dead .nm b{text-decoration:line-through;color:#7a6a66}
.dead .why{font-size:12.5px;color:#8a3f34;font-weight:600}
.rez{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.rez .kopf{display:flex;align-items:baseline;gap:9px}
.rez .no{font:800 15px ui-monospace,Menlo,monospace;background:#f0ede8;border-radius:6px;padding:5px 8px}
.rez .ampel{margin-left:auto;font:700 12px inherit;padding:4px 9px;border-radius:20px}
.rez .ampel.gr{background:var(--okbg);color:var(--ok);border:1px solid var(--okln)}
.rez .ampel.rt{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
.rez .ampel.ge{background:#fffaf0;color:var(--warn);border:1px solid #ecdfae}
.rez .zut{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.rez .zut span{font:600 11.5px inherit;padding:4px 8px;border-radius:6px;background:var(--okbg);color:#2c6b4a;border:1px solid var(--okln)}
.rez .zut span.f{background:var(--missbg);color:var(--miss);border-color:var(--missln)}
.rez .zut span.g{background:#fffaf0;color:#8a6d1f;border-color:#ecdfae}
.del{border:none;background:none;color:var(--miss);font:700 18px/1 inherit;cursor:pointer;padding:4px 6px;flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:36px 20px;font-size:15px}
textarea#out{height:210px;font:12px/1.5 ui-monospace,Menlo,monospace;margin-top:12px}
.mini{font-size:12.5px;color:var(--muted)}
.user{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;
 font:700 12px inherit;cursor:pointer;margin-left:auto;white-space:nowrap}
label i.en{display:block;font-style:normal;font-weight:600;font-size:11.5px;color:#a09a92;
 text-transform:none;letter-spacing:0}
.en{color:#a09a92;font-weight:600;font-size:12px}
.nm .haupt{display:block;font-weight:600;font-size:15px;line-height:1.25}
.nm .zweit{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nm .dritt{display:block;font-size:12.5px;color:var(--nose);font-weight:600}
.nm .dritt i.laut{font-style:italic;color:#8a7a55;font-weight:600;margin-left:5px}
.hoer{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;
 font-size:15px;cursor:pointer;flex:0 0 auto}
.hoer:active{background:#f0ede8}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
 display:flex;align-items:center;justify-content:center;padding:16px}
.ovl>.dlg{background:#fff;border-radius:14px;max-width:340px;width:100%;
 max-height:88vh;overflow:auto;padding:16px}
.dlg{padding:16px}
.dlg h3{margin:0 0 12px;font-size:15.5px;line-height:1.4}
.wahl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
 border-radius:10px;padding:11px 13px;margin-bottom:8px;font:15px inherit;cursor:pointer}
.wahl.on{border-color:var(--ink);background:#f1ede8;font-weight:700}
.wahl small{display:block;color:var(--muted);font-size:12px}
.schalter{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin-top:10px}
.stimmen{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:10px}
.stimmen.ok{background:var(--okbg);color:#22694a;border:1px solid var(--okln)}
.stimmen.no{background:var(--missbg);color:var(--miss);border:1px solid var(--missln)}
details.tipp{background:#fffdf5;border:1px solid #ecdfae;border-radius:10px;margin-bottom:13px;overflow:hidden}
details.tipp summary{padding:10px 12px;cursor:pointer;font:700 13.5px inherit;list-style:none}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp .inhalt{padding:0 12px 11px;font-size:13.5px;line-height:1.55}
details.tipp .inhalt .en{display:block;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">100<span>blend</span> · Stand-OS</div>
    <button class="user" id="userbtn">👤</button>
  </div>
</header>
<main id="view"></main>
<div id="vdlg" class="ovl" style="display:none"><div class="dlg">
  <h3 id="vtitel"></h3>
  <div class="f"><label id="vl_geruch"></label>
    <div class="stars nose" id="v_geruch">1 2 3 4 5</div></div>
  <div class="f"><label id="vl_geschmack"></label>
    <div class="stars" id="v_geschmack">1 2 3 4 5</div></div>

    <input type="number" inputmode="decimal" step="0.1" id="v_bx" placeholder="12.5"></div>

  <div class="bar"><button class="b p" id="v_ok" style="flex:1"></button>
    <button class="b" id="v_ab">✕</button></div>
</div></div>

<div id="dlg" class="ovl" style="display:none"><div class="dlg">
  <h3 id="dlgtitel"></h3>
  <button class="wahl" data-u="peter">🇩🇪 Peter<small>Deutsch + English</small></button>
  <button class="wahl" data-u="lexi">🇹🇭 Lexi<small>ไทย + English</small></button>
  <label class="schalter"><input type="checkbox" id="enaus"> <span id="enaustxt"></span></label>
  <div class="stimmen" id="stimmen"></div>
  <div class="mini" id="version" style="margin-top:10px;text-align:center"></div>
  <div class="bar"><button class="b p" id="dlgok" style="flex:1">OK</button>
    <button class="b" id="frisch" title="Neu laden">🔄</button></div>
</div></div>
<nav>
  <button data-v="start" class="on"><b>🏠</b><span id="nv_start"></span></button>
  <button data-v="einkauf"><b>🛒</b><span id="nv_einkauf"></span></button>
  <button data-v="ruesten"><b>🧊</b><span id="nv_ruesten"></span></button>
  <button data-v="bestand"><b>📦</b><span id="nv_bestand"></span></button>
  <button data-v="vorschlag"><b>🛒</b><span id="nv_vorschlag"></span></button>
  <button data-v="rezepte"><b>📖</b><span id="nv_rezepte"></span></button>
</nav>

window.onerror=function(msg,src,zeile,spalte,err){

    box.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fdf4f3;"
      +"border-top:2px solid #c0392b;color:#7a2018;padding:12px 14px;font:12px/1.5 monospace;max-height:45vh;overflow:auto";

      +"<br><br><button onclick=\"location.replace(location.pathname+'?v='+Date.now())\" "
      +"style=\"padding:8px 12px;font:700 13px sans-serif;border-radius:8px;border:1px solid #c0392b;background:#fff\">"
      +"🔄 Neu laden</button>";
    document.body.appendChild(box);
  }catch(e){}
  function spalta(c){return c===undefined?"?":c}
  return false;
};

/* 🔊 spricht ein Wort in der jeweiligen Sprache */
function sprich(text,lang){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.slice(0,2)));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* Zutatenname mehrsprachig: Muttersprache · Englisch · Fremdsprache + Lautschrift + 🔊 */
function zname(k,klein){
  const fremd = istLexi() ? {txt:k.de,laut:k.deLaut,lang:"de-DE",flag:"🇩🇪"}
                          : {txt:k.th,laut:k.laut, lang:"th-TH",flag:"🇹🇭"};
  const haupt = istLexi() ? (k.th||k.de) : k.de;
  return `<span class="haupt">${esc(haupt)}</span>
    ${EN_AUS||!k.en?"":`<span class="zweit">${esc(k.en)}</span>`}
    ${fremd.txt?`<span class="dritt">${fremd.flag} ${esc(fremd.txt)}
      ${fremd.laut?`<i class="laut">${esc(fremd.laut)}</i>`:""}</span>`:""}`;
}
function hoerBtn(k){
  const t = istLexi() ? k.de : k.th;
  const lang = istLexi() ? "de-DE" : "th-TH";
  return t?`<button class="hoer" data-say="${esc(t)}" data-lang="${lang}">🔊</button>`:"";
}
const heute=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MAERKTE=["Ratanakorn","Theprasit","GO Wholesale","Makro","Villa Market","Central","Doi Kham","anderer"];

/* Sucht über ALLE Felder und alle Sprachen. Mehrere Wörter = alle müssen passen.
   „erd" findet Erdbeere, „straw" findet Strawberry, „สตรอ" findet สตรอว์เบอร์รี,
   „ER" findet den Code, „tk" findet die TK-Gruppe. */
function passt(k,q){
  const heu=[k.code,k.de,k.th,k.en,k.gruppe,k.sorten,k.preistext,k.laut,k.deLaut]
    .filter(Boolean).join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(w=>{
    /* GROSS geschriebene 2-3 Buchstaben = Code-Suche ("ER" soll nicht in "Beere" treffen) */
    if(/^[A-Z]{2,3}[0-9]?$/.test(w))return k.code===w;
    return heu.includes(w.toLowerCase());
  });
}

/* Katalog + eigene Zutaten in einer Liste */
const alleZutaten=()=>KATALOG.concat(S.eigen);
const findeCode=c=>alleZutaten().find(k=>k.code===c);
const bestandVon=c=>+(S.bestand[c]||0);          // Rohware
const tkVon=c=>+(S.tk[c]||0);                     // verarbeitet, verkaufsfähig
const daIst=c=>tkVon(c)>0||bestandVon(c)>0;       // überhaupt vorhanden
const verkaufsfaehig=c=>{ const kk=findeCode(c); return tkVon(c)>0 || (schonFertig(kk)&&bestandVon(c)>0); };

/* Selbst hergestellte Fluessigkeiten: nur den Rohstoff im Bestand fuehren.
   Die App rechnet, fuer wie viele Liter er reicht.
   ⚠ Startannahmen — beim ersten Ansatz nachwiegen und hier korrigieren. */
const SELBST={
  HM:{aus:"HF", proLiter:100, name:"Hafermilch"},   /* 100 g Haferflocken -> 1 L */
  MM:{aus:"MA", proLiter:150, name:"Mandelmilch"},
  SM:{aus:"SJ", proLiter:120, name:"Sojamilch"}
};
const literAus=code=>{ const s2=SELBST[code]; if(!s2)return null;
  const roh=+(S.bestand[s2.aus]||0); return roh?Math.round(roh/s2.proLiter*10)/10:0; };

/* Gekaufte TK-Ware und Pürees sind fertig — sie brauchen keine Verarbeitung.
   Frische Marktware dagegen muss erst geschnitten und gefrostet werden. */
function schonFertig(k){
  if(!k)return false;
  if((k.gruppe||"").indexOf("B · Früchte TK")===0)return true;
  if((" "+(k.de||"")+" ").indexOf(" TK ")>=0)return true;
  if(/P.?ree|puree|frozen|IQF/i.test(k.de||""))return true;
  return ["D · Milch","E · Tee","G · Aroma","H · Supplements","C · Rohstoffe","I · Verpackung","F · Grün"]
    .some(x=>(k.gruppe||"").indexOf(x)===0);
}

const reiftVon=c=>+(S.reift&&S.reift[c]&&S.reift[c].menge||0);
const reiftSeit=c=>(S.reift&&S.reift[c]&&S.reift[c].seit)||"";
const tageSeit=d=>{ if(!d)return 0;
  const a=new Date(d+"T00:00:00"), b=new Date(heute()+"T00:00:00");
  return Math.round((b-a)/86400000); };

/* Wie viel von einer Zutat steckt in EINEM Smoothie? Mittel über alle Rezepte, die sie brauchen. */
/* Nur noch fuer Zutaten, die WIRKLICH stueckweise gehandelt werden.
   Alle Rezepte sind seit 15.08. in Gramm — Blaetter zaehlen war eine Fehlerquelle
   (Peter: 3 kleine vs. 3 grosse Blaetter = spuerbarer Geschmacksunterschied). */
const STUECK_GRAMM={KN:350, SA:1};
function proSmoothie(code){
  const m=[];
  REZEPTE.forEach(r=>(r.zut||[]).forEach(z=>{
    if(z[0]!==code)return;
    if(typeof z[1]==="number"){ m.push(z[1]); return; }
    /* "4 Blätter", "1 Prise", "½ Limette" — mit Erfahrungswert in Gramm umrechnen */
    const zahl=parseFloat(String(z[1]).replace(",","."))||1;
    if(STUECK_GRAMM[code])m.push(zahl*STUECK_GRAMM[code]);
  }));
  if(!m.length)return 0;
  return Math.round(m.reduce((a,b)=>a+b,0)/m.length*10)/10;
}
/* Reichweite in Smoothies — zählt NUR verkaufsfähige (verarbeitete) Ware,
   bei Flüssigkeiten und Trockenware den normalen Bestand. */
function reichweite(k){
  const g=proSmoothie(k.code); if(!g)return null;
  const da=schonFertig(k) ? bestandVon(k.code)+tkVon(k.code) : tkVon(k.code);
  return Math.floor(da/g);
}

/* Gemessene Ausbeute aus den eigenen Verarbeitungen — schlägt die Katalog-Schätzung */
function ausbeuteReal(code){
  const v=S.verarb.filter(x=>x.code===code&&+x.roh>0&&+x.fertig>0);
  if(!v.length)return null;
  const roh=v.reduce((a,x)=>a+ +x.roh,0), fertig=v.reduce((a,x)=>a+ +x.fertig,0);
  return {proz:Math.round(fertig/roh*1000)/10, n:v.length};
}

/* Welche Rezepte brauchen diese Zutat? ("*" = alle) */
const brauchtRezepte=k=>k.rezepte||[];
/* Zutat gilt als Defizit, wenn ein Rezept sie braucht und nichts da ist */
const fehlt=k=>brauchtRezepte(k).length>0 && !daIst(k.code);

/* Preis-Historie aus den eigenen Chargen: letzter tatsächlich bezahlter ฿/Einheit */
function letzterPreis(code){
  const c=S.chargen.filter(x=>x.code===code&&x.pr).slice(-1)[0];
  return c?+c.pr:null;
}
function preisText(k){
  const eigen=letzterPreis(k.code);
  const ref=k.pmin!=null?(k.pmin===k.pmax?`${k.pmin}`:`${k.pmin}–${k.pmax}`):null;
  if(eigen!=null)return `zuletzt <b>${eigen} ฿</b>${ref?` · Referenz ${ref}`:""}`;
  if(ref)return `Referenz ${ref} ฿`;
  return k.preistext?esc(k.preistext.replace(/<[^>]*>/g,"")):`<span style="color:var(--warn)">⚠ Preis offen</span>`;
}

let bFilter="miss", bLimit=30, bSuche="";
function vBestand(){
  const zut=alleZutaten();
  const grp={};
  zut.forEach(k=>{(grp[k.gruppe]=grp[k.gruppe]||[]).push(k)});
  let html=`<div class="such" style="top:52px">
      <input id="b_such" placeholder="${h("suchePl")}" value="${esc(bSuche)}" autocomplete="off">
    </div>
    <div class="bar" style="margin:0 0 12px">
      <button class="b ${bFilter==="all"?"p":""}" data-bf="all">${h("alle")}</button>
      <button class="b ${bFilter==="miss"?"p":""}" data-bf="miss">${h("nurFehlt")}</button>
      <button class="b ${bFilter==="have"?"p":""}" data-bf="have">${h("nurDa")}</button>
      <button class="b" id="neuzutat">➕ ${h("neueZutat")}</button></div>
    <div id="neuform"></div>`;
  let gezeigt=0, uebrig=0;
  Object.entries(grp).forEach(([g,items])=>{
    const gefiltert=items.filter(k=>{
      if(bSuche)return passt(k,bSuche);              /* Suche ignoriert den Filter */

    });
    const rows=gefiltert.map(k=>{
      if(gezeigt>=bLimit){uebrig++;return ""}
      gezeigt++;
      const v=S.bestand[k.code]||"", da=+v>0, f=fehlt(k), own=S.eigen.includes(k);
      return `<div class="row ${da?"has":(f?"miss":"")} ${own?"own":""}">
        <span class="code">${k.code}</span>

          ${brauchtRezepte(k).length?`<span class="rz">${brauchtRezepte(k).map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}

  if(bSuche&&!gezeigt)html+=`<div class="empty">${h("nixGefunden")}<br><b>„${esc(bSuche)}"</b></div>`;
  if(uebrig)html+=`<div class="bar"><button class="b" id="mehr" style="flex:1">⌄ ${uebrig} ${h("weitere")}</button></div>`;

/* ---- 🛒 EINKAUFSVORSCHLAG — was zuerst? --------------------------------
   Dringlichkeit = wie viele Smoothies die Zutat noch hergibt, gewichtet damit,
   in wie vielen Rezepten sie steckt. Was nur noch für 1-2 Becher reicht,
   steht oben — auch wenn rechnerisch noch etwas da ist. */
/* Was nie auf eine Einkaufsliste gehört */
const NICHT_KAUFEN=["WA","SA","PP"];

function vorschlag(){
  const liste=[];
  alleZutaten().forEach(k=>{
    if(NICHT_KAUFEN.indexOf(k.code)>=0)return;
    const inRez=(k.rezepte||[]).length; if(!inRez&&!SELBST[k.code])return;
    const g=proSmoothie(k.code);
    const roh=bestandVon(k.code), tk=tkVon(k.code), reift=reiftVon(k.code);
    const frisch=!schonFertig(k);
    let stufe, grund;

    /* WICHTIG: Rohware im Haus ist KEIN Einkaufsgrund, sondern ein Verarbeitungs-Auftrag. */
    if(frisch && roh>0 && tk<=0){
      liste.push({k,stufe:0,rw:null,grund:`${roh} ${k.einheit||"g"} ${h("rohUngeruestet")}`,reift,g});
      return;
    }
    const rw=reichweite(k);
    if(rw===null){ if(roh||tk||reift)return; stufe=2; grund=h("keineMenge"); }
    else if(rw<=0){ stufe=1; grund=`0 ${h("smoothies")}`; }
    else if(rw<=2){ stufe=1; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else if(rw<=5){ stufe=2; grund=`${h("reicht")} ${rw} ${h("smoothies")}`; }
    else return;                          /* genug da */
    if(reift&&stufe===1)stufe=2;          /* Nachschub reift schon */
    liste.push({k,stufe,rw,grund,reift,g});
  });
  liste.sort((a,b)=>a.stufe-b.stufe || (a.rw==null?99:a.rw)-(b.rw==null?99:b.rw)
    || (b.k.rezepte||[]).length-(a.k.rezepte||[]).length);
  return liste;
}

function vVorschlag(){
  const L2=vorschlag();
  const ruesten=L2.filter(x=>x.stufe===0), dring=L2.filter(x=>x.stufe===1), bald=L2.filter(x=>x.stufe===2);
  const zeile=x=>{
    const k=x.k, pr=k.pmin!=null?`${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:h("keinPreis");
    return `<div class="row ${x.stufe===1?"miss":""}">
      <span class="code">${k.code}</span>
      <span class="nm">${zname(k)}
        <span class="pr">${esc(x.grund)}${x.g?` · ${x.g} g/${h("smoothies")}`:""} · ${pr}
          ${x.reift?` · 🌤 ${x.reift} ${k.einheit||"g"} ${h("reiftNoch")}`:""}</span>
        ${(k.rezepte||[]).length?`<span class="rz">${k.rezepte.map(r=>`<span>${r==="*"?"alle":r}</span>`).join("")}</span>`:""}</span>
      ${hoerBtn(k)}</div>`;
  };
  return `<div class="tip">${L1("vorschlagHint")}</div>
    ${ruesten.length?`<h2>🧊 ${L1("zuRuestenTitel")} <em>· ${ruesten.length}</em></h2>
      <div class="mini" style="margin:-4px 0 8px">${h("zuRuestenHint")}</div>
      ${ruesten.map(zeile).join("")}`:""}
    ${dring.length?`<h2>🔴 ${L1("jetzt")} <em>· ${dring.length}</em></h2>${dring.map(zeile).join("")}`:""}
    ${bald.length?`<h2>🟡 ${L1("bald")} <em>· ${bald.length}</em></h2>${bald.map(zeile).join("")}`:""}
    ${!L2.length?`<div class="empty">✅ ${h("allesDa")}</div>`:""}
    ${(()=>{  /* selbst hergestellte Flüssigkeiten: reicht der Rohstoff? */
      const rows=Object.keys(SELBST).map(c=>{
        const sp=SELBST[c], k=findeCode(c), roh=findeCode(sp.aus);
        const l=literAus(c);
        if(l===null)return "";
        return `<div class="row ${l<1?"miss":""}"><span class="code">${sp.aus}</span>
          <span class="nm"><b>${esc(sp.name)}</b>
            <span class="pr">${roh?esc(roh.de):sp.aus}: <b>${bestandVon(sp.aus)} g</b> →
              ${h("reicht")} <b>${l} ${h("liter")}</b> <span style="opacity:.7">(${sp.proLiter} g/L)</span></span></span></div>`;
      }).filter(Boolean).join("");
      return rows?`<h2>🥛 ${L1("selbstHerstellen")}</h2>${rows}`:"";
    })()}
    <div class="bar"><button class="b p" id="ekliste" style="flex:1">🛒 ${h("ekliste")}</button></div>
    <textarea id="out" style="display:none" readonly></textarea>`;

/* ---- 📖 REZEPTE --------------------------------------------------------- */
function vRezepte(){
  const mit=REZEPTE.filter(r=>r.zut&&r.zut.length), ohne=REZEPTE.filter(r=>!r.zut||!r.zut.length);
  const karte=r=>{
    const fehlen=r.zut.filter(z=>!daIst(z[0]));
    const ruesten=r.zut.filter(z=>daIst(z[0])&&!verkaufsfaehig(z[0]));
    const status=fehlen.length?["rt",`${fehlen.length} ${h("fehltBtn")}`]
                : ruesten.length?["ge",`${ruesten.length}${h("erstRuesten")}`]
                : ["gr",h("mixbarBtn")];
    return `<div class="rez">
      <div class="kopf"><span class="no">${r.n}</span><b>${esc(istLexi()?(r.th||r.de):r.de)}</b>
        <span class="ampel ${status[0]}">${status[1]}</span></div>
      <div class="mini">${esc(r.en||"")}${istLexi()?"":` · ${esc(r.th||"")}`}</div>
      <div class="zut">${r.zut.map(z=>{
        const cls=!daIst(z[0])?"f":(verkaufsfaehig(z[0])?"":"g");
        const kk=findeCode(z[0]);
        const nam=kk?(istLexi()?(kk.th||kk.de):kk.de):z[2];
        const zw=kk&&!EN_AUS?(istLexi()?kk.en:(kk.th||kk.en)):"";
        return `<span class="${cls}">${z[0]} ${esc(nam)}${zw?` <i style="font-style:normal;opacity:.75">${esc(zw)}</i>`:""}${typeof z[1]==="number"?` ${z[1]} g`:` ${esc(z[1])}`}</span>`;
      }).join("")}</div></div>`;
  };
  return `<div class="tip">${L1("rezLegende")}</div>
    <h2>${L1("ausgearbeitet")} <em>· ${mit.length}</em></h2>${mit.map(karte).join("")}
    ${ohne.length?`<h2>${L1("ohneGramm")} <em>· ${ohne.length}</em></h2>${ohne.map(r=>`<div class="rez">
      <div class="kopf"><span class="no">${r.n}</span><b>${esc(istLexi()?(r.th||r.de):r.de)}</b>
      <span class="ampel rt">${h("rezFehlt")}</span></div></div>`).join("")}`:""}`;
}

  $("view").innerHTML={start:vStart,bestand:vBestand,einkauf:vEinkauf,ruesten:vRuesten,vorschlag:vVorschlag,rezepte:vRezepte}[V]();
  binde();
}

function einkaufsliste(){
  const z=alleZutaten().filter(fehlt);
  let t="EINKAUFSLISTE 100blend — "+heute()+"\n\n";
  const grp={}; z.forEach(k=>{(grp[k.gruppe]=grp[k.gruppe]||[]).push(k)});
  Object.entries(grp).forEach(([g,items])=>{
    t+=g+"\n"+items.map(k=>{
      const ref=k.pmin!=null?` — ${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:"";
      return `  [ ] ${k.code}  ${k.de} (${k.th||""})${ref}   für Rezept ${brauchtRezepte(k).join("/")}`;
    }).join("\n")+"\n\n";
  });
  t+="NICHT KAUFEN (durchgefallen 13.08.):\n"+ENTSORGT.map(x=>`  ✗ ${x[1]} — ${x[2]} (Note ${x[5]}/5)`).join("\n");
  return t;
}

function csvText(){
  let t="﻿Typ;Datum;Wer;Code;Zutat;Thai;Gruppe;Sorte;Menge;Einheit;bezahlt_THB;THB_pro_Einheit;Brix;Duft;Duftnoten;Fehlnoten;Note;Markt;Bemerkung\n";
  alleZutaten().forEach(k=>{ if(S.bestand[k.code])
    t+=["Bestand",heute(),S.cfg.who||"",k.code,k.de,k.th||"",k.gruppe,"",S.bestand[k.code],k.einheit||"g","","","","","","","","",""].join(";")+"\n"; });
  alleZutaten().forEach(k=>{ if(S.tk[k.code])
    t+=["Verarbeitet",heute(),S.cfg.who||"",k.code,k.de,k.th||"",k.gruppe,"",S.tk[k.code],"g","","","","","","","","",""].join(";")+"\n"; });
  S.verarb.forEach(v=>{ const k=findeCode(v.code)||{de:v.code,th:"",gruppe:""};
    t+=["Verarbeitung",v.dat,v.who||"",v.code,k.de,k.th||"",k.gruppe,"",v.roh+" roh -> "+v.fertig+" fertig","g","",v.kosten||"","","","","",v.proz+"% Ausbeute","",(v.bem||"").replace(/;/g,",")].join(";")+"\n"; });
  S.chargen.forEach(c=>{ const k=findeCode(c.code)||{de:c.code,th:"",gruppe:"",einheit:""};
    t+=["Charge",c.dat,c.who||"",c.code,k.de,k.th||"",k.gruppe,c.sorte||"",c.kg||"",k.einheit||"",c.ges||"",c.pr||"",
        c.bx||"",c.duft||"",(c.des||[]).join("/"),(c.feh||[]).join("/"),c.note||"",c.markt||"",(c.bem||"").replace(/;/g,",")].join(";")+"\n"; });
  return t;
}

async function senden(){
  const wer=(S.cfg.who||"unbekannt").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const txt=csvText(), name=`100blend_standos_${heute()}_${wer}.csv`;
  try{
    const file=new File([txt],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"100blend Stand-OS",text:`Bestand + ${S.chargen.length} Chargen`}); return;
    }
  }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a"), url=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function binde(){
  /* --- Import: CSV-Export ODER einfache Zeilen "CODE MENGE" ---------------
     Damit lassen sich Mengen von aussen einspielen, ohne 95 Felder abzutippen.
     Erkennt beide Formate automatisch und meldet, was NICHT zugeordnet wurde. */
  const ib=$("importb");
  if(ib)ib.onclick=()=>{
    const box=$("importbox");
    if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div class="card">
      <div class="mini" style="margin-bottom:8px">${h("importHint")}</div>
      <textarea id="i_text" style="height:150px;font:12px/1.5 ui-monospace,Menlo,monospace"></textarea>
      <div class="bar" style="margin:8px 0 0">
        <button class="b p" id="i_ok" style="flex:1">${h("importOk")}</button></div>
      <div class="mini" id="i_log" style="margin-top:8px"></div></div>`;
    $("i_ok").onclick=()=>{
      const txt=$("i_text").value||"";
      let ok=0, unbekannt=[];
      txt.split(/\r?\n/).forEach(zeile=>{
        if(!zeile.trim())return;
        let code="", menge="";
        if(zeile.indexOf(";")>=0){                    /* CSV aus dem Export */
          const sp=zeile.split(";");
          if(!/^(Bestand|Verarbeitet)$/i.test((sp[0]||"").trim()))return;
          code=(sp[3]||"").trim(); menge=(sp[8]||"").trim();
          if(/^Verarbeitet$/i.test(sp[0].trim())){
            if(findeCode(code)&&+menge>0){S.tk[code]=+menge; ok++;}
            return;
          }
        }else{                                        /* einfache Zeile: CODE MENGE */
          const m=zeile.trim().match(/^([A-Za-z]{2,3}[0-9]?)[\s:=,]+([0-9.,]+)/);
          if(!m)return;
          code=m[1].toUpperCase(); menge=m[2].replace(",",".");
        }
        if(findeCode(code)&&+menge>0){ S.bestand[code]=+menge; ok++; }
        else if(code) unbekannt.push(code+" "+menge);
      });
      save();
      $("i_log").innerHTML = ok
        ? `✅ <b>${ok}</b> ${h("importErgebnis")}`+(unbekannt.length?`<br>⚠ unbekannt: ${esc(unbekannt.join(", "))}`:"")
        : `⚠ ${h("importNichts")}`;
      if(ok){ setTimeout(()=>render(),900); }
    };
  };

  document.querySelectorAll(".hoer").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); sprich(b.dataset.say,b.dataset.lang);
  });
  /* Bestand: Mengen + Filter + eigene Zutat */
  document.querySelectorAll("input.qty").forEach(i=>i.oninput=()=>{
    if(i.value==="")delete S.bestand[i.dataset.c]; else S.bestand[i.dataset.c]=i.value;
    save();
    const r=i.closest(".row"); r.classList.toggle("has",+i.value>0);
    if(+i.value>0)r.classList.remove("miss");
  });
  document.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{bFilter=b.dataset.bf;bLimit=30;render()});
  const mehr=$("mehr"); if(mehr)mehr.onclick=()=>{bLimit+=40;render()};
  const bs=$("b_such");
  if(bs){
    bs.oninput=()=>{
      bSuche=bs.value.trim(); bLimit=bSuche?200:30;
      const pos=bs.selectionStart; render();
      const neu=$("b_such"); if(neu){neu.focus(); try{neu.setSelectionRange(pos,pos)}catch(e){}}
    };
  }
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const k=findeCode(b.dataset.del);
    if(!confirm(`„${k.de}" entfernen?`))return;
    S.eigen=S.eigen.filter(x=>x.code!==b.dataset.del); delete S.bestand[b.dataset.del]; save(); render();
  });
  const nz=$("neuzutat"); if(nz)nz.onclick=()=>{
    const f=$("neuform");
    if(f.innerHTML){f.innerHTML="";return}
    f.innerHTML=`<div class="card">
      <div class="f"><label>${L("wasIstEs")}</label><input id="n_de" placeholder="z. B. Sesamöl"></div>
      <div class="f"><label>ไทย / Thai</label><input id="n_th"></div>
      <div class="f2"><div class="f"><label>${L("gruppe")}</label><select id="n_g">
        ${[...new Set(KATALOG.map(k=>k.gruppe))].map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
        <div class="f"><label>${L("einheit")}</label><select id="n_u"><option>g</option><option>ml</option><option>Stk</option><option>Pack</option><option>kg</option></select></div></div>
      <div class="f2"><div class="f"><label>${L("menge")}</label><input type="number" step="any" id="n_m"></div>
        <div class="f"><label>Code</label><input id="n_c" maxlength="3" style="text-transform:uppercase"></div></div>
      <div class="bar" style="margin:6px 0 0"><button class="b p" id="n_ok" style="flex:1">${h("uebernehmen")}</button></div></div>`;
    $("n_de").oninput=()=>{ if(!$("n_c").value)$("n_c").value=freierCode($("n_de").value) };
    $("n_ok").onclick=()=>{
      const de=$("n_de").value.trim(); if(!de){alert(h("wasIstEs"));return}
      const code=($("n_c").value.trim()||freierCode(de)).toUpperCase();
      S.eigen.push({code,de,th:$("n_th").value.trim(),gruppe:$("n_g").value,einheit:$("n_u").value,
                    rezepte:[],pmin:null,pmax:null,preistext:"selbst angelegt",eigen:true});
      const m=$("n_m").value.trim(); if(m)S.bestand[code]=m;
      save(); render();
    };
  };

  /* Start */
  const ek=$("ekliste"); if(ek)ek.onclick=()=>{ $("out").value=einkaufsliste(); $("out").style.display="block"; $("out").select(); };
  const zt=$("zeigetot"); if(zt)zt.onclick=()=>{
    const b=$("totbox");
    b.innerHTML=b.innerHTML?"":ENTSORGT.map(t=>`<div class="dead"><span class="code">${t[0]}</span>
      <span class="nm"><b>${esc(t[1])}</b><i>${esc(t[2])}</i>
      <span class="why">Note ${t[5]}/5 · ${t[4]} °Bx — ${esc(t[6])}</span></span></div>`).join("");
  };
  const cb=$("csvb"); if(cb)cb.onclick=()=>{ $("out").value=csvText().replace(/^﻿/,""); $("out").style.display="block"; $("out").select(); };
  const sd=$("senden"); if(sd)sd.onclick=senden;

  /* Einkauf */
  const such=$("e_such");
  if(such){
    const zeigen=()=>{
      const q=such.value.trim().toLowerCase();
      const L=$("e_liste");
      if(!q){L.style.display="none";return}
      const tr=alleZutaten().filter(k=>[k.de,k.th,k.en,k.code].join(" ").toLowerCase().includes(q)).slice(0,40);
      L.innerHTML=tr.length?tr.map(k=>`<button class="frow" data-c="${k.code}"><b>${esc(istLexi()?(k.th||k.de):k.de)}</b> · ${esc(k.en||"")} · ${esc(istLexi()?k.de:(k.th||""))}
        <small>${esc(k.gruppe)}${k.pmin!=null?` · ${k.pmin===k.pmax?k.pmin:k.pmin+"–"+k.pmax} ฿`:""}</small></button>`).join("")
        :`<div class="fgrp">nichts gefunden</div>`;
      L.style.display="block";
      L.querySelectorAll(".frow").forEach(b=>b.onclick=()=>{
        eCode=b.dataset.c; localStorage.setItem("blend_os_code",eCode); eSuche=""; render();
      });
    };
    such.oninput=zeigen; such.onfocus=zeigen;

    const sumZeigen=()=>{
      const kg=parseFloat($("e_kg").value), ges=parseFloat($("e_ges").value), k=findeCode(eCode);
      const el=$("e_sum"); if(!el)return;
      if(!(kg>0)||!(ges>0)){el.innerHTML="";return}
      const pr=Math.round(ges/kg*10)/10, eh=k.einheit==="Stk"?"Stück":"kg";
      let s=`🧾 ${ges} ฿ ÷ ${kg} ${eh} = <b>${pr} ฿/${eh}</b>`;
      const a=$("e_verarb").checked?100:k.ausbeute;
      if(a&&a<100&&k.einheit!=="Stk")s+=`<br>🥤 ${h("ausbeuteTxt")} ~${a} % → <b>${Math.round(pr/a*100)} ${h("fruchtfleisch")}</b>`;
      if(k.pmax!=null){ if(pr>k.pmax*1.15)s+=`<br><b style="color:var(--miss)">⚠ ${h("ueberRef")} ${k.pmin}–${k.pmax} ฿</b>`;
        else if(pr<=k.pmin)s+=`<br><b style="color:var(--ok)">✓ ${h("unterRef")}</b>`; }
      el.innerHTML=s;
    };
    $("e_kg").oninput=sumZeigen; $("e_ges").oninput=sumZeigen; $("e_verarb").onchange=sumZeigen;

    const sterne=(id,set)=>{const el=$(id); el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const n=+b.dataset.n; set(n); el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=n))}};
    sterne("e_duft",n=>eDuft=n); sterne("e_note",n=>eNote=n);
    const toggle=(id,arr)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const i=arr.indexOf(b.dataset.k); if(i<0)arr.push(b.dataset.k); else arr.splice(i,1); b.classList.toggle("on",i<0)}};
    toggle("e_des",eDes); toggle("e_feh",eFeh);
    $("e_markt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      S.cfg.markt=(S.cfg.markt===b.dataset.m)?"":b.dataset.m; save();
      $("e_markt").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.m===S.cfg.markt));
      $("who").innerHTML=(S.cfg.who?esc(S.cfg.who):"—")+(S.cfg.markt?`<br>${esc(S.cfg.markt)}`:"");};

    $("e_ok").onclick=()=>{
      const kg=$("e_kg").value, ges=$("e_ges").value;
      const pr=(+kg>0&&+ges>0)?Math.round(+ges/+kg*10)/10:"";
      const c={dat:heute(),who:S.cfg.who||"",code:eCode,sorte:$("e_sorte").value.trim(),
        kg,ges,pr,verarb:$("e_verarb").checked?1:"",bx:$("e_bx").value,
        duft:eDuft||"",des:eDes.slice(),feh:eFeh.slice(),note:eNote||"",
        markt:S.cfg.markt,bem:$("e_bem").value.trim()};
      if(!c.ges&&!c.bx&&!c.duft&&!c.sorte){alert(h("mind"));return}
      S.chargen.push(c);
      if($("e_bestand").checked&&+kg>0){
        const k=findeCode(eCode);
        const dazu=k.einheit==="Stk"?+kg:(k.einheit==="ml"?+kg*1000:+kg*1000); // kg/l -> g/ml
        S.bestand[eCode]=Math.round((+(S.bestand[eCode]||0))+dazu);
      }
      save(); eDuft=0;eNote=0;eDes=[];eFeh=[];
      render();
    };
  }
  /* Verarbeiten */
  const rc=$("r_code");
  if(rc){
    rc.onchange=()=>{rCode=rc.value;render()};
    const rechnung=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      const el=$("r_rechnung"); if(!el)return;
      if(!(roh>0)||!(fertig>0)){el.innerHTML="";return}
      const rohG=stk?roh:roh*1000, fertigG=fertig*1000;
      const proz=Math.round(fertigG/rohG*1000)/10;
      let s=`📊 ${h("ausbeuteTxt")} <b>${stk?Math.round(fertigG/roh)+" g/Stk":proz+" %"}</b>`
        +(stk?"":` · 🗑 ${h("abfall")} <b>${Math.round((100-proz)*10)/10} %</b>`);
      /* echter Preis der Verkaufsware: was die Rohware kostete, geteilt durch das, was übrig blieb */
      const pr=letzterPreis(k.code);
      if(pr){
        const kosten=Math.round(pr*roh/fertig*10)/10;
        s+=`<br>💰 ${pr} ฿/${stk?"Stk":"kg"} → <b>${kosten} ฿ ${h("verkaufsware")}</b>`;
        if(!stk&&pr)s+=` <span style="opacity:.7">(+${Math.round((kosten/pr-1)*100)} % ${h("durchVerschnitt")})</span>`;
      }
      const rohDa=bestandVon(k.code);
      if(rohG>rohDa)s+=`<br><b style="color:var(--warn)">⚠ ${h("zuVielRoh")} (${rohDa} ${k.einheit||"g"})</b>`;
      if(fertigG>rohG)s+=`<br><b style="color:var(--miss)">⚠ ${h("dreher")}</b>`;
      el.innerHTML=s;
    };
    $("r_roh").oninput=rechnung; $("r_fertig").oninput=rechnung;
    $("r_ok").onclick=()=>{
      const k=findeCode(rCode), stk=(k.einheit==="Stk");
      const roh=parseFloat($("r_roh").value), fertig=parseFloat($("r_fertig").value);
      if(!(roh>0)||!(fertig>0)){alert(h("rohFertig"));return}
      const rohG=Math.round(stk?roh:roh*1000), fertigG=Math.round(fertig*1000);
      const pr=letzterPreis(k.code);
      S.verarb.push({dat:heute(),who:S.cfg.who||"",code:rCode,roh:rohG,fertig:fertigG,
        proz:Math.round(fertigG/rohG*1000)/10,
        kosten:pr?Math.round(pr*roh/fertig*10)/10:"",bem:$("r_bem").value.trim()});
      S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-rohG);
      if(!S.bestand[rCode])delete S.bestand[rCode];
      S.tk[rCode]=(+(S.tk[rCode]||0))+fertigG;
      /* Was noch nicht reif war, wandert ins Reifelager statt verloren zu gehen */
      const reift=parseFloat($("r_reift").value);
      if(reift>0){
        const reiftG=Math.round(stk?reift:reift*1000);
        S.reift[rCode]={menge:(reiftVon(rCode)+reiftG), seit:heute()};
        S.bestand[rCode]=Math.max(0,(+(S.bestand[rCode]||0))-reiftG);
        if(!S.bestand[rCode])delete S.bestand[rCode];
      }
      save(); render();
    };
  }
  document.querySelectorAll("[data-verk]").forEach(b=>b.onclick=()=>verkostungAuf(+b.dataset.verk));
  document.querySelectorAll("[data-verarb]").forEach(b=>b.onclick=()=>{
    if(!confirm(h("zurueck")))return;
    const v=S.verarb[+b.dataset.verarb];
    S.bestand[v.code]=(+(S.bestand[v.code]||0))+ +v.roh;
    S.tk[v.code]=Math.max(0,(+(S.tk[v.code]||0))- +v.fertig);
    if(!S.tk[v.code])delete S.tk[v.code];
    S.verarb.splice(+b.dataset.verarb,1); save(); render();
  });

  document.querySelectorAll("[data-charge]").forEach(b=>b.onclick=()=>{
    if(!confirm("Charge löschen?"))return;
    S.chargen.splice(+b.dataset.charge,1); save(); render();
  });
}

function freierCode(name){
  const alle=new Set(alleZutaten().map(k=>k.code));
  let b=(name.toUpperCase().replace(/[^A-ZÄÖÜ]/g,"").replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U")+"XX").slice(0,2);
  if(!alle.has(b))return b;
  for(let i=2;i<10;i++){const k=b[0]+i; if(!alle.has(k))return k}
  return b[0]+"9";
}

/* 🔄 holt die neueste Fassung — löscht den Offline-Speicher, NICHT die Daten */
$("frisch").onclick=async()=>{
  try{
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister())); }
  }catch(e){}
  location.replace(location.pathname+"?v="+Date.now());
};

/* Kann das Handy Thai und Deutsch sprechen? */
function stimmenPruefen(){
  const el=$("stimmen");
  if(!window.speechSynthesis){el.className="stimmen no";el.textContent="🔊 —";return}
  const zeig=()=>{
    const v=speechSynthesis.getVoices();
    const th=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("th"));
    const de=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith("de"));
    el.className="stimmen "+(th&&de?"ok":"no");
    el.innerHTML=`🔊 ไทย ${th?"✓":"✗"} · Deutsch ${de?"✓":"✗"}`
      +(th&&de?"":"<br>Fehlende Stimme in den Android-Einstellungen (Sprachausgabe) nachladen.");
  };
  zeig(); speechSynthesis.onvoiceschanged=zeig;
}

if(!USER)dialogAuf(); else render();
(function(){
  var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(iOS||location.search.indexOf("nosw=1")>=0){
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
    return;
  }
  if("serviceWorker" in navigator)
    navigator.serviceWorker.register("./sw-os.js").then(function(r){r.update()}).catch(function(){});
})();
