<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0f1116; --panel:#191d26; --panel2:#222732; --line:#2c333f;
    --txt:#eef1f6; --dim:#9aa3b2; --orange:#FF6600; --orange2:#ff8c3a;
    --green:#37d67a; --red:#ff5d5d; --blue:#4ea3ff; --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;font-size:16px}
  button{font-family:inherit;cursor:pointer;border:none}
  .hidden{display:none!important}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(100deg,#1c1306,#191d26 60%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header .logo{font-size:24px;font-weight:900}.logo span{color:var(--orange)}
  header .loc{font-size:12px;color:var(--dim)}
  .langs{display:flex;gap:5px;margin-left:6px}
  .lang{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px}
  .lang.on{background:#fff;color:#111;border-color:#fff}
  header .tabs{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tab{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
  /* Dieselbe Sprache oben in den Reitern: was leuchtet, ist aktiv. */
  .tab.on{background:#16a34a;color:#fff;border-color:#22c55e;
    box-shadow:0 0 0 2px rgba(34,197,94,.35), 0 0 12px rgba(34,197,94,.5)}

  main{padding:16px;max-width:1280px;margin:0 auto}
  .row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.row{grid-template-columns:1fr}}

  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;position:relative;transition:.1s;overflow:hidden}
  .item:active{transform:scale(.97)}
  .item .bar{position:absolute;left:0;top:0;bottom:0;width:7px}
  .item .nr{font-size:12px;color:var(--orange2);font-weight:800;padding-left:4px}
  .item .nm{font-weight:800;font-size:15px;line-height:1.2;margin:3px 0 3px;min-height:36px;color:#ffffff;padding-left:4px}
  .item .desc{font-size:11px;color:#b6bfce;margin:0 0 7px;min-height:26px;padding-left:4px}
  .item .meta{display:flex;justify-content:space-between;align-items:flex-end;padding-left:4px}
  .item .pr{font-size:19px;font-weight:900;color:var(--orange2)}
  .item .sz{font-size:11px;color:var(--dim)}
  .item .prov{color:var(--dim);font-size:11px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:12px}
  .ol{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:42vh;overflow:auto}
  .oli{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .oli .t{font-size:14px;font-weight:700}.oli .t small{color:var(--dim);font-weight:400}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:18px;font-weight:800}
  .oli .lp{font-weight:800;min-width:62px;text-align:right}
  .empty{color:var(--dim);font-size:14px;padding:14px 0;text-align:center}
  .sum{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
  .sum .big{font-size:30px;font-weight:900}
  .cust{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:14px;display:flex;align-items:center;gap:8px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .btn{padding:14px;border-radius:12px;font-weight:800;font-size:16px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.pay{background:var(--orange);color:#1a0d00;grid-column:1/-1;font-size:19px}
  .btn.green{background:var(--green);color:#06210f}
  .btn.ghost{background:transparent}
  .btn.red{background:transparent;border-color:#5a2a2a;color:var(--red)}
  .btn:disabled{opacity:.4}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
  .modal.on{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:430px;width:100%;max-height:92vh;overflow:auto;padding:20px}
  .box h3{font-size:20px;margin-bottom:6px}
  .box .x{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:5px 11px;font-weight:800}
  .qrwrap{text-align:center;margin:14px 0}
  .qrwrap img{width:240px;height:240px;background:#fff;border-radius:12px;padding:8px}
  .field{margin:10px 0}
  .field label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:16px}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--dim);margin:10px 0}
  .chk input{margin-top:3px}

  .bon{background:#fff;color:#111;border-radius:10px;padding:16px;font-family:"Courier New",monospace;font-size:13px;line-height:1.5}
  .bon hr{border:none;border-top:1px dashed #999;margin:7px 0}
  .bon .c{text-align:center}.bon .b{font-weight:800}
  .bon table{width:100%}.bon td{padding:1px 0}.bon td:last-child{text-align:right}
  .bon .qrc{text-align:center;margin-top:8px}.bon .qrc img{width:120px;height:120px}

  .prep h4{font-size:15px;margin:12px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .prep .grp{margin:6px 0}
  .prep .gl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .prep ul{list-style:none;margin:3px 0}
  .prep li{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px}

  .list{display:flex;flex-direction:column;gap:8px}
  .lrow{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .lrow .sub{font-size:12px;color:var(--dim)}
  .stamps{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;font-size:11px}
  .dot.on{background:var(--orange);color:#1a0d00}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .k{font-size:11px;color:var(--dim);text-transform:uppercase}
  .kpi .v{font-size:22px;font-weight:900;margin-top:3px}
  .seduce{background:linear-gradient(135deg,#2a1606,#191d26);border:1px solid #5a3a14;border-radius:12px;padding:14px;margin-bottom:14px;line-height:1.6}
  .seduce b{color:var(--orange2)}
  .note{font-size:12px;color:var(--dim);margin-top:10px}
  .free{background:var(--green);color:#06210f;border-radius:10px;padding:10px;text-align:center;font-weight:800;margin:10px 0}
  .grleiste{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .grleiste .gr{padding:9px 14px;border:1px solid #d8d1c7;background:#fff;border-radius:10px;
    font:700 14px inherit;cursor:pointer;color:#40352a}
  /* AUSGEWAEHLT = LEUCHTET GRUEN. Peter, 30.08.2026: "Koennen wir die
     Buttons in der Kasse farblich umdrehen? Wenn die leuchten und gruenes
     Licht haben, sind die ausgewaehlt. Finde ich bedienerfreundlicher."
     Vorher war die Auswahl DUNKELgruen (#1b4332) — im Sonnenlicht am Stand
     sieht ein dunkler Knopf aus wie ein ausgegrauter. Jetzt ein saftiges
     Gruen mit Leuchtrand, das man auch mit Sonne im Ruecken erkennt. */
  .grleiste .gr.on{background:#16a34a;color:#fff;border-color:#22c55e;
    box-shadow:0 0 0 2px rgba(34,197,94,.35), 0 0 12px rgba(34,197,94,.5)}
  .grleiste .trenner{width:1px;height:24px;background:#ddd;margin:0 4px}
  .item .db{font:700 11px inherit;color:#2f855a;margin-top:2px}
  .item .db.warn{color:#a4262c}
  .item .stern{color:#d4a72c}
/* BOOSTER-CHIPS in der Bestellzeile — antippen schaltet den Booster
   fuer genau diese Zeile an oder aus. Aktiv = gefuellt. */
.bchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bchip{
  border:1px solid #cfc9bd;background:#fff;color:#5b5347;
  border-radius:999px;padding:4px 9px;font:600 11.5px/1.2 inherit;
  cursor:pointer;white-space:nowrap;
}
.bchip:active{transform:scale(.96)}
.bchip.on{background:#16a34a;border-color:#22c55e;color:#fff;
  box-shadow:0 0 0 2px rgba(34,197,94,.3), 0 0 10px rgba(34,197,94,.45)}
/* Eignung je Rezept: grauer durchgestrichener Chip = passt chemisch nicht
   (Whey in Saeure oder roher Ananas). Nicht anklickbar, damit es am Tresen
   gar nicht erst passieren kann. */
.bchip.aus{opacity:.42;text-decoration:line-through;cursor:not-allowed;background:#f2efe9}
/* Ausverkaufte Menuekachel: sichtbar, aber gesperrt. Das rote Band sagt den
   Grund auf einen Blick, der Tooltip nennt die fehlende Zutat mit Menge. */
.item.aus{opacity:.45;cursor:not-allowed;position:relative;filter:grayscale(.7)}
.item.aus .ausband{position:absolute;top:8px;right:-30px;transform:rotate(35deg);
  background:#c0392b;color:#fff;font:800 10px/1.6 inherit;letter-spacing:.5px;
  padding:2px 34px;z-index:2;pointer-events:none}
.bchip.etop{border-color:#2C5A3B}
.bchip.eklein{border-color:#c9a227}
/* --- AMPEL: START --- */
/* Zutaten-Ampel — die Kasse liest die Ampel nur, sie setzt sie nicht.
   'rot': Kachel bleibt sichtbar, aber ausgegraut mit Klartext-Overlay,
          damit Lexi den Grund sofort sieht und nicht in Standos suchen muss.
   'gelb': kleiner Warnpunkt oben rechts, Kachel bleibt normal bedienbar. */
.item.a-rot{opacity:.35;cursor:not-allowed;filter:grayscale(.85)}
.item.a-rot .a-overlay{position:absolute;left:0;right:0;bottom:0;background:rgba(122,26,26,.94);
  color:#fff;font:800 10.5px/1.35 inherit;padding:5px 6px;text-align:center;
  letter-spacing:.3px;z-index:3;pointer-events:none}
.item .a-warn{position:absolute;top:6px;right:6px;z-index:2;
  background:#eab308;color:#3a2400;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font:900 13px/1 inherit;
  box-shadow:0 0 0 2px rgba(234,179,8,.35);pointer-events:none}
/* --- AMPEL: ENDE --- */
</style>
<meta name="robots" content="noindex,nofollow">
<title>MIXO Kasse</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIXO Kasse">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
</head>
<body>

<header>
  <div><div class="logo"><a href="./standos.html" title="Zurück zu MIXO" style="text-decoration:none;color:inherit"><b style="letter-spacing:1px">MIXO</b></a> · 100<span>blend</span></div><div class="loc" id="locline">Stand —</div></div>
  <div class="langs">
    <button class="lang on" data-l="th" onclick="setLang('th')">🇹🇭 ไทย</button>
    <button class="lang" data-l="de" onclick="setLang('de')">🇩🇪 DE</button>
    <button class="lang" data-l="en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
  <div class="tabs">
    <button class="tab" id="syncchip" onclick="tab('tag')" title="Gemeinsamer Speicher"
      style="border:0;background:transparent;font:700 12px inherit;padding:0 8px;cursor:pointer"></button>
    <button class="tab on" data-t="kasse" onclick="tab('kasse')">🛒 <span data-i18n="tab_sell"></span></button>
    <button class="tab" data-t="kunde" onclick="tab('kunde')">🎟️ <span data-i18n="tab_members"></span></button>
    <button class="tab" data-t="tag" onclick="tab('tag')">📊 <span data-i18n="tab_day"></span></button>
    <!-- CHARGEN: START -->
    <button class="tab" data-t="chargen" onclick="tab('chargen')" title="Frische-Chargen">🥛</button>
    <!-- CHARGEN: ENDE -->
    <button class="tab" data-t="setup" onclick="tab('setup')">⚙️</button>
  </div>
</header>

<main>
  <!-- KASSE -->
  <section id="v-kasse">
    <div class="row">
      <div>
        <div class="cust" id="custline"></div>
        <div id="groessenleiste" class="grleiste"></div>
        <div class="menu" id="menu"></div>
      </div>
      <div class="panel">
        <h2>🧾 <span data-i18n="order_h"></span></h2>
        <div class="ol" id="orderlist"></div>
        <div class="sum"><span data-i18n="sum"></span><span class="big" id="total">0 ฿</span></div>
        <div class="actions">
          <button class="btn" onclick="showPrep()" id="btnPrep" disabled>👩‍🍳 <span data-i18n="btn_prep"></span></button>
          <button class="btn red" onclick="clearOrder()">🗑️ <span data-i18n="btn_clear"></span></button>
          <button class="btn pay" onclick="pay()" id="btnPay" disabled>💳 <span data-i18n="btn_pay"></span></button>
        </div>
        <div class="note" data-i18n="tap_hint"></div>
      </div>
    </div>
  </section>

  <!-- KUNDEN -->
  <section id="v-kunde" class="hidden">
    <div class="row">
      <div class="panel">
        <div class="seduce">
          🎁 <b data-i18n="seduce_h"></b><br>
          <span data-i18n="seduce_perks"></span><br>
          <span class="note" data-i18n="seduce_sub"></span>
        </div>
        <h2>➕ <span data-i18n="newmember_h"></span></h2>
        <div class="field"><label data-i18n="lbl_name"></label><input id="c-name"></div>
        <div class="field"><label data-i18n="lbl_bday"></label><input id="c-bday" type="date"></div>
        <div class="field"><label data-i18n="lbl_contact"></label><input id="c-contact" placeholder="+66… / mail@…"></div>
        <label class="chk"><input type="checkbox" id="c-pdpa"><span data-i18n="pdpa"></span></label>
        <button class="btn green" style="width:100%" onclick="addCustomer()">✅ <span data-i18n="btn_createmember"></span></button>
      </div>
      <div class="panel">
        <h2>🎟️ <span data-i18n="members_h"></span> <span style="color:var(--dim);font-weight:400" id="custcount"></span></h2>
        <div class="field"><input id="c-search" data-i18n-ph="ph_search" oninput="renderCustomers()"></div>
        <div class="list" id="custlist"></div>
      </div>
    </div>
  </section>

  <!-- TAG -->
  <section id="v-tag" class="hidden">
    <div class="kpis">
      <div class="kpi"><div class="k" data-i18n="kpi_rev"></div><div class="v" id="d-ums">0 ฿</div></div>
      <div class="kpi"><div class="k" data-i18n="kpi_cups"></div><div class="v" id="d-cnt">0</div></div>
      <div class="kpi"><div class="k" data-i18n="kpi_avg"></div><div class="v" id="d-avg">0 ฿</div></div>
      <div class="kpi"><div class="k" data-i18n="kpi_db"></div><div class="v" id="d-db">0 ฿</div></div>
    </div>
    <div class="panel" id="lagerpanel" style="display:none">
      <h2>📦 <span data-i18n="stock_h"></span></h2>
      <div class="list" id="lagerlist"></div>
      <div class="note" data-i18n="stock_note"></div>
    </div>
    <div class="panel">
      <h2>📈 <span data-i18n="sales_h"></span></h2>
      <div class="list" id="saleslist"></div>
      <div class="actions" style="grid-template-columns:1fr 1fr 1fr;margin-top:14px">
        <button class="btn" onclick="exportCSV()">⬇️ <span data-i18n="btn_export"></span></button>
        <button class="btn" onclick="copyKIZ()">📋 <span data-i18n="btn_copykiz"></span></button>
        <button class="btn" onclick="sendeWarteschlange(true)">☁️ <span data-i18n="btn_sync"></span></button>
        <button class="btn red" onclick="closeDay()">🔒 <span data-i18n="btn_closeday"></span></button>
      </div>
      <div class="note" data-i18n="db_note"></div>
    </div>
  </section>

  <!-- CHARGEN: START -->
  <section id="v-chargen" class="hidden">
    <div class="panel" style="max-width:720px">
      <h2>🥛 Frische-Chargen</h2>
      <div class="note" style="margin:-4px 0 10px">
        Neue Charge = Ein Klick. Menge, Datum, Wer — fertig. Ampel geht auf 🟢, Ablaufdatum wird automatisch gesetzt.
      </div>
      <div id="ch-neue"></div>
      <h2 style="margin-top:16px">Aktive Chargen</h2>
      <div class="list" id="ch-liste"></div>
    </div>
    <div id="ch-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;align-items:center;justify-content:center;padding:12px">
      <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)">
        <h2 id="ch-modal-title" style="margin:0 0 10px">Neue Charge</h2>
        <div id="ch-modal-body"></div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" style="flex:1" onclick="chModalClose()">Abbrechen</button>
          <button class="btn green" style="flex:2" id="ch-modal-ok">Speichern</button>
        </div>
      </div>
    </div>
  </section>
  <!-- CHARGEN: ENDE -->

  <!-- SETUP -->
  <section id="v-setup" class="hidden">
    <div class="panel" style="max-width:560px">
      <h2>⚙️ <span data-i18n="settings_h"></span></h2>
      <div class="field"><label data-i18n="lbl_locnr"></label><input id="s-loc" placeholder="01"></div>
      <div class="field"><label data-i18n="lbl_mname"></label><input id="s-name" maxlength="25" placeholder="100BLEND"></div>
      <div class="field"><label data-i18n="lbl_city"></label><input id="s-city" placeholder="PATTAYA"></div>
      <div class="field"><label data-i18n="lbl_pptype"></label>
        <select id="s-pptype"><option value="phone" data-i18n="opt_phone"></option><option value="natid" data-i18n="opt_natid"></option></select></div>
      <div class="field"><label data-i18n="lbl_ppid"></label><input id="s-ppid" placeholder="0812345678"></div>
      <div class="field"><label data-i18n="lbl_sync"></label><input id="s-sync" placeholder="https://script.google.com/…/exec"></div>
      <button class="btn green" style="width:100%" onclick="saveSetup()">💾 <span data-i18n="btn_save"></span></button>
      <div class="note" data-i18n="setup_note"></div>
    </div>
  </section>
</main>

<!-- Bezahlen -->
<div class="modal" id="m-pay"><div class="box">
  <button class="x" onclick="off('m-pay')">✕</button>
  <h3>💳 <span data-i18n="pay_h"></span></h3>
  <div style="font-size:34px;font-weight:900;text-align:center;margin:6px 0" id="pay-amount">0 ฿</div>
  <div class="qrwrap"><img id="pay-qr" alt="PromptPay QR"><div class="note" id="pay-recv"></div></div>
  <div class="actions" style="grid-template-columns:1fr 1fr">
    <button class="btn green" onclick="confirmSale('PromptPay')">✅ <span data-i18n="btn_pp_paid"></span></button>
    <button class="btn" onclick="confirmSale('Bar')">💵 <span data-i18n="btn_cash_paid"></span></button>
  </div>
</div></div>

<!-- Bon -->
<div class="modal" id="m-bon"><div class="box">
  <button class="x" onclick="off('m-bon')">✕</button>
  <h3>🧾 <span data-i18n="bon_h"></span></h3>
  <div class="bon" id="bon"></div>
  <div class="actions" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <button class="btn" onclick="window.print()">🖨️ <span data-i18n="btn_print"></span></button>
    <button class="btn green" onclick="off('m-bon');newSale()"><span data-i18n="btn_next"></span> ▶</button>
  </div>
</div></div>

<!-- Zubereitung -->
<div class="modal" id="m-prep"><div class="box">
  <button class="x" onclick="off('m-prep')">✕</button>
  <h3>👩‍🍳 <span data-i18n="prep_h"></span></h3>
  <div class="note" data-i18n="prep_note"></div>

/* WARTESCHLANGE: Am Stand faellt das WLAN aus. Jeder Verkauf wird ZUERST hier

   und wandert beim naechsten Versuch raus. So kann kein Bon verloren gehen.
   Der Server erkennt doppelt gesendete Bons an der Bon-Nummer. */
let WARTE=LS("kb_warte")||[];

/* --- AMPEL: START --- */
/* Zutaten-Ampel — gleicher Schluessel wie standos.html im gemeinsamen Origin.
   Rot in einer Zutat sperrt jeden Becher, der sie braucht; Gelb warnt nur. */
const AMPELKEY = "blend_ampel_v1";
let AMPEL = LS(AMPELKEY) || {};
/* Live-Update im selben Browser: sobald Standos die Ampel schreibt,
   feuert das storage-Event in allen anderen Tabs. */
window.addEventListener("storage", ev=>{
  if(ev && ev.key===AMPELKEY){
    AMPEL = LS(AMPELKEY) || {};
    if(typeof renderMenu==="function") renderMenu();
  }
});
/* Fallback fuer Faelle, in denen das storage-Event nicht kommt
   (z. B. dasselbe Tab per Zurueck-Taste, iOS-Home-Screen). */
setInterval(()=>{
  try{
    const roh = localStorage.getItem(AMPELKEY);
    if(roh==null) return;
    const neu = JSON.parse(roh);
    if(JSON.stringify(neu)!==JSON.stringify(AMPEL)){
      AMPEL = neu||{};
      if(typeof renderMenu==="function") renderMenu();
    }
  }catch(e){}
}, 15000);

/* ID-Bildung: <CODE>_YYYY-MM-DD_HHMM_<xxx>, chronologisch sortierbar. */
function chargeId(code){
  const d=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const rnd=Math.random().toString(36).slice(2,5);
  return code+"_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())
        +"_"+pad(d.getHours())+pad(d.getMinutes())+"_"+rnd;
}

/* Ampel-Marker: manuell/automatisch trennen. Manuell darf Auto NIE ueberschreiben. */
function setAmpelKasse(code,status,grund,manuell){
  try{
    const A = LS(AMPELKEY) || {};
    A[code] = {status:String(status), grund:(grund==null?"":String(grund)),
               ts:Date.now(), wer:(CFG.who||CFG.name||"Kasse"), manuell:!!manuell};
    localStorage.setItem(AMPELKEY, JSON.stringify(A));
    AMPEL = A;
    /* Sync-Nachricht wie im Standos-Format. */
    chargenSync({typ:"ampel",code,status,grund:grund||"",manuell:!!manuell});
  }catch(e){}
}

/* Ableitungsregel Chargen -> Ampel (identisch mit standos ampelAusChargen).
   >=1 frisch-Charge mit rest > 20% -> gruen.
   Nur karrenz oder alle rest < 20% -> gelb.
   Keine in [frisch, karrenz] -> rot. */
function ampelAusChargenKasse(code){
  const alle = Object.values(CHARGEN).filter(c=>c && c.zutat_code===code);
  const aktiv = alle.filter(c=>c.status==="frisch"||c.status==="karrenz");
  if(!aktiv.length) return "rot";
  const frischOK = aktiv.some(c=>{
    if(c.status!=="frisch") return false;
    const menge = +(c.menge_ml||c.menge_g||0);
    const rest  = +(c.menge_rest||0);
    return menge>0 && (rest/menge) > 0.20;
  });
  if(frischOK) return "gruen";
  return "gelb";
}
function chargenAmpelSyncAll(){
  Object.keys(HALTBARKEIT).forEach(code=>{
    /* Wenn ueberhaupt keine Chargen fuer diese Zutat existieren, nichts tun —
       sonst wuerden vor Erstanlage alle sofort auf rot geschaltet und blockieren
       den ganzen Betrieb. */
    const hatChargen = Object.values(CHARGEN).some(c=>c && c.zutat_code===code);
    if(!hatChargen) return;
    const cur = (AMPEL||{})[code];
    if(cur && cur.manuell) return;                   /* manuell hat Vorrang */
    const soll = ampelAusChargenKasse(code);
    if(!cur || cur.status !== soll){
      setAmpelKasse(code, soll, "auto: aus Chargen abgeleitet", false);
    }
  });
}

/* Timer: alle Status vorwaerts schalten, wenn Ablauf/Karenz erreicht,
   danach Ampel neu ableiten. Laeuft beim Laden und alle 5 Minuten. */
function chargenAutoStatus(){
  const jetzt=Date.now();
  let ver=false;
  Object.values(CHARGEN).forEach(c=>{
    if(!c) return;
    if((+c.menge_rest||0)<=0 && c.status!=="entsorgen" && c.status!=="aufgebraucht"){
      c.status="aufgebraucht"; ver=true;
    }
    if(c.status==="frisch" && c.ablauf_am && new Date(c.ablauf_am).getTime()<=jetzt){
      c.status="abgelaufen_pruefen"; ver=true;
    }
    if(c.status==="karrenz" && c.karrenz_bis && new Date(c.karrenz_bis).getTime()<=jetzt){
      const letzte=(c.peter_freigaben||[]).slice(-1)[0];
      const jung = letzte && (jetzt - new Date(letzte.ts).getTime()) < 2*3600*1000;
      if(!jung){ c.status="entsorgen"; ver=true; }

/* ═══════════ LAGERSTAND IN DER KASSE ═══════════
   Peter, 30.08.2026: "Wenn ich das dann rausgenommen habe, muss sofort eine
   Kettenreaktion gestartet werden. Der Smoothie wird nicht mehr angeboten …
   nicht mehr verkauft."

   Bis heute war das die grosse Luecke: Die Kasse hat den Bestand NIE
   gelesen. Sie erfuhr von einer Fehlmenge erst NACH dem Verkauf, aus der
   Antwort des Servers ("knapp"). Der Gast hatte da schon bezahlt.

   Dabei liefert der Server den Stand laengst — eine schlichte GET-Anfrage
   ohne Parameter gibt bestand, tk, reift und bestellt zurueck. Es hat nur
   nie jemand gefragt.

   Rechenregel wie auf dem Server (Funktion abziehen): erst TK, dann
   Rohware. Verfuegbar ist also tk + bestand.

   ⚠ FAIL OPEN, und das ist Absicht: Solange KEIN Lagerstand vorliegt — Sync
   aus, kein Netz, Server alt — wird NICHTS gesperrt. Eine Kasse, die bei
   Funkloch alles als ausverkauft zeigt, ist schlimmer als gar keine
   Sperre. */
let LAGER = null;          /* null = wir wissen nichts, also nicht sperren */
let LAGER_ZEIT = 0;
const VERPACKUNG_CODES = ["B12","D12","B16","D16","BE","DE","HA","SR","TB"];

function lagerHolen(){
  /* Die Kasse fuehrt die Adresse in CFG.sync, nicht in einer Funktion
     syncUrl() wie die App — beim ersten Einbau hier verwechselt. */
  const url = CFG && CFG.sync;
  if(!url) return Promise.resolve();
  return fetch(url, {method:"GET"})
    .then(r=>r.json())
    .then(a=>{
      if(!a || !a.ok) return;
      LAGER = {bestand:a.bestand||{}, tk:a.tk||{}};
      LAGER_ZEIT = Date.now();
      renderMenu();
    })
    .catch(()=>{ /* stillschweigend: fail open */ });
}

/* Wieviel ist von einem Code wirklich greifbar? */
function greifbar(code){
  if(!LAGER) return Infinity;
  return (Number(LAGER.tk[code]||0)) + (Number(LAGER.bestand[code]||0));
}

/* Kann dieser Becher jetzt gemixt werden? Verpackung zaehlt bewusst NICHT
   mit — ein fehlender Sticker darf keinen Smoothie sperren. */
function machbar(m, g){
  if(!LAGER) return {ok:true, fehlt:[]};
  const ab = ((m.groessen||{})[g||GROESSE]||{}).abzug || {};
  const fehlt = [];
  Object.keys(ab).forEach(code=>{
    if(VERPACKUNG_CODES.indexOf(code)>=0) return;
    const brauch = Number(ab[code])||0;
    if(brauch<=0) return;
    const da = greifbar(code);
    if(da + 0.001 < brauch) fehlt.push({code:code, fehlt:Math.round((brauch-da)*100)/100});
  });
  return {ok: fehlt.length===0, fehlt: fehlt};
}

/* --- AMPEL: START --- */
/* Berechnet den Ampel-Zustand fuer einen Becher aus seinen Zutaten-Codes.
   Verpackung zaehlt bewusst NICHT mit — ein roter Sticker sperrt keinen Smoothie.
   Reihenfolge: rot > gelb > gruen (eine einzige rote Zutat sperrt den Becher). */
function ampelStateOfBecher(zutaten){
  const rot=[], gelb=[];
  (zutaten||[]).forEach(c=>{
    if(!c || VERPACKUNG_CODES.indexOf(c)>=0) return;
    const st = ((AMPEL||{})[c]||{}).status;
    if(st==="rot")       rot .push({code:c, de:(ZUTATNAME[c]||c)});
    else if(st==="gelb") gelb.push({code:c, de:(ZUTATNAME[c]||c)});
  });
  const status = rot.length ? "rot" : (gelb.length ? "gelb" : "gruen");
  return {status, roteListe:rot, gelbeListe:gelb};
}

/* Farben blieben frueher im Menue stehen; jetzt aus der Nummer abgeleitet,
   damit das erzeugte Menue keine Gestaltung mitschleppen muss. */
function FARBE(nr){
  const p=["#f2a900","#b98c5a","#7faa6e","#5aa9b9","#e85d75","#9b6bb5","#d97706","#2f855a"];
  return p[(parseInt(nr,10)||0)%p.length];
}
/* Schluessel der Bestellzeile ist jetzt "Nr|Groesse" — derselbe Smoothie in
   zwei Groessen sind zwei Zeilen. */
/* Der Zeilenschluessel traegt jetzt auch die Booster: "09|16|WY+MC".
   Derselbe Smoothie mit und ohne Booster sind zwei Zeilen — sonst liesse
   sich der Aufpreis nicht sauber zuordnen. */
function add(nr){const k=pKey(nr,GROESSE)+"|";order[k]=(order[k]||0)+1;renderOrder();}
function chg(k,d){order[k]=(order[k]||0)+d;if(order[k]<=0)delete order[k];renderOrder();}
function clearOrder(){order={};renderOrder();}
/* Booster an-/abschalten: die Zeile wandert auf einen neuen Schluessel. */
function togBoost(k,code){
  const [nr,g,bs]=k.split("|");
  const liste=(bs||"").split("+").filter(Boolean);
  const i=liste.indexOf(code);
  if(i<0) liste.push(code); else liste.splice(i,1);
  liste.sort();
  const neu=nr+"|"+g+"|"+liste.join("+");
  if(neu===k) return;
  order[neu]=(order[neu]||0)+order[k];
  delete order[k];
  renderOrder();
}
/* ═══════════ WHEY- UND KREATIN-EIGNUNG JE REZEPT ═══════════
   Peter, 30.08.2026: "Was jetzt extrem wichtig ist — wo sehe ich, welche
   Smoothies mit Protein zubereitet werden?"

   Bisher: nirgends. Die Eignung stand nur in
   konzept-bausteine/protein-creatin-booster-30-08.md, waehrend die Kasse den
   Whey-Chip an JEDEM Becher angeboten hat. Damit konnte Lexi Whey in die
   Wassermelone kippen — und der Becher flockt aus.

   Die Chemie dahinter, kurz: Molkenprotein flockt bei pH 4,0-5,5 aus. Genau
   dort liegen Limette, Passionsfrucht, Hibiskus und Orangensaft. Und rohe
   Ananas enthaelt Bromelain, ein Enzym, das Molkenprotein in bittere Peptide
   spaltet — Einfrieren daempft es, zerstoert es aber nicht.

   nein     Whey wird gar nicht erst angeboten (Chip grau, durchgestrichen)
   klein    geht, aber halbe Dosis und zuegig servieren
   (fehlt)  keine Aussage — Chip normal, aber ohne Empfehlung
   top      ausdruecklich empfohlen (Chip mit 💪) */
const WHEY_TOP  =["9","17","20","21","26","30","34","35","36","37","39","41","44"];
const WHEY_KLEIN=["4","8","10","11","32","33","38","40","42","48","51"];
const WHEY_NEIN =["1","2","3","5","6","7","12","13","15","16","18","19","22","24",
                  "25","27","28","29","43","45","46","47","49"];
/* Kreatin ist kein Geschmacks-, sondern ein Textur-Thema: Es bleibt leicht
   sandig. In dicken Bechern mit Kakao/Nuss/Hafer faellt das nicht auf, in
   klaren duennen Bechern schmeckt man jedes Korn. */
const KREA_TOP  =["17","30","39","44","41"];
const KREA_NEIN =["43","29","15"];
function eignung(code,nr){
  /* FEHLER GEFUNDEN 30.08.2026 beim Bau der Kalkulationstabelle:
     Die Listen fuehren "1".."9" ohne fuehrende Null, die Rezepte heissen
     aber "01".."09". Fuer NEUN Rezepte griff die Sperre damit gar nicht —
     Nr. 01 (Gruener Tee + Passionsfrucht + Ananas) bot Whey an, obwohl es
     genau der Fall ist, den die Liste verhindern soll. Aufgefallen ist es
     erst, weil die Tabelle jede Kombination einzeln ausweist.
     Deshalb auf beiden Seiten die fuehrende Null wegrechnen. */
  nr=String(nr).replace(/^0+/,"");
  if(code==="WY"){
    if(WHEY_NEIN.indexOf(nr)>=0) return "nein";
    if(WHEY_KLEIN.indexOf(nr)>=0)return "klein";
    if(WHEY_TOP.indexOf(nr)>=0)  return "top";
  }
  if(code==="KR"){
    if(KREA_NEIN.indexOf(nr)>=0) return "nein";
    if(KREA_TOP.indexOf(nr)>=0)  return "top";
  }
  return "";
}
const EIGNUNG_TXT={
  nein :{de:"passt nicht zu diesem Smoothie",         th:"ไม่เข้ากับสูตรนี้",              en:"does not suit this smoothie"},
  klein:{de:"nur halbe Menge, zügig servieren",       th:"ใส่แค่ครึ่งเดียว รีบเสิร์ฟ",        en:"half dose only, serve quickly"},
  top  :{de:"passt besonders gut",                    th:"เข้ากันดีมาก",                   en:"suits this one especially well"}
};

function boosterCodes(k){ return (k.split("|")[2]||"").split("+").filter(Boolean); }
/* Aufpreis aller Booster einer Zeile — je Becher. */
function boosterAufpreis(k,g){
  return boosterCodes(k).reduce((s,c)=>{
    const b=boosterVon(c); return b? s+boosterPreis(b,g) : s;
  },0);
}
function boosterKosten(k,g){
  return boosterCodes(k).reduce((s,c)=>{
    const b=boosterVon(c); return b? s+boosterEk(b,g) : s;
  },0);
}
/* Zeilenpreis je Becher = Grundpreis + Booster. */
function zeilenPreis(r){ return preisVon(r.m,r.g) + boosterAufpreis(r.k,r.g); }
function orderRows(){
  return Object.entries(order).map(([k,q])=>{
    const [nr,g]=k.split("|");
    return {k,m:item(nr),g:g||"16",q};
  }).filter(r=>r.m);
}
function orderTotal(){return orderRows().reduce((s,r)=>s+zeilenPreis(r)*r.q,0);}
function orderCost(){
  /* Thermo-Tasche faellt je angefangene 2 Becher an, nicht je Becher. */
  const roh=orderRows().reduce((s,r)=>
    s+(((r.m.groessen[r.g]||{}).ek||0)+boosterKosten(r.k,r.g))*r.q,0);
  /* Grab geht ebenfalls im Thermobeutel raus — gleiche Verpackungskosten. */
  if(KANAL!=="lieferung" && KANAL!=="grab")return roh;
  return roh + Math.ceil(orderCount()/2)*THERMO_TASCHE;
}
function orderCount(){return orderRows().reduce((s,r)=>s+r.q,0);}

/* --- SCHRITT 3: was nimmt dieser Bon vom Bestand? ------------------------
   Die Mengen je Becher stehen fertig hochgerechnet im Menue (Feld "abzug",
   erzeugt von _kassenmenue-generieren.js). Hier wird nur noch mit der
   Stueckzahl multipliziert und zusammengezaehlt.
   Die Thermo-Tasche kommt nur bei Lieferung dazu — eine je zwei Becher,
   deshalb 0,5 je Becher; aufgerundet, weil man keine halbe Tasche gibt. */
function abzugFuer(rows, kanal){
  const a={};
  const nimm=(c,m)=>{ if(!c||!m)return; a[c]=Math.round(((a[c]||0)+m)*100)/100; };
  rows.forEach(r=>{
    const d=(r.m.groessen[r.g]||{}).abzug||{};
    Object.keys(d).forEach(c=>nimm(c,d[c]*r.q));
    /* Booster gehen genauso vom Bestand ab wie jede andere Zutat —
       sonst stimmt die Inventur nach dem ersten Protein-Smoothie nicht mehr. */
    boosterCodes(r.k).forEach(c=>{
      const b=boosterVon(c); if(b) nimm(c, boosterGramm(b,r.g)*r.q);
    });
  });
  if(kanal==="lieferung"||kanal==="grab"){
    const becher=rows.reduce((x,r)=>x+r.q,0);
    if(becher>0)nimm(TASCHE_CODE, Math.ceil(becher*THERMO_PRO_BECHER));
  }
  return a;
}

         wenn der Becher schon steht. */

          EIGNUNG_TXT.nein[LANG]||EIGNUNG_TXT.nein.de}"

      /* ⊘ am Chip: dieser Booster nimmt dem Becher den Halal-Anspruch.

         Chip UND als Zeile darunter, sobald er aktiv ist: am Tresen wird auf

      const zeichen = eig==="top" ? "💪 " : eig==="klein" ? "½ " : "";
      return `<button class="bchip${an?" on":""}${eig?" e"+eig:""}" onclick="togBoost('${r.k}','${b.code}')"
        title="${eig?(EIGNUNG_TXT[eig][LANG]||EIGNUNG_TXT[eig].de):""}"
        >${zeichen}${b[LANG]||b.de}${b.nichtHalal?" ⊘":""} +${boosterPreis(b,r.g)}฿</button>`;
    }).join("");
    const ohneHalal=aktiv.map(c=>boosterVon(c)).filter(b=>b&&b.nichtHalal);
    const halbe=aktiv.filter(c=>eignung(c,r.m.nr)==="klein")

    const halalHinweis=ohneHalal.length

        : LANG==="en" ? "⊘ This cup is not halal (whey protein)"
        :               "⊘ Dieser Becher ist nicht Halal (Whey)"}</div>`
      : "";
    /* Was der Gast fuer sein Geld bekommt: 90 % Protein laut Etikett,
       also 0,9 g Protein je Gramm Pulver. Steht am Becher, nicht in einer

    const proteinZeile=aktiv.indexOf("WY")>=0
      ? `<div style="margin-top:4px;font:700 11px/1.3 inherit;color:#2C5A3B">💪 ${
          Math.round(boosterGramm(boosterVon("WY"),r.g)*0.9*10)/10} g ${
          LANG==="th"?"โปรตีน":LANG==="en"?"protein":"Protein"}</div>`
      : "";
    const halbHinweis=halbe.length
      ? `<div style="margin-top:4px;font:700 11px/1.3 inherit;color:#8a6a12">½ ${halbe.join(" · ")} — ${
          EIGNUNG_TXT.klein[LANG]||EIGNUNG_TXT.klein.de}</div>`

    const auf=boosterAufpreis(r.k,r.g);
    return `

  $("#total").textContent=baht(orderTotal());

/* =================== PROMPTPAY QR =================== */
function tlv(id,val){return id+String(val.length).padStart(2,"0")+val;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,"0");}
function ppAccount(){
  const id=(CFG.ppid||"").replace(/\D/g,"")||"0000000000";
  if(CFG.pptype==="natid")return tlv("00","A000000677010111")+tlv("02",id);
  return tlv("00","A000000677010111")+tlv("01","0066"+id.replace(/^0/,""));
}
function ppPayload(amount,ref){
  const name=(CFG.name||"100BLEND").toUpperCase().replace(/[^A-Z0-9 ]/g,"").slice(0,25);
  let p=tlv("00","01")+tlv("01",amount>0?"12":"11")+tlv("29",ppAccount())+tlv("53","764")
    +(amount>0?tlv("54",amount.toFixed(2)):"")+tlv("58","TH")+tlv("59",name)
    +tlv("60",(CFG.city||"PATTAYA").toUpperCase().slice(0,15))+tlv("62",tlv("05",ref.slice(0,25)));
  p+="6304";return p+crc16(p);
}
function qr(data,size){return "https://api.qrserver.com/v1/create-qr-code/?size="+size+"x"+size+"&margin=1&data="+encodeURIComponent(data);}

function confirmSale(method){
  /* Tatsaechlicher VK und tatsaechlicher EK je Zeile — Grundlage des Gewinns.
     Peter 17.08.: geschaetzte Werte sind nur der Vorschlag, gebucht wird real. */
  const items=orderRows().map(r=>({
    nr:r.m.nr, name:r.m.name, groesse:r.g, ml:(r.m.groessen[r.g]||{}).ml,
    preis:preisVon(r.m,r.g), cost:(r.m.groessen[r.g]||{}).ek||0,
    kanal:KANAL, qty:r.q
  }));
  const total=orderTotal(),cost=orderCost(),cnt=orderCount();
  if(curCust){
    const c=CUST.find(x=>x.id===curCust.id);
    c.visits+=cnt;c.stamps+=cnt;while(c.stamps>=10){c.stamps-=10;c.free+=1;}
    SET("kb_cust",CUST);curCust=c;setCust(c);
  }
  const rows=orderRows();
  const abzug=abzugFuer(rows,KANAL);
  const sale={ts:new Date().toISOString(),ref:pending?.ref||("ST"+CFG.loc+"-"+String(Date.now()).slice(-6)),
    items,total,cost,pay:method,custId:curCust?.id||null,kanal:KANAL,abzug};
  SALES.unshift(sale);SET("kb_sales",SALES);

  /* SCHRITT 3+4: erst in die Warteschlange, dann senden. Nie umgekehrt —
     sonst waere ein Bon bei Netzausfall zwischen Senden und Speichern weg. */
  WARTE.push({
    ref:sale.ref, ts:Date.parse(sale.ts), stand:CFG.loc, kanal:KANAL,
    zahlung:method, kunde:sale.custId,
    posten:items.map(i=>({nr:i.nr,groesse:i.groesse,menge:i.qty,preis:i.preis,ek:i.cost})),
    summe:total, ek:cost, abzug
  });
  SET("kb_warte",WARTE);
  sendeWarteschlange();

  off('m-pay');showBon(sale);
}

/* --- SCHRITT 4: Bons an den gemeinsamen Speicher -------------------------
   Der Server bucht Verkauf und Bestandsabzug in EINEM Schritt innerhalb
   seiner Sperre. Antwortet er nicht, bleibt alles in der Warteschlange.  */
let sendeLaeuft=false;
function sendeWarteschlange(laut){
  if(sendeLaeuft){ if(laut)alert(t('sync_wait')); return; }
  if(!CFG.sync){ if(laut)alert(t('sync_off')); syncChip(); return; }
  if(!WARTE.length){ if(laut)alert(t('sync_ok')); syncChip(); return; }
  sendeLaeuft=true; syncChip();
  const paket=WARTE.slice(0,25);            /* nicht alles auf einmal */
  if(!DARF_SENDEN){ console.log("[Test] kein Senden von",location.hostname); sendeLaeuft=false; syncChip(); return; }
  fetch(CFG.sync,{
    method:"POST",
    /* text/plain mit Absicht: Apps Script beantwortet die Vorab-Anfrage des
       Browsers sonst nicht und der Abgleich scheitert stumm. */
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({typ:"verkauf",geraet:"Kasse "+CFG.loc,verkaeufe:paket})
  })
  .then(r=>r.json())
  .then(a=>{
    if(!a||!a.ok)throw new Error("Server sagt nein");
    /* Der alte Server kennt "typ:verkauf" nicht und antwortet trotzdem mit
       ok:true — er haelt das Paket fuer eine Bestandsmeldung. Ohne diese
       Pruefung wuerde die Kasse den Bon als gebucht ansehen und wegwerfen,
       obwohl der Server ihn nie gesehen hat. Fehlt das Feld "gebucht"
       vollstaendig, ist der Server noch nicht aktualisiert. */
    if(!("gebucht" in a))throw new Error("veraltet");
    /* Gebucht UND als doppelt erkannt heisst beides: liegt sicher dort. */
    const fertig={};
    (a.gebucht||[]).forEach(r=>fertig[r]=1);
    (a.doppelt||[]).forEach(r=>fertig[r]=1);
    WARTE=WARTE.filter(v=>!fertig[v.ref]);
    SET("kb_warte",WARTE);
    SYNCSTAND={zeit:Date.now(),ok:true,knapp:a.knapp||[]};
    if(laut)alert(t('sync_ok')+" · "+(a.gebucht||[]).length);
  })
  .catch(e=>{
    const alt=e&&e.message==="veraltet";
    SYNCSTAND={zeit:Date.now(),ok:false,alt:alt,knapp:SYNCSTAND.knapp};
    if(laut)alert(alt?t('sync_old'):t('sync_err'));
  })
  .finally(()=>{ sendeLaeuft=false; syncChip(); if($("#v-tag")&&!$("#v-tag").classList.contains("hidden"))renderDay();
    /* Nach jedem gebuchten Verkauf den Stand neu ziehen — der Becher, der
       gerade die letzte Mango verbraucht hat, muss sofort gesperrt sein. */
    lagerHolen(); });
}

function syncChip(){
  const el=$("#syncchip"); if(!el)return;
  if(!CFG.sync){ el.textContent="⛔"; el.title=t('sync_off'); return; }
  if(sendeLaeuft){ el.textContent="⏳"; el.title=t('sync_wait'); return; }
  if(WARTE.length){ el.textContent="📤 "+WARTE.length; el.title=t('sync_err'); return; }
  el.textContent=SYNCSTAND.ok===false?"⚠️":"☁️";
  el.title=SYNCSTAND.ok===false?(SYNCSTAND.alt?t('sync_old'):t('sync_err')):t('sync_ok');
}

/* =================== ZUBEREITUNGS-BON =================== */
/* BOOSTER AUF DEM ZUBEREITUNGS-BON.
   Peter, 30.08.2026: "Wo sehe ich, welche Smoothies mit Protein zubereitet
   werden?" — Auf dem Zubereitungs-Bon stand es bis heute NICHT. Der Bon
   zeigte nur die Rezeptgruppen; ein Becher mit 25 g Whey sah aus wie jeder
   andere. Lexi konnte gar nicht wissen, dass Protein hineingehoert.

   Jetzt steht der Booster als eigener, hervorgehobener Block darunter — mit
   Gramm-Menge und dem Arbeitsschritt: NACH dem Hauptgang, 5 Sekunden.
   Nicht vorher, sonst schaeumt Whey und Kreatin wird sandig. */
function boosterBlock(r){
  const codes=boosterCodes(r.k); if(!codes.length)return "";
  const zeilen=codes.map(c=>{
    const b=boosterVon(c); if(!b)return "";
    const g=boosterGramm(b,r.g), eig=eignung(c,r.m.nr);
    const menge = eig==="klein" ? Math.round(g/2*10)/10 : g;
    return `<li><span>${(b[LANG]||b.de)}${b.nichtHalal?" ⊘":""}</span><b>${
      String(menge).replace(".",",")} g${eig==="klein"?" (½)":""}</b></li>`;
  }).join("");
  return `<div class="grp" style="border:2px solid #7a3ea8;border-radius:8px;padding:6px 8px">
    <div class="gl" style="color:#7a3ea8">💪 ${
      LANG==="th"?"บูสเตอร์ — ใส่ทีหลัง":LANG==="en"?"BOOSTER — add last":"BOOSTER — kommt zuletzt"}</div>
    <ul>${zeilen}</ul>
    <div class="note" style="margin-top:4px">${
      LANG==="th"?"ใส่หลังปั่นเสร็จ แล้วปั่นต่อ 5 วินาที — ห้ามใส่ก่อน เวย์จะเป็นฟอง ครีเอทีนจะสาก"
     :LANG==="en"?"Add after the main blend, then 5 seconds — never before: whey foams, creatine turns gritty"
     :"Nach dem Hauptgang zugeben, dann 5 Sekunden — nie vorher: Whey schäumt, Kreatin wird sandig"}</div>
  </div>`;
}

function showPrep(){
  const rows=orderRows();
  const COL={fl:"#0d3b2e",tk:"#13335a",fest:"#3a2f0c",wirk:"#3a1340"};
  const TC={fl:"#7fe0bf",tk:"#9cc8ff",fest:"#ffce4d",wirk:"#e3a0ff"};
  $("#prep").innerHTML=rows.map(r=>{
    const m=r.m;
    /* REPARIERT 30.08.2026: Der Bon las m.z — ein Feld, das der Menue-
       Generator seit dem Umbau nicht mehr schreibt. Kein einziger Menue-
       Eintrag hatte es noch, also warf der Bon bei JEDEM Rezept einen Fehler
       und blieb leer. Aufgefallen erst, als Peter fragte, wo er sieht,
       welcher Becher Protein bekommt.
       Jetzt aus abzug gebaut — der Liste, die ohnehin den Bestand bucht.
       Zwei Vorteile: die Gramm stimmen je Bechergroesse, und die Reihenfolge
       ist automatisch die Einfuellfolge ①②③④, weil abzug aus der
       sortierten Zutatenliste des Rezepts entsteht. */
    const VERPACKUNG=["B12","D12","B16","D16","BE","DE","HA","SR","TB"];
    const ab=((m.groessen||{})[r.g]||{}).abzug||{};
    const zut=Object.keys(ab).filter(c=>VERPACKUNG.indexOf(c)<0);
    const liste=zut.length
      ? `<div class="grp"><div class="gl">${
           LANG==="th"?"ใส่ตามลำดับนี้":LANG==="en"?"Fill in this order":"In dieser Reihenfolge einfüllen"
         }</div><ul>${zut.map((c,i)=>`<li><span>${i+1}. ${tIng(ZUTATNAME[c]||c)}
           <small style="opacity:.55">${c}</small></span><b>${
           String(ab[c]).replace(".",",")} ${(EINHEIT[c]||"g")}</b></li>`).join("")}</ul></div>`
      : "";
    const pn=m.prep?(LANG==="de"?m.prep:((PREPN[m.nr]||{})[LANG]||m.prep)):"";
    return `<h4>${r.q}× ${t('no')} ${m.nr} — ${mName(m)} <span class="tag" style="background:${COL.fl};color:${TC.fl}">${GR_NAME[r.g]}</span></h4>
      ${pn?`<div class="note">🔪 ${pn}</div>`:""}
      ${liste}
      ${boosterBlock(r)}
      <div class="note">${t('mix_line')}</div>`;
  }).join("");
  on('m-prep');
}

/* =================== TAG =================== */
function todays(){const t0=today();return SALES.filter(s=>s.ts.slice(0,10)===t0);}
function renderDay(){
  const s=todays();
  const ums=s.reduce((a,x)=>a+x.total,0),cnt=s.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0),cost=s.reduce((a,x)=>a+x.cost,0);
  $("#d-ums").textContent=baht(ums);$("#d-cnt").textContent=cnt;
  $("#d-avg").textContent=baht(s.length?ums/s.length:0);$("#d-db").textContent=baht(ums-cost);
  $("#saleslist").innerHTML=s.length?s.map(x=>{
    const c=x.custId?CUST.find(k=>k.id===x.custId):null;
    return `<div class="lrow"><div><b>${baht(x.total)}</b> · ${x.pay}<div class="sub">${new Date(x.ts).toLocaleTimeString("de-DE")} · ${x.items.map(i=>i.qty+"×"+i.nr).join(", ")}${c?" · 🎟️"+c.name:""}</div></div></div>`;
  }).join(""):`<div class="empty">${t('no_sales')}</div>`;

  /* Was der Tag vom Lager genommen hat — die Gegenprobe zur Inventur.
     Peter sieht damit abends, ob der Bestand noch zu den Verkaeufen passt. */
  const verbr={};
  s.forEach(x=>Object.keys(x.abzug||{}).forEach(c=>verbr[c]=Math.round(((verbr[c]||0)+x.abzug[c])*100)/100));
  const codes=Object.keys(verbr).sort((a,b)=>verbr[b]-verbr[a]);
  const knapp={}; (SYNCSTAND.knapp||[]).forEach(k=>knapp[k.code]=k.fehlt);
  $("#lagerpanel").style.display=codes.length?"":"none";
  $("#lagerlist").innerHTML=codes.map(c=>{
    const nm=(ZUTATNAME[c]||c), e=(EINHEIT[c]||"g");
    return `<div class="lrow"><div><b>${nm}</b>
      <div class="sub">${c}${knapp[c]?` · ⚠ ${t('stock_short')} (${knapp[c]} ${e})`:""}</div></div>
      <div style="font-weight:800">${verbr[c].toLocaleString("de-DE")} ${e}</div></div>`;
  }).join("");
  syncChip();
}
function exportCSV(){
  const s=todays();let csv="Zeit;Bon;Positionen;Summe_THB;Wareneinsatz_THB;DB_THB;Zahlart;KundeID\n";
  s.forEach(x=>{csv+=[new Date(x.ts).toLocaleString("de-DE"),x.ref||"",x.items.map(i=>i.qty+"x"+i.nr).join("|"),x.total,x.cost,x.total-x.cost,x.pay,x.custId||""].join(";")+"\n";});
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="100blend_verkaeufe_"+today()+".csv";a.click();
}
function copyKIZ(){
  const s=todays();const ums=s.reduce((a,x)=>a+x.total,0),cnt=s.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0),cost=s.reduce((a,x)=>a+x.cost,0);
  const obj={aktiv:true,stand:"Stand "+CFG.loc,heute:{umsatz_thb:ums,becher:cnt,obon_thb:s.length?Math.round(ums/s.length):0,wareneinsatz_thb:cost,db_thb:ums-cost},aktualisiert:new Date().toLocaleString("de-DE")};
  navigator.clipboard.writeText(JSON.stringify(obj,null,2)).then(()=>alert(t('a_copied')));
}
