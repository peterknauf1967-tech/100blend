/* GPS: läuft still im Hintergrund mit (funktioniert offline, GPS braucht kein Netz).
   Beim Speichern wandert die letzte Position in die Charge — als Gedächtnisstütze
   für Stände ohne Nummer. Genauigkeit unter Marktdächern: eher 10–30 m als 5 m,
   deshalb ist die Standnummer/das Kürzel weiterhin die Hauptreferenz. */
let GEO=null;
function geoStart(){
  if(!("geolocation" in navigator))return;
  navigator.geolocation.watchPosition(p=>{
    GEO={lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()};
    const el=document.getElementById("i_geo");
    if(el)el.textContent="📍 GPS ±"+GEO.acc+" m";
  },()=>{ const el=document.getElementById("i_geo"); if(el)el.textContent=t("geo_kein"); },
  {enableHighAccuracy:true,maximumAge:30000});
}

/* Frucht-Suche: Teiltreffer über Englisch + Thai + Deutsch + Code + Hinweis */
const norm=s=>String(s||"").toLowerCase();
function fruchtSuche(q){
  const toks=norm(q).trim().split(/\s+/).filter(Boolean);
  if(!toks.length)return null;                     // null = komplette Liste zeigen
  return FRUCHT.filter(f=>{
    const hay=norm(f[8]+" "+f[2]+" "+f[1]+" "+f[0]+" "+f[3]);
    return toks.every(t=>hay.includes(t));
  });
}

/* Preis-Check gegen die erfassten Referenzpreise (Notion, 11.07.2026) */
function prUrteil(code,pr){
  const f=fr(code), lo=f[6], hi=f[7];
  if(!pr||lo==null)return["",""];
  const p=+pr, sp=lo===hi?`${lo}`:`${lo}–${hi}`;
  if(p>hi*1.15)return["bad",t("pr_ueber")(sp)];
  if(p>hi)return["warn",t("pr_leicht")(sp)];
  if(p<=lo)return["good",t("pr_gut")(sp)];
  return["",t("pr_ok")(sp)];
}
const lbl=(arr,k)=>{const x=arr.find(a=>a[0]===k);return x?x[1]:k};
const heute=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* Brix-Bewertung: gegen Zielwert, sonst gegen den eigenen bisherigen Schnitt */
function bxUrteil(code,bx){
  if(bx==null||bx==="")return["",""];
  const ziel=fr(code)[4];
  if(ziel!=null)return bx>=ziel?["good","≥ Ziel "+ziel]:bx>=ziel-2?["warn","knapp unter Ziel "+ziel]:["bad","unter Ziel "+ziel];
  const alt=D.filter(e=>e.code===code&&e.bx).map(e=>+e.bx);
  if(alt.length<3)return["","noch kein Vergleich (min. 3 Messungen)"];
  const s=alt.reduce((a,b)=>a+b,0)/alt.length;
  return bx>=s?["good","über eurem Schnitt "+s.toFixed(1)]:["bad","unter eurem Schnitt "+s.toFixed(1)];
}

/* Gesamturteil: Brix UND Nase. Eine Fehlnote kippt die Charge, egal wie süß. */
function urteil(e){
  if(e.feh&&e.feh.length)return"bad";
  const [c]=bxUrteil(e.code,e.bx);
  if(e.duft&&+e.duft<=2)return"bad";
  if(c==="good"&&(!e.duft||+e.duft>=4))return"good";
  return c==="bad"?"bad":"";
}

}

function liste(){
  if(!D.length)return `<div class="empty">${t("leer")}</div>`;
  return D.slice().reverse().map((e,ri)=>{
    const i=D.length-1-ri, f=fr(e.code), [bcls,btxt]=bxUrteil(e.code,e.bx),
          [pcls,ptxt]=prUrteil(e.code,e.pr), cls=urteil(e);
    const tags=[...(e.des||[]).map(k=>`<span>${esc(lbl(DUFT,k))}</span>`),
                ...(e.feh||[]).map(k=>`<span class="bad">⚠ ${esc(lbl(FEHL,k))}</span>`)].join("");
    return `<div class="e ${cls}">
      <div class="eh"><span class="code">${e.code}</span><b>${esc(f[1])}</b>
        <span class="d">${esc(e.dat)}</span></div>
      <div class="meta">
        ${e.sorte?`Sorte <b>${esc(e.sorte)}</b> · `:""}${e.pr?`<b>${e.pr} ฿/kg</b>`:"Preis –"}${e.kg?` · ${e.kg} kg`:""}
        ${e.bx?` · <span class="bx ${bcls}">${e.bx} °Bx</span>`:""}
        ${e.duft?` · <span class="ns">👃 ${e.duft}/5</span>`:""}
        ${e.note?` · Gesamt <b>${e.note}/5</b>`:""}
      </div>
      ${tags?`<div class="tags">${tags}</div>`:""}
      <div class="meta">${e.h?esc(e.h):t("haendler_leer")}${e.lat?` · 📍±${e.acc} m`:""}${btxt?` · ${esc(btxt)}`:""}${ptxt?` · <b class="bx ${pcls}">${esc(ptxt)}</b>`:""}${e.bem?` · <i>${esc(e.bem)}</i>`:""}</div>
      <div class="bar" style="margin:8px 0 0">
        <button class="b edit" data-i="${i}" style="padding:6px 11px;font-size:12.5px">${t("nachtragen")}</button>
        <button class="b del" data-i="${i}" style="padding:6px 11px;font-size:12.5px">${t("loeschen")}</button></div>
    </div>`;
  }).join("");
}

function auswertung(){
  if(D.length<2)return `<div class="empty">${t("aus_leer")}</div>`;
  const m=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const top=(es,feld,arr)=>{const c={};es.forEach(e=>(e[feld]||[]).forEach(k=>c[k]=(c[k]||0)+1));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>lbl(arr,k)+" ×"+n).join(", ")};

  const grp={};
  D.forEach(e=>{const k=e.code+"|"+(e.sorte||"—");(grp[k]=grp[k]||[]).push(e)});
  const rows=Object.entries(grp).map(([k,es])=>{
    const [code,sorte]=k.split("|");
    return{code,sorte,n:es.length,
      bx:m(es.filter(e=>e.bx).map(e=>+e.bx)),
      du:m(es.filter(e=>e.duft).map(e=>+e.duft)),
      no:m(es.filter(e=>e.note).map(e=>+e.note)),
      pr:m(es.filter(e=>e.pr).map(e=>+e.pr)),
      dtop:top(es,"des",DUFT), ftop:top(es,"feh",FEHL)};
  }).sort((a,b)=>(b.no||0)-(a.no||0)||(b.du||0)-(a.du||0));

  const hg={};
  D.forEach(e=>{if(e.h){(hg[e.h]=hg[e.h]||[]).push(e)}});
  const hr=Object.entries(hg).map(([h,es])=>({h,n:es.length,
      bx:m(es.filter(e=>e.bx).map(e=>+e.bx)),
      du:m(es.filter(e=>e.duft).map(e=>+e.duft)),
      no:m(es.filter(e=>e.note).map(e=>+e.note)),
      fq:es.filter(e=>e.feh&&e.feh.length).length}))
    .sort((a,b)=>(b.du||0)-(a.du||0));

  return `<h2>${t("aus_frucht")}</h2>
  <table><tr><th>Frucht / Sorte</th><th class="n">n</th><th class="n">Ø °Bx</th><th class="n">Ø 👃</th><th class="n">Ø Note</th><th class="n">Ø ฿/kg</th></tr>
  ${rows.map(r=>`<tr><td><span class="code">${r.code}</span> ${esc(fr(r.code)[1])} · ${esc(r.sorte)}
      ${r.dtop?`<br><small>👃 ${esc(r.dtop)}</small>`:""}${r.ftop?`<br><small style="color:var(--miss)">⚠ ${esc(r.ftop)}</small>`:""}</td>
    <td class="n">${r.n}</td><td class="n">${r.bx?r.bx.toFixed(1):"–"}</td>
    <td class="n">${r.du?r.du.toFixed(1):"–"}</td>
    <td class="n">${r.no?r.no.toFixed(1):"–"}</td><td class="n">${r.pr?r.pr.toFixed(1):"–"}</td></tr>`).join("")}</table>

  <h2>${t("aus_haendler")}</h2>
  <table><tr><th>Händler / Markt</th><th class="n">Chargen</th><th class="n">Ø °Bx</th><th class="n">Ø 👃</th><th class="n">Ø Note</th><th class="n">Fehlnoten</th></tr>
  ${hr.length?hr.map(r=>`<tr><td>${esc(r.h)}</td><td class="n">${r.n}</td>
    <td class="n">${r.bx?r.bx.toFixed(1):"–"}</td><td class="n">${r.du?r.du.toFixed(1):"–"}</td>
    <td class="n">${r.no?r.no.toFixed(1):"–"}</td><td class="n">${r.fq||"–"}</td></tr>`).join("")
    :`<tr><td colspan="6">Noch kein Händler erfasst.</td></tr>`}</table>

  <div class="tip" style="margin-top:16px">
    <b>Was du daraus machst:</b> Sobald eine Zeile 4–5 Chargen hat, sind ihr Ø-Brix <b>und</b> ihr Ø-Duft euer
    Zielwert für diese Frucht. Beides in <code>_grundlagen/11_sorten-und-einkaufsspezifikation.md</code> eintragen.<br>
    <b>Die spannendste Spalte ist Ø 👃:</b> zwei Sorten mit gleichem Brix, aber unterschiedlichem Duft —
    da entscheidet sich, welche in den Becher kommt. Süße kann man nicht schmecken lassen, Aroma schon.
  </div>`;
}

function render(){
  const n=D.length, bxA=D.filter(e=>e.bx).length, duA=D.filter(e=>e.duft).length;
  $("sum").innerHTML=n?`${t("sum_chargen")(n)}<br>${bxA} × Brix · ${duA} × 👃`:t("sum_leer");
  document.querySelectorAll(".tabs button").forEach(b=>{
    b.classList.toggle("on",b.dataset.v===view);
    b.textContent=t("tab_"+b.dataset.v);
  });
  const v=$("view"), bar=`<div class="bar">
      <button class="b p" id="send">${t("senden")}</button>
      <button class="b" id="csv">${t("csv")}</button>
      <button class="b r" id="clear">${t("alles_loeschen")}</button></div>
    <div class="note" style="margin-top:2px">${t("send_note")}</div>`;
  /* Leiste immer zeigen, auch bei leerer Liste — sonst "fehlt das Menü",
     wenn die Chargen des Geräts gesendet+gelöscht wurden (Peter, 15.08.) */
  if(view==="neu"){v.innerHTML=formular();bindForm();}
  else if(view==="liste"){v.innerHTML=liste()+bar;bindList();}
  else {v.innerHTML=auswertung()+bar;bindList();}
  $("out").style.display="none";
}

function bindForm(){
  const hint=()=>{
    const f=fr(CODE), lo=f[6], hi=f[7];
    const preis = lo==null ? t("pr_keine") : t("pr_ref")(lo===hi?`${lo}`:`${lo}–${hi}`);
    const tk=TK_CODES.includes(CODE);
    $("i_hint").innerHTML=(f[5]
      ? `${t("s_krit")} ${esc(f[3])}${f[4]?t("s_ziel")(f[4]):""}`
      : `${t("s_egal")} ${esc(f[3])}`)
      +`<br>${preis}<span id="i_prchk"></span>`
      +(tk?`<br>${t("tk_info")}`:"");
    $("sorten").innerHTML=f[3].split("·").map(s=>`<option value="${esc(s.trim().replace(/\s*\d+([–-]\d+)?\s*$/,""))}">`).join("")
      +[...new Set(D.filter(e=>e.code===CODE&&e.sorte).map(e=>e.sorte))].map(s=>`<option value="${esc(s)}">`).join("");
    prCheck();
  };
  const prCheck=()=>{
    const el=$("i_prchk"); if(!el)return;
    const [c,t]=prUrteil(CODE,kgPreis());
    el.innerHTML=t?` · <b class="bx ${c}">${esc(t)}</b>`:"";
    sumCheck();
  };

  /* Gegenprobe gegen den Kassenzettel: Menge × Preis muss das sein, was wirklich
     bezahlt wurde. Ohne diese Zeile ist nicht erkennbar, ob jemand versehentlich
     den GESAMTPREIS ins Feld "pro kg" getippt hat (Vorfall 13.08., Drachenfrucht). */
  const sumCheck=()=>{
    const el=$("i_sum"); if(!el)return;
    const kg=parseFloat($("i_kg").value), ges=parseFloat($("i_ges").value), pr=kgPreis();
    if(!(kg>0)||!(ges>0)){ el.innerHTML=""; return; }
    const stk=STUECK_CODES.includes(CODE), th=lang()==="th";
    const einheit=stk?(th?"ลูก":"Stück"):"kg";
    let s = th
      ? `🧾 ${ges} ฿ ÷ ${kg} ${einheit} = <b>${pr} ฿/${einheit}</b>`
      : `🧾 ${ges} ฿ ÷ ${kg} ${einheit} = <b>${pr} ฿/${einheit}</b> — daraus rechnet die App weiter`;
    /* Was kostet das, was wirklich in den Becher kommt? */
    const a=$("i_verarb")&&$("i_verarb").checked?100:AUSBEUTE[CODE];
    if(a&&a<100&&!stk){
      const eff=Math.round(pr/a*100);
      s += th
        ? `<br>🥤 เนื้อผลไม้จริง ~${a}% → <b>${eff} ฿/kg</b> ที่ใช้ได้จริง`
        : `<br>🥤 Ausbeute ~${a} % → <b>${eff} ฿/kg Fruchtfleisch</b> (das ist die Zahl für die Kalkulation)`;
    }
    el.innerHTML=s;
  };

  /* Markt-Chips: einmal antippen, bleibt für den ganzen Markttag stehen */
  const setMarkt=m=>{
    MARKT=m; localStorage.setItem("bl_markt",m);
    $("i_markt").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  };
  $("i_markt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    setMarkt(b.dataset.m===MARKT?"":b.dataset.m)};
  setMarkt(MARKT);

  /* TK-Beutel von GO Wholesale: Markt, 1 kg und aktueller Preis stehen schon fest.
     Nur füllen, was leer ist oder noch aus der letzten Vorbelegung stammt —
     was Peter selbst eingetippt hat, bleibt unangetastet. */
  const auto={i_kg:null,i_ges:null};
  const setAuto=(id,val)=>{
    const el=$(id); if(!el)return;
    if(el.value===""||el.value===String(auto[id]??"")){ el.value=val==null?"":val; auto[id]=val; }
  };
  const vorbelegen=()=>{
    /* Markt kommt seit dem Start-Dialog aus der Sitzung — Frucht-Auswahl
       belegt ihn nur noch vor, wenn noch gar keiner gewählt ist */
    const f=fr(CODE), tk=TK_CODES.includes(CODE);
    if(!MARKT)setMarkt(tk?TK_HAENDLER:"Ratanakorn");
    setAuto("i_kg",tk?1:null);
    setAuto("i_ges",tk?f[6]:null);   /* TK = 1-kg-Beutel, also Gesamtbetrag = ฿/kg */
  };

  /* Frucht-Suchfeld: tippen filtert über EN/TH/DE, antippen wählt aus */
  const such=$("i_such"), list=$("i_list"), pick=$("i_pick");
  const th=lang()==="th";
  const namen=f=>th?`<b>${esc(f[2]||f[8])}</b> · ${esc(f[8])}`:`<b>${esc(f[8])}</b> · ${esc(f[2])} · ${esc(f[1])}`;
  const frow=f=>`<button type="button" class="frow" data-c="${f[0]}">${namen(f)}
      <small>${esc(f[3])}</small></button>`;
  const listHtml=q=>{
    const res=fruchtSuche(q);
    if(res===null)return GRUPPEN.map(g=>`<div class="fgrp">${esc(g[0])}</div>`+g[1].map(frow).join("")).join("");
    if(!res.length)return `<div class="fgrp">${t("nix")}</div>`+frow(fr("XX"));
    return res.map(frow).join("");
  };
  const zeigen=()=>{list.innerHTML=listHtml(such.value);list.style.display="block";};
  const waehlen=c=>{
    CODE=c; localStorage.setItem("bl_code",c);
    const f=fr(c);
    pick.innerHTML=`<div class="meta">✓ ${namen(f)} <span class="code">${f[0]}</span></div>`;
    const rtxt=th?(f[10]||f[9]):f[9];
    $("i_reife").innerHTML=`<b>${t("reife_t")(esc(th?(f[2]||f[1]):f[1]))}</b><br>${esc(rtxt||"")}`;
    list.style.display="none"; such.value="";
    vorbelegen(); hint();
  };
  such.oninput=zeigen;
  such.onfocus=zeigen;
  list.onclick=e=>{const b=e.target.closest("button.frow");if(b)waehlen(b.dataset.c)};
  $("i_ges").oninput=prCheck;
  $("i_kg").oninput=prCheck;
  if($("i_verarb"))$("i_verarb").onchange=sumCheck;
  sumCheck();

  const paint=(id,n)=>$(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=n));
  if(EDIT>=0){
    /* Zuhause-Nachtragen: gespeicherte Charge in die Maske laden */
    const e=D[EDIT];
    waehlen(e.code);
    const m=MAERKTE.find(x=>e.h&&e.h.indexOf(x)===0)||"";
    setMarkt(m);
    $("i_stand").value=e.h?e.h.slice(m.length).replace(/^ Stand /,"").trim():"";
    $("i_sorte").value=e.sorte||"";$("i_kg").value=e.kg||"";
    $("i_ges").value=e.ges||((e.pr&&e.kg)?Math.round(e.pr*e.kg*10)/10:"");
    if($("i_verarb"))$("i_verarb").checked=!!e.verarb;
    $("i_who").value=e.who||WHO;$("i_dat").value=e.dat||heute();
    $("i_bx").value=e.bx||"";$("i_bem").value=e.bem||"";
    note=+e.note||0;duft=+e.duft||0;des=(e.des||[]).slice();feh=(e.feh||[]).slice();
    paint("i_note",note);paint("i_duft",duft);
    des.forEach(k=>{const b=$("i_des").querySelector(`button[data-k="${k}"]`);if(b)b.classList.add("on")});
    feh.forEach(k=>{const b=$("i_feh").querySelector(`button[data-k="${k}"]`);if(b)b.classList.add("on")});
    $("i_lab").open=true;
    $("add").textContent=t("sichern_edit");
  } else waehlen(CODE);

  const sterne=(id,setter)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
    const n=+b.dataset.n; setter(n);
    $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=n))}};
  sterne("i_note",n=>note=n); sterne("i_duft",n=>duft=n);

  const toggle=(id,list)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
    const k=b.dataset.k, i=list.indexOf(k);
    if(i<0)list.push(k); else list.splice(i,1);
    b.classList.toggle("on",i<0)}};
  toggle("i_des",des); toggle("i_feh",feh);

  $("add").onclick=()=>{
    WHO=$("i_who").value.trim(); localStorage.setItem("bl_who",WHO);
    const stand=$("i_stand").value.trim();
    const e={who:WHO,dat:$("i_dat").value||heute(),code:CODE,sorte:$("i_sorte").value.trim(),
      bx:$("i_bx").value,kg:$("i_kg").value,ges:$("i_ges").value,pr:kgPreis(),
      verarb:$("i_verarb")&&$("i_verarb").checked?1:"",
      h:MARKT?(MARKT+(stand?" Stand "+stand:"")):stand,
      duft:duft||"",des:des.slice(),feh:feh.slice(),note:note||"",bem:$("i_bem").value.trim()};
    if(!e.bx&&!e.ges&&!e.sorte&&!e.duft){alert(t("alert_min"));return}
    if(EDIT>=0){
      /* beim Nachtragen die Markt-GPS-Position behalten — die Heim-Position wäre falsch */
      const alt=D[EDIT];
      if(alt.lat){e.lat=alt.lat;e.lon=alt.lon;e.acc=alt.acc}
      D[EDIT]=e;EDIT=-1;
    }else{
      if(GEO&&Date.now()-GEO.t<5*60*1000){e.lat=GEO.lat.toFixed(6);e.lon=GEO.lon.toFixed(6);e.acc=GEO.acc}
      D.push(e);
    }
    save();note=0;duft=0;des=[];feh=[];view="liste";render();
  };
}

/* CSV mit BOM, damit Excel die Umlaute und das Thai richtig anzeigt */
function csvText(){
  return "﻿Wer;Datum;Code;Frucht;Sorte;Brix;Duft;Duftnoten;Fehlnoten;Gesamtnote;kg;bezahlt_gesamt_THB;THB/kg;verarbeitet;Haendler;Bemerkung;Lat;Lon;GPSm\n"
    +D.map(e=>[e.who,e.dat,e.code,fr(e.code)[1],e.sorte,e.bx,e.duft,
      (e.des||[]).map(k=>lbl(DUFT,k)).join(" / "),(e.feh||[]).map(k=>lbl(FEHL,k)).join(" / "),
      e.note,e.kg,e.ges,e.pr,e.verarb?"ja":"",e.h,e.bem,e.lat,e.lon,e.acc]
      .map(x=>String(x==null?"":x).replace(/;/g,",")).join(";")).join("\n");
}

/* Vom Handy weg: erst echtes Teilen (LINE/Mail/Drive), sonst Datei-Download */
async function csvSenden(){
  const wer=(WHO||"unbekannt").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const txt=csvText(), name=`100blend_einkauf_${heute()}_${wer}.csv`;
  try{
    const file=new File([txt],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"100blend Einkauf",
        text:`Messreihe ${D.length} Chargen, Stand ${heute()}`});
      return;
    }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  const a=document.createElement("a"), url=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function bindList(){
  const s=$("send");if(s)s.onclick=()=>{if(!D.length){alert(t("leer").replace(/<br>/g,"\n"));return}csvSenden()};

    if(!D.length){alert(t("leer").replace(/<br>/g,"\n"));return}
    $("out").value=csvText().replace(/^﻿/,"");$("out").style.display="block";$("out").select();
  };
  const cl=$("clear");if(cl)cl.onclick=()=>{if(!D.length)return;if(confirm(t("confirm_clear"))){D=[];save();render()}};
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{D.splice(+b.dataset.i,1);save();render()});
  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{EDIT=+b.dataset.i;view="neu";render()});
}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{EDIT=-1;view=b.dataset.v;render()});

/* ---- Start-Dialog (Peter-Aenderung 3): 1. Wer bedient? (stellt die Sprache um)
   2. Markt wählen. Beides gilt, bis die App geschlossen wird (sessionStorage). ---- */
function startDialog(){
  const ov=document.createElement("div");ov.className="overlay";ov.id="startov";
  const step1=()=>{
    ov.innerHTML=`<h1>${T.de.ov_wer}</h1>
      <button class="bigbtn" data-w="Peter">🇩🇪 Peter</button>
      <button class="bigbtn" data-w="Lexi">🇹🇭 Lexi</button>`;
    ov.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      WHO=b.dataset.w;localStorage.setItem("bl_who",WHO);step2();};
  };
  const step2=()=>{
    ov.innerHTML=`<h1>${t("ov_markt")}<br><span style="font-size:14px;color:var(--muted)">${t("ov_markt_i")}</span></h1>`
      +MAERKTE.map(m=>`<button class="bigbtn" data-m="${esc(m)}"${m===MARKT?' style="border-color:var(--accent);border-width:2px"':''}>${esc(m)}</button>`).join("");
    ov.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      MARKT=b.dataset.m;localStorage.setItem("bl_markt",MARKT);
      sessionStorage.setItem("bl_sess","1");ov.remove();render();};
  };
  document.body.appendChild(ov);step1();
}

render();
geoStart();
if(!sessionStorage.getItem("bl_sess"))startDialog();

/* ---- Smartphone: offline lauffähig + auf den Startbildschirm ---- */
if("serviceWorker" in navigator)
  navigator.serviceWorker.register("./sw.js").catch(()=>{});

(function(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(standalone || localStorage.getItem("bl_hidehint")) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const d = document.createElement("div");
  d.className = "tip";
  d.style.cssText = "position:sticky;bottom:0;margin:16px;z-index:20";
  d.innerHTML = '<b>📲 Aufs Handy legen:</b> ' + (ios
      ? 'unten auf <b>Teilen</b> tippen → <b>„Zum Home-Bildschirm"</b>.'
      : 'Browser-Menü ⋮ → <b>„App installieren"</b> bzw. „Zum Startbildschirm hinzufügen".')
    + ' Danach startet sie wie eine App — <b>auch ohne Netz auf dem Markt</b>.'
    + ' <button class="b" style="padding:5px 10px;font-size:12px;margin-left:6px">verstanden</button>';
  d.querySelector("button").onclick=()=>{localStorage.setItem("bl_hidehint","1");d.remove()};
  document.body.appendChild(d);
})();
</script>
</body>
</html>
