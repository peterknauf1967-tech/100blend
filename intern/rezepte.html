<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b;
  --line:#e6e2dc; --accent:#e2543f; --ok:#2f8f5b;
  --A:#4a9d5f; --B:#c88a2e; --C:#8b5cf6; --X:#8b8b8b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line); padding:12px 16px;
  display:flex; align-items:center; gap:12px;
}
.brand{font-weight:800; font-size:19px; letter-spacing:-.02em}
.brand span{color:var(--accent)}
.langs{margin-left:auto; display:flex; gap:4px}
.langs button{
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:7px 11px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
}
.langs button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
main{padding:16px; max-width:760px; margin:0 auto}

/* ---- Kachel-Grid ---- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; text-align:left; cursor:pointer; display:block; width:100%;
  font:inherit; color:inherit; transition:transform .08s;
}
.tile:active{transform:scale(.97)}
.tile .no{font-size:30px; font-weight:800; line-height:1; letter-spacing:-.03em}
.tile .nm{margin-top:6px; font-weight:600; font-size:14px}
/* Thai gleichrangig — gleiche Groesse, gleiches Gewicht, gleiche Farbe.
   Peter, 21.08.2026: "Ich möchte das gleichwertig haben, so dass sich
   keiner benachteiligt fühlt. Gleiches gilt bei ALLEN Rezepten."
   Vorher stand Thai hier in Grau und 13 statt 14 px - eine Kachel, die
   dem Thai-Leser sagt, seine Zeile sei die Fussnote zur deutschen. */
.tile .th{font-weight:600; font-size:14px; margin-top:2px; min-height:19px}
.tile .foot{margin-top:10px; display:flex; align-items:center; gap:6px}
.pill{font-size:11px; font-weight:800; color:#fff; padding:2px 7px; border-radius:99px}
.alg{margin-left:auto; font-size:15px; letter-spacing:1px}

/* ---- Rezept-Ansicht ---- */
.back{
  border:none; background:none; color:var(--accent); font:700 15px/1 inherit;
  padding:6px 0 14px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.rhead{display:flex; align-items:flex-start; gap:14px; margin-bottom:6px}
.rno{
  flex:0 0 auto; width:56px; height:56px; border-radius:14px; background:var(--ink); color:#fff;
  display:grid; place-items:center; font-size:24px; font-weight:800;
}
.rname{font-size:22px; font-weight:800; line-height:1.2; letter-spacing:-.02em}
.rth{color:var(--muted); font-size:15px; margin-top:2px}
.warn{
  background:#fff6e8; border:1px solid #f0d9ae; color:#8a5a10;
  padding:10px 12px; border-radius:10px; font-size:13px; margin:14px 0;
}
h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
   margin:24px 0 10px; font-weight:800}
.zut{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.zut div{display:flex; align-items:center; gap:10px; padding:11px 13px; border-top:1px solid var(--line)}
.zut div:first-child{border-top:none}
.code{
  flex:0 0 auto; font:800 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#f0ede8; border-radius:6px; padding:6px 8px; letter-spacing:.5px;
}
.zn{flex:1; min-width:0}
.zn b{font-weight:600; display:block}
/* Zweite Sprache gleichrangig - gleiche Groesse, gleiche Farbe.
   Peter 21.08.2026: gleiches gilt bei ALLEN Rezepten. Vorher stand die
   Thai-Zeile hier grau und 13 statt 15 px unter der deutschen. */
.zn i{font-style:normal; font-size:15px; display:block; margin-top:1px}
/* THAI IST DIE ARBEITSSPRACHE. Peter, 30.08.2026: "Lexi ist Ausfuehrende,
   Thai muss vorne stehen, ich hab nur eine Kontrollfunktion."
   Thai steht deshalb oben UND groesser als die Kontrollzeile darunter. */
html[lang="th"] .zn b,
html[lang="th"] ol.steps b{font-size:19px; line-height:1.4}
html[lang="th"] .zn i,
html[lang="th"] ol.steps i{font-size:14px; color:var(--muted); font-weight:600}
html[lang="th"] .rname{font-size:25px}
.zg{font-weight:800; white-space:nowrap}
/* Frisch/Gefroren-Chip in Zutaten-Zeile — deutlich sichtbar */
.fg{display:inline-flex;align-items:center;flex:0 0 auto;padding:3px 8px;border-radius:999px;
    font:800 10px/1 inherit;letter-spacing:.4px;margin-left:4px;white-space:nowrap;text-transform:uppercase}
.fg-tk{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.fg-fr{background:#dcfce7;color:#166534;border:1px solid #86efac}

/* ---- Schritte mit Nummernkreis ---- */
ol.steps{list-style:none; margin:0; padding:0; counter-reset:s}
ol.steps li{
  counter-increment:s; position:relative; padding:0 0 20px 48px; min-height:34px;
}
ol.steps li::before{
  content:counter(s,decimal-leading-zero);
  position:absolute; left:0; top:0; width:34px; height:34px; border-radius:50%;
  background:var(--card); border:2px solid var(--ink); color:var(--ink);
  display:grid; place-items:center; font-weight:800; font-size:14px;
}
ol.steps li::after{
  content:""; position:absolute; left:16px; top:38px; bottom:2px; width:2px; background:var(--line);
}
ol.steps li:last-child{padding-bottom:0}
ol.steps li:last-child::after{display:none}
ol.steps b{display:block; font-weight:700; padding-top:6px}
ol.steps i{font-style:normal; font-size:15px; font-weight:700; display:block; margin-top:2px}
/* KENNZEICHNUNG — Worte statt Pflaenzchen. Peter, 22.08.2026: er hat erst
   nach Wochen erfahren, dass das Pflaenzchen vegan bedeutet. Was der
   Betreiber nicht weiss, weiss der Gast nie. */
.kenn{display:inline-block; font:800 11px/1.5 inherit; letter-spacing:.04em;
      border:1.5px solid var(--ink); border-radius:6px; padding:1px 7px; margin-right:5px}
.kenn.vegan{background:#e8f3ea}
.kenn.vegetarisch{background:#f2f0e6}
.kenn.fisch{background:var(--ink); color:#fff}
.kenn.kof{background:#fdf4f3; border-color:#c0392b; color:#c0392b}
.allerg{display:block; margin-top:5px; font-size:13px; color:var(--muted)}
.kennzeile{margin-top:7px}
.tile .alg{margin-left:auto; letter-spacing:0}
.tile .alg .kenn{font-size:10px; margin-right:0}
/* VORSTUFEN-VERLINKUNG — Peter, 21.08.2026: "Kannst du mir die Kacheln
   vom grünen Tee zum Rezept Grüner Tee verlinken? Und bei den anderen
   selbstgemachten Flüssigkeiten auch."
   Zutaten, die wir selbst herstellen, sind antippbar und fuehren auf die
   Herstellungskarte. Der Pfeil rechts sagt, dass da noch etwas kommt -
   ohne ihn tippt niemand darauf, weil die Zeile aussieht wie jede andere. */
.zut div.mach{cursor:pointer; background:#f2f9f4}
.zut div.mach:active{background:#e3f1e8}
.mach .pfeil{font-weight:800; color:var(--accent); white-space:nowrap; font-size:13px}
.vhead{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.vcode{font:800 18px ui-monospace,Menlo,monospace; background:var(--accent); color:#fff;
       border-radius:9px; padding:6px 11px}
.vname{font-weight:800; font-size:20px; line-height:1.2}
.vname span{display:block; font-weight:800; font-size:20px}
.vkurz{background:#eaf5ee; border-left:4px solid var(--accent); border-radius:0 10px 10px 0;
       padding:10px 12px; margin-bottom:8px; font-weight:600}
.vwarn{background:#fdf4f3; border:1px solid #f0cdc8; border-left:4px solid #c0392b;
       border-radius:0 10px 10px 0; padding:10px 12px; margin-bottom:10px}
.vwarum{background:#f7f7f5; border-radius:10px; padding:10px 12px; margin-top:8px}
.voffen{border:1px dashed #c8862a; background:#fdfaf4; border-radius:10px;
        padding:10px 12px; margin-top:8px}
.vzeile{display:block; margin-bottom:5px}
.kalt{font-weight:900; border:1.5px solid var(--ink); border-radius:4px; padding:0 4px}
.tip{background:#eef7f1; border:1px solid #cfe8da; color:#1f5c3c;
     padding:10px 12px; border-radius:10px; font-size:14px; margin-top:6px}
footer{color:var(--muted); font-size:12px; text-align:center; padding:32px 16px 40px}
</style>

 tip:["GEÄNDERT 05.09.2026 (Peter): Wasserspinat raus, Brokkoli TK rein — Wasserspinat war frisch zu beschaffen und welkte schnell, der Brokkoli liegt ohnehin gedämpft und gefroren im Fach. ZWEI FOLGEN: Erstens rutscht er von ② nach ④ — gefroren gehört er ganz nach oben, nicht nach unten zur weichen Ware. Zweitens trägt er mehr Kohlgeschmack als Spinat, deshalb 30 g mehr weiße Drachenfrucht (frisch 40→50 g, gefroren 40→60 g). Gegengesteuert wird mit Frucht, NICHT mit Zucker — der bleibt gesperrt. Die Summe steigt damit auf 473 g und trifft die 16-oz-Bezugsgröße, die Nr. 04 vorher als einziges Rezept verfehlt hat. Wenn er trotzdem zu grün schmeckt: Brokkoli auf 30 g senken, bevor du an der Frucht drehst.",

      "CHANGED 05.09.2026 (Peter): water spinach out, frozen broccoli in — the spinach had to be bought fresh and wilted fast, the broccoli is already steamed and frozen in the drawer. TWO CONSEQUENCES: first it moves from ② to ④ — frozen goods belong on top, not down with the soft ones. Second it carries more cabbage flavour than spinach, so 30 g more white dragon fruit (fresh 40→50 g, frozen 40→60 g). Countered with fruit, NOT with sugar — that stays blocked. The total rises to 473 g and now matches the 16 oz reference size, which Nr. 04 was the only recipe to miss. If it still tastes too green: drop the broccoli to 30 g before touching the fruit."]},

 tip:["GEÄNDERT 05.09.2026 (Peter): Maulbeere gestrichen — 'die werde ich nicht handeln'. Sie stand seit dem 25.08. ohnehin als gesperrt im Katalog, wurde von diesem Rezept aber weiter angefordert. Die 40 g gehen auf die Erdbeere über (60 → 100 g): getestet, Royal Project Nr. 80, gefroren im Haus. · Hibiskustee am Vortag ansetzen: 4–5 getrocknete Blüten auf 1 L Wasser, 10 Min ziehen lassen, abseihen, kalt stellen. Die Blüten kommen NIE trocken in den Mixer. ⚠ Beim ersten Ansatz abschmecken — für 60 ml im Becher darf der Aufguss kräftiger sein. Guave ersetzt das Acerola-Pulver: mehr Vitamin C, lokal, ein Bruchteil des Preises. Astaxanthin NIE ins Standardrezept — nur als bezahlter Booster.",

      "Brew the hibiscus tea a day ahead: 4–5 dried flowers per litre, steep 10 min, strain, chill. Dried flowers never go into the blender. Guava replaces acerola powder: more vitamin C, local, a fraction of the cost. Astaxanthin never in the base recipe — paid booster only."]},

 tip:["GEÄNDERT 05.09.2026 (Peter): Süßtamarinde raus. Sie ist ein Nostalgie-Produkt — was ältere Thais gegessen haben, als es noch keinen 7-Eleven gab —, kostet 180 ฿/kg, muss entkernt werden und schmeckt für sich genommen fad. Ersetzt durch 40 g mehr gut reife Banane, dafür 25 g weniger Kokosmilch: der Becher bleibt gleich groß, wird aber fruchtiger statt dünner. Banane und nicht Mango, weil Kakao und Banane zusammengehören — Mango arbeitet gegen das Kakao-Aroma. Rechnung dahinter: getrocknete Süßtamarinde hat 55–60 g Zucker je 100 g, frische Frucht 14–18 g; 15 g Tamarinde entsprechen also etwa 50–60 g Frucht. · Kürbiskerne über Nacht einweichen, sonst „Grus\" unterm Gebiss. Resveratrol/Traubenkern ist raus (Entscheidung 12.08.): Der Kakao trägt die Polyphenol-Story allein und kostet ein Zehntel.",

      "Soak pumpkin seeds overnight or it turns gritty. Resveratrol removed (decision 12.08.) — cacao carries the polyphenol story alone at a tenth of the cost."]},

 tip:["🔒 NICHT im Verkaufsmenü — Peters persönlicher Smoothie. NEUE FASSUNG 05.09.2026 (Peter): Joghurt trägt den Becher statt Wasser, Whey Protein neu drin, Ananas ersetzt Mango und Beeren, Passionsfrucht grün fürs Aroma. ZWEI MIXGÄNGE SIND ABSICHT: erst alles ohne Brokkoli 35 Sekunden, dann Brokkoli dazu und nochmal 35 Sekunden — so wird er fein, ohne den ganzen Becher warm zu schlagen. ⚠ SOFORT TRINKEN: Ananas enthält Bromelain, ein Enzym, das Eiweiß zerlegt — Einfrieren zerstört es nicht, nur Hitze. Frisch getrunken passiert nichts; stehen gelassen wird der Becher bitter und das Whey verliert seinen Zweck. Kurkuma 0,4 g und Pfeffer 0,1 g bleiben wie am 24.08. festgelegt — der Pfeffer ist nur wegen des Kurkumas drin, Piperin macht Curcumin verfügbar. KEINE Banane, KEIN Zucker (Diabetes), KEIN Grapefruit/Pomelo (Eliquis), KEIN Salz (Bauchwasser). Wenn noch zu grasig: Gurke schälen · Ananas auf 120 g · Brokkoli auf 40 g — in dieser Reihenfolge, Brokkoli zuletzt.",

      "🔒 NOT on the sales menu — Peter's personal smoothie. NEW VERSION 05.09.2026 (Peter): yogurt carries the cup instead of water, whey protein added, pineapple replaces mango and berries, green passion fruit for the aroma. TWO BLENDS ARE DELIBERATE: everything except the broccoli for 35 seconds, then the broccoli and another 35 seconds. ⚠ DRINK IT IMMEDIATELY: pineapple contains bromelain, an enzyme that splits protein — freezing does not destroy it, only heat does. Left standing the cup turns bitter and the whey loses its point. NO banana, NO sugar (diabetes), NO grapefruit or pomelo (Eliquis), NO salt (ascites)."]},

 tip:["⚠ WIEDERHOLUNG mit GEÄNDERTEM REZEPT. Der Ansatz vom 19.08. klemmte und lief erst mit 42 g mehr Flüssigkeit - die Probe war dadurch um 17 % verdünnt, Säure und Süße zählen nicht. Jetzt ist die Flüssigkeit IM Rezept: Kokoswasser hoch, gefrorene Ananas um denselben Betrag runter. Der Becher bleibt 473 g, es kommt kein Wasser dazu - deshalb diesmal NICHTS nachgießen. Wenn es trotzdem klemmt: Menge notieren und melden, nicht schätzen. Kein Eis: das Kokoswasser ist die Flüssigkeit, die gefrorene Ananas die Kälte. Passionsfrucht-Kerne NICHT absieben, das Knacken ist das Erkennungsmerkmal. Passionsfrucht-Kerne NICHT absieben, das Knacken ist das Erkennungsmerkmal.",

 tip:["⚠ VERKOSTET 30.08.2026 (Peter, mit 20 g Whey-Isolat): »Das Proteinpulver war geschmacksneutral. Aber der Smoothie war sehr schwer, süß UND bitter, guter Geschmack durch die Mandelmilch — nach dem Smoothie ist mir übel, als hätte ich 2 Tafeln Schokolade zum Frühstück gegessen. Irgendwas war überdosiert.« NACHGERECHNET, ZWEI URSACHEN: (1) KAKAO WAR DER AUSREISSER — 12 g in 473 ml, die höchste Dosis der ganzen Karte; alle anderen Kakao-Rezepte (07, 36, 39, 44) liegen bei 10 g, Nr. 30 sogar bei 8 g. Auf 10 g gesenkt, damit dieser Becher nicht aus der Reihe fällt. (2) PROTEIN AUF PROTEIN — der Becher trägt schon rund 15,9 g Eigenprotein (21 g Hanfsamen à 31 %, 60 g Seidentofu, dazu Kakao und Mandelmilch). Mit 20 g Isolat kommen 18 g dazu: rund 34 g Protein in EINEM Becher, plus etwa 10 g Fett aus den Hanfsamen. Das ist die Schwere und die Übelkeit. Die Booster-Empfehlung war deshalb falsch: chemisch passt Whey hier (keine Säure, kein Bromelain), ernährungsphysiologisch ist es Doppelung. Ab jetzt rechnet die Karte das Eigenprotein aus und halbiert die Whey-Menge automatisch ab 8 g — für Nr. 17 also 12,5 g statt 25 g. NEU VERKOSTEN mit 10 g Kakao und 12,5 g Whey. PROTEIN-SMOOTHIE der Karte. Die Recherche nennt Schokolade + Kern/Nuss + Banane als die beliebteste Proteinkombination - hier mit Hanfsamen (31 % Protein) und Seidentofu statt Erdnussbutter, weil beides im Haus ist und Hanf keinen Eigengeschmack aufdrängt. ⚠ EHRLICHE ZAHL: das ergibt rund 13 g Protein, nicht die 25-40 g der US-Rezepte - dafür fehlt Proteinpulver. Wer mehr will: 10 g Marine-Kollagen dazu (+9 g), dann ~22 g. Kakao IMMER zuerst in der Flüssigkeit lösen, sonst bleiben Klumpen. Die 0,2 g Salz sind kein Fehler - sie machen den Kakao tiefer. ABWIEGEN, nicht mit den Fingern schaetzen: eine Fingerprise streut zwischen 0,1 und 0,5 g, und bei 0,5 g schmeckt der Becher salzig. Kakao kostet 1.000 THB/kg: 8 g sind bewusst knapp und reichen voellig.",
      "สมูทตี้โปรตีนประจำเมนู · จากการค้นข้อมูล ช็อกโกแลต + ถั่วหรือเมล็ด + กล้วย คือสูตรโปรตีนที่นิยมที่สุด ที่นี่ใช้เมล็ดกัญชง (โปรตีน 31 %) และเต้าหู้อ่อน แทนเนยถั่ว เพราะมีอยู่แล้วทั้งคู่ และกัญชงไม่มีรสของตัวเองมากลบ · ตัวเลขตามจริง: ได้โปรตีนราว 13 กรัม ไม่ใช่ 25-40 กรัม แบบสูตรอเมริกัน เพราะเราไม่ใส่ผงโปรตีน · ถ้าต้องการมากกว่านี้ ใส่มารีนคอลลาเจน 10 กรัม (เพิ่ม 9 กรัม) รวมเป็นราว 22 กรัม · ละลายโกโก้ในของเหลวก่อนเสมอ ไม่อย่างนั้นจะเป็นก้อน · เกลือ 0,2 กรัม ไม่ใช่ความผิดพลาด มันทำให้โกโก้ลึกขึ้น · ต้องชั่ง อย่าหยิบด้วยนิ้ว: หยิบมือหนึ่งได้ตั้งแต่ 0,1 ถึง 0,5 กรัม และที่ 0,5 กรัม แก้วจะเค็ม · โกโก้ราคา 1.000 บาทต่อกิโล 8 กรัม จึงตั้งใจให้น้อยและเพียงพอแล้ว",
      "ALWAYS dissolve the cacao in the liquid first. The pinch of salt deepens the chocolate."]},

 tip:["⚠ GEÄNDERT am 22.08. nach Lexys Verkostung: „zu sauer, ich schmecke kaum Erdbeere heraus.“ Die LIMETTE IST RAUS – 11 g auf 473 g waren der größte Säurebringer, und Säure überdeckt auch das Fruchtaroma. Der alte Tip hatte es vorhergesagt: „zu viel = die Erdbeere verschwindet.“ Die schwache Erdbeere liegt NICHT an der Menge – 220 g sind die höchste aller Rezepte – sondern an der Reife: Erdbeeren reifen nach dem Pflücken nicht nach. Grün gepflückt bleibt sauer, auch im Froster. Nur EINE Änderung, damit man sie zuordnen kann. Ob Salz zusätzlich hilft, klärt der Salz-Test.",
      "แก้ไข 22.08. หลังเล็กซี่ชิม: “เปรี้ยวเกินไป แทบไม่ได้รสสตรอว์เบอร์รี่” · เอามะนาวออก – 11 กรัม ต่อ 473 กรัม คือตัวทำให้เปรี้ยวที่สุด และความเปรี้ยวก็กลบกลิ่นรสผลไม้ด้วย · ทิปเก่าเคยเตือนไว้แล้ว: “ใส่มากไปสตรอว์เบอร์รี่จะหาย” · รสสตรอว์เบอร์รี่ที่อ่อน ไม่ได้เพราะปริมาณ – 220 กรัม มากที่สุดในทุกสูตร – แต่เพราะความสุก: สตรอว์เบอร์รี่ไม่สุกต่อหลังเก็บ เก็บตอนเขียวก็เปรี้ยวตลอด แม้แช่แข็ง · แก้อย่างเดียว จะได้รู้ว่าอะไรทำให้ต่าง · เกลือจะช่วยไหม ดูจากการทดสอบเกลือ",
      "CHANGED 22.08. after Lexy tasted it: “too sour, hardly any strawberry.” The LIME IS OUT. Strawberries are non-climacteric – they never ripen after picking, so berries harvested green stay sour, freezer or not. The weak flavour is a ripeness problem, not a quantity problem. One change only."]},

 tip:["Der einzige auf der Karte mit echter Schärfe — der KICK ist der Ingwer, und er wärmt im Hals nach. ⚠ 5 g ist der Startwert und die wichtigste Zahl dieses Rezepts: 3 g merkt kaum jemand, 8 g vertreiben Gäste. Beim Verkosten in 2-g-Schritten herantasten und den gefundenen Wert hier eintragen. Ingwer IMMER frisch reiben, nie vorher schneiden — das Aroma ist nach einer Stunde weg.",
      "แก้วเดียวในเมนูที่เผ็ดร้อนจริง — จุดเด่นคือขิง ที่ยังอุ่นคอหลังกลืน · 5 กรัม คือค่าเริ่มต้นและเป็นตัวเลขที่สำคัญที่สุดของสูตรนี้: 3 กรัม แทบไม่มีใครรู้สึก 8 กรัม ไล่ลูกค้าหนี · ตอนชิมให้ค่อย ๆ ปรับทีละ 2 กรัม แล้วจดค่าที่ได้ไว้ตรงนี้ · ขูดขิงสดทุกครั้ง ห้ามหั่นทิ้งไว้ก่อน กลิ่นจะหายไปภายในหนึ่งชั่วโมง",
      "The only one on the card with real heat — the KICK is ginger and it warms the throat afterwards. 5 g is the starting value and the most important number in this recipe. Always grate ginger fresh."]},

      "NEW 20.08., never blended. Blackcurrant is very tart - the mango is the counterweight. Deliberately wetter than No. 16."]},

      "สูตรสตรอว์เบอร์รี่ที่ถูกทำตามมากที่สุดในอินเทอร์เน็ต — สตรอว์เบอร์รี่ มะม่วง และกล้วย ปรากฏเป็นสามอย่างนี้พอดีในเว็บสูตรอาหารอิสระนับสิบแห่ง · มะม่วงยังเป็นผลไม้หลักของไทย (Mango Tango, กรุงเทพฯ) และเป็นรสที่ขายดีที่สุดของ Jamba Juice · ไม่ใส่โยเกิร์ต ไม่ใส่นม: น้ำมะพร้าวทำให้เบาและออกเขตร้อน แทนที่จะครีมมี่ — นี่คือความต่างจากเบอร์ 26",

 tip:["BEAUTY-SMOOTHIE der Karte. Die drei Früchte sind nicht nach Farbe gewählt, sondern weil jede in der Recherche einzeln als Hautzutat genannt wird: Ananas liefert Vitamin C, das der Körper zur Kollagenbildung braucht; Erdbeere enthält Ellagsäure, die den Kollagenabbau bremst; Mango bringt Carotinoide, die für den Glow genannt werden. Kokoswasser statt Milch, weil Hydration Teil der Wirkung ist. ⚠ WELLNESS-SPRACHE, KEIN HEILVERSPRECHEN - nach außen nur \"für Haut und Frische\", nie eine Wirkung behaupten. Kollagen IMMER zuerst in der Flüssigkeit lösen, sonst klumpt es.",
      "สมูทตี้เพื่อความงามประจำเมนู · ผลไม้สามอย่างนี้ไม่ได้เลือกตามสี แต่เพราะแต่ละอย่างถูกระบุแยกกันว่าดีต่อผิว: สับปะรดให้วิตามินซี ซึ่งร่างกายต้องใช้สร้างคอลลาเจน · สตรอว์เบอร์รี่มีกรดเอลลาจิก ซึ่งชะลอการสลายคอลลาเจน · มะม่วงให้แคโรทีนอยด์ ที่ถูกพูดถึงเรื่องผิวเปล่งปลั่ง · ใช้น้ำมะพร้าวแทนนม เพราะการเติมน้ำให้ร่างกายเป็นส่วนหนึ่งของผล · ใช้ภาษาแบบเวลเนส ห้ามอ้างสรรพคุณรักษา — พูดกับลูกค้าได้แค่ว่า เพื่อผิวและความสดชื่น ห้ามอ้างผลลัพธ์ · ละลายคอลลาเจนในของเหลวก่อนเสมอ ไม่อย่างนั้นจะจับตัวเป็นก้อน",
      "The BEAUTY smoothie. Pineapple for vitamin C, strawberry for ellagic acid, mango for carotenoids. Dissolve the collagen in the liquid first."]},

 tip:["NEU 20.08., noch nie gemixt. DREI Antworten auf Peters Frage. (1) Mixbar: NICHT gefrorene Orangenspalten nehmen - die weißen Häute sind bitter und werden mitgemixt. Stattdessen eigenen Saft flach einfrieren und brechen: 100 % Frucht, kein Wasser, kein Eiszusatz, und die Kälte kommt aus der Orange selbst. Die Mango gibt den Körper, den Saft allein nie hat. (2) Was ballert: die ZESTE. Das Aroma der Orange sitzt zu über 90 % als Limonen im Schalenöl, nicht im Saft - deshalb riecht geschälte Orange stärker als gepresste. 1 g Abrieb macht mehr aus als 100 g mehr Saft. (3) Das Salz ist keine Erfindung: Thai-Saftstände geben ins Nam Som traditionell Sirup MIT einer Prise Salz. Wir behalten das Salz und lassen den Zucker weg. ⚠ Nicht bis zum letzten Tropfen pressen - der letzte Druck holt die Bitterstoffe aus der weißen Haut.",
      "ใหม่ 20.08. ยังไม่เคยปั่น · สามคำตอบต่อคำถามของปีเตอร์ · (1) ปั่นได้หรือไม่: อย่าใช้ส้มแช่แข็งทั้งกลีบ เยื่อขาวจะขมและถูกปั่นไปด้วย ให้แช่แข็งน้ำส้มที่คั้นเองเป็นแผ่นบางแล้วหักใช้แทน: ผลไม้ 100 % ไม่มีน้ำ ไม่มีน้ำแข็งเพิ่ม และความเย็นมาจากส้มเอง · มะม่วงให้เนื้อสัมผัสที่น้ำส้มอย่างเดียวไม่มีวันมี · (2) อะไรคือตัวชูรส: ผิวส้มขูด กลิ่นส้มกว่า 90 % คือลิโมนีนในน้ำมันที่เปลือก ไม่ใช่ในน้ำ ส้มที่ปอกจึงหอมกว่าส้มที่คั้น · ผิวขูด 1 กรัม ได้ผลมากกว่าน้ำส้มเพิ่ม 100 กรัม · (3) เกลือไม่ใช่สิ่งที่เราคิดขึ้นเอง: ร้านน้ำส้มไทยใส่น้ำเชื่อมพร้อมเกลือหยิบมือในน้ำส้มมาแต่ไหนแต่ไร เราเก็บเกลือไว้และตัดน้ำตาลออก · อย่าคั้นจนหมดเกลี้ยง แรงบีบครั้งสุดท้ายจะดึงความขมจากเยื่อขาวออกมา",
      "NEW 20.08., never blended. Do NOT use frozen orange segments - the white membranes are bitter. Freeze your own juice instead. The aroma of an orange is over 90 % limonene in the PEEL oil, not in the juice - 1 g of zest beats 100 g more juice. The salt is traditional in Thai nam som; we keep the salt and drop the sugar."]},

 tip:["NEU 21.08., noch nie gemixt. Der naheliegende Kaffee-Smoothie: Kaffee, Schokolade und Banane sind die Kombination, die weltweit auf jeder Frühstückskarte steht. Die ganze Süße kommt aus der gefrorenen Banane — deshalb muss sie reif sein, eine grüne Banane macht diesen Becher bitter. Das Salz ist kein Zierrat: es dämpft die Bitterkeit des Kaffees hörbar, das ist derselbe Trick, den Barista mit einer Prise im Filterkaffee anwenden. ⚠ KOFFEIN: gehört auf die Karte, nicht für Kinder, Hinweis für Schwangere. ⚠ Espresso morgens für den ganzen Tag vorbereiten und kalt stellen — siehe Vorstufen-Karte KF.",
      "ใหม่ 21.08. ยังไม่เคยปั่น · กาแฟ ช็อกโกแลต และกล้วย คือส่วนผสมที่อยู่ในเมนูเช้าทั่วโลก · ความหวานทั้งหมดมาจากกล้วยแช่แข็ง กล้วยต้องสุก ถ้าดิบแก้วนี้จะขม · เกลือไม่ใช่ของประดับ มันลดความขมของกาแฟได้จริง · คาเฟอีน: ต้องระบุบนเมนู ไม่เหมาะกับเด็ก มีคำเตือนสำหรับหญิงตั้งครรภ์ · ชงเอสเปรสโซตอนเช้าสำหรับทั้งวันแล้วแช่เย็น ดูการ์ด KF",
      "NEW 21.08., never blended. Coffee, chocolate and banana is the combination on breakfast menus worldwide. All the sweetness comes from the frozen banana - it must be ripe. The salt dampens the coffee's bitterness, the same trick baristas use with a pinch in filter coffee. CAFFEINE: must be on the menu card, not for children."]},

 tip:["NEU 21.08., noch nie gemixt. Kein Experiment, sondern ein Klassiker der Region: Avocado mit Kaffee wird in Vietnam als cà phê bơ und in Indonesien als es alpukat kopi seit Jahrzehnten getrunken — dort mit gezuckerter Kondensmilch. Wir lassen den Zucker weg und holen die Süße aus der gefrorenen Banane. Das ist der Becher, der uns von jedem anderen Stand in Pattaya unterscheidet, und Avocado steht mit Nr. 11 ohnehin schon im Einkauf. ⚠ Avocado MUSS reif sein — eine harte Avocado schmeckt nach nichts und macht den Becher grasig. Daumendruck am Stielansatz: gibt leicht nach = reif. ⚠ KOFFEIN auf die Karte.",
      "ใหม่ 21.08. ยังไม่เคยปั่น · ไม่ใช่การทดลอง แต่เป็นของคลาสสิกในภูมิภาค เวียดนามเรียก cà phê bơ อินโดนีเซียเรียก es alpukat kopi ดื่มกันมาหลายสิบปี ที่นั่นใส่นมข้นหวาน เราตัดน้ำตาลออกและเอาความหวานจากกล้วยแช่แข็งแทน · อะโวคาโดต้องสุก ถ้าแข็งจะไม่มีรสและเหม็นเขียว กดที่ขั้วเบา ๆ ถ้านิ่มคือสุก · อะโวคาโดมีอยู่ในรายการสั่งซื้ออยู่แล้วจากสูตรเบอร์ 11 · ต้องระบุคาเฟอีนบนเมนู",
      "NEW 21.08., never blended. Not an experiment but a regional classic: avocado with coffee is drunk in Vietnam as ca phe bo and in Indonesia as es alpukat kopi, there with sweetened condensed milk. We drop the sugar and take the sweetness from the frozen banana. The avocado MUST be ripe."]},

 tip:["DER KICK IST DIE GRÜNE PASSIONSFRUCHT — und sie ist das Gegenteil der Erdbeere, an der wir uns heute die Zähne ausgebissen haben: sie bringt das Aroma MIT der Säure, nicht ohne. ⚠ Peters Urteil vom 23.08. („mehr Säure, aber auch viel mehr Aroma\") widerspricht der Katalognotiz vom 14.08., die die ROTE als die aromatischere führte — beide nebeneinander gegenprüfen, bevor über den Preis entschieden wird. RECHNUNG: grün kostet 271 ฿ je kg Fruchtmark gegen 158 bei rot, also 72 % mehr; das gleicht sich aus, sobald 58 % der Menge für dasselbe Aroma reichen. KERNE BLEIBEN DRIN — das Knacken ist das Erkennungsmerkmal, und die Kerne tragen den größten Teil der Ballaststoffe: rohe Passionsfruchtkerne liegen bei 64,8 g je 100 g, Kerne und Mark zusammen bei 53,5 g. Wer absiebt, siebt genau das weg. KOKOSMILCH IST KEIN FÜLLER, sondern der Aromaträger: Fett bindet die fettlöslichen Aromastoffe und hält sie länger im Mund — genau das, was die fettarme Hafermilch bei Nr. 21 nicht konnte. ⚠ NEU 23.08., noch nie gemixt. Salz-Test durchführen: bei dieser Säure ist Salz der stärkste Hebel.",
      "จุดเด่นคือเสาวรสสีเขียว และมันตรงข้ามกับสตรอว์เบอร์รี่ที่เรามีปัญหาวันนี้: มันให้กลิ่นรสมาพร้อมความเปรี้ยว ไม่ใช่เปรี้ยวเพียงอย่างเดียว · คำตัดสินของปีเตอร์ 23.08. (“เปรี้ยวกว่า แต่ก็หอมกว่ามาก”) ขัดกับบันทึกในคู่มือเมื่อ 14.08. ที่ระบุว่าพันธุ์สีม่วงหอมกว่า — ต้องชิมเทียบกันก่อนตัดสินเรื่องราคา · ตัวเลข: สีเขียวราคา 271 บาทต่อกิโลเนื้อ ส่วนสีม่วง 158 บาท แพงกว่า 72 % จะคุ้มกันถ้าใช้เพียง 58 % ของปริมาณก็ได้กลิ่นเท่าเดิม · ห้ามกรองเมล็ดออก — เสียงกรุบคือเอกลักษณ์ และเมล็ดคือส่วนที่มีใยอาหารมากที่สุด: เมล็ดดิบ 64,8 กรัม ต่อ 100 กรัม เมล็ดรวมเนื้อ 53,5 กรัม · ใครกรอง ก็กรองสิ่งนี้ทิ้ง · กะทิไม่ใช่ตัวเติม แต่เป็นตัวพากลิ่น: ไขมันจับกลิ่นที่ละลายในไขมันและเก็บไว้ในปากนานกว่า — สิ่งที่นมข้าวโอ๊ตไขมันต่ำทำไม่ได้ในเบอร์ 21 · ใหม่ 23.08. ยังไม่เคยปั่น · ให้ทำการทดสอบเกลือ: ที่ความเปรี้ยวระดับนี้ เกลือคือตัวช่วยที่แรงที่สุด",
      "THE KICK IS THE GREEN PASSION FRUIT — the opposite of the strawberry problem: it brings the aroma WITH the acid, not without it. Seeds stay in: raw passion fruit seeds carry 64.8 g dietary fibre per 100 g, seeds and pulp together 53.5 g. Straining removes exactly that. Coconut milk is not a filler but the aroma carrier — fat binds the fat-soluble aromatics. NEW 23.08., never blended."]},

 tip:["MANGO FUEHRT, ANANAS GIBT DEN KICK — 175 g gegen 117,7 g, also rund 1,5 : 1. Andersherum kippt der Becher in die Saeure, und die duenne Mandelmilch faengt das nicht auf. WARUM 180 g FLUESSIG: alle Basis-Rezepte liegen bei 35-48 % Fluessigkeit; Nr. 16 (Ananas-Passionsfrucht-Kokos, Peters bester mit 9 Punkten) liegt bei 38 % — genau darauf ist dieser hier gesetzt. ⚠ KARTON PRUEFEN: unsere Mandelmilch ist V-Soy, also von einem Soja-Hersteller. Steht Sojaprotein in der Zutatenliste, kann die Ananas-Saeure es ausflocken — dieselbe Regel wie bei Nr. 20 und Nr. 21. Reine Mandelmilch hat zu wenig Protein dafuer und ist unproblematisch. ⚠ PROTEIN-ZUSATZ NICHT ZU DIESEM BECHER: Ananas enthaelt Bromelain, und Einfrieren zerstoert das Enzym nicht (nur Hitze tut das). Bromelain spaltet Protein in bittere Bruchstuecke. Wer Protein bestellt, bekommt es besser in Nr. 17. ⚠ SCHWACHSTELLE: Mandelmilch ist fettarm, und die Mango-Aromastoffe sind fettloeslich — dasselbe Nadeloehr, an dem Nr. 21 mit Hafermilch gescheitert ist. Wenn der Becher flach schmeckt, liegt es daran, nicht an der Menge. Gegenprobe: dieselbe Rezeptur mit Kokosmilch statt Mandelmilch nebeneinander verkosten. ⚠ NEU 24.08.2026, noch nie gemixt. Erst mit dem Verkostungsbogen bewerten, dann auf die Karte.",
      "มะม่วงเป็นตัวนำ สับปะรดเป็นตัวชูรส — 175 กรัม ต่อ 117,7 กรัม ประมาณ 1,5 : 1 · ถ้าสลับกัน แก้วจะเปรี้ยวเกินไป และนมอัลมอนด์ที่บางเกินจะรับไม่ไหว · ทำไมของเหลว 180 กรัม: สูตรพื้นฐานทุกสูตรอยู่ที่ 35-48 % ของเหลว ส่วนเบอร์ 16 (สับปะรด-เสาวรส-กะทิ สูตรที่ปีเตอร์ให้คะแนนสูงสุด 9 คะแนน) อยู่ที่ 38 % — สูตรนี้ตั้งตามนั้น · ตรวจกล่องนม: นมอัลมอนด์ของเราคือ V-Soy ซึ่งเป็นผู้ผลิตถั่วเหลือง ถ้าในส่วนผสมมีโปรตีนถั่วเหลือง ความเปรี้ยวของสับปะรดอาจทำให้แตกตัว — กฎเดียวกับเบอร์ 20 และ 21 · นมอัลมอนด์แท้มีโปรตีนน้อยเกินกว่าจะเกิดปัญหา · ห้ามเติมโปรตีนในแก้วนี้: สับปะรดมีเอนไซม์โบรมีเลน และการแช่แข็งไม่ทำลายเอนไซม์ (มีแต่ความร้อนที่ทำลายได้) โบรมีเลนย่อยโปรตีนจนเกิดรสขม · ถ้าลูกค้าสั่งโปรตีน ให้แนะนำเบอร์ 17 แทน · จุดอ่อน: นมอัลมอนด์ไขมันต่ำ แต่กลิ่นมะม่วงละลายในไขมัน — คอขวดเดียวกับที่ทำให้เบอร์ 21 ที่ใช้นมข้าวโอ๊ตล้มเหลว · ถ้ารสจืด สาเหตุคือเรื่องนี้ ไม่ใช่ปริมาณ · ให้ชิมเทียบกับสูตรเดียวกันที่ใช้กะทิแทนนมอัลมอนด์ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ต้องให้คะแนนด้วยแบบฟอร์มชิมก่อน แล้วค่อยขึ้นเมนู",
      "MANGO LEADS, PINEAPPLE GIVES THE KICK — 175 g against 117.7 g, about 1.5 : 1. Reversed, the cup tips into acid and thin almond milk cannot carry it. Check the carton: our almond milk is V-Soy, a soy maker. If soy protein is listed, the pineapple acid can flocculate it — same rule as Nr. 20 and 21. No protein add-on in this cup: pineapple carries bromelain, freezing does not destroy it, and it splits protein into bitter fragments. Weak spot: almond milk is low in fat and mango aromatics are fat-soluble — the same bottleneck that sank Nr. 21 with oat milk. Compare side by side against the same recipe with coconut milk. NEW 24.08.2026, never blended."]},

 tip:["DAS IST PETERS EIGENES HAUSREZEPT, nur ohne den Zucker. Er hat am 22.08. selbst gesagt, dass seine Fassung — Milch, Erdbeeren, Zucker — besser war als unsere Nr. 21. Er hatte recht, und der Grund ist Chemie: das Milchfett bindet die fettlöslichen Erdbeer-Aromastoffe, Zucker maskiert die Säure UND trägt Aroma. Nr. 21 hatte beides nicht — fettarme Hafermilch und obendrein zugesetzte Limette. Zwei Vorteile weniger, ein Nachteil mehr. DER ZUCKER FEHLT NICHT: er ist als Zutat verboten, steht aber am Tresen als kostenlose Zugabe. Im Becher übernimmt die gefrorene Banane seine Aufgabe. KEINE LIMETTE, KEINE ZITRONE. Bei Beeren nie — das war der zweite Fehler bei Nr. 21. NICHT VEGAN. Die pflanzliche Antwort auf denselben Becher ist Nr. 35 mit Kokosmilch. ⚠ NEU 24.08.2026, noch nie gemixt. Erst mit dem Verkostungsbogen bewerten.",
      "นี่คือสูตรที่ปีเตอร์ทำเองที่บ้าน เพียงแต่ไม่ใส่น้ำตาล · เมื่อ 22.08. เขาบอกเองว่าสูตรของเขา — นม สตรอว์เบอร์รี น้ำตาล — อร่อยกว่าเบอร์ 21 ของเรา · เขาพูดถูก และเหตุผลคือเคมี: ไขมันนมจับกลิ่นสตรอว์เบอร์รีที่ละลายในไขมัน ส่วนน้ำตาลกลบความเปรี้ยวและพากลิ่นไปด้วย · เบอร์ 21 ไม่มีทั้งสองอย่าง — ใช้นมข้าวโอ๊ตไขมันต่ำ แถมยังเติมมะนาวเข้าไปอีก · ได้เปรียบน้อยลงสองข้อ เสียเปรียบเพิ่มหนึ่งข้อ · น้ำตาลไม่ได้หายไป: ห้ามใส่เป็นส่วนผสม แต่มีให้ฟรีที่เคาน์เตอร์ · ในแก้วนี้กล้วยแช่แข็งทำหน้าที่แทน · ห้ามใส่มะนาวหรือเลมอน · กับผลไม้ตระกูลเบอร์รีห้ามเด็ดขาด — นั่นคือความผิดพลาดข้อที่สองของเบอร์ 21 · ไม่ใช่วีแกน · สูตรจากพืชล้วนที่ให้ผลแบบเดียวกันคือเบอร์ 35 ที่ใช้กะทิ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ต้องให้คะแนนด้วยแบบฟอร์มชิมก่อน",
      "THIS IS PETER'S OWN HOME RECIPE, only without the sugar. On 22.08. he said his version — milk, strawberries, sugar — beat our Nr. 21, and he was right: milk fat binds the fat-soluble strawberry aromatics, sugar masks acid AND carries aroma. Nr. 21 had neither, plus added lime. The sugar is not missing — it is banned as an ingredient but free at the counter; here frozen banana does its job. NO lime, no lemon — never with berries. NOT vegan; Nr. 35 is the plant version. NEW 24.08.2026, never blended."]},

 tip:["DIE VEGANE ANTWORT AUF NR. 21. Dort ist die Erdbeere an fettarmer Hafermilch gescheitert — Lexy: „zu sauer, ich schmecke kaum Erdbeere heraus.\" Kokosmilch bringt genau das zurück, was fehlte: Fett. Es bindet die Aromastoffe und hält sie länger im Mund. WARUM ZWEI MILCHSORTEN: Kokosmilch allein wäre zu schwer und zu teuer, und sie baut im Mixer keinen Wirbel — für die 42-%-Regel zählt sie nur zu 0,6. Die Mandelmilch macht die Masse beweglich, ohne Fett zu verdünnen. KOKOS UND ERDBEERE ist in Thailand kein Experiment, sondern eine vertraute Kombination — das senkt die Hürde bei thailändischen Gästen, und Lexi ist unsere Kontrollinstanz dafür. KEINE LIMETTE. Wer hier Säure zugibt, wiederholt Nr. 21. ⚠ NEU 24.08.2026, noch nie gemixt. Direkt gegen Nr. 34 verkosten: gleiche Frucht, einmal Milchfett, einmal Kokosfett. Der Vergleich beantwortet die Fettfrage ein für alle Mal.",
      "นี่คือคำตอบแบบวีแกนของเบอร์ 21 · ที่นั่นสตรอว์เบอร์รีพ่ายให้กับนมข้าวโอ๊ตไขมันต่ำ — เลกซี่บอกว่า “เปรี้ยวเกินไป แทบไม่ได้กลิ่นสตรอว์เบอร์รีเลย” · กะทินำสิ่งที่ขาดไปกลับมา นั่นคือไขมัน · มันจับกลิ่นและเก็บไว้ในปากได้นานกว่า · ทำไมต้องใช้นมสองชนิด: ใช้กะทิอย่างเดียวจะหนักและแพงเกินไป และมันไม่สร้างวังวนในโถปั่น — ตามกฎ 42 % กะทินับเพียง 0,6 เท่านั้น · นมอัลมอนด์ทำให้เนื้อเคลื่อนตัวได้โดยไม่เจือจางไขมัน · กะทิกับสตรอว์เบอร์รีไม่ใช่การทดลองในเมืองไทย แต่เป็นคู่ที่คุ้นเคย — ช่วยลดกำแพงสำหรับลูกค้าคนไทย และเลกซี่คือคนตรวจสอบเรื่องนี้ให้เรา · ห้ามใส่มะนาว · ใครเติมความเปรี้ยวตรงนี้ ก็คือทำซ้ำความผิดพลาดของเบอร์ 21 · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ให้ชิมเทียบกับเบอร์ 34 โดยตรง: ผลไม้เดียวกัน ข้างหนึ่งไขมันนม อีกข้างไขมันกะทิ · การเทียบนี้จะตอบคำถามเรื่องไขมันได้เด็ดขาด",
      "THE VEGAN ANSWER TO NR. 21, where strawberry failed on low-fat oat milk — Lexy: too sour, barely any strawberry. Coconut milk returns exactly what was missing: fat. Two milks because coconut alone is too heavy, too costly, and builds no vortex — it counts only 0.6 towards the 42 % rule; almond milk keeps the mass moving without diluting the fat. Coconut and strawberry is familiar in Thailand, which lowers the barrier for Thai guests. NO lime. NEW 24.08.2026, never blended — taste it side by side against Nr. 34 to settle the fat question."]},

 tip:["DAS IST PETERS EIGENER WUNSCH, wörtlich aus dem Verkostungsbogen vom 20.08.: „Etwas mehr Nuss oder Schoko könnte sehr gut passen.\" Hier ist beides drin. UND ES LÖST NEBENBEI DAS ERDBEERPROBLEM. Kakao bringt Bitterstoffe, und Bitter dämpft die Wahrnehmung von Säure — derselbe Effekt wie Salz, nur über einen anderen Weg. Genau die Säure war Lexys Einwand gegen Nr. 21. KAKAO ZUERST UND VOLLSTÄNDIG LÖSEN. Wer ihn zusammen mit der gefrorenen Frucht einwirft, bekommt Kakaonester, die auf der Zunge sandig sind — das schlägt sofort auf „Belag auf der Zunge\" und „pelzig\" im Bogen durch. VEGAN, ENTHÄLT MANDEL. Die Kennzeichnung fällt automatisch aus den Zutaten. ⚠ NEU 24.08.2026, noch nie gemixt. ⚠ OFFEN: ob 10 g Kakao reichen oder die Beere zudecken — das entscheidet der erste Ansatz, nicht die Rechnung.",
      "นี่คือสิ่งที่ปีเตอร์ขอเอง คำต่อคำจากแบบฟอร์มชิมเมื่อ 20.08.: “ถ้าเพิ่มกลิ่นถั่วหรือช็อกโกแลตอีกนิด น่าจะเข้ากันมาก” · ในแก้วนี้มีทั้งสองอย่าง · และมันแก้ปัญหาสตรอว์เบอร์รีไปในตัว · โกโก้ให้ความขม และความขมลดการรับรู้ความเปรี้ยว — กลไกเดียวกับเกลือ เพียงแต่คนละเส้นทาง · ความเปรี้ยวคือสิ่งที่เลกซี่ติงในเบอร์ 21 พอดี · ต้องละลายโกโก้ก่อนและให้หมดจริง ๆ · ใครใส่พร้อมผลไม้แช่แข็งจะได้ก้อนโกโก้ที่สากลิ้น — และจะไปโผล่ทันทีในช่อง “ความรู้สึกเคลือบลิ้น” และ “ฝาดคอ” ของแบบฟอร์ม · วีแกน มีอัลมอนด์ · ฉลากคำนวณจากส่วนผสมโดยอัตโนมัติ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ยังไม่รู้: โกโก้ 10 กรัม พอดีหรือจะกลบเบอร์รี — ต้องตัดสินจากการปั่นครั้งแรก ไม่ใช่จากการคำนวณ",
      "PETER'S OWN REQUEST, verbatim from the 20.08. sheet: more nut or chocolate would fit very well. Both are here — and it solves the strawberry problem on the way: cocoa brings bitterness, and bitterness damps the perception of acid, the same effect as salt by another route. Dissolve the cocoa FIRST and completely; thrown in with frozen fruit it leaves sandy nests that show up instantly under coating and furriness on the sheet. VEGAN, contains almond. NEW 24.08.2026, never blended. OPEN: whether 10 g cocoa is enough or buries the berry."]},

 tip:["GEBAUT AUF DEM EINZIGEN GEMESSENEN SPITZENWERT DES PROJEKTS. Bei Nr. 20 gaben beide Verkoster der Glattheit 10 von 10 — der einzige Wert, bei dem sie sich auf der Höchstnote trafen. Die Basis dafür war Joghurt mit Mango. Hier kommt die Erdbeere in genau diese Basis. MANGO IST NICHT DEKORATION, SONDERN DER ZUCKERERSATZ. Sie deckt die Beerensäure zu, ohne dass ein Löffel Zucker in den Becher muss. GESTUFT MIXEN IST PFLICHT. Joghurt ist zäh und baut keinen Wirbel — bei Nr. 20 klebte die Masse außen, und Peter musste 80 ml nachgießen. Das hat den Fruchtgeschmack auf 4 von 10 gedrückt (Skalenpol 1 heißt wörtlich „wässrig\"). Deshalb: erst ein Drittel, dann der Rest. NICHT nachgießen. VEGETARISCH, ENTHÄLT MILCH UND MANDEL. ⚠ NEU 24.08.2026, noch nie gemixt. ⚠ Die gestufte Zugabe ist bisher eine Hypothese und wird hier zum ersten Mal geprüft — wenn sie scheitert, die zugegossene Menge notieren.",
      "สร้างขึ้นบนค่าสูงสุดค่าเดียวที่วัดได้จริงในโครงการนี้ · ในเบอร์ 20 ผู้ชิมทั้งสองให้คะแนนความเนียน 10 เต็ม 10 — เป็นค่าเดียวที่ทั้งคู่ให้คะแนนสูงสุดตรงกัน · ฐานของมันคือโยเกิร์ตกับมะม่วง · แก้วนี้คือการเอาสตรอว์เบอร์รีใส่ลงไปในฐานเดียวกันนั้น · มะม่วงไม่ใช่ของประดับ แต่คือตัวแทนน้ำตาล · มันกลบความเปรี้ยวของเบอร์รีได้โดยไม่ต้องใส่น้ำตาลลงในแก้ว · ต้องปั่นแบบแบ่งใส่เท่านั้น · โยเกิร์ตหนืดและไม่สร้างวังวน — ในเบอร์ 20 เนื้อไปเกาะข้างโถ และปีเตอร์ต้องเติมน้ำ 80 มล. · ผลคือคะแนนรสผลไม้ตกเหลือ 4 เต็ม 10 (ปลายสเกลที่ 1 แปลว่า “จืดเหมือนน้ำ”) · ดังนั้น: ใส่หนึ่งในสามก่อน แล้วค่อยใส่ที่เหลือ · ห้ามเติมของเหลว · มังสวิรัติ มีนมและอัลมอนด์ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · การแบ่งใส่ยังเป็นเพียงสมมติฐานและจะถูกทดสอบครั้งแรกที่นี่ — ถ้าไม่ได้ผล ให้จดปริมาณของเหลวที่เติมไว้",
      "BUILT ON THE PROJECT'S ONLY MEASURED TOP SCORE: at Nr. 20 both tasters gave smoothness 10 of 10, the single value where they met at the maximum, and the base for it was yoghurt with mango. The strawberry now goes into exactly that base. Mango is not decoration but the sugar substitute. Staged blending is mandatory — yoghurt is thick and builds no vortex; at Nr. 20 the mass stuck to the wall and 80 ml had to be added, which pushed fruit flavour down to 4 of 10. One third first, then the rest, and do NOT pour in liquid. VEGETARIAN, contains milk and almond. NEW 24.08.2026, never blended — the staged method is tested here for the first time."]},

 tip:["DIESER BECHER REPARIERT DEN EINZIGEN FEHLER VON NR. 16. Dort haben beide das Kaufkreuz gesetzt — Peter 9, das beste Ergebnis mit beidseitiger Zustimmung — aber die Glattheit lag bei 4 und 5. Der Bogen nennt den Verdacht ausdrücklich: nicht die Passionsfruchtkerne, sondern die ANANASFASERN. Also fliegt die Passionsfrucht raus, die Ananas bleibt, und die Mixzeit verdoppelt sich. 60 SEKUNDEN SIND KEINE EMPFEHLUNG, SONDERN DIE ZUTAT. Wer nach 30 Sekunden abbricht, verkauft genau die 4 von 10, die Nr. 16 ausgebremst hat. PIÑA OHNE ALKOHOL — die Kombination kennt jeder Tourist in Pattaya, das spart die Erklärung am Tresen. Und sie räumt Bestand ab: 1.146 g Ananas liegen in der Truhe. KEINE LIMETTE. Ananas bringt genug Säure mit, deshalb steht das Salz im Rezept. VEGAN, KEIN ALLERGEN. ⚠ NEU 24.08.2026, noch nie gemixt. Beim Test ausdrücklich die Glattheit gegen Nr. 16 vergleichen.",
      "แก้วนี้แก้ข้อผิดพลาดข้อเดียวของเบอร์ 16 · ที่นั่นทั้งสองคนกาช่องว่าจะซื้อ — ปีเตอร์ให้ 9 คะแนน เป็นผลลัพธ์ที่ดีที่สุดที่ทั้งคู่เห็นตรงกัน — แต่ความเนียนได้แค่ 4 กับ 5 · แบบฟอร์มระบุข้อสงสัยไว้ชัดเจน: ไม่ใช่เมล็ดเสาวรส แต่เป็นเส้นใยสับปะรด · ดังนั้นตัดเสาวรสออก เก็บสับปะรดไว้ และเพิ่มเวลาปั่นเป็นสองเท่า · 60 วินาทีไม่ใช่คำแนะนำ แต่คือส่วนผสมอย่างหนึ่ง · ใครหยุดที่ 30 วินาที ก็คือขายคะแนน 4 เต็ม 10 ที่ฉุดเบอร์ 16 เอาไว้นั่นเอง · ปีญ่าโคลาด้าแบบไม่มีแอลกอฮอล์ — นักท่องเที่ยวในพัทยารู้จักทุกคน ไม่ต้องอธิบายที่เคาน์เตอร์ · และช่วยระบายของในตู้แช่: มีสับปะรดอยู่ 1.146 กรัม · ห้ามใส่มะนาว · สับปะรดเปรี้ยวพออยู่แล้ว จึงต้องมีเกลือในสูตร · วีแกน ไม่มีสารก่อภูมิแพ้ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ตอนทดสอบให้เทียบความเนียนกับเบอร์ 16 โดยเฉพาะ",
      "THIS CUP REPAIRS THE ONLY FAULT OF NR. 16, where both tasters ticked the buy box — Peter 9, the best mutually agreed result — but smoothness came in at 4 and 5. The sheet names the suspect explicitly: not the passion fruit seeds but the PINEAPPLE FIBRES. So the passion fruit goes, the pineapple stays, and the blending time doubles. 60 seconds is not advice, it is an ingredient. A piña without alcohol needs no explaining in Pattaya, and it clears stock: 1,146 g of pineapple are in the freezer. NO lime — pineapple brings enough acid, which is why salt is in the recipe. VEGAN, no allergen. NEW 24.08.2026, never blended."]},

 tip:["PETERS WUNSCH, AUF SEIN EIGENES BESTBEWERTETES REZEPT ANGEWENDET. Im Bogen zu Nr. 20 steht unter „Was fehlt Ihnen?\" wörtlich: „Etwas mehr Nuss oder Schoko könnte sehr gut passen.\" Nr. 20 war Mango mit Joghurt und Mandelmilch — hier fällt der Joghurt weg und der Kakao kommt dazu. MANGO UND KAKAO IST UNGEWÖHNLICH, und das ist der Punkt: es gibt keinen zweiten Stand in Pattaya, der das anbietet. Ein Becher, den man nirgends sonst bekommt, verkauft sich anders als der fünfzehnte Mango-Smoothie der Straße. OHNE JOGHURT LÄUFT ER OHNE GESTUFTES MIXEN — Mandelmilch baut den Wirbel von allein, das ist der praktische Vorteil gegenüber Nr. 20 und Nr. 37. VEGAN, ENTHÄLT MANDEL. ⚠ NEU 24.08.2026, noch nie gemixt. ⚠ OFFEN: das Verhältnis Kakao zu Mango. 10 g sind der Startwert aus Nr. 17, nicht ein für diesen Becher gemessener Wert.",
      "สิ่งที่ปีเตอร์ขอ นำมาใช้กับสูตรที่เขาให้คะแนนสูงสุดเอง · ในแบบฟอร์มของเบอร์ 20 ช่อง “ขาดอะไรไหม” เขียนไว้คำต่อคำว่า “ถ้าเพิ่มกลิ่นถั่วหรือช็อกโกแลตอีกนิด น่าจะเข้ากันมาก” · เบอร์ 20 คือมะม่วงกับโยเกิร์ตและนมอัลมอนด์ — แก้วนี้ตัดโยเกิร์ตออกและใส่โกโก้เข้าไปแทน · มะม่วงกับโกโก้เป็นคู่ที่ไม่ธรรมดา และนั่นคือประเด็น: ไม่มีร้านไหนในพัทยาขายแบบนี้ · แก้วที่หาที่อื่นไม่ได้ ย่อมขายได้ต่างจากสมูทตี้มะม่วงแก้วที่สิบห้าของถนนสายนั้น · เมื่อไม่มีโยเกิร์ต ก็ไม่ต้องแบ่งใส่ — นมอัลมอนด์สร้างวังวนได้เอง นี่คือข้อได้เปรียบในทางปฏิบัติเหนือเบอร์ 20 และเบอร์ 37 · วีแกน มีอัลมอนด์ · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ยังไม่รู้: สัดส่วนโกโก้ต่อมะม่วง · 10 กรัม คือค่าตั้งต้นที่ยกมาจากเบอร์ 17 ไม่ใช่ค่าที่วัดมาสำหรับแก้วนี้",
      "PETER'S REQUEST APPLIED TO HIS OWN TOP-SCORING RECIPE. Under what is missing on the Nr. 20 sheet he wrote: more nut or chocolate would fit very well. Nr. 20 was mango with yoghurt and almond milk; here the yoghurt goes and the cocoa arrives. Mango and cocoa is unusual, and that is the point — no other stand in Pattaya offers it, and a cup you cannot get elsewhere sells differently from the fifteenth mango smoothie on the street. Without yoghurt it needs no staged blending: almond milk builds the vortex by itself. VEGAN, contains almond. NEW 24.08.2026, never blended. OPEN: the cocoa-to-mango ratio; 10 g is carried over from Nr. 17, not measured for this cup."]},

 tip:["DIE ARBEITSTEILUNG IST DER GANZE TRICK: die Drachenfrucht liefert die Farbe, die Erdbeere den Geschmack. Rote Drachenfrucht schmeckt fast nach nichts — deshalb ist sie bei Nr. 18 auch durchgefallen, Peter hat kein Kaufkreuz gesetzt. Als Farbgeber ohne eigene Meinung ist sie dagegen unschlagbar. AUSSEHEN IST EIN BEWERTETES KRITERIUM. Bei Nr. 20 gaben beide Verkoster dafür 10 von 10 — und auf einem Instagram-Foto vor dem Stand ist es das einzige Kriterium, das der Gast vorher sieht. KEINE LIMETTE. Bei Nr. 18 war Limette drin und der Becher fiel bei Peter durch; dieselbe Kombination ohne Säure und mit Kokosfett ist ein anderes Produkt. BESTAND BEACHTEN: nur 352 g Drachenfrucht in der Truhe, das reicht für knapp drei Becher. Für den Test genug, für die Karte muss nachgekauft werden. VEGAN, ENTHÄLT MANDEL. ⚠ NEU 24.08.2026, noch nie gemixt.",
      "การแบ่งหน้าที่คือหัวใจทั้งหมด: แก้วมังกรให้สี สตรอว์เบอร์รีให้รส · แก้วมังกรแดงแทบไม่มีรสชาติของตัวเอง — นั่นคือเหตุผลที่เบอร์ 18 ไม่ผ่าน ปีเตอร์ไม่กาช่องว่าจะซื้อ · แต่ในฐานะตัวให้สีที่ไม่มีความเห็นเป็นของตัวเอง มันหาตัวจับยาก · หน้าตาเป็นเกณฑ์ที่ให้คะแนนจริง · ในเบอร์ 20 ผู้ชิมทั้งสองให้ 10 เต็ม 10 ในข้อนี้ — และในรูปอินสตาแกรมหน้าร้าน มันคือเกณฑ์เดียวที่ลูกค้าเห็นก่อนตัดสินใจ · ห้ามใส่มะนาว · เบอร์ 18 มีมะนาวและปีเตอร์ไม่ผ่าน · ส่วนผสมเดียวกันแต่ไม่มีความเปรี้ยวและมีไขมันกะทิ ถือเป็นสินค้าคนละตัว · ดูของในสต๊อกด้วย: มีแก้วมังกรเพียง 352 กรัม พอทำได้ไม่ถึงสามแก้ว · พอสำหรับทดสอบ แต่ถ้าจะขึ้นเมนูต้องสั่งเพิ่ม · วีแกน มีอัลมอนด์ · ใหม่ 24.08.2026 ยังไม่เคยปั่น",
      "THE DIVISION OF LABOUR IS THE WHOLE TRICK: dragon fruit supplies the colour, strawberry the taste. Red dragon fruit tastes of almost nothing — which is why Nr. 18 failed and Peter ticked no buy box — but as a colourant with no opinion of its own it is unbeatable. Appearance is a scored criterion: at Nr. 20 both gave it 10 of 10, and on a photo outside the stand it is the only criterion the guest sees in advance. NO lime — Nr. 18 had lime and failed. STOCK: only 352 g of dragon fruit, enough for barely three cups. VEGAN, contains almond. NEW 24.08.2026, never blended."]},

 tip:["🔒 NICHT im Verkaufsmenü — Peters persönlicher Becher, die satt machende Fassung von Nr. 13. DER WIDERSPRUCH UND SEINE AUFLÖSUNG: Zunehmen heißt Kalorien, Diabetes heißt kein Zucker. Der Ausweg ist FETT — es hat mehr als doppelt so viele Kalorien je Gramm wie Zucker und bewegt den Blutzucker praktisch nicht. Deshalb tragen Hanfsamen, Avocado und Vollmilch diesen Becher, nicht Banane und nicht Sirup. RECHNUNG (Referenzwerte aus Nährwerttabellen, ⚠ nicht an unseren Zutaten gemessen): rund 620 kcal auf 535 g. Der Löwenanteil kommt aus 25 g Hanfsamen und 40 g Haferflocken. Zum Vergleich: Nr. 13 liegt bei etwa 200 kcal. WARUM KAKAO DEN BROKKOLI RETTET: Peters Zweifel war berechtigt — im grünen Becher schmeckt man ihn. Kakao ist bitter und dunkel; die Bitterkeit deckt den Kohlgeschmack, die Farbe deckt das Grün. Dieselbe Überlegung wie bei Nr. 36. Der Brokkoli sinkt trotzdem von 60 g auf 30 g. ⚠ KEIN SALZ. In jedem Verkaufsrezept ist Salz der stärkste Hebel gegen Säure — hier ist es gesperrt, weil bei Bauchwasser Natrium begrenzt wird. Nr. 13 hat auch keins. Nicht nachträglich zufügen, auch nicht \"nur eine Prise\". AUF ZWEI GLÄSER: 535 g auf einmal drücken bei Bauchwasser auf den Bauch. Zweimal ein halber Becher über den Tag bringt dieselben Kalorien, ohne Völlegefühl. KEINE BANANE, KEIN ZUCKER (Diabetes), KEIN Grapefruit/Pomelo (Eliquis) — unverändert aus Nr. 13. ANANAS GEHÖRT HIER NICHT HINEIN, obwohl Peter sie liebt: ihr Bromelain zerlegt genau das Eiweiß, das dieser Becher liefern soll, in bittere Bruchstücke — und das zweite Glas steht. Der Ananas-Becher ist Nr. 42, dort trägt Kokosfett statt Eiweiß die Kalorien. ⚠ NEU 24.08.2026, noch nie gemixt. Die Eiweißmenge und die Natriumgrenze entscheidet der Arzt, nicht dieses Rezept.",
      "🔒 ไม่อยู่ในเมนูขาย — แก้วส่วนตัวของปีเตอร์ เป็นฉบับที่ทำให้อิ่มของเบอร์ 13 · ความขัดแย้งและทางออก: จะเพิ่มน้ำหนักต้องมีแคลอรี แต่เบาหวานห้ามน้ำตาล · ทางออกคือไขมัน — ให้แคลอรีต่อกรัมมากกว่าน้ำตาลสองเท่า และแทบไม่ขยับน้ำตาลในเลือด · ดังนั้นแก้วนี้จึงพึ่งเมล็ดกัญชง อะโวคาโด และนมไขมันเต็ม ไม่ใช่กล้วยและไม่ใช่น้ำเชื่อม · การคำนวณ (ค่าอ้างอิงจากตารางโภชนาการ ยังไม่ได้วัดจากวัตถุดิบของเราเอง): ประมาณ 620 กิโลแคลอรี ต่อ 535 กรัม · ส่วนใหญ่มาจากเมล็ดกัญชง 25 กรัม และข้าวโอ๊ต 40 กรัม · เทียบกับเบอร์ 13 ที่อยู่ราว 200 กิโลแคลอรี · ทำไมโกโก้ช่วยเรื่องบรอกโคลี: ข้อสงสัยของปีเตอร์มีเหตุผล — ในแก้วสีเขียวจะได้รสบรอกโคลีชัด · โกโก้ขมและสีเข้ม ความขมกลบรสผัก สีกลบความเขียว · แนวคิดเดียวกับเบอร์ 36 · และบรอกโคลียังลดจาก 60 กรัม เหลือ 30 กรัม อยู่ดี · ห้ามใส่เกลือ · ในสูตรขายทุกสูตร เกลือคือตัวช่วยที่แรงที่สุดในการลดความเปรี้ยว — แต่ที่นี่ห้าม เพราะภาวะน้ำในช่องท้องต้องจำกัดโซเดียม · เบอร์ 13 ก็ไม่มีเกลือ · ห้ามใส่เพิ่มทีหลัง แม้แต่ “หยิบมือเดียว” · ต้องแช่ข้าวโอ๊ตก่อน ไม่ใช่ทางเลือก · ถ้าใส่แบบแห้งลงในแก้วเย็น จะสากและย่อยยาก · แบ่งเป็นสองแก้ว: 535 กรัม รวดเดียวจะกดท้องเมื่อมีน้ำในช่องท้อง · ดื่มครึ่งแก้วสองครั้งต่อวันได้แคลอรีเท่ากันโดยไม่อึดอัด · ไม่ใส่กล้วย ไม่ใส่น้ำตาล (เบาหวาน) ไม่ใส่ส้มโอหรือเกรปฟรุต (ยาอีลิควิส) — เหมือนเบอร์ 13 · สับปะรดใส่ในแก้วนี้ไม่ได้ ทั้งที่ปีเตอร์ชอบมาก: โบรมีเลนในสับปะรดจะย่อยโปรตีน ซึ่งเป็นสิ่งที่แก้วนี้ตั้งใจให้ ให้กลายเป็นชิ้นส่วนที่ขม และแก้วที่สองยังต้องตั้งทิ้งไว้ · แก้วสับปะรดคือเบอร์ 42 ที่ใช้ไขมันกะทิเป็นตัวให้แคลอรีแทนโปรตีน · ใหม่ 24.08.2026 ยังไม่เคยปั่น · ปริมาณโปรตีนและขีดจำกัดโซเดียมให้แพทย์ตัดสิน ไม่ใช่สูตรนี้",
      "🔒 NOT on the sales menu — Peter's personal cup, the filling version of Nr. 13. THE CONTRADICTION AND ITS RESOLUTION: gaining weight means calories, diabetes means no sugar. The way out is FAT — more than twice the calories per gram of sugar, and it barely moves blood glucose. So hemp seeds, avocado and whole milk carry this cup, not banana and not syrup. MATH (reference values from nutrition tables, ⚠ not measured on our own ingredients): about 620 kcal in 535 g, most of it from 25 g hemp seeds and 40 g oats. Nr. 13 sits at roughly 200. WHY COCOA RESCUES THE BROCCOLI: the doubt was justified — in a green cup you taste it. Cocoa is bitter and dark; the bitterness covers the cabbage note, the colour covers the green. Same reasoning as Nr. 36. The broccoli still drops from 60 g to 30 g. ⚠ NO SALT. In every sales recipe salt is the strongest lever against acid — here it is blocked, because ascites means limiting sodium. Nr. 13 has none either. Do not add it later, not even a pinch. ⚠ SOAKING THE OATS IS MANDATORY, not a refinement — dry into a cold cup they turn gritty and hard to digest. TWO GLASSES: 535 g at once presses on a distended abdomen. Half a cup twice a day delivers the same calories without the fullness. NO banana, NO sugar (diabetes), NO grapefruit or pomelo (Eliquis) — unchanged from Nr. 13. PINEAPPLE DOES NOT BELONG HERE although Peter loves it: its bromelain splits exactly the protein this cup is meant to deliver into bitter fragments, and the second glass stands. The pineapple cup is Nr. 42, where coconut fat carries the calories instead of protein. NEW 24.08.2026, never blended. The protein amount and the sodium limit are the doctor's call, not this recipe's."]},

 tip:["🔒 NICHT im Verkaufsmenü — Peters persönlicher Ananas-Becher, das Gegenstück zu Nr. 41. WARUM ANANAS NICHT IN NR. 41 DARF: Nr. 41 ist absichtlich eiweißreich (Milch, Joghurt, Hanfsamen). Ananas enthält Bromelain, ein Enzym, das Eiweiß in bittere Bruchstücke zerlegt — Einfrieren zerstört es nicht, nur Hitze. Und weil Nr. 41 auf zwei Gläser über den Tag verteilt wird, stünde das zweite Glas und würde bitter. DIE LÖSUNG IST NICHT VERZICHT, SONDERN EIN ANDERER TRÄGER: Bromelain braucht Eiweiß, um Schaden anzurichten. Kokosmilch ist praktisch reines Fett und bringt fast keins mit — die Kalorien kommen hier aus Fett statt aus Eiweiß, und das Enzym findet nichts vor. Dieser Becher darf stehen. RECHNUNG (Referenzwerte aus Nährwerttabellen, ⚠ nicht an unseren Zutaten gemessen): rund 570 kcal auf 502 g, davon etwa zwei Drittel aus der Kokosmilch. Fruchtzucker rund 20 g — vergleichbar mit Nr. 41, weil die Gurke Volumen ohne Zucker liefert. SO ERGIBT SICH EIN PAAR, KEIN ENTWEDER-ODER: Nr. 41 ist der Eiweiß-Becher für den Muskel, Nr. 42 der Ananas-Becher. Abwechselnd getrunken deckt das beide Ziele. ⚠ KEIN SALZ — wie bei Nr. 13 und Nr. 41, wegen Bauchwasser. ⚠ KOKOSMILCH IST NICHT KOKOSWASSER. Ausgeschlossen wurde Kokos-WASSER (Kalium). Kokosmilch ist ein anderes Erzeugnis mit deutlich weniger Kalium je Portion, aber nicht null — beim nächsten Arzttermin ansprechen, bevor das ein täglicher Becher wird. 60 SEKUNDEN SIND DIE ZUTAT: bei Nr. 16 haben Ananasfasern die Glattheit auf 4 von 10 gedrückt. ALLE ZUTATEN IM HAUS (Bestand 24.08.): Kokosmilch 500 g, Ananas 1.146 g, Avocado 200 g, Gurke 300 g, Ingwer 30 g, Zimt 100 g. ⚠ NEU 24.08.2026, noch nie gemixt.",
      "🔒 ไม่อยู่ในเมนูขาย — แก้วสับปะรดส่วนตัวของปีเตอร์ เป็นคู่ของเบอร์ 41 · ทำไมสับปะรดใส่ในเบอร์ 41 ไม่ได้: เบอร์ 41 ตั้งใจให้มีโปรตีนสูง (นม โยเกิร์ต เมล็ดกัญชง) · สับปะรดมีเอนไซม์โบรมีเลนที่ย่อยโปรตีนจนเกิดรสขม — การแช่แข็งไม่ทำลายมัน มีแต่ความร้อนที่ทำได้ · และเพราะเบอร์ 41 ต้องแบ่งดื่มสองแก้วตลอดวัน แก้วที่สองจะตั้งทิ้งไว้และกลายเป็นขม · ทางแก้ไม่ใช่การเลิกใส่ แต่คือเปลี่ยนตัวพา: โบรมีเลนต้องมีโปรตีนจึงจะสร้างปัญหาได้ · กะทิเกือบเป็นไขมันล้วนและมีโปรตีนน้อยมาก — แคลอรีในแก้วนี้จึงมาจากไขมันแทนโปรตีน และเอนไซม์ก็ไม่มีอะไรให้ย่อย · แก้วนี้ตั้งทิ้งไว้ได้ · การคำนวณ (ค่าอ้างอิงจากตารางโภชนาการ ยังไม่ได้วัดจากวัตถุดิบของเราเอง): ประมาณ 570 กิโลแคลอรี ต่อ 502 กรัม ราวสองในสามมาจากกะทิ · น้ำตาลผลไม้ราว 20 กรัม เทียบเท่าเบอร์ 41 เพราะแตงกวาเพิ่มปริมาณโดยไม่เพิ่มน้ำตาล · จึงกลายเป็นคู่ ไม่ใช่ต้องเลือกอย่างใดอย่างหนึ่ง: เบอร์ 41 คือแก้วโปรตีนเพื่อกล้ามเนื้อ เบอร์ 42 คือแก้วสับปะรด · ดื่มสลับกันจะได้ทั้งสองเป้าหมาย · ห้ามใส่เกลือ — เหมือนเบอร์ 13 และ 41 เพราะภาวะน้ำในช่องท้อง · กะทิไม่ใช่น้ำมะพร้าว · สิ่งที่ห้ามคือน้ำมะพร้าว (โพแทสเซียม) · กะทิเป็นผลิตภัณฑ์อีกชนิด มีโพแทสเซียมต่อหนึ่งเสิร์ฟน้อยกว่ามาก แต่ไม่ใช่ศูนย์ — ให้ปรึกษาแพทย์ครั้งต่อไปก่อนที่จะดื่มเป็นประจำทุกวัน · 60 วินาทีคือส่วนผสมอย่างหนึ่ง: ในเบอร์ 16 เส้นใยสับปะรดทำให้คะแนนความเนียนตกเหลือ 4 เต็ม 10 · วัตถุดิบมีอยู่ในบ้านทั้งหมด (สต๊อก 24.08.): กะทิ 500 กรัม สับปะรด 1.146 กรัม อะโวคาโด 200 กรัม แตงกวา 300 กรัม ขิง 30 กรัม อบเชย 100 กรัม · ใหม่ 24.08.2026 ยังไม่เคยปั่น",
      "🔒 NOT on the sales menu — Peter's personal pineapple cup, the counterpart to Nr. 41. WHY PINEAPPLE CANNOT GO INTO NR. 41: that cup is deliberately protein-rich (milk, yoghurt, hemp seeds). Pineapple carries bromelain, an enzyme that splits protein into bitter fragments — freezing does not destroy it, only heat does. And since Nr. 41 is split across two glasses over the day, the second glass would stand and turn bitter. THE ANSWER IS NOT GOING WITHOUT, BUT A DIFFERENT CARRIER: bromelain needs protein to do damage. Coconut milk is almost pure fat and brings almost none — the calories here come from fat instead of protein, and the enzyme finds nothing. This cup may stand. MATH (reference values, ⚠ not measured on our own ingredients): about 570 kcal in 502 g, roughly two thirds from the coconut milk. Fruit sugar about 20 g, comparable to Nr. 41, because the cucumber delivers volume without sugar. SO IT IS A PAIR, NOT AN EITHER-OR: Nr. 41 is the protein cup for muscle, Nr. 42 the pineapple cup. Alternating them covers both goals. ⚠ NO SALT — as in Nr. 13 and Nr. 41, because of ascites. ⚠ COCONUT MILK IS NOT COCONUT WATER. What was excluded is coconut WATER (potassium). Coconut milk is a different product with far less potassium per serving, but not zero — raise it at the next doctor's appointment before this becomes a daily cup. 60 SECONDS IS AN INGREDIENT: at Nr. 16 pineapple fibres pushed smoothness down to 4 of 10. ALL INGREDIENTS IN THE HOUSE (stock 24.08.). NEW 24.08.2026, never blended."]},

 tip:["EINFACHSTES REZEPT DER KARTE. Zwei Zutaten (Wassermelone + Minze), eine Prise Salz. WARUM 1:1 FRISCH+GEFROREN: reine frische Wassermelone ist warm und wässrig. Reine gefrorene Wassermelone verliert Aroma und schmeckt nach Sorbet. Die Mischung bringt Kälte OHNE Aromaverlust — die frische Hälfte hält den Duft, die gefrorene die Temperatur. Kein Eiszusatz nötig, keine Milch, kein Fett-Träger (Wassermelone ist nicht sauer). WARUM MINZE PASST: Wassermelone+Minze ist das älteste Kombinationspaar in der arabischen und mexikanischen Sommergetränke-Tradition (agua fresca). Die Minze muss frisch sein — getrocknet schmeckt sie nach Zahnpasta. Und sie muss ANGEQUETSCHT werden, nicht zerhackt: Zerhacken bricht die Blätter und setzt Bitterstoffe frei; Anquetschen presst nur die ätherischen Öle raus. SALZ: 0,3 g klingt wie Rundungsfehler, aber der Effekt ist gewaltig. Salz maskiert Bittere und verstärkt Süße-Wahrnehmung — deshalb wird in Thai-Fruchtsäften traditionell mit einer Prise Salz gearbeitet, nicht mit mehr Zucker. GRAB-TAUGLICH: keine Deko, keine Toppings, durch den Halm trinkbar. Regel 8 erfüllt. AGUA-FRESCA-SIGNATURE: dieses Rezept ist der Sommer-Becher schlechthin — man kann Gäste damit bewirten, die noch nie ein 100blend-Smoothie getrunken haben, und sie verstehen ihn sofort. Nichts zu erklären, nur Wassermelone kalt und lebendig. ⚠ NEU 25.08.2026, noch nie gemixt.",
      "สูตรที่ง่ายที่สุดในเมนู · สองวัตถุดิบ (แตงโม + สะระแหน่) กับเกลือหนึ่งหยิบมือ · ทำไม 1:1 สด+แช่แข็ง: แตงโมสดล้วนอุ่นและเป็นน้ำ · แตงโมแช่แข็งล้วนสูญเสียกลิ่นและกลายเป็นเชอร์เบท · การผสมครึ่งต่อครึ่งให้ความเย็นโดยไม่เสียกลิ่น — ครึ่งสดเก็บกลิ่น ครึ่งแช่แข็งเก็บอุณหภูมิ · ไม่ต้องใส่น้ำแข็ง ไม่ต้องใส่นม ไม่ต้องมีตัวพาไขมัน (แตงโมไม่เปรี้ยว) · ทำไมสะระแหน่เข้ากัน: แตงโม+สะระแหน่คือคู่เก่าแก่ที่สุดในเครื่องดื่มฤดูร้อนของอาหรับและเม็กซิโก (agua fresca) · สะระแหน่ต้องสด — แบบแห้งจะเหมือนยาสีฟัน · และต้องบดเบา ๆ ไม่ใช่สับ: สับจะทำให้ใบแตกและปล่อยรสขม ส่วนบดเบา ๆ จะบีบเฉพาะน้ำมันหอม · เกลือ: 0.3 กรัม ดูเหมือนไม่มีค่า แต่ผลใหญ่มาก · เกลือกลบรสขมและเพิ่มการรับรู้ความหวาน — นี่คือเหตุผลที่น้ำผลไม้ไทยใช้เกลือแทนน้ำตาลเพิ่ม · ผ่านเกณฑ์แกร็บ: ไม่มีของแต่ง ไม่มีท็อปปิ้ง ดื่มผ่านหลอดได้ ผ่านกฎข้อ 8 · ซิกเนเจอร์อาควาเฟรสก้า: สูตรนี้คือแก้วฤดูร้อนของแท้ — ให้แขกที่ไม่เคยดื่ม 100blend มาก่อนดื่มได้ทันที ไม่ต้องอธิบายอะไร แค่แตงโมเย็นและมีชีวิต · ใหม่ 25.08.2026 ยังไม่เคยปั่น",
      "SIMPLEST RECIPE ON THE MENU. Two ingredients (watermelon + mint), a pinch of salt. WHY 1:1 FRESH+FROZEN: pure fresh watermelon is warm and watery. Pure frozen watermelon loses aroma and tastes like sorbet. The blend brings cold WITHOUT aroma loss — the fresh half keeps the scent, the frozen half keeps the temperature. No added ice, no milk, no fat carrier (watermelon is not acidic). WHY MINT WORKS: watermelon+mint is the oldest pairing in Arabic and Mexican summer-drink tradition (agua fresca). The mint must be fresh — dried mint tastes like toothpaste. And it must be BRUISED, not chopped: chopping breaks the leaves and releases bitters; bruising presses out only the essential oils. SALT: 0.3 g sounds like a rounding error, but the effect is huge. Salt masks bitters and boosts sweetness perception — that is why Thai fruit juices traditionally use a pinch of salt instead of more sugar. GRAB-COMPATIBLE: no deco, no toppings, drinkable through a straw. Rule 8 met. AGUA FRESCA SIGNATURE: this is the summer cup, plain and simple — you can serve it to guests who have never had a 100blend smoothie, and they get it instantly. Nothing to explain, just watermelon cold and alive. ⚠ NEW 25.08.2026, never blended."]},

 tip:["TESTKANDIDAT (Stufe B) NEU 25.08.2026, noch nie gemixt. Die Kombination Beere+Kakao+Mandel ist die klassische PRALINÉ-Formel — Sacher, Rehrücken, Nougat: alle drei drehen sich um genau diese drei Aromen. WARUM ES FUNKTIONIEREN SOLLTE: (1) Beerenmix bringt Säure, die den Kakao braucht, sonst wirkt er dumpf. (2) Geröstete Mandeln geben eine tiefe Nuss-Note, die Mandelmilch nicht schafft — Rösten setzt Aromastoffe frei, die im Rohmandel gebunden sind. (3) Banane liefert die Süße OHNE Zucker und bindet die Mischung. WARUM NR. 44 UND NICHT NR. 36 REICHT: Nr. 36 (Erdbeere-Schoko-Mandel) hat Erdbeere allein und Mandel als MILCH — leichter und einfarbig-pink. Nr. 44 hat den vollen Beeren-Mix (dunkler, komplexer) und GANZE Mandeln (nussiger, sättigender). Andere Zielgruppe: Nr. 36 = Frühstück-leicht, Nr. 44 = Dessert-satt. NACH DEM MIXEN: sofort trinken, sonst setzt sich der Mandel-Trester unten ab. Wenn es zu dick wird: 20 g Milch nachgießen. Wenn es sandig ist: nochmal 20 Sekunden mixen — geröstete Mandeln brauchen etwas mehr Zeit als Mandelmilch. Grab-tauglich (Regel 8): keine Deko, alles im Mix, durch den Halm trinkbar.",
      "แบบทดสอบ (ระดับ B) ใหม่ 25.08.2026 ยังไม่เคยปั่น · การรวมกันของเบอร์รี+โกโก้+อัลมอนด์คือสูตรพราลิเน่คลาสสิก — ซาเชอร์ เรห์รือคเคน นูกาต์ ทั้งสามอย่างหมุนรอบสามกลิ่นนี้ · ทำไมมันน่าจะได้ผล: (1) เบอร์รีให้ความเปรี้ยวที่โกโก้ต้องการ ไม่งั้นจะทึม (2) อัลมอนด์คั่วให้ความหอมลึกที่นมอัลมอนด์ทำไม่ได้ — การคั่วปลดปล่อยกลิ่นที่ผูกอยู่ในอัลมอนด์ดิบ (3) กล้วยให้ความหวานโดยไม่มีน้ำตาลและช่วยยึดส่วนผสม · ทำไมเบอร์ 44 ต้องมีทั้งที่มีเบอร์ 36: เบอร์ 36 (สตรอว์เบอร์รี-ช็อกโกแลต-อัลมอนด์) มีสตรอว์เบอร์รีอย่างเดียวและอัลมอนด์ในรูปนม — เบา สีชมพูล้วน · เบอร์ 44 มีเบอร์รีรวมเต็ม (สีเข้มกว่า ซับซ้อนกว่า) และอัลมอนด์ทั้งเมล็ด (หอมกว่า อิ่มกว่า) · กลุ่มเป้าหมายต่างกัน: เบอร์ 36 = อาหารเช้าเบา ๆ เบอร์ 44 = ของหวานอิ่ม · หลังปั่น: ดื่มทันที ไม่งั้นกากอัลมอนด์จะตกก้น · ถ้าข้นเกิน: เติมนม 20 กรัม · ถ้าสาก: ปั่นต่ออีก 20 วินาที — อัลมอนด์คั่วใช้เวลานานกว่านมอัลมอนด์เล็กน้อย · ผ่านเกณฑ์แกร็บ (กฎ 8): ไม่มีของแต่ง ทุกอย่างอยู่ในแก้ว ดื่มผ่านหลอดได้",
      "TEST CANDIDATE (stufe B) NEW 25.08.2026, never blended. The combination berry+cacao+almond is the classic PRALINÉ formula — Sachertorte, Rehrücken, nougat: all three revolve around exactly these three aromas. WHY IT SHOULD WORK: (1) Berry mix brings acidity, which cacao needs — otherwise it tastes flat. (2) Roasted almonds give a deep nut note that almond milk cannot deliver — roasting releases aroma compounds that are locked in the raw nut. (3) Banana delivers sweetness WITHOUT sugar and binds the mixture. WHY NR. 44 IF NR. 36 ALREADY EXISTS: Nr. 36 (Strawberry-Chocolate-Almond) uses strawberry alone and almond AS MILK — lighter, monochrome pink. Nr. 44 uses the full berry mix (darker, more complex) and WHOLE almonds (nuttier, more filling). Different targets: Nr. 36 = light breakfast, Nr. 44 = dessert-satisfying. AFTER BLENDING: drink immediately, otherwise the almond pulp settles. If too thick: add 20 g milk. If sandy: blend another 20 s — roasted almonds need a touch more time than almond milk. Grab-compatible (rule 8): no deco, everything in the mix, drinkable through a straw."]},

 tip:["🧪 LABOR-REZEPT (Stufe X), NEU 25.08.2026 · Der erste HERZHAFTE Smoothie in der Karte — direkte Vorlage: Tarator (Bulgarien) / Cacık (Türkei) / Tzatziki (Griechenland als Sauce). Zielgruppe: der Gast, der nichts Süßes will, oder als Begleiter zu Essen. NICHT als Zwischenmahlzeit-Smoothie gedacht. WARUM SCHALOTTE STATT ZWIEBEL: rohe normale Zwiebel setzt Schwefelverbindungen frei, die im warmen Mixer noch aggressiver werden. Schalotte hat davon deutlich weniger und ist in Thailand ohnehin die Standard-Zwiebel (หอมแดง). WARUM PASTE STATT ROHER KNOBLAUCH: mit Salz zerdrücken zerstört einen Teil der Allicin-Enzyme, bevor sie im Speichel den scharfen Effekt entfalten — genau der Trick, den italienische Aioli-Köche seit Jahrhunderten machen. LIMETTE STATT ESSIG: türkische Restaurants nehmen Zitrone, bulgarische Balsamico. Wir haben Limette im Haus, sie tut denselben Job. SALZ WICHTIG: Tarator ist salzig, das ist kein Fehler. Wenn er nicht salzig genug ist, wirkt der Joghurt kreidig. TEXTUR: bewusst DÜNN — Ayran-nah, kein Sattmach-Smoothie. Grab-tauglich (Regel 8): keine Deko, alles gemixt. ⚠ VERKOSTUNG STEHT AUS — Peter/Freundin haben eine Variante experimentiert; dies ist die Labor-Version zum systematischen Vergleich.",
      "🧪 สูตรทดลอง (ระดับ X) ใหม่ 25.08.2026 · แก้วรสเผ็ดร้อนแรกในเมนู — ต้นแบบตรง: ทาราเตอร์ (บัลแกเรีย) / จาจีก (ตุรกี) / ทซัตซิกิ (กรีกในรูปซอส) · กลุ่มเป้าหมาย: ลูกค้าที่ไม่ต้องการอะไรหวาน หรือดื่มคู่กับอาหาร ไม่ได้ตั้งใจเป็นสมูทตี้ทานเล่น · ทำไมใช้หอมแดงแทนหอมใหญ่: หอมใหญ่ดิบปล่อยสารซัลเฟอร์ที่แรงขึ้นในเครื่องปั่นที่อุ่น ๆ · หอมแดงมีน้อยกว่ามาก และเป็นหอมมาตรฐานในไทยอยู่แล้ว · ทำไมทำเป็นเนื้อแทนกระเทียมดิบ: การบดกับเกลือทำลายเอนไซม์อัลลิซินบางส่วนก่อนที่มันจะเผ็ดในน้ำลาย — เป็นเคล็ดลับที่คนทำอาหารอิตาเลียนใช้มาหลายศตวรรษ · มะนาวแทนน้ำส้มสายชู: ร้านตุรกีใช้มะนาว บัลแกเรียใช้บัลซามิก · เรามีมะนาว มันทำงานเหมือนกัน · เกลือสำคัญ: ทาราเตอร์ต้องเค็ม ไม่ใช่ความผิด ถ้าไม่เค็มพอ โยเกิร์ตจะรู้สึกฝืด · เนื้อสัมผัส: ตั้งใจให้เจือจาง — คล้ายอายราน ไม่ใช่สมูทตี้อิ่ม · ผ่านเกณฑ์แกร็บ (กฎ 8): ไม่มีของแต่ง ทุกอย่างอยู่ในแก้ว · ยังไม่ได้ชิม — ปีเตอร์กับแฟนทดลองเวอร์ชันหนึ่งแล้ว นี่คือเวอร์ชันห้องแล็บสำหรับเปรียบเทียบอย่างเป็นระบบ",
      "🧪 LAB RECIPE (stufe X), NEW 25.08.2026 · The first SAVOURY smoothie on the menu — direct model: Tarator (Bulgaria) / Cacık (Turkey) / Tzatziki (Greece as a sauce). Target: the guest who does not want anything sweet, or as a companion to food. NOT intended as an in-between-meal smoothie. WHY SHALLOT INSTEAD OF ONION: raw regular onion releases sulphur compounds that become even more aggressive in a warm mixer. Shallot has far less of them and is the standard onion in Thailand anyway (หอมแดง). WHY PASTE INSTEAD OF RAW GARLIC: crushing with salt destroys part of the allicin enzymes before they unfold their sharp effect in saliva — exactly the trick Italian aioli cooks have used for centuries. LIME INSTEAD OF VINEGAR: Turkish restaurants use lemon, Bulgarian ones balsamic. We have lime in the house, it does the same job. SALT MATTERS: Tarator is salty, that is not a mistake. If it is not salty enough, the yoghurt feels chalky. TEXTURE: deliberately THIN — close to Ayran, not a filling smoothie. Grab-compatible (rule 8): no deco, everything blended. ⚠ TASTING PENDING — Peter/partner have experimented with a variant; this is the lab version for systematic comparison."]},

{n:"46", stufe:"X", de:"Ayran (Instant, mit Limette) 🧪", th:"อายราน (โยเกิร์ตดื่ม) 🧪", en:"Ayran (instant, with lime) 🧪",

   ["JO", 310,"Naturjoghurt UNGESÜẞT — 2 Teile Joghurt : 1 Teil Wasser ist die klassische türkische Ratio","โยเกิร์ตธรรมชาติไม่หวาน — โยเกิร์ต 2 ส่วน ต่อน้ำ 1 ส่วน คืออัตราส่วนคลาสสิกของตุรกี","Plain unsweetened yoghurt — 2 parts yoghurt to 1 part water is the classic Turkish ratio"],
   ["WA", 150,"Flaschen-Trinkwasser EISKALT (KEIN Leitungswasser) — verdünnt auf Trink-Konsistenz (Ayran ist DÜNNER als jeder Smoothie)","น้ำเย็นจัด — เจือจางให้ดื่มได้ (อายรานเจือจางกว่าสมูทตี้)","Ice-cold water — dilutes to drinking consistency (Ayran is THINNER than any smoothie)"],

   ["Eiskaltes Wasser in dünnem Strahl unter Rühren dazugeben — nie umgekehrt, sonst wird der Joghurt körnig","ค่อย ๆ เทน้ำเย็นจัดเป็นสายบาง ๆ ขณะคน — อย่ากลับกัน ไม่งั้นโยเกิร์ตจะเป็นเม็ด","Slowly stream in the ice-cold water while stirring — never the other way around, otherwise the yoghurt turns grainy"],
   ["Limette + Minze am Ende zufügen und noch einmal kurz verrühren","ใส่มะนาวและสะระแหน่ตอนท้าย แล้วคนอีกสั้น ๆ","Add lime and mint at the end, stir briefly again"],
   ["Direkt in ein GEKÜHLTES Glas, sofort trinken","เทลงแก้วเย็น ดื่มทันที","Pour straight into a CHILLED glass, drink immediately"]
 ],
 tip:["🧪 LABOR-REZEPT (Stufe X), NEU 25.08.2026 · Türkischer Klassiker in seiner reinsten Form — nur Joghurt, Wasser, Salz. Peter fügt Limette als moderne Variation dazu; das ist keine Häresie, sondern Öffnung Richtung Osten (arabischer Laban hat oft Zitrus). WARUM 2:1 (Joghurt zu Wasser): das ist die getestete Volksrezeptur, weniger wird zu wässrig, mehr zu breiig. WARUM VON HAND STATT MIXER: der Ayran soll SEIDIG und leicht luftig sein, nicht schaumig. Ein Mixer schlägt so viel Luft ein, dass er innerhalb von 10 Minuten zusammenfällt und den Joghurt trennt. WARUM WASSER IN JOGHURT und nicht umgekehrt: Joghurt in Wasser lässt Eiweiß koagulieren — das gibt Klümpchen. Wasser langsam in Joghurt ergibt eine glatte Emulsion. WARUM VIEL SALZ: Ayran wird ohne Salz fad und kreidig. 1 g auf 460 g klingt viel, ist aber die Grenze zum Wohlfühlen — türkische Standard-Ayrans sind sogar salziger. TEMPERATUR-KRITISCH: warmer Ayran ist ungenießbar. Glas im Voraus kühlen. Grab-tauglich (Regel 8) — aber vermutlich zu ungewöhnlich für den ersten Grab-Bestand; erst mal als Stand-Verkauf testen. ⚠ VERKOSTUNG STEHT AUS.",
      "🧪 สูตรทดลอง (ระดับ X) ใหม่ 25.08.2026 · คลาสสิกตุรกีในรูปแบบดั้งเดิม — มีแค่โยเกิร์ต น้ำ เกลือ · ปีเตอร์เติมมะนาวเป็นเวอร์ชันสมัยใหม่ ไม่ใช่นอกรีต แต่เปิดไปทางตะวันออก (ลาบันอาหรับมักมีรสส้ม) · ทำไม 2:1 (โยเกิร์ตต่อน้ำ): เป็นสัดส่วนที่ทดสอบมาแล้ว น้อยกว่าจะเหลว มากกว่าจะข้น · ทำไมตีมือแทนเครื่องปั่น: อายรานต้องนุ่มนวลและเบาเล็กน้อย ไม่ใช่เป็นฟอง เครื่องปั่นจะตีอากาศเข้ามากจนพังใน 10 นาทีและโยเกิร์ตแยกชั้น · ทำไมเทน้ำในโยเกิร์ตแทนที่จะกลับกัน: โยเกิร์ตในน้ำจะทำให้โปรตีนจับตัว — เกิดเม็ด · เทน้ำช้า ๆ ในโยเกิร์ตจะได้อิมัลชันเนียน · ทำไมเกลือมาก: อายรานไม่มีเกลือจะจืดและฝืด · 1 กรัมต่อ 460 กรัมฟังดูมาก แต่เป็นขอบเขตของความสบายลิ้น — อายรานตุรกีมาตรฐานเค็มกว่านี้อีก · อุณหภูมิสำคัญ: อายรานอุ่นดื่มไม่ได้ · ให้แช่แก้วก่อน · ผ่านเกณฑ์แกร็บ (กฎ 8) — แต่คงแปลกเกินไปสำหรับแกร็บครั้งแรก ทดสอบขายที่ร้านก่อน · ยังไม่ได้ชิม",
      "🧪 LAB RECIPE (stufe X), NEW 25.08.2026 · Turkish classic in its purest form — only yoghurt, water, salt. Peter adds lime as a modern variation; that is not heresy but opens towards the east (Arab laban often has citrus). WHY 2:1 (yoghurt to water): the tested folk ratio, less becomes watery, more becomes pasty. WHY BY HAND INSTEAD OF BLENDER: Ayran should be SILKY and slightly airy, not foamy. A blender whips so much air in that it collapses within 10 minutes and the yoghurt separates. WHY WATER INTO YOGHURT and not the other way: yoghurt into water makes protein coagulate — that gives lumps. Water slowly into yoghurt gives a smooth emulsion. WHY LOTS OF SALT: Ayran without salt is bland and chalky. 1 g on 460 g sounds like a lot but is the border of the comfort zone — standard Turkish Ayrans are even saltier. TEMPERATURE-CRITICAL: warm Ayran is undrinkable. Chill the glass in advance. Grab-compatible (rule 8) — but probably too unusual for the first Grab order; test as counter sale first. ⚠ TASTING PENDING."]},

 tip:["Mango 50 % gefroren / 50 % frisch nach Grundlage 27 (83,5 % Wasser + Kokosmilch als Basis). Matcha IMMER durch ein feines Sieb — er klumpt sonst und man beißt auf grüne Nester. Das Sieb hängt am Mixplatz, es kostet drei Sekunden. Kokosmilch, nicht Kokoswasser: das Fett nimmt dem Matcha die Bitterkeit und trägt gleichzeitig das Mangoaroma. ⚠ Verkostung steht aus — beim ersten Mal mit 1,5 g Matcha anfangen und hochtasten, 2 g ist der Startwert für kräftigen Geschmack.",

      "Mango half frozen, half fresh per rule 27. Always sift the matcha — otherwise you bite into green pockets. Coconut milk, not coconut water: the fat takes the bitterness off the matcha and carries the mango. ⚠ Not yet tasted — start at 1.5 g matcha and work up."]},

 tip:["Der Zimt ist der Trick: er schmeckt süß, ohne Zucker zu sein, und baut eine Brücke zwischen der spitzen Ananas-Säure und der Herbe des Matcha. Ohne ihn stehen beide unverbunden nebeneinander. Zimt abwiegen, nicht schätzen — 0,5 g ist ein gestrichener Viertel-Teelöffel, ab 1 g schmeckt der Becher nach Weihnachten. Ananas braucht 90 Sekunden wegen der Fasern (Grundlage 27). ⚠ Verkostung steht aus.",

      "The cinnamon is the trick: it reads sweet without being sugar and bridges the sharp pineapple acidity and the matcha astringency. Weigh it, don't guess — 0.5 g is a level quarter teaspoon; past 1 g the cup tastes like Christmas. Pineapple needs 90 s because of the fibres. ⚠ Not yet tasted."]},

   ["④ Gefrorenes ganz oben: Banane reif","④ ของแช่แข็งไว้บนสุด: กล้วยสุก","④ Frozen last, on top: Ripe banana"],
   ["60\"-Taste (1 Minute)  (60 s, höchste Stufe)","กดปุ่ม 60 วินาที (1 นาที)  (60 วินาที ความเร็วสูงสุด)","The 60\" button  (60 s, high speed)"],

 tip:["Das ist der Matcha-Latte als Smoothie — die Fassung, die in Thailand jeder kennt, nur ohne Zucker und ohne Eis. AUSNAHME ZUR REGEL: Banane steht hier bei 60 % gefroren statt der üblichen 45 %. Das ist Absicht. Banane friert cremig statt eisig, weil sie kaum freies Wasser hat, das große Kristalle bilden könnte — und die Mandelmilch trägt die Masse. So werden die 180 g Kälte je Becher erreicht, die die Frucht ohne Eiszusatz liefern muss. Haferflocken kommen trocken dazu (Stufe ③) und mixen sich in 60 Sekunden glatt; sie machen aus dem Getränk ein Frühstück. ⚠ Verkostung steht aus.",
      "มัทฉะลาเต้ในแบบสมูทตี้ — ไม่ใส่น้ำตาล ไม่ใส่น้ำแข็ง · ข้อยกเว้น: กล้วยแช่แข็ง 60% แทน 45% ตั้งใจทำ เพราะกล้วยแช่แข็งแล้วเนียน ไม่เป็นเกล็ดน้ำแข็ง และนมอัลมอนด์ช่วยพยุงเนื้อ · ข้าวโอ๊ตใส่ตอนของแห้ง (ขั้นที่ ③) ปั่น 60 วินาทีก็เนียน ทำให้อิ่มเหมือนมื้อเช้า · ⚠ ยังไม่ได้ชิมทดสอบ",
      "The matcha latte as a smoothie — the version everyone in Thailand knows, minus the sugar and the ice. EXCEPTION TO THE RULE: banana sits at 60 % frozen here instead of the usual 45 %. That is deliberate. Banana freezes creamy rather than icy because it holds almost no free water to form large crystals, and the almond milk carries the mass. That is how the cup reaches its 180 g of cold without added ice. ⚠ Not yet tasted."]},

 ],
 tip:["Der Becher soll nach ANANAS mit warmer Gewürznote schmecken, nicht nach Kurkuma — genau wie Peters Grundsatz bei Rezept 13: Geschmack geht vor. Deshalb nur 1 g Kurkuma. Kokosmilch und Pfeffer stehen nicht zufällig drin: Curcumin ist fettlöslich, und Piperin aus dem Pfeffer ist der zweite Teil des Paars. Ohne beides ist der Kurkuma reine Farbe. Kurkuma IMMER mit Handschuhen reiben und auf einem Plastik- oder Glasbrett — Holz färbt dauerhaft gelb. ⚠ Verkostung steht aus.",
      "แก้วนี้ต้องได้รสสับปะรดเป็นหลัก มีกลิ่นเครื่องเทศอุ่น ๆ ตาม ไม่ใช่รสขมิ้นล้วน จึงใส่ขมิ้นแค่ 1 กรัม · กะทิกับพริกไทยไม่ได้ใส่เล่น ๆ — เคอร์คูมินละลายในไขมัน และพริกไทยช่วยเสริม · ขูดขมิ้นต้องใส่ถุงมือ ใช้เขียงพลาสติกหรือแก้ว ไม่ใช้เขียงไม้ เพราะติดสีถาวร · ⚠ ยังไม่ได้ชิมทดสอบ",
      "The cup should taste of PINEAPPLE with a warm spice note, not of turmeric — 1 g only. Coconut milk and pepper are not decoration: curcumin is fat-soluble and piperine is the other half of the pair. Always grate turmeric with gloves on a plastic or glass board — wood stains permanently. ⚠ Not yet tasted."]},

 tip:["Peters eigener Verkostungsbefund vom 15.08. über rohe Drachenfrucht: „Geruch kaum vorhanden, Geschmack kaum vorhanden“. Genau deshalb stehen Limette, Minze und Salz hier NICHT als Deko drin, sondern als Wachmacher — ohne sie schmeckt der Becher nach nichts. Das Salz ist der stärkste der drei Hebel, obwohl man es nicht herausschmeckt. Verbraucht 450 g Drachenfrucht je Becher und ist damit der schnellste Weg, die 3 kg abzubauen. Als zweite „pur“-Farbe (weiß) neben dem Gelb von Mango und Ananas. ⚠ Verkostung steht aus.",
      "ผลชิมของปีเตอร์ 15.08. เรื่องแก้วมังกรดิบ: แทบไม่มีกลิ่น แทบไม่มีรส · มะนาว สะระแหน่ และเกลือจึงไม่ใช่ของตกแต่ง แต่เป็นตัวปลุกรส ถ้าไม่มีจะจืดสนิท · เกลือคือตัวที่แรงที่สุด แม้จะไม่รู้สึกว่าเค็ม · ใช้แก้วมังกร 450 กรัมต่อแก้ว จึงลดสต็อก 3 กก. ได้เร็วที่สุด · ⚠ ยังไม่ได้ชิมทดสอบ",
      "Peter's own tasting note on raw dragon fruit (15.08.): barely any smell, barely any taste. That is exactly why lime, mint and salt are here as wake-up agents, not garnish. Salt is the strongest of the three even though you never taste it. Uses 450 g per cup — the fastest way to clear the 3 kg. ⚠ Not yet tasted."]},

 tip:["Die Kokosmilch ist hier keine Geschmacksfrage, sondern Bedingung: Das Pandan-Aroma (2-Acetyl-1-Pyrrolin) ist fettlöslich. In einem wässrigen Becher verpufft es und übrig bleibt eine grasige, leicht seifige Note. Das ist Regel A aus den Kombi-Regeln vom 25.08. — und der Grund, warum Rezept 03 nie verkaufsfähig war. Dieses Rezept ersetzt es. Ananas darf zusätzlich dazu: ihre Enzyme unterstützen die Aromafreisetzung, und die Süße trägt das Pandan. 90 Sekunden wegen der Ananas-Fasern. PANDAN LIEGT GEFROREN UND GESCHNITTEN IN DER TRUHE (Peter, 30.08.2026) — direkt hineingeben, nicht auftauen. Das Einfrieren ist hier sogar ein Vorteil: die Eiskristalle sprengen die Zellwände, das Aroma tritt beim Mixen leichter aus als bei frischen Blättern. ⚠ Verkostung steht aus.",
      "กะทิไม่ใช่เรื่องรสชาติ แต่เป็นเงื่อนไข: กลิ่นใบเตย (2-Acetyl-1-Pyrroline) ละลายในไขมัน ถ้าอยู่ในน้ำเปล่าจะหายไป เหลือแต่กลิ่นหญ้าและสบู่ · นี่คือกฎข้อ A จากกฎการจับคู่ 25.08. และเป็นเหตุผลที่สูตร 03 ขายไม่ได้ · สูตรนี้มาแทน · ปั่น 90 วินาที เพราะเส้นใยสับปะรด · ⚠ ยังไม่ได้ชิมทดสอบ",
      "The coconut milk is not a taste choice but a condition: pandan's aroma compound (2-acetyl-1-pyrroline) is fat-soluble. In a watery cup it evaporates and leaves a grassy, faintly soapy note. That is rule A from the 25.08. pairing rules — and the reason recipe 03 was never sellable. This one replaces it. ⚠ Not yet tasted."]},

 tip:["Gleiche Fett-Logik wie Nr. 58: Citral aus dem Zitronengras ist fettlöslich, die Kokosmilch trägt es. Rezept 01 nutzte Seidentofu — der ist Protein, kein Fettträger, und deshalb verstieß es gegen Regel A. Dieses Rezept ersetzt es. Mango statt Ananas als zweite Aromabrücke, weil Zitronengras-Mango-Kokos zur Tom-Kha-Aromenfamilie gehört, die hier jeder kennt. NUR das weiche Innere des Stängels verwenden — die äußeren Blätter sind holzig und geben Fasern, die man zwischen den Zähnen hat. ⚠ Verkostung steht aus.",

      "Same fat logic as No. 58: citral is fat-soluble, coconut milk carries it. Recipe 01 used silken tofu — that is protein, not a fat carrier, so it broke rule A. This replaces it. Use only the tender inner core; the outer leaves are woody and leave fibres between the teeth. ⚠ Not yet tasted."]}

}

/* Eine Vorstufen-Karte in der App. Beide Sprachen gleichrangig -
   gleiche Groesse, gleiches Gewicht, untereinander. Englisch gibt es auf
   diesen Karten noch nicht; solange das so ist, zeigt die App auch bei

function vorstufe(k){
  const zw=(de,th)=>'<span class="vzeile">'+kalt(esc(de))+'</span>'
                   +'<span class="vzeile">'+kalt(esc(th))+'</span>';

  app.innerHTML='<button class="back">← '+zurueck+'</button>'
    +'<div class="vhead"><div class="vcode">'+k.code0+'</div>'
    +'<div class="vname">'+esc(k.de)+'<span>'+esc(k.th)+'</span></div></div>'
    +'<div class="vkurz">'+zw(k.kurz[0],k.kurz[1])+'</div>'
    +'<div class="vwarn">'+zw(k.warn[0],k.warn[1])+'</div>'

        '<div><span class="zn"><b>'+kalt(esc(z[0]))+'</b><i>'+kalt(esc(z[1]))+'</i></span>'

    +'<ol class="steps">'+k.schritte.map(s=>
        '<li><b>'+kalt(esc(s[0]))+'</b><i>'+kalt(esc(s[1]))+'</i></li>').join("")+'</ol>'

/* EISKALT und die anderen Kippschalter hervorheben - dieselben Woerter wie
   auf dem Ausdruck, damit Handy und Papier gleich aussehen. */
function kalt(h){
  return h.replace(/(EISKALT(?:ES|EM|E)?|[Ee]iskalt(?:es|em|e)?|FEINE[SN]? SIEB|FEINSIEB|NICHT PRESSEN|MUSS KOCHEN|เย็นจัด|ห้ามบีบ|ตะแกรงตาถี่|ต้องต้ม)/g,
    '<span class="kalt">$1</span>');
}
