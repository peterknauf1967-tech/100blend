/* Kacheln nach Nummer sortiert zeichnen.
   Peter, 02.09.2026: "ich brauche erst mal das rezept nr. 13 wieder in der
   Rezepte-liste." Es war nie weg -- es stand an Position 19, zwischen 20 und
   21, weil spaeter angehaengte Rezepte hinten in der Reihe landen und die
   Kacheln bisher in Array-Reihenfolge gezeichnet wurden. Wer zwischen 12 und
   15 nachsieht, findet dort eine Luecke und haelt das Rezept fuer geloescht.
   Dasselbe galt fuer die 24 (stand hinter der 29).
   Sortiert wird eine Kopie -- die Array-Reihenfolge bleibt unangetastet,
   damit REZEPTE.find() und alles Uebrige weiter greift. */
const nachNummer = () =>
  REZEPTE.slice().sort((a,b) => (parseInt(a.n,10)||0) - (parseInt(b.n,10)||0));

function list(){
  app.innerHTML='<div class="grid">'+nachNummer().map(r=>`
    <button class="tile" data-n="${r.n}">
      <div class="no">${r.n}</div>
      <div class="nm">${esc(r[L]||r.de)}</div>
      <div class="th">${esc(r[GEGEN[L]]||"")}</div>
      <div class="foot">
        <span class="pill" style="background:var(--${r.stufe})">${r.stufe==="X"?"?":r.stufe}</span>
        <span class="alg">${kennBadge(r.n,true)}</span>
        ${(()=>{ /* PROTEIN SCHON IN DER UEBERSICHT.
            Peter, 30.08.2026: "Proteinpulver ist immer noch nicht auf der
            Liste bei den Smoothies, wo es schmeckt."
            Richtig — es stand nur im geoeffneten Rezept. Wer die Kachelseite
            ansieht, will aber auf einen Blick wissen, welchen Becher er mit
            Protein anbieten kann, ohne 58 Rezepte einzeln zu oeffnen.
            💪 = ausdruecklich empfohlen · ½ = geht in halber Menge.
            Rezepte ohne Zeichen: entweder ungeeignet oder ohne Befund. */
          /* Fuehrende Null weg: die Listen fuehren "1".."9", die Rezepte
             heissen "01".."09" — sonst greift die Sperre bei neun Rezepten
             nicht (gefunden 30.08.2026). */
          const nr=String(r.n).replace(/^0+/,"");
          if(WHEY_TOP.indexOf(nr)>=0)  return `<span class="pill" style="background:#2C5A3B" title="Whey Protein Isolat — passt besonders gut">💪</span>`;
          if(WHEY_KLEIN.indexOf(nr)>=0)return `<span class="pill" style="background:#c9a227" title="Whey Protein Isolat — nur halbe Menge">½💪</span>`;
          return "";
        })()}
      </div>
    </button>`).join("")+'</div>';
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{cur=t.dataset.n;scrollTo(0,0);render()});
}

/* BOOSTER IN DER REZEPTKARTE.
   Peter, 30.08.2026: "ich finde kein Rezept mit Proteinpulver in Rezepte."

   Deshalb drei Zustaende statt einer pauschalen Ansage.
   Quelle: konzept-bausteine/protein-creatin-booster-30-08.md */
const WHEY_TOP  =["9","17","20","21","26","30","34","35","36","37","39","41","44"];
const WHEY_KLEIN=["4","8","10","11","32","33","38","40","42","48","51"];
const WHEY_NEIN =["1","2","3","5","6","7","12","13","15","16","18","19","22","24",
                  "25","27","28","29","43","45","46","47","49"];
const KREA_TOP  =["17","30","39","44","41"];
const KREA_NEIN =["43","29","15"];
/* Menge je Bechergroesse. Whey steigt mit dem Becher, Kreatin nicht —
   das ist eine Dosis, kein Geschmacksmittel. */
const BOOST_G={WY:{"12":20,"16":25,"22":30}, KR:{"12":2.5,"16":2.5,"22":2.5}};
function boosterZeile(r){
  const nr=String(r.n).replace(/^0+/,"");   /* siehe oben: "01" gegen "1" */
  let wy = WHEY_NEIN.indexOf(nr)>=0 ? "nein" : WHEY_KLEIN.indexOf(nr)>=0 ? "klein"
           : WHEY_TOP.indexOf(nr)>=0 ? "top" : "";
  /* Traegt der Becher schon Protein, wird die Zugabe halbiert — sonst
     stapelt sich Eiweiss auf Eiweiss. Aus Peters Verkostung von Nr. 17. */
  const eig=eigenProtein(r);
  if(wy!=="nein" && eig>=PROT_SCHWELLE) wy="klein";
  const kr = KREA_NEIN.indexOf(nr)>=0 ? "nein" : KREA_TOP.indexOf(nr)>=0 ? "top" : "";
  if(!wy && !kr) return "";
  /* Die Rezeptkarte hat keine Bechergroessen-Variable wie die Kasse — die
     Rezepte stehen auf 473 ml (16 oz). Deshalb fest die 16-oz-Dosis, und
     zwar bewusst: Lexi liest hier den Standardbecher, alles andere rechnet
     die Kasse. */
  const g = BOOST_G.WY["16"];
  const T={
    th:{kopf:"บูสเตอร์ (ลูกค้าสั่งเพิ่ม)", nein:"❌ ห้ามใส่", klein:"½ ครึ่งเดียว", top:"✅ เข้ากันดี", ok:"ใส่ได้",
        wy:"เวย์โปรตีนไอโซเลท", kr:"ครีเอทีน",
        end:"ใส่หลังปั่นเสร็จ แล้วปั่นต่อ 5 วินาที"},
    de:{kopf:"Booster (Zubestellung durch den Gast)", nein:"❌ nicht anbieten", klein:"½ halbe Menge", top:"✅ passt gut", ok:"möglich",
        wy:"Whey Protein Isolat", kr:"Kreatin",
        end:"Kommt nach dem Hauptgang, dann 5 Sekunden"},
    en:{kopf:"Boosters (customer add-on)", nein:"❌ do not offer", klein:"½ half dose", top:"✅ suits well", ok:"possible",
        wy:"Whey protein isolate", kr:"Creatine",
        end:"Goes in after the main blend, then 5 seconds"}
  }[L]||{};
  const zeile=(name,zustand,menge)=>{
    const txt = zustand==="nein"?T.nein : zustand==="klein"?T.klein : zustand==="top"?T.top : T.ok;
    const farbe = zustand==="nein"?"var(--accent)" : zustand==="klein"?"#c9a227" : "var(--ok)";
    /* Komma statt Punkt — 2,5 g, nicht 2.5 g. Auf einem Arbeitsblatt in

    const m = zustand==="nein" ? "" : " · <b>"+String(zahl).replace(".",",")+" g</b>";
    return `<li><span>${esc(name)}</span> <span style="color:${farbe};font-weight:700">${txt}</span>${m}</li>`;
  };

/* ①②③④ AN DER ZUTAT.
   Peter, 30.08.2026: "Hanfsamen steht irgendwo am Ende."
   Stimmt — und das ist richtig so, nur sah man den Grund nicht. Die
   Zutatenliste ist seit dem 30.08. in der EINFUELLREIHENFOLGE sortiert,
   nicht nach Wichtigkeit: erst Fluessigkeit, dann Frisches, dann Trockenes,
   ganz zuletzt Gefrorenes. Hanfsamen sind trocken, also Gruppe ③.
   Ohne Marker sieht die Reihenfolge willkuerlich aus, und wer sie fuer
   willkuerlich haelt, kippt in beliebiger Folge ein — dann dreht die Klinge
   im Hohlraum oder das Trockene staubt an den Deckel.
   Die Zuordnung wird aus den Schritten des Rezepts gelesen, nicht geraten:
   dort stehen die Zutatennamen bereits hinter ①②③④. */
function gruppeJeZutat(r){
  const map={};
  (r.schritte||[]).forEach(s=>{
    const txt=String(s[0]||"");
    const m=txt.match(/^([①②③④])/);
    if(!m) return;
    const teil=txt.split(":")[1]||"";
    (r.zut||[]).forEach((z,idx)=>{
      const name=String(z[2]||"");
      /* Der Schritt nennt den Kurznamen, die Zutat traegt oft noch einen
         Zusatz nach dem Gedankenstrich ("Banane (frisch)" gegen
         "Banane"). Deshalb auf den Kern vor Klammer/Gedankenstrich kuerzen. */
      const kern=name.split("—")[0].split("(")[0].trim();
      /* SCHLUESSEL IST DIE POSITION, nicht Code+Menge. Bei Nr. 43 stehen
         235 g Wassermelone frisch UND 235 g gefroren — gleicher Code,
         gleiche Menge, also derselbe Schluessel, und die frische bekam die
         Markierung der gefrorenen. Gefunden 30.08. beim Gegenlesen. */
      const key=idx;
      /* ERSTER Treffer gilt. Sonst gewinnt der letzte Schritt, und weil
         Schritt ④ die Frucht noch einmal nennt, landete die FRISCHE Banane
         faelschlich bei ④. */
      if(kern && teil.indexOf(kern)>=0 && map[key]===undefined) map[key]=m[1];
    });
  });
  /* ZWEITER DURCHGANG mit dem ersten Wort. Manche Zutaten tragen im Rezept
     einen Zusatz, den der Schritt nicht nennt — "Ananas FRISCH (Aroma +
     Saeure)" gegen "④ Gefrorenes: Ananas". Der Kern-Vergleich greift dann
     nicht, das erste Wort schon. */
  (r.zut||[]).forEach((z,idx)=>{
    if(map[idx]!==undefined) return;
    const wort=String(z[2]||"").trim().split(/[\s(—,]/)[0];
    if(wort.length<4) return;
    (r.schritte||[]).forEach(s=>{
      const txt=String(s[0]||""); const m=txt.match(/^([①②③④])/);
      if(!m) return;
      const teil=txt.split(":")[1]||"";
      if(teil.indexOf(wort)>=0 && map[idx]===undefined) map[idx]=m[1];
    });
  });
  /* Gefrorenes ist immer ④, egal was der Schritttext hergibt — die
     Unterscheidung steht nur am Zutatennamen, seit dem TK/frisch-Split
     vom 30.08. steht dieselbe Frucht zweimal im Rezept. */
  (r.zut||[]).forEach((z,idx)=>{
    if(/gefroren|แช่แข็ง|frozen/i.test(String(z[2]||""))) map[idx]="④";
  });
  return map;
}

const PROT_ANTEIL={HS:0.31, TO:0.05, MA:0.21, KE:0.30, SK:0.21, JO:0.035,
                   KM:0.034, MM:0.01, KK:0.20, HF:0.13, BA:0.011};

  (r.zut||[]).forEach(z=>{ const f=PROT_ANTEIL[z[0]];
    if(f && typeof z[1]==="number") g+=z[1]*f; });
  return Math.round(g*10)/10;
}

/* ═══════════ ZUTAT AM MIXPLATZ SPERREN ═══════════
   Peter, 30.08.2026: "Wie löse ich das, wenn ich ein Rezept zubereite und
   feststelle, ich kann etwas nicht mehr verarbeiten? Es ist nicht mehr
   aromatisch, verdorben oder schlicht weg verbraucht? Wenn ich das dann
   rausgenommen habe, muss sofort eine Kettenreaktion gestartet werden."

   Genau hier gehoert der Griff hin — an die Zutat, im geoeffneten Rezept,
   waehrend der Becher auf der Waage steht. Alles andere (App aufmachen,
   Zutat suchen, Menge auf 0 tippen) passiert am Stand nicht.

   WAS DER KNOPF AUSLOEST, in dieser Reihenfolge:
     1. Bestand UND Gefriergut dieser Zutat auf 0
     2. Zeitstempel auf jetzt, damit die Buchung beim Abgleich gewinnt
     3. Grund + Datum werden mitgeschrieben (blend_sperrgrund)
     4. sofortiger POST an den gemeinsamen Speicher — damit die KASSE den
        Becher noch in derselben Minute sperrt und die App ihn rot faerbt
     5. Die Zutat steht ab dann automatisch auf der Einkaufsliste, weil die
        Reichweite auf 0 faellt. Das musste nicht gebaut werden, das kann
        die App laengst.

   DER GRUND IST DER EIGENTLICHE WERT. "Verbraucht" ist Alltag.
   "Verdorben" heisst: Lieferant oder Lagerung pruefen. "Nicht mehr
   aromatisch" heisst: Sorte oder Reifegrad pruefen. Ohne den Grund
   verschwindet die Information, und im naechsten Monat kauft man dieselbe
   schlechte Charge wieder.

   Die Seiten teilen sich localStorage, weil sie auf derselben Adresse
   liegen — die Rezeptkarte schreibt also in denselben Speicher wie die App
   (blend_os_v1) und nutzt dieselbe Sync-Adresse (blend_os_sync). */
const SKEY_OS="blend_os_v1", SYNCKEY_OS="blend_os_sync";
const SYNC_STD="https://script.google.com/macros/s/AKfycbzDrg7mh6nIeGWYKNOXRYjs4bw0aAqmOyN1ZQQZcfbyWg5MZLt87B7FbiqyeN2p1f0S/exec";
const GRUND_TXT={
  verbraucht:{de:"aufgebraucht",         th:"ใช้หมดแล้ว",        en:"used up"},
  verdorben :{de:"verdorben",            th:"เสียแล้ว",          en:"spoiled"},
  fad       :{de:"nicht mehr aromatisch",th:"ไม่มีกลิ่นรสแล้ว",  en:"no aroma left"}
};
function osLesen(){ try{ return JSON.parse(localStorage.getItem(SKEY_OS)||"{}"); }catch(e){ return {}; } }
function zutatSperren(code, grund){
  const S=osLesen();
  S.bestand=S.bestand||{}; S.tk=S.tk||{}; S.reift=S.reift||{}; S.ts=S.ts||{};
  S.bestand[code]=0; S.tk[code]=0; S.reift[code]=0;
  S.ts[code]=Date.now();
  localStorage.setItem(SKEY_OS, JSON.stringify(S));
  /* Grund getrennt fuehren — der gemeinsame Speicher kennt das Feld nicht,
     und es soll den Abgleich nicht stoeren. */
  let gr={}; try{ gr=JSON.parse(localStorage.getItem("blend_sperrgrund")||"{}"); }catch(e){}
  gr[code]={grund:grund, zeit:new Date().toISOString().slice(0,16).replace("T"," ")};
  localStorage.setItem("blend_sperrgrund", JSON.stringify(gr));
  /* Sofort an den gemeinsamen Speicher — sonst verkauft die Kasse den
     Becher weiter, bis das naechste Geraet zufaellig abgleicht. */
  const url=(localStorage.getItem(SYNCKEY_OS)===null)?SYNC_STD:localStorage.getItem(SYNCKEY_OS);
  /* KEIN SCHREIBEN AUS EINER TESTUMGEBUNG.
     Am 30.08.2026 hat ein Test auf localhost den Kakao im ECHTEN
     gemeinsamen Speicher auf 0 gesetzt — der Server nimmt jeden POST an,
     egal woher er kommt, und der frische Zeitstempel gewinnt. Seitdem
     schreibt nur noch die ausgelieferte Fassung. Lokal wird die Sperre
     im Geraetespeicher gesetzt, aber nicht gesendet. */
  const echt = location.protocol==="https:" && !/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
  if(url && echt){
    fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({geraet:"Rezeptkarte", bestand:S.bestand, tk:S.tk,
                           reift:S.reift, bestellt:S.bestellt||{}, ts:S.ts, wer:S.wer||{}, stand:S.stand||0})
    }).catch(()=>{});
  } else if(url && !echt){
    console.log("[Test] Sperre nur lokal gesetzt, KEIN Senden an den gemeinsamen Speicher:", code, grund);
  }
  render();
}

      }).join(" · ");
    }
  } catch (e) { d["Kontext-Fehler"] = String(e && e.message || e); }
  return d;
};
